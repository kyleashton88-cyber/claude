<script id="data" type="application/json">{"stages":[["0","Zero",[0]],["1","Foundations",[1,2]],["2","Practitioner",[3,4,5]],["3","Analyst",[6,7]],["4","Strategist",[8,9,10,11]],["5","Operator",[12,13,14]]],"modules":[{"n":0,"title":"Crypto From Zero","outcome":"go from never having owned crypto to a secured exchange account, a backed-up wallet, a first transfer you made yourself, and a first practice DeFi transaction.","icon":"compass","banner":"../assets/modules/module-00.png","intro":{"src":"../video/module-00-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"0.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>Crypto is money recorded on a public ledger that nobody can quietly edit. You&#39;ll open an exchange account, buy a little crypto, move it into a wallet only you control, and make your first practice DeFi transaction, all with a small amount and a checklist.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Blockchain\u003c/td>\n\u003ctd>a shared ledger kept by thousands of computers\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Wallet\u003c/td>\n\u003ctd>an app or device holding the keys that control your crypto\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Seed phrase\u003c/td>\n\u003ctd>12–24 words that are your wallet. Never share\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Exchange\u003c/td>\n\u003ctd>a company that swaps your money for crypto\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gas\u003c/td>\n\u003ctd>the network fee for a transaction\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.0:c0\">\u003cspan>A phone, a computer, ID for KYC, a bank account\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.0:c1\">\u003cspan>$50–$200 you can afford to lose while learning\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.0:c2\">\u003cspan>2–3 hours over a few days\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>Read Lesson 0.1, then secure your email with a unique password and authenticator-app 2FA. No money needed yet.\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Can explain blockchain, wallet and seed phrase in plain words\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Has a secured exchange account and a restore-tested wallet\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Completes the whole Day-1 Setup Kit and can coach a friend through it\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…every box of the Day-1 Setup Kit is ticked.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version Crypto is money recorded on a public ledger that nobody can quietly edit. You'll open an exchange account, buy a little crypto, move it into a wallet only you control, and make your first practice DeFi transaction, all with a small amount and a checklist. Words you'll need Term Meaning Blockchain a shared ledger kept by thousands of computers Wallet an app or device holding the keys that control your crypto Seed phrase 12–24 words that are your wallet. Never share Exchange a company that swaps your money for crypto Gas the network fee for a transaction Before you start [ ] A phone, a computer, ID for KYC, a bank account [ ] $50–$200 you can afford to lose while learning [ ] 2–3 hours over a few days Your first safe step Read Lesson 0.1, then secure your email with a unique password and authenticator app 2FA. No money needed yet. The mastery ladder Level You can… Beginner Can explain blockchain, wallet and seed phrase in plain words Practitioner Has a secured exchange account and a restore tested wallet Master Completes the whole Day 1 Setup Kit and can coach a friend through it You've mastered this module when… …every box of the Day 1 Setup Kit is ticked.","video":null,"script":"video-scripts/lessons/lesson-00-0.json"},{"id":"0.1","title":"Money, ledgers and why blockchains exist","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Explain in plain words what a blockchain is, what a cryptocurrency is, and what &quot;DeFi&quot; means.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Money is a record of who owns what.\u003c/strong> Your bank balance is a line in your bank&#39;s private ledger (record book). You trust the bank to keep it correct.\u003c/li>\n\u003cli>\u003cstrong>A blockchain\u003c/strong> is a ledger that thousands of computers keep a copy of and agree on together. New entries are added in batches called \u003cstrong>blocks\u003c/strong>, each linked to the one before: a chain of blocks. Nobody can quietly change an old entry, because everyone else&#39;s copy would disagree.\u003c/li>\n\u003cli>\u003cstrong>A cryptocurrency\u003c/strong> is a unit recorded on a blockchain. \u003cstrong>Bitcoin (BTC)\u003c/strong> was the first (2009). \u003cstrong>Ether (ETH)\u003c/strong> is the currency of the \u003cstrong>Ethereum\u003c/strong> blockchain, which also runs programs.\u003c/li>\n\u003cli>\u003cstrong>A smart contract\u003c/strong> is a program that lives on a blockchain and follows fixed rules, for example &quot;whoever deposits X gets Y back plus interest&quot;.\u003c/li>\n\u003cli>\u003cstrong>Stablecoins\u003c/strong> are tokens designed to stay worth $1 (e.g. USDC, USDT). You&#39;ll use them a lot, but they can fail (Lesson 1.5).\u003c/li>\n\u003cli>\u003cstrong>DeFi (decentralised finance)\u003c/strong> is financial services (trading, lending, earning interest) run by smart contracts instead of banks.\u003c/li>\n\u003cli>\u003cstrong>The trade-off:\u003c/strong> no bank in the middle means nobody can freeze your money, but also \u003cstrong>nobody can reverse your mistakes.\u003c/strong> That&#39;s why this program starts with safety.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>When Alice sends Bob 0.1 ETH, she doesn&#39;t send a file. She signs an instruction\n(&quot;move 0.1 ETH from my address to Bob&#39;s&quot;). The network checks she owns it,\nadds it to the next block, and every copy of the ledger updates. Bob now owns it.\nThere is no &quot;undo&quot; button.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.1:c0\">\u003cspan>I can explain a blockchain as &quot;a shared ledger nobody can quietly edit&quot;\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.1:c1\">\u003cspan>I know the difference between BTC, ETH and a stablecoin\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.1:c2\">\u003cspan>I understand that crypto transactions can&#39;t be reversed\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"0.1:q0\">\u003cdiv class=\"qtext\">Why can&#39;t someone quietly change an old blockchain entry?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Thousands of computers hold copies and would reject a version that doesn&#39;t match.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.1:q1\">\u003cdiv class=\"qtext\">What is a stablecoin designed to do?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Stay worth about $1 (or another currency). It can still fail.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.1:q2\">\u003cdiv class=\"qtext\">What does DeFi replace, and what do you give up?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It replaces banks and brokers with smart contracts. You give up anyone who can reverse mistakes or help recover funds.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Explain in plain words what a blockchain is, what a cryptocurrency is, and what \"DeFi\" means. Explanation Money is a record of who owns what. Your bank balance is a line in your bank's private ledger (record book). You trust the bank to keep it correct. A blockchain is a ledger that thousands of computers keep a copy of and agree on together. New entries are added in batches called blocks , each linked to the one before: a chain of blocks. Nobody can quietly change an old entry, because everyone else's copy would disagree. A cryptocurrency is a unit recorded on a blockchain. Bitcoin (BTC) was the first (2009). Ether (ETH) is the currency of the Ethereum blockchain, which also runs programs. A smart contract is a program that lives on a blockchain and follows fixed rules, for example \"whoever deposits X gets Y back plus interest\". Stablecoins are tokens designed to stay worth $1 (e.g. USDC, USDT). You'll use them a lot, but they can fail (Lesson 1.5). DeFi (decentralised finance) is financial services (trading, lending, earning interest) run by smart contracts instead of banks. The trade off: no bank in the middle means nobody can freeze your money, but also nobody can reverse your mistakes. That's why this program starts with safety. Worked example When Alice sends Bob 0.1 ETH, she doesn't send a file. She signs an instruction (\"move 0.1 ETH from my address to Bob's\"). The network checks she owns it, adds it to the next block, and every copy of the ledger updates. Bob now owns it. There is no \"undo\" button. Checklist [ ] I can explain a blockchain as \"a shared ledger nobody can quietly edit\" [ ] I know the difference between BTC, ETH and a stablecoin [ ] I understand that crypto transactions can't be reversed Quiz 1. Why can't someone quietly change an old blockchain entry? Thousands of computers hold copies and would reject a version that doesn't match. 2. What is a stablecoin designed to do? Stay worth about $1 (or another currency). It can still fail. 3. What does DeFi replace, and what do you give up? It replaces banks and brokers with smart contracts. You give up anyone who can reverse mistakes or help recover funds.","video":{"src":"../video/lesson-00-1.mp4","poster":"","vtt":"","chapters":[]},"script":"video-scripts/lessons/lesson-00-1.json"},{"id":"0.2","title":"Opening and securing an exchange account","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Open an account on a reputable exchange and lock it down before putting money in.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>An \u003cstrong>exchange\u003c/strong> is a company that lets you swap your normal money (dollars,\npounds, euros) for crypto. It&#39;s your \u003cstrong>on-ramp\u003c/strong>. Choose one that is:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Licensed or registered where you live\u003c/strong> (check your country&#39;s financial regulator)\u003c/li>\n\u003cli>\u003cstrong>Large and long-established\u003c/strong>, with a good security record\u003c/li>\n\u003cli>\u003cstrong>Supports your bank&#39;s deposit method\u003c/strong> and the coins/networks you&#39;ll use (ETH, USDC, and low-cost networks such as Arbitrum or Base)\u003c/li>\n\u003c/ul>\n\u003cp>Well-known examples include Coinbase, Kraken, Binance, Bybit and OKX, but\navailability differs by country. \u003cstrong>Pick one that&#39;s legally available to you.\u003c/strong>\u003c/p>\n\u003cp>You&#39;ll be asked for \u003cstrong>KYC\u003c/strong> (&quot;know your customer&quot;): ID and sometimes proof of\naddress. This is normal and legally required for regulated exchanges.\u003c/p>\n\u003cp>\u003cstrong>Secure it before depositing:\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Unique, long password\u003c/strong> stored in a \u003cstrong>password manager\u003c/strong> (e.g. Bitwarden, 1Password)\u003c/li>\n\u003cli>\u003cstrong>Secure your email first.\u003c/strong> Whoever controls your email can often reset your exchange account. Give it its own strong password and 2FA.\u003c/li>\n\u003cli>\u003cstrong>Two-factor authentication (2FA)\u003c/strong> with an \u003cstrong>authenticator app\u003c/strong> (e.g. Google Authenticator, Authy) or a \u003cstrong>hardware security key\u003c/strong>. \u003cstrong>Avoid SMS codes\u003c/strong>: phone numbers can be hijacked (&quot;SIM swap&quot;).\u003c/li>\n\u003cli>\u003cstrong>Save the 2FA backup codes\u003c/strong> offline (on paper, stored safely)\u003c/li>\n\u003cli>Turn on the \u003cstrong>anti-phishing code\u003c/strong> if offered (a word that appears in every real email from the exchange)\u003c/li>\n\u003cli>Turn on the \u003cstrong>withdrawal address allowlist\u003c/strong> if offered (withdrawals can only go to addresses you pre-approved)\u003c/li>\n\u003c/ol>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Maria signs up, completes KYC in 10 minutes, then spends another 10 on\nsecurity: password manager, authenticator-app 2FA on both her email and the\nexchange, backup codes on paper, and an anti-phishing code &quot;blue-kettle&quot;.\nLater, an email arrives about a &quot;suspicious login&quot; with no &quot;blue-kettle&quot; in it.\nShe knows it&#39;s fake and deletes it.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.2:c0\">\u003cspan>Exchange chosen: legally available and reputable where I live\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.2:c1\">\u003cspan>KYC complete\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.2:c2\">\u003cspan>Email secured with its own strong password + 2FA\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.2:c3\">\u003cspan>Exchange 2FA via authenticator app or security key (not SMS)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.2:c4\">\u003cspan>Backup codes stored offline\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.2:c5\">\u003cspan>Anti-phishing code and withdrawal allowlist switched on (if offered)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"0.2:q0\">\u003cdiv class=\"qtext\">Why secure your email before the exchange?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Email is often how accounts are reset. Whoever controls it can take over the exchange account.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.2:q1\">\u003cdiv class=\"qtext\">Why avoid SMS 2FA?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Attackers can hijack phone numbers (SIM swap) and receive your codes.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.2:q2\">\u003cdiv class=\"qtext\">What does a withdrawal allowlist do?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Only lets withdrawals go to addresses you approved in advance.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Open an account on a reputable exchange and lock it down before putting money in. Explanation An exchange is a company that lets you swap your normal money (dollars, pounds, euros) for crypto. It's your on ramp . Choose one that is: Licensed or registered where you live (check your country's financial regulator) Large and long established , with a good security record Supports your bank's deposit method and the coins/networks you'll use (ETH, USDC, and low cost networks such as Arbitrum or Base) Well known examples include Coinbase, Kraken, Binance, Bybit and OKX, but availability differs by country. Pick one that's legally available to you. You'll be asked for KYC (\"know your customer\"): ID and sometimes proof of address. This is normal and legally required for regulated exchanges. Secure it before depositing: 1. Unique, long password stored in a password manager (e.g. Bitwarden, 1Password) 2. Secure your email first. Whoever controls your email can often reset your exchange account. Give it its own strong password and 2FA. 3. Two factor authentication (2FA) with an authenticator app (e.g. Google Authenticator, Authy) or a hardware security key . Avoid SMS codes : phone numbers can be hijacked (\"SIM swap\"). 4. Save the 2FA backup codes offline (on paper, stored safely) 5. Turn on the anti phishing code if offered (a word that appears in every real email from the exchange) 6. Turn on the withdrawal address allowlist if offered (withdrawals can only go to addresses you pre approved) Worked example Maria signs up, completes KYC in 10 minutes, then spends another 10 on security: password manager, authenticator app 2FA on both her email and the exchange, backup codes on paper, and an anti phishing code \"blue kettle\". Later, an email arrives about a \"suspicious login\" with no \"blue kettle\" in it. She knows it's fake and deletes it. Checklist [ ] Exchange chosen: legally available and reputable where I live [ ] KYC complete [ ] Email secured with its own strong password + 2FA [ ] Exchange 2FA via authenticator app or security key (not SMS) [ ] Backup codes stored offline [ ] Anti phishing code and withdrawal allowlist switched on (if offered) Quiz 1. Why secure your email before the exchange? Email is often how accounts are reset. Whoever controls it can take over the exchange account. 2. Why avoid SMS 2FA? Attackers can hijack phone numbers (SIM swap) and receive your codes. 3. What does a withdrawal allowlist do? Only lets withdrawals go to addresses you approved in advance.","video":null,"script":"video-scripts/lessons/lesson-00-2.json"},{"id":"0.3","title":"Buying your first crypto without overpaying","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Fund your account and make a first purchase at a sensible cost.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Deposit\u003c/strong> your money, usually by bank transfer (cheapest) or card (fastest, most expensive).\u003c/li>\n\u003cli>\u003cstrong>Instant buy / convert\u003c/strong> buttons are simple but often include a \u003cstrong>spread\u003c/strong>\n(a price markup) plus a fee.\u003c/li>\n\u003cli>The \u003cstrong>trading screen\u003c/strong> (&quot;advanced&quot; or &quot;spot trading&quot;) uses an \u003cstrong>order book\u003c/strong>:\u003cul>\n\u003cli>\u003cstrong>Market order:\u003c/strong> buy now at the best available price\u003c/li>\n\u003cli>\u003cstrong>Limit order:\u003c/strong> buy only at your chosen price or better. It often has a lower fee (&quot;maker&quot; fee).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>What to buy first for this program:\u003c/strong> a little \u003cstrong>ETH\u003c/strong> (you need it to pay\nnetwork fees, called &quot;gas&quot;) and some \u003cstrong>USDC\u003c/strong> (a dollar stablecoin for practice).\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Buying $500 of ETH:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Route\u003c/th>\n\u003cth>Typical cost\u003c/th>\n\u003cth>You pay in fees\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Card + instant buy\u003c/td>\n\u003ctd>~3.99%\u003c/td>\n\u003ctd>~$19.95\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bank transfer + limit order\u003c/td>\n\u003ctd>~0.4%\u003c/td>\n\u003ctd>~$2.00\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Same ETH, ~$18 difference. Your exchange&#39;s fee page has the real numbers.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.3:c0\">\u003cspan>Deposited by the cheapest method available to me\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.3:c1\">\u003cspan>Bought a small amount of ETH (for gas) and USDC (for practice)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.3:c2\">\u003cspan>Tried a limit order on the trading screen\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.3:c3\">\u003cspan>Saved a record: date, amount, price, fees (you&#39;ll need records for tax)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"0.3:q0\">\u003cdiv class=\"qtext\">Why keep a little ETH even if you mostly want stablecoins?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>You need ETH to pay network fees (gas) on Ethereum and most of its low-cost networks.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.3:q1\">\u003cdiv class=\"qtext\">Market or limit order: which controls the price you pay?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A limit order.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.3:q2\">\u003cdiv class=\"qtext\">Why keep records from day one?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Most countries tax crypto gains. Records of dates, amounts, prices and fees make that straightforward.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Fund your account and make a first purchase at a sensible cost. Explanation Deposit your money, usually by bank transfer (cheapest) or card (fastest, most expensive). Instant buy / convert buttons are simple but often include a spread (a price markup) plus a fee. The trading screen (\"advanced\" or \"spot trading\") uses an order book : Market order: buy now at the best available price Limit order: buy only at your chosen price or better. It often has a lower fee (\"maker\" fee). What to buy first for this program: a little ETH (you need it to pay network fees, called \"gas\") and some USDC (a dollar stablecoin for practice). Worked example (illustrative fees) Buying $500 of ETH: Route Typical cost You pay in fees Card + instant buy ~3.99% ~$19.95 Bank transfer + limit order ~0.4% ~$2.00 Same ETH, ~$18 difference. Your exchange's fee page has the real numbers. Checklist [ ] Deposited by the cheapest method available to me [ ] Bought a small amount of ETH (for gas) and USDC (for practice) [ ] Tried a limit order on the trading screen [ ] Saved a record: date, amount, price, fees (you'll need records for tax) Quiz 1. Why keep a little ETH even if you mostly want stablecoins? You need ETH to pay network fees (gas) on Ethereum and most of its low cost networks. 2. Market or limit order: which controls the price you pay? A limit order. 3. Why keep records from day one? Most countries tax crypto gains. Records of dates, amounts, prices and fees make that straightforward.","video":null,"script":"video-scripts/lessons/lesson-00-3.json"},{"id":"0.4","title":"Exchange account vs your own wallet: who holds the keys?","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Understand custody and decide what stays on the exchange and what moves to your own wallet.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>On an exchange (custodial):\u003c/strong> the exchange holds your crypto and owes it to you. Easy, recoverable with ID, but if the exchange fails, freezes or is hacked, your money is at risk. \u003cem>&quot;Not your keys, not your coins.&quot;\u003c/em>\u003c/li>\n\u003cli>\u003cstrong>In your own wallet (self-custody):\u003c/strong> you hold the \u003cstrong>keys\u003c/strong>, which are the secret codes that control your crypto. Nobody can freeze it; nobody can recover it for you.\u003c/li>\n\u003cli>\u003cstrong>A wallet doesn&#39;t &quot;store&quot; coins.\u003c/strong> The coins are on the blockchain; the wallet holds the keys that let you move them. That&#39;s why a backup of the keys (your \u003cstrong>seed phrase\u003c/strong>) is the wallet.\u003c/li>\n\u003cli>\u003cstrong>Addresses:\u003c/strong> your wallet gives you a public \u003cstrong>address\u003c/strong> (like \u003ccode>0x7a3F…9c21\u003c/code>) to receive funds. Safe to share, like an account number.\u003c/li>\n\u003cli>\u003cstrong>Seed phrase / recovery phrase:\u003c/strong> 12 or 24 words that recreate your keys. \u003cstrong>Never share it, never type it into a website, never photograph it.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Exchange\u003c/th>\n\u003cth>Your wallet\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Who holds keys\u003c/td>\n\u003ctd>The exchange\u003c/td>\n\u003ctd>You\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Recover if you forget password\u003c/td>\n\u003ctd>Yes, with ID\u003c/td>\n\u003ctd>Only with your seed phrase\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Can be frozen\u003c/td>\n\u003ctd>Yes\u003c/td>\n\u003ctd>No\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Can use DeFi\u003c/td>\n\u003ctd>Limited\u003c/td>\n\u003ctd>Yes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Your main risk\u003c/td>\n\u003ctd>The company\u003c/td>\n\u003ctd>Your own mistakes and scams\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.4:c0\">\u003cspan>I can explain custodial vs self-custody\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.4:c1\">\u003cspan>I know my seed phrase \u003cstrong>is\u003c/strong> the wallet\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.4:c2\">\u003cspan>I know an address is safe to share and a seed phrase never is\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"0.4:q0\">\u003cdiv class=\"qtext\">What does &quot;not your keys, not your coins&quot; mean?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>If someone else holds the keys, you depend on them to give your crypto back.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.4:q1\">\u003cdiv class=\"qtext\">Is your crypto stored inside your wallet app?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. It&#39;s on the blockchain. The wallet holds the keys that control it.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.4:q2\">\u003cdiv class=\"qtext\">Which can you share: your address or your seed phrase?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Your address. Never the seed phrase.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Understand custody and decide what stays on the exchange and what moves to your own wallet. Explanation On an exchange (custodial): the exchange holds your crypto and owes it to you. Easy, recoverable with ID, but if the exchange fails, freezes or is hacked, your money is at risk. \"Not your keys, not your coins.\" In your own wallet (self custody): you hold the keys , which are the secret codes that control your crypto. Nobody can freeze it; nobody can recover it for you. A wallet doesn't \"store\" coins. The coins are on the blockchain; the wallet holds the keys that let you move them. That's why a backup of the keys (your seed phrase ) is the wallet. Addresses: your wallet gives you a public address (like 0x7a3F…9c21 ) to receive funds. Safe to share, like an account number. Seed phrase / recovery phrase: 12 or 24 words that recreate your keys. Never share it, never type it into a website, never photograph it. Exchange Your wallet Who holds keys The exchange You Recover if you forget password Yes, with ID Only with your seed phrase Can be frozen Yes No Can use DeFi Limited Yes Your main risk The company Your own mistakes and scams Checklist [ ] I can explain custodial vs self custody [ ] I know my seed phrase is the wallet [ ] I know an address is safe to share and a seed phrase never is Quiz 1. What does \"not your keys, not your coins\" mean? If someone else holds the keys, you depend on them to give your crypto back. 2. Is your crypto stored inside your wallet app? No. It's on the blockchain. The wallet holds the keys that control it. 3. Which can you share: your address or your seed phrase? Your address. Never the seed phrase.","video":null,"script":"video-scripts/lessons/lesson-00-4.json"},{"id":"0.5","title":"Setting up your wallet and backing it up","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Install a wallet safely, back up the seed phrase correctly, and prove the backup works.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Two kinds of wallet:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Software wallet\u003c/strong> (browser extension or phone app, e.g. MetaMask, Rabby): free, convenient; keys live on your computer/phone.\u003c/li>\n\u003cli>\u003cstrong>Hardware wallet\u003c/strong> (a small device, e.g. Ledger, Trezor): keys stay on the device; every transaction must be approved on its screen. \u003cstrong>Recommended once you hold more than you&#39;d be upset to lose.\u003c/strong> Buy only from the manufacturer&#39;s official website, never second-hand.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Safe install:\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Get the wallet from the \u003cstrong>official website\u003c/strong> (type the address yourself or use the link from the official site). Fake wallet apps and sponsored search ads are a common scam.\u003c/li>\n\u003cli>Create a \u003cstrong>new\u003c/strong> wallet. Never use a seed phrase someone else gave you or that came pre-printed in a box.\u003c/li>\n\u003cli>Write the seed phrase \u003cstrong>on paper\u003c/strong> (or stamp it into metal), in order, spelled exactly.\u003c/li>\n\u003cli>Store it somewhere private and safe from fire and water. For larger amounts, keep a second copy in a separate location.\u003c/li>\n\u003cli>\u003cstrong>Never\u003c/strong> store it in photos, email, notes apps, cloud drives or password managers.\u003c/li>\n\u003c/ol>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"Seed phrase: do and don't\" src=\"../assets/diagrams/seed-backup.png\">\u003cfigcaption>Seed phrase: do and don't\u003c/figcaption>\u003c/figure>\n\u003cp>\u003cstrong>Prove the backup works (do this now, with nothing in the wallet):\u003c/strong>\nremove the wallet (or use a second device), choose &quot;restore/import&quot;, enter\nyour written seed phrase, and check the \u003cstrong>same address\u003c/strong> appears.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Sam installs Rabby from its official site, writes 12 words on the card in his\nhardware wallet box (the card is blank, as it should be), restores on his\nlaptop, sees the same address \u003ccode>0x4b…e1\u003c/code>, and only then sends money to it.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.5:c0\">\u003cspan>Wallet installed from the official website\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.5:c1\">\u003cspan>New seed phrase written on paper (or metal), never digital\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.5:c2\">\u003cspan>Restore test done: same address appears\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.5:c3\">\u003cspan>Hardware wallet planned for larger amounts (bought from the maker directly)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"0.5:q0\">\u003cdiv class=\"qtext\">A wallet box contains a card with 24 words already printed. What do you do?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Don&#39;t use it. It&#39;s a scam. Genuine devices generate your seed phrase themselves.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.5:q1\">\u003cdiv class=\"qtext\">Why test the restore before depositing?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>To prove your written backup is correct while nothing is at risk.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.5:q2\">\u003cdiv class=\"qtext\">Is a cloud-drive photo of your seed phrase a safe backup?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. Anyone who gets into that account can take everything.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Install a wallet safely, back up the seed phrase correctly, and prove the backup works. Explanation Two kinds of wallet: Software wallet (browser extension or phone app, e.g. MetaMask, Rabby): free, convenient; keys live on your computer/phone. Hardware wallet (a small device, e.g. Ledger, Trezor): keys stay on the device; every transaction must be approved on its screen. Recommended once you hold more than you'd be upset to lose. Buy only from the manufacturer's official website, never second hand. Safe install: 1. Get the wallet from the official website (type the address yourself or use the link from the official site). Fake wallet apps and sponsored search ads are a common scam. 2. Create a new wallet. Never use a seed phrase someone else gave you or that came pre printed in a box. 3. Write the seed phrase on paper (or stamp it into metal), in order, spelled exactly. 4. Store it somewhere private and safe from fire and water. For larger amounts, keep a second copy in a separate location. 5. Never store it in photos, email, notes apps, cloud drives or password managers. Prove the backup works (do this now, with nothing in the wallet): remove the wallet (or use a second device), choose \"restore/import\", enter your written seed phrase, and check the same address appears. Worked example Sam installs Rabby from its official site, writes 12 words on the card in his hardware wallet box (the card is blank, as it should be), restores on his laptop, sees the same address 0x4b…e1 , and only then sends money to it. Checklist [ ] Wallet installed from the official website [ ] New seed phrase written on paper (or metal), never digital [ ] Restore test done: same address appears [ ] Hardware wallet planned for larger amounts (bought from the maker directly) Quiz 1. A wallet box contains a card with 24 words already printed. What do you do? Don't use it. It's a scam. Genuine devices generate your seed phrase themselves. 2. Why test the restore before depositing? To prove your written backup is correct while nothing is at risk. 3. Is a cloud drive photo of your seed phrase a safe backup? No. Anyone who gets into that account can take everything.","video":null,"script":"video-scripts/lessons/lesson-00-5.json"},{"id":"0.6","title":"Networks, gas and your first transfer","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Move crypto from the exchange to your own wallet safely, on the right network, starting with a test amount.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Networks (chains):\u003c/strong> the same token (e.g. USDC) can exist on several blockchains: \u003cstrong>Ethereum\u003c/strong> (the main one, higher fees) and cheaper \u003cstrong>Layer 2\u003c/strong> networks such as \u003cstrong>Arbitrum\u003c/strong>, \u003cstrong>Base\u003c/strong> and \u003cstrong>Optimism\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>The golden rule:\u003c/strong> the \u003cstrong>network you withdraw on must match a network your wallet (or the receiving service) supports.\u003c/strong> Sending on the wrong network can mean lost funds.\u003c/li>\n\u003cli>\u003cstrong>Gas:\u003c/strong> every transaction pays a small network fee in the network&#39;s gas token. On Ethereum and its Layer 2s that&#39;s \u003cstrong>ETH\u003c/strong>. Without a little ETH on the network you&#39;re using, you can&#39;t move anything.\u003c/li>\n\u003cli>Your wallet address is usually the \u003cstrong>same\u003c/strong> on Ethereum and its Layer 2s, but your balances are separate per network. Switch networks in your wallet to see them.\u003c/li>\n\u003c/ul>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"Your first transfer\" src=\"../assets/diagrams/first-transfer.png\">\u003cfigcaption>Your first transfer\u003c/figcaption>\u003c/figure>\n\u003cp>\u003cstrong>Step by step:\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>In your wallet, \u003cstrong>copy your address\u003c/strong> (use the copy button; never type it).\u003c/li>\n\u003cli>On the exchange, choose \u003cstrong>Withdraw\u003c/strong> → the coin → \u003cstrong>pick the network\u003c/strong> (for learning, a low-fee Layer 2 your wallet supports, e.g. Arbitrum or Base).\u003c/li>\n\u003cli>Paste the address. \u003cstrong>Check the first 6 and last 6 characters\u003c/strong> match your wallet. Better, check it all.\u003c/li>\n\u003cli>Send a \u003cstrong>small test\u003c/strong> first (e.g. $10 of ETH).\u003c/li>\n\u003cli>Wait for it to arrive; see it in your wallet on that network.\u003c/li>\n\u003cli>Only then send the rest. Add the address to the exchange \u003cstrong>allowlist\u003c/strong>.\u003c/li>\n\u003c/ol>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Withdrawing $100 of ETH to Arbitrum: exchange withdrawal fee ~$0.10–$1.\nLater, a swap on Arbitrum costs a few cents in gas. The same swap on Ethereum\nmight cost a few dollars, more when the network is busy. That&#39;s why beginners\nlearn on Layer 2s.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.6:c0\">\u003cspan>Network chosen on purpose, and supported by my wallet\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.6:c1\">\u003cspan>Address pasted, first and last 6 characters checked\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.6:c2\">\u003cspan>Test amount sent and received before the rest\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.6:c3\">\u003cspan>A little ETH held on that network for gas\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.6:c4\">\u003cspan>Address added to the exchange withdrawal allowlist\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"0.6:q0\">\u003cdiv class=\"qtext\">What&#39;s the golden rule of withdrawals?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The network you send on must be one the receiving wallet or service supports.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.6:q1\">\u003cdiv class=\"qtext\">You have USDC on Arbitrum but zero ETH there. Can you send it?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. You need a little ETH on Arbitrum to pay gas.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.6:q2\">\u003cdiv class=\"qtext\">Why send a test amount?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>To confirm the address and network are right before risking the full amount.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Move crypto from the exchange to your own wallet safely, on the right network, starting with a test amount. Explanation Networks (chains): the same token (e.g. USDC) can exist on several blockchains: Ethereum (the main one, higher fees) and cheaper Layer 2 networks such as Arbitrum , Base and Optimism . The golden rule: the network you withdraw on must match a network your wallet (or the receiving service) supports. Sending on the wrong network can mean lost funds. Gas: every transaction pays a small network fee in the network's gas token. On Ethereum and its Layer 2s that's ETH . Without a little ETH on the network you're using, you can't move anything. Your wallet address is usually the same on Ethereum and its Layer 2s, but your balances are separate per network. Switch networks in your wallet to see them. Step by step: 1. In your wallet, copy your address (use the copy button; never type it). 2. On the exchange, choose Withdraw → the coin → pick the network (for learning, a low fee Layer 2 your wallet supports, e.g. Arbitrum or Base). 3. Paste the address. Check the first 6 and last 6 characters match your wallet. Better, check it all. 4. Send a small test first (e.g. $10 of ETH). 5. Wait for it to arrive; see it in your wallet on that network. 6. Only then send the rest. Add the address to the exchange allowlist . Worked example (illustrative) Withdrawing $100 of ETH to Arbitrum: exchange withdrawal fee ~$0.10–$1. Later, a swap on Arbitrum costs a few cents in gas. The same swap on Ethereum might cost a few dollars, more when the network is busy. That's why beginners learn on Layer 2s. Checklist [ ] Network chosen on purpose, and supported by my wallet [ ] Address pasted, first and last 6 characters checked [ ] Test amount sent and received before the rest [ ] A little ETH held on that network for gas [ ] Address added to the exchange withdrawal allowlist Quiz 1. What's the golden rule of withdrawals? The network you send on must be one the receiving wallet or service supports. 2. You have USDC on Arbitrum but zero ETH there. Can you send it? No. You need a little ETH on Arbitrum to pay gas. 3. Why send a test amount? To confirm the address and network are right before risking the full amount.","video":null,"script":"video-scripts/lessons/lesson-00-6.json"},{"id":"0.7","title":"Your first DeFi steps (practice mode first)","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Connect your wallet to a DeFi app, understand what you&#39;re signing, and practise on a free test network before using real money.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Connect wallet:\u003c/strong> lets a site \u003cem>see\u003c/em> your address. It can&#39;t move funds by itself.\u003c/li>\n\u003cli>\u003cstrong>Sign a message:\u003c/strong> proves you own the address (e.g. to log in). Read it. Some &quot;messages&quot; are really permissions (Lesson 1.4).\u003c/li>\n\u003cli>\u003cstrong>Approve:\u003c/strong> gives an app permission to move a specific token. Limit the amount.\u003c/li>\n\u003cli>\u003cstrong>Transaction:\u003c/strong> actually does something (swap, deposit) and costs gas.\u003c/li>\n\u003cli>\u003cstrong>Testnets\u003c/strong> are practice blockchains with free, worthless coins. Ethereum&#39;s main one is \u003cstrong>Sepolia\u003c/strong>. You get test ETH from a \u003cstrong>faucet\u003c/strong> (a free giveaway site). Use testnets to practise without risk.\u003c/li>\n\u003cli>\u003cstrong>Revoke\u003c/strong> permissions you no longer need with a tool such as revoke.cash.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Practice run:\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Add the Sepolia test network in your wallet (most wallets have a &quot;show test networks&quot; setting).\u003c/li>\n\u003cli>Get free test ETH from a Sepolia faucet.\u003c/li>\n\u003cli>Make a test swap on a testnet version of a well-known DEX (or send test ETH to yourself).\u003c/li>\n\u003cli>Look up the transaction on a block explorer (Lesson 1.2).\u003c/li>\n\u003cli>Then, on a Layer 2 with a \u003cstrong>tiny\u003c/strong> real amount: connect to a well-known app,\nread every prompt, do one small swap, then revoke the approval.\u003c/li>\n\u003c/ol>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Priya connects to a DEX on Arbitrum. Her wallet shows &quot;Approve USDC: Unlimited&quot;.\nShe edits it to $20, swaps $20 of USDC for ETH, pays ~$0.05 in gas, checks the\ntransaction on the explorer, then revokes the approval. Total cost: a few cents.\nTotal lessons learned: five.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.7:c0\">\u003cspan>I know the difference between connect, sign, approve and transact\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.7:c1\">\u003cspan>Practised on the Sepolia testnet\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.7:c2\">\u003cspan>Made one small real swap on a Layer 2 with a limited approval\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.7:c3\">\u003cspan>Found my transaction on a block explorer\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.7:c4\">\u003cspan>Revoked the approval afterwards\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"0.7:q0\">\u003cdiv class=\"qtext\">Can &quot;connect wallet&quot; move your funds?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. It shares your address. Approvals and transactions are what move funds.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.7:q1\">\u003cdiv class=\"qtext\">What is a testnet for?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Practising with worthless coins, so mistakes cost nothing.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.7:q2\">\u003cdiv class=\"qtext\">What should you do with an approval after you&#39;re done?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Revoke it, or limit it to the amount needed in the first place.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Connect your wallet to a DeFi app, understand what you're signing, and practise on a free test network before using real money. Explanation Connect wallet: lets a site see your address. It can't move funds by itself. Sign a message: proves you own the address (e.g. to log in). Read it. Some \"messages\" are really permissions (Lesson 1.4). Approve: gives an app permission to move a specific token. Limit the amount. Transaction: actually does something (swap, deposit) and costs gas. Testnets are practice blockchains with free, worthless coins. Ethereum's main one is Sepolia . You get test ETH from a faucet (a free giveaway site). Use testnets to practise without risk. Revoke permissions you no longer need with a tool such as revoke.cash. Practice run: 1. Add the Sepolia test network in your wallet (most wallets have a \"show test networks\" setting). 2. Get free test ETH from a Sepolia faucet. 3. Make a test swap on a testnet version of a well known DEX (or send test ETH to yourself). 4. Look up the transaction on a block explorer (Lesson 1.2). 5. Then, on a Layer 2 with a tiny real amount: connect to a well known app, read every prompt, do one small swap, then revoke the approval. Worked example Priya connects to a DEX on Arbitrum. Her wallet shows \"Approve USDC: Unlimited\". She edits it to $20, swaps $20 of USDC for ETH, pays ~$0.05 in gas, checks the transaction on the explorer, then revokes the approval. Total cost: a few cents. Total lessons learned: five. Checklist [ ] I know the difference between connect, sign, approve and transact [ ] Practised on the Sepolia testnet [ ] Made one small real swap on a Layer 2 with a limited approval [ ] Found my transaction on a block explorer [ ] Revoked the approval afterwards Quiz 1. Can \"connect wallet\" move your funds? No. It shares your address. Approvals and transactions are what move funds. 2. What is a testnet for? Practising with worthless coins, so mistakes cost nothing. 3. What should you do with an approval after you're done? Revoke it, or limit it to the amount needed in the first place.","video":null,"script":"video-scripts/lessons/lesson-00-7.json"},{"id":"0.8","title":"Your security baseline, and the language of DeFi","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Lock in the habits that prevent most losses, and learn the words used in the rest of the program.\u003c/p>\n\u003c/section>\u003ch3>Explanation — the 10 rules\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Never share your seed phrase.\u003c/strong> No real person or company will ever ask for it.\u003c/li>\n\u003cli>\u003cstrong>Bookmark\u003c/strong> the sites you use; never reach them from ads, DMs or emails.\u003c/li>\n\u003cli>\u003cstrong>Nobody legitimate DMs you first\u003c/strong> offering help, investments or &quot;recovery&quot;.\u003c/li>\n\u003cli>\u003cstrong>Guaranteed returns are a scam.\u003c/strong> Always.\u003c/li>\n\u003cli>\u003cstrong>Read every wallet prompt\u003c/strong> before approving: what, how much, to whom.\u003c/li>\n\u003cli>\u003cstrong>Test first\u003c/strong> with a small amount on anything new.\u003c/li>\n\u003cli>\u003cstrong>Use a hardware wallet\u003c/strong> once the amount matters to you.\u003c/li>\n\u003cli>\u003cstrong>Keep devices updated\u003c/strong>, and use a separate browser profile for crypto.\u003c/li>\n\u003cli>\u003cstrong>Keep records\u003c/strong> of every buy, sell, transfer and fee.\u003c/li>\n\u003cli>\u003cstrong>If something feels urgent, stop.\u003c/strong> Scammers create urgency; real opportunities wait.\u003c/li>\n\u003c/ol>\n\u003ch3>Glossary (the words you&#39;ll meet next)\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Word\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Address\u003c/td>\n\u003ctd>Your public &quot;account number&quot; on a blockchain\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Seed phrase\u003c/td>\n\u003ctd>12–24 words that recreate your wallet&#39;s keys. Never share\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Private key\u003c/td>\n\u003ctd>The secret that signs transactions (your seed phrase generates it)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Custody\u003c/td>\n\u003ctd>Who holds the keys: an exchange (custodial) or you (self-custody)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gas\u003c/td>\n\u003ctd>The network fee for a transaction, paid in the network&#39;s token\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Network / chain\u003c/td>\n\u003ctd>A blockchain, e.g. Ethereum, Arbitrum, Base\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Layer 2 (L2)\u003c/td>\n\u003ctd>A cheaper, faster network built on top of Ethereum\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Token\u003c/td>\n\u003ctd>A unit of value on a blockchain, e.g. USDC\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stablecoin\u003c/td>\n\u003ctd>A token designed to hold a steady value, usually $1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Smart contract\u003c/td>\n\u003ctd>A program on a blockchain that follows fixed rules\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEX\u003c/td>\n\u003ctd>Decentralised exchange: swap tokens from your wallet\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Approval\u003c/td>\n\u003ctd>Permission for an app to move a specific token\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Block explorer\u003c/td>\n\u003ctd>A website that shows every transaction (e.g. Etherscan)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Testnet / faucet\u003c/td>\n\u003ctd>A practice blockchain / a site giving free test coins\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>APY\u003c/td>\n\u003ctd>Annual percentage yield: yearly return including compounding\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Liquidity\u003c/td>\n\u003ctd>How easily something can be bought or sold without moving the price\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>KYC\u003c/td>\n\u003ctd>ID checks required by regulated exchanges\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2FA\u003c/td>\n\u003ctd>Two-factor authentication: a second proof of identity at login\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c0\">\u003cspan>I&#39;ve read the 10 rules and can repeat them\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c1\">\u003cspan>Separate browser profile set up for crypto\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c2\">\u003cspan>I know every word in the glossary\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"0.8:q0\">\u003cdiv class=\"qtext\">Someone offers a &quot;guaranteed 2% a day&quot;. What is it?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A scam. Guaranteed returns don&#39;t exist.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.8:q1\">\u003cdiv class=\"qtext\">What&#39;s gas?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The network fee for a transaction, paid in the network&#39;s token.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"0.8:q2\">\u003cdiv class=\"qtext\">A message says your wallet will be &quot;suspended&quot; unless you act in 1 hour. What do you do?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Stop. Urgency is a scam tactic. Wallets can&#39;t be suspended; check only through bookmarked official sites.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003chr>\n\u003ch2>The Day-1 Setup Kit\u003c/h2>\n\u003cp>Print this, and tick every box in order. When all boxes are ticked, you&#39;re\nready for Module 1. Allow \u003cstrong>2–3 hours\u003c/strong> in total, spread over a few days\n(deposits and KYC can take time).\u003c/p>\n\u003cp>\u003cstrong>What you need:\u003c/strong> ID for KYC · a bank account · a smartphone for the\nauthenticator app · a computer with an up-to-date browser · pen and paper (or\na metal backup plate) · optional: a hardware wallet bought from the maker.\u003c/p>\n\u003c/section>\u003ch3>Part A — Accounts (≈ 45 min)\u003c/h3>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c3\">\u003cspan>Password manager installed; master password written down and stored safely\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c4\">\u003cspan>Email secured: unique password + authenticator-app 2FA\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c5\">\u003cspan>Authenticator app installed on your phone\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c6\">\u003cspan>Exchange chosen (legally available to you, reputable)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c7\">\u003cspan>Exchange account opened and KYC completed\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c8\">\u003cspan>Exchange 2FA on (authenticator or security key, not SMS); backup codes stored offline\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c9\">\u003cspan>Anti-phishing code and withdrawal allowlist switched on\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003ch3>Part B — First purchase (≈ 20 min)\u003c/h3>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c10\">\u003cspan>Deposited a small learning amount by the cheapest method\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c11\">\u003cspan>Bought a little ETH (gas) and some USDC (practice)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c12\">\u003cspan>Tried a limit order\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c13\">\u003cspan>Started a simple records sheet: date, action, amount, price, fees\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003ch3>Part C — Your wallet (≈ 30 min)\u003c/h3>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c14\">\u003cspan>Wallet installed from the official website (separate browser profile)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c15\">\u003cspan>New seed phrase written on paper/metal, in order; never digital\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c16\">\u003cspan>Restore test passed: same address appears\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c17\">\u003cspan>Wallet address saved in the password manager&#39;s notes (address only, \u003cstrong>never the seed\u003c/strong>)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003ch3>Part D — First transfer (≈ 20 min)\u003c/h3>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c18\">\u003cspan>Network chosen (low-fee L2 supported by your wallet)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c19\">\u003cspan>Test withdrawal (e.g. $10 of ETH) sent and received\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c20\">\u003cspan>Remaining learning funds sent; address added to the allowlist\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c21\">\u003cspan>Transfer found on a block explorer\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003ch3>Part E — Practice DeFi (≈ 30 min)\u003c/h3>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c22\">\u003cspan>Sepolia test network added; free test ETH from a faucet\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c23\">\u003cspan>One practice transaction on the testnet\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c24\">\u003cspan>One tiny real swap on an L2 with a limited approval\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c25\">\u003cspan>Approval revoked afterwards\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003ch3>Part F — Security baseline (≈ 15 min)\u003c/h3>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c26\">\u003cspan>The 10 rules read and understood\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c27\">\u003cspan>Sites bookmarked; no links from ads or DMs\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c28\">\u003cspan>Hardware wallet ordered from the maker (when the amount will matter)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"0.8:c29\">\u003cspan>Records sheet up to date\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>All ticked? You&#39;re ready for Module 1 — Foundations &amp; Safety.\u003c/strong>\u003c/p>\n","text":"Objective Lock in the habits that prevent most losses, and learn the words used in the rest of the program. Explanation — the 10 rules 1. Never share your seed phrase. No real person or company will ever ask for it. 2. Bookmark the sites you use; never reach them from ads, DMs or emails. 3. Nobody legitimate DMs you first offering help, investments or \"recovery\". 4. Guaranteed returns are a scam. Always. 5. Read every wallet prompt before approving: what, how much, to whom. 6. Test first with a small amount on anything new. 7. Use a hardware wallet once the amount matters to you. 8. Keep devices updated , and use a separate browser profile for crypto. 9. Keep records of every buy, sell, transfer and fee. 10. If something feels urgent, stop. Scammers create urgency; real opportunities wait. Glossary (the words you'll meet next) Word Meaning Address Your public \"account number\" on a blockchain Seed phrase 12–24 words that recreate your wallet's keys. Never share Private key The secret that signs transactions (your seed phrase generates it) Custody Who holds the keys: an exchange (custodial) or you (self custody) Gas The network fee for a transaction, paid in the network's token Network / chain A blockchain, e.g. Ethereum, Arbitrum, Base Layer 2 (L2) A cheaper, faster network built on top of Ethereum Token A unit of value on a blockchain, e.g. USDC Stablecoin A token designed to hold a steady value, usually $1 Smart contract A program on a blockchain that follows fixed rules DEX Decentralised exchange: swap tokens from your wallet Approval Permission for an app to move a specific token Block explorer A website that shows every transaction (e.g. Etherscan) Testnet / faucet A practice blockchain / a site giving free test coins APY Annual percentage yield: yearly return including compounding Liquidity How easily something can be bought or sold without moving the price KYC ID checks required by regulated exchanges 2FA Two factor authentication: a second proof of identity at login Checklist [ ] I've read the 10 rules and can repeat them [ ] Separate browser profile set up for crypto [ ] I know every word in the glossary Quiz 1. Someone offers a \"guaranteed 2% a day\". What is it? A scam. Guaranteed returns don't exist. 2. What's gas? The network fee for a transaction, paid in the network's token. 3. A message says your wallet will be \"suspended\" unless you act in 1 hour. What do you do? Stop. Urgency is a scam tactic. Wallets can't be suspended; check only through bookmarked official sites. The Day 1 Setup Kit Print this, and tick every box in order. When all boxes are ticked, you're ready for Module 1. Allow 2–3 hours in total, spread over a few days (deposits and KYC can take time). What you need: ID for KYC · a bank account · a smartphone for the authenticator app · a computer with an up to date browser · pen and paper (or a metal backup plate) · optional: a hardware wallet bought from the maker. Part A — Accounts (≈ 45 min) [ ] Password manager installed; master password written down and stored safely [ ] Email secured: unique password + authenticator app 2FA [ ] Authenticator app installed on your phone [ ] Exchange chosen (legally available to you, reputable) [ ] Exchange account opened and KYC completed [ ] Exchange 2FA on (authenticator or security key, not SMS); backup codes stored offline [ ] Anti phishing code and withdrawal allowlist switched on Part B — First purchase (≈ 20 min) [ ] Deposited a small learning amount by the cheapest method [ ] Bought a little ETH (gas) and some USDC (practice) [ ] Tried a limit order [ ] Started a simple records sheet: date, action, amount, price, fees Part C — Your wallet (≈ 30 min) [ ] Wallet installed from the official website (separate browser profile) [ ] New seed phrase written on paper/metal, in order; never digital [ ] Restore test passed: same address appears [ ] Wallet address saved in the password manager's notes (address only, never the seed ) Part D — First transfer (≈ 20 min) [ ] Network chosen (low fee L2 supported by your wallet) [ ] Test withdrawal (e.g. $10 of ETH) sent and received [ ] Remaining learning funds sent; address added to the allowlist [ ] Transfer found on a block explorer Part E — Practice DeFi (≈ 30 min) [ ] Sepolia test network added; free test ETH from a faucet [ ] One practice transaction on the testnet [ ] One tiny real swap on an L2 with a limited approval [ ] Approval revoked afterwards Part F — Security baseline (≈ 15 min) [ ] The 10 rules read and understood [ ] Sites bookmarked; no links from ads or DMs [ ] Hardware wallet ordered from the maker (when the amount will matter) [ ] Records sheet up to date All ticked? You're ready for Module 1 — Foundations & Safety.","video":null,"script":"video-scripts/lessons/lesson-00-8.json"}]},{"n":1,"title":"Foundations & Safety","outcome":"set up and use a wallet safely, and know what can go irreversibly wrong before any capital moves.","icon":"shield","banner":"../assets/modules/module-01.png","intro":{"src":"../video/module-01-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"1.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>Most crypto losses aren&#39;t market losses; they&#39;re mistakes and scams: a seed phrase typed into a fake site, an approval signed without reading, the wrong network. This module builds the habits that prevent them.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Private key\u003c/td>\n\u003ctd>the secret that signs transactions\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Approval\u003c/td>\n\u003ctd>permission for an app to move a token\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Multisig\u003c/td>\n\u003ctd>a wallet that needs several keys to act\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Phishing\u003c/td>\n\u003ctd>a fake site or message built to steal\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Simulation\u003c/td>\n\u003ctd>a preview of what a transaction will change\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.0:c0\">\u003cspan>Module 0 done (secured exchange, restore-tested wallet)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.0:c1\">\u003cspan>A small amount in a wallet on a low-fee network\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>Open your wallet&#39;s approvals (or a revoke tool), list every approval you&#39;ve granted, and revoke any you don&#39;t use.\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Uses a separate burner wallet and reads every prompt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Runs the before-signing checklist without notes; limited approvals; hardware wallet\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Multisig vault, simulation on every signature, private addresses, tested recovery\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…you can take a new app from first visit to a limited, simulated, verified transaction, and revoke it after.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version Most crypto losses aren't market losses; they're mistakes and scams: a seed phrase typed into a fake site, an approval signed without reading, the wrong network. This module builds the habits that prevent them. Words you'll need Term Meaning Private key the secret that signs transactions Approval permission for an app to move a token Multisig a wallet that needs several keys to act Phishing a fake site or message built to steal Simulation a preview of what a transaction will change Before you start [ ] Module 0 done (secured exchange, restore tested wallet) [ ] A small amount in a wallet on a low fee network Your first safe step Open your wallet's approvals (or a revoke tool), list every approval you've granted, and revoke any you don't use. The mastery ladder Level You can… Beginner Uses a separate burner wallet and reads every prompt Practitioner Runs the before signing checklist without notes; limited approvals; hardware wallet Master Multisig vault, simulation on every signature, private addresses, tested recovery You've mastered this module when… …you can take a new app from first visit to a limited, simulated, verified transaction, and revoke it after.","video":null,"script":"video-scripts/lessons/lesson-01-0.json"},{"id":"1.1","title":"What DeFi is, and the risk-first mindset","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Describe the DeFi stack and explain why every yield is payment for a risk.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>DeFi replaces intermediaries (banks, brokers, exchanges) with \u003cstrong>smart\ncontracts\u003c/strong>: public programs on a blockchain that hold assets and follow fixed\nrules. The stack, bottom to top:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Blockchain\u003c/strong>: records every balance and transaction (Ethereum, L2s, other chains).\u003c/li>\n\u003cli>\u003cstrong>Smart contracts\u003c/strong>: the protocol logic (a lending market, an exchange pool).\u003c/li>\n\u003cli>\u003cstrong>Tokens\u003c/strong>: the assets the contracts move.\u003c/li>\n\u003cli>\u003cstrong>Wallets\u003c/strong>: where \u003cem>you\u003c/em> hold keys and sign actions.\u003c/li>\n\u003cli>\u003cstrong>Interfaces\u003c/strong>: websites that build transactions for you. They&#39;re a convenience, not the protocol itself.\u003c/li>\n\u003cli>\u003cstrong>Data layers\u003c/strong>: explorers and dashboards you use to verify what happened.\u003c/li>\n\u003c/ol>\n\u003cp>Three properties make DeFi powerful and dangerous:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Self-custody\u003c/strong>: nobody can freeze your funds, and nobody can recover them either.\u003c/li>\n\u003cli>\u003cstrong>Composability\u003c/strong>: protocols plug into each other. That makes products powerful, and a position can fail because of something it depends on.\u003c/li>\n\u003cli>\u003cstrong>Transparency\u003c/strong>: you can verify everything on-chain. Transparent doesn&#39;t mean safe.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Risk-first rule:\u003c/strong> before comparing returns, list what could make you lose\nmoney. A higher yield means you&#39;re being paid to carry more risk, whether or\nnot the website mentions it.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A pool advertises \u00
