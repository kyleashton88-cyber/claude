3cstrong>12% APY on a stablecoin\u003c/strong>. Before depositing, ask:\u003c/p>\n\u003cul>\n\u003cli>Where does the 12% come from? Borrowers paying interest, trading fees, or a reward token?\u003c/li>\n\u003cli>Which stablecoin, and what backs it? (Lesson 1.5)\u003c/li>\n\u003cli>Which contracts hold the money, and who can upgrade them?\u003c/li>\n\u003cli>Is there a bridge or oracle involved?\u003c/li>\n\u003cli>How do I withdraw, and could withdrawals be blocked?\u003c/li>\n\u003c/ul>\n\u003cp>If you can&#39;t answer these, you don&#39;t know what the 12% is paying you for.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.1:c0\">\u003cspan>I can name the six layers of the DeFi stack\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.1:c1\">\u003cspan>I can explain why self-custody cuts both ways\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.1:c2\">\u003cspan>Before any yield, I ask &quot;what am I being paid to risk?&quot;\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"1.1:q0\">\u003cdiv class=\"qtext\">Why can composability increase risk?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A position inherits the failure risk of every protocol, asset, oracle and bridge it depends on.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.1:q1\">\u003cdiv class=\"qtext\">Is a website the same thing as the protocol?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. The interface only builds transactions. The contracts are the protocol, and interfaces can be faked or compromised.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.1:q2\">\u003cdiv class=\"qtext\">What is the risk-first mindset in one sentence?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Identify what could make you lose money before you compare returns.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Describe the DeFi stack and explain why every yield is payment for a risk. Explanation DeFi replaces intermediaries (banks, brokers, exchanges) with smart contracts : public programs on a blockchain that hold assets and follow fixed rules. The stack, bottom to top: 1. Blockchain : records every balance and transaction (Ethereum, L2s, other chains). 2. Smart contracts : the protocol logic (a lending market, an exchange pool). 3. Tokens : the assets the contracts move. 4. Wallets : where you hold keys and sign actions. 5. Interfaces : websites that build transactions for you. They're a convenience, not the protocol itself. 6. Data layers : explorers and dashboards you use to verify what happened. Three properties make DeFi powerful and dangerous: Self custody : nobody can freeze your funds, and nobody can recover them either. Composability : protocols plug into each other. That makes products powerful, and a position can fail because of something it depends on. Transparency : you can verify everything on chain. Transparent doesn't mean safe. Risk first rule: before comparing returns, list what could make you lose money. A higher yield means you're being paid to carry more risk, whether or not the website mentions it. Worked example A pool advertises 12% APY on a stablecoin . Before depositing, ask: Where does the 12% come from? Borrowers paying interest, trading fees, or a reward token? Which stablecoin, and what backs it? (Lesson 1.5) Which contracts hold the money, and who can upgrade them? Is there a bridge or oracle involved? How do I withdraw, and could withdrawals be blocked? If you can't answer these, you don't know what the 12% is paying you for. Checklist [ ] I can name the six layers of the DeFi stack [ ] I can explain why self custody cuts both ways [ ] Before any yield, I ask \"what am I being paid to risk?\" Quiz 1. Why can composability increase risk? A position inherits the failure risk of every protocol, asset, oracle and bridge it depends on. 2. Is a website the same thing as the protocol? No. The interface only builds transactions. The contracts are the protocol, and interfaces can be faked or compromised. 3. What is the risk first mindset in one sentence? Identify what could make you lose money before you compare returns.","video":null,"script":"video-scripts/lessons/lesson-01-1.json"},{"id":"1.2","title":"How a transaction actually happens","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Follow a transaction from signature to finality, and estimate its cost.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>\u003cstrong>Lifecycle:\u003c/strong> create → sign → broadcast → mempool (waiting) → included in a\nblock → confirmed → final.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Gas\u003c/strong> is the unit of computation. Cost = \u003ccode>gas used × gas price\u003c/code>. On\nEthereum the price has a \u003cem>base fee\u003c/em> (burned) plus a \u003cem>priority tip\u003c/em>\n(to get included sooner). Gas price is quoted in \u003cstrong>gwei\u003c/strong> (1 gwei = 0.000000001 ETH).\u003c/li>\n\u003cli>\u003cstrong>Nonce\u003c/strong>: each account&#39;s transactions are numbered in order. A stuck\nlow-nonce transaction blocks all later ones until it confirms or is\n\u003cstrong>replaced\u003c/strong> (same nonce, higher fee).\u003c/li>\n\u003cli>\u003cstrong>Failed transactions still cost gas.\u003c/strong> The network did the computation even though the result was reverted.\u003c/li>\n\u003cli>\u003cstrong>Finality\u003c/strong>: the point after which a transaction can&#39;t realistically be\nreversed. It differs by chain, and L2s have their own rules (Module 5).\u003c/li>\n\u003cli>\u003cstrong>Explorers\u003c/strong> (e.g. Etherscan) show status, fee, sender, contract called, token transfers and logs.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A swap uses \u003cstrong>150,000 gas\u003c/strong> at \u003cstrong>20 gwei\u003c/strong>:\n\u003ccode>150,000 × 20 = 3,000,000 gwei = 0.003 ETH\u003c/code>. At $3,000/ETH that&#39;s \u003cstrong>$9\u003c/strong>.\nThe same swap during congestion at 80 gwei costs \u003cstrong>$36\u003c/strong>. If you&#39;re compounding\n$1.50 of rewards, the gas costs more than the rewards. That&#39;s why position\nsize matters on-chain.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.2:c0\">\u003cspan>I check the fee estimate before signing\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.2:c1\">\u003cspan>I know how to find my transaction on an explorer\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.2:c2\">\u003cspan>I know a stuck transaction can be sped up or cancelled with the same nonce\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"1.2:q0\">\u003cdiv class=\"qtext\">Your transaction reverted. Did you pay?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Yes, for the gas used up to the point of failure.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.2:q1\">\u003cdiv class=\"qtext\">200,000 gas at 10 gwei with ETH at $2,500 costs?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>2,000,000 gwei = 0.002 ETH = $5.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.2:q2\">\u003cdiv class=\"qtext\">Why are your newer transactions all pending?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>An earlier nonce is stuck. Replace or speed it up, and the rest follow.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Follow a transaction from signature to finality, and estimate its cost. Explanation Lifecycle: create → sign → broadcast → mempool (waiting) → included in a block → confirmed → final. Gas is the unit of computation. Cost = gas used × gas price . On Ethereum the price has a base fee (burned) plus a priority tip (to get included sooner). Gas price is quoted in gwei (1 gwei = 0.000000001 ETH). Nonce : each account's transactions are numbered in order. A stuck low nonce transaction blocks all later ones until it confirms or is replaced (same nonce, higher fee). Failed transactions still cost gas. The network did the computation even though the result was reverted. Finality : the point after which a transaction can't realistically be reversed. It differs by chain, and L2s have their own rules (Module 5). Explorers (e.g. Etherscan) show status, fee, sender, contract called, token transfers and logs. Worked example A swap uses 150,000 gas at 20 gwei : 150,000 × 20 = 3,000,000 gwei = 0.003 ETH . At $3,000/ETH that's $9 . The same swap during congestion at 80 gwei costs $36 . If you're compounding $1.50 of rewards, the gas costs more than the rewards. That's why position size matters on chain. Checklist [ ] I check the fee estimate before signing [ ] I know how to find my transaction on an explorer [ ] I know a stuck transaction can be sped up or cancelled with the same nonce Quiz 1. Your transaction reverted. Did you pay? Yes, for the gas used up to the point of failure. 2. 200,000 gas at 10 gwei with ETH at $2,500 costs? 2,000,000 gwei = 0.002 ETH = $5. 3. Why are your newer transactions all pending? An earlier nonce is stuck. Replace or speed it up, and the rest follow.","video":null,"script":"video-scripts/lessons/lesson-01-2.json"},{"id":"1.3","title":"Wallets, keys, hardware & multisig","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Set up a wallet structure where one mistake can&#39;t lose everything.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Private key\u003c/strong>: the authority to sign. Whoever has it controls the funds.\u003c/li>\n\u003cli>\u003cstrong>Seed phrase\u003c/strong>: 12–24 words that recreate your keys. \u003cstrong>Never type it into\na website, never photograph it, never share it. No legitimate support team\nwill ever ask for it.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Hardware wallet\u003c/strong>: keeps keys on a separate device. Signing requires physical confirmation.\u003c/li>\n\u003cli>\u003cstrong>Multisig\u003c/strong>: needs M of N signers (e.g. 2 of 3). Good for large or shared funds.\u003c/li>\n\u003cli>\u003cstrong>Smart wallets\u003c/strong>: contract accounts that can add spending limits, recovery and batching.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Compartmentalise:\u003c/strong> separate wallets by job, so a compromise only reaches one of them.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"The 3-wallet setup\" src=\"../assets/diagrams/three-wallets.png\">\u003cfigcaption>The 3-wallet setup\u003c/figcaption>\u003c/figure>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Wallet\u003c/th>\n\u003cth>Holds\u003c/th>\n\u003cth>Signs\u003c/th>\n\u003cth>Device\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Vault\u003c/strong>\u003c/td>\n\u003ctd>Long-term holdings\u003c/td>\n\u003ctd>Almost never. No DeFi approvals\u003c/td>\n\u003ctd>Hardware (or multisig)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Operator\u003c/strong>\u003c/td>\n\u003ctd>Active DeFi positions\u003c/td>\n\u003ctd>Known, verified protocols only\u003c/td>\n\u003ctd>Hardware\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Burner\u003c/strong>\u003c/td>\n\u003ctd>Small amounts for new apps, mints, airdrops\u003c/td>\n\u003ctd>Anything experimental\u003c/td>\n\u003ctd>Hot wallet\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Move money \u003cem>down\u003c/em> the chain (vault → operator → burner) only as needed, and\nsweep profits back \u003cem>up\u003c/em>. If the burner gets drained, you lose only the burner&#39;s balance.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.3:c0\">\u003cspan>Seed phrase stored offline, in two separate physical places\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.3:c1\">\u003cspan>Vault wallet has never approved a DeFi contract\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.3:c2\">\u003cspan>Separate burner wallet for anything new\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.3:c3\">\u003cspan>I read every signing prompt on the hardware device screen, not just the website\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"1.3:q0\">\u003cdiv class=\"qtext\">A &quot;support agent&quot; in DMs needs your seed phrase to fix a stuck transaction. What do you do?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Nothing. It&#39;s a scam, every time. Block and report.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.3:q1\">\u003cdiv class=\"qtext\">Why keep the vault wallet free of approvals?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Approvals let contracts move your tokens. With none, a compromised protocol can&#39;t reach it.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.3:q2\">\u003cdiv class=\"qtext\">What does 2-of-3 multisig protect against?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A single lost or compromised key. Two signers are still needed to move funds.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Set up a wallet structure where one mistake can't lose everything. Explanation Private key : the authority to sign. Whoever has it controls the funds. Seed phrase : 12–24 words that recreate your keys. Never type it into a website, never photograph it, never share it. No legitimate support team will ever ask for it. Hardware wallet : keeps keys on a separate device. Signing requires physical confirmation. Multisig : needs M of N signers (e.g. 2 of 3). Good for large or shared funds. Smart wallets : contract accounts that can add spending limits, recovery and batching. Compartmentalise: separate wallets by job, so a compromise only reaches one of them. Worked example — the 3 wallet setup Wallet Holds Signs Device Vault Long term holdings Almost never. No DeFi approvals Hardware (or multisig) Operator Active DeFi positions Known, verified protocols only Hardware Burner Small amounts for new apps, mints, airdrops Anything experimental Hot wallet Move money down the chain (vault → operator → burner) only as needed, and sweep profits back up . If the burner gets drained, you lose only the burner's balance. Checklist [ ] Seed phrase stored offline, in two separate physical places [ ] Vault wallet has never approved a DeFi contract [ ] Separate burner wallet for anything new [ ] I read every signing prompt on the hardware device screen, not just the website Quiz 1. A \"support agent\" in DMs needs your seed phrase to fix a stuck transaction. What do you do? Nothing. It's a scam, every time. Block and report. 2. Why keep the vault wallet free of approvals? Approvals let contracts move your tokens. With none, a compromised protocol can't reach it. 3. What does 2 of 3 multisig protect against? A single lost or compromised key. Two signers are still needed to move funds.","video":null,"script":"video-scripts/lessons/lesson-01-3.json"},{"id":"1.4","title":"Tokens, approvals & allowances","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Read an approval request and know what you&#39;re allowing.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>Most tokens on EVM chains are \u003cstrong>ERC-20\u003c/strong> (fungible). NFTs (ERC-721/1155)\ncan also represent positions (e.g. concentrated LP).\u003c/li>\n\u003cli>To let a protocol move your tokens you \u003cstrong>approve\u003c/strong> a \u003cstrong>spender\u003c/strong> for an\n\u003cstrong>allowance\u003c/strong>. The protocol then pulls tokens when you act.\u003c/li>\n\u003cli>\u003cstrong>Unlimited approvals\u003c/strong> are convenient but let that contract move \u003cem>all\u003c/em>\nof that token, now and in future. If the contract (or the approval) is\nexploited, the tokens can be taken.\u003c/li>\n\u003cli>\u003cstrong>Signature approvals (Permit / Permit2)\u003c/strong> grant allowances with an\noff-chain signature, not a transaction. There&#39;s no gas, so they&#39;re easy to\nsign without noticing. Drainers abuse exactly this.\u003c/li>\n\u003cli>\u003cstrong>Wrapped / receipt tokens\u003c/strong>: WETH, LP tokens and lending receipts represent a claim on something else.\u003c/li>\n\u003cli>\u003cstrong>Fake tokens\u003c/strong>: anyone can create a token called &quot;USDC&quot;. Only the \u003cstrong>contract address\u003c/strong> identifies it.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Wallet shows: \u003cem>&quot;Allow 0x3fC9…a1B2 to spend your USDC. Amount: Unlimited.&quot;\u003c/em>\u003c/p>\n\u003col>\n\u003cli>Is \u003ccode>0x3fC9…a1B2\u003c/code> the protocol&#39;s official router? Check the docs or explorer.\u003c/li>\n\u003cli>Do I need unlimited? Edit it to the amount of this deposit.\u003c/li>\n\u003cli>Is this USDC the real contract?\u003c/li>\n\u003cli>After finishing, revoke with a revoke tool (e.g. revoke.cash) if I won&#39;t be back.\u003c/li>\n\u003c/ol>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.4:c0\">\u003cspan>Spender verified against official docs\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.4:c1\">\u003cspan>Allowance limited to what&#39;s needed\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.4:c2\">\u003cspan>Signature requests read as carefully as transactions\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.4:c3\">\u003cspan>Approvals reviewed and revoked monthly\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"1.4:q0\">\u003cdiv class=\"qtext\">Why is a gasless &quot;Permit&quot; signature dangerous?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It can grant a token allowance without a transaction, so it&#39;s easy to sign without noticing. Drainers use it to take tokens.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.4:q1\">\u003cdiv class=\"qtext\">How do you know a token is the real one?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>By its contract address from an authoritative source, never by name or ticker.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.4:q2\">\u003cdiv class=\"qtext\">When should you revoke an approval?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>When you no longer use that protocol, or on a regular schedule.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Read an approval request and know what you're allowing. Explanation Most tokens on EVM chains are ERC 20 (fungible). NFTs (ERC 721/1155) can also represent positions (e.g. concentrated LP). To let a protocol move your tokens you approve a spender for an allowance . The protocol then pulls tokens when you act. Unlimited approvals are convenient but let that contract move all of that token, now and in future. If the contract (or the approval) is exploited, the tokens can be taken. Signature approvals (Permit / Permit2) grant allowances with an off chain signature, not a transaction. There's no gas, so they're easy to sign without noticing. Drainers abuse exactly this. Wrapped / receipt tokens : WETH, LP tokens and lending receipts represent a claim on something else. Fake tokens : anyone can create a token called \"USDC\". Only the contract address identifies it. Worked example — reading an approval Wallet shows: \"Allow 0x3fC9…a1B2 to spend your USDC. Amount: Unlimited.\" 1. Is 0x3fC9…a1B2 the protocol's official router? Check the docs or explorer. 2. Do I need unlimited? Edit it to the amount of this deposit. 3. Is this USDC the real contract? 4. After finishing, revoke with a revoke tool (e.g. revoke.cash) if I won't be back. Checklist [ ] Spender verified against official docs [ ] Allowance limited to what's needed [ ] Signature requests read as carefully as transactions [ ] Approvals reviewed and revoked monthly Quiz 1. Why is a gasless \"Permit\" signature dangerous? It can grant a token allowance without a transaction, so it's easy to sign without noticing. Drainers use it to take tokens. 2. How do you know a token is the real one? By its contract address from an authoritative source, never by name or ticker. 3. When should you revoke an approval? When you no longer use that protocol, or on a regular schedule.","video":null,"script":"video-scripts/lessons/lesson-01-4.json"},{"id":"1.5","title":"Stablecoins and how they break","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Classify a stablecoin by design and name what could break its peg.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Type\u003c/th>\n\u003cth>Backing\u003c/th>\n\u003cth>Main risks\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Fiat-backed\u003c/strong>\u003c/td>\n\u003ctd>Cash/treasuries held by an issuer\u003c/td>\n\u003ctd>Issuer, bank and custodian risk; freezes; redemption limited to approved parties\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Crypto-backed\u003c/strong>\u003c/td>\n\u003ctd>Over-collateralised on-chain crypto\u003c/td>\n\u003ctd>Collateral crash, liquidations, oracle failure\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Synthetic / hedged\u003c/strong>\u003c/td>\n\u003ctd>Derivative positions (e.g. spot + short perp)\u003c/td>\n\u003ctd>Funding turns negative, exchange/venue risk, model risk\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Algorithmic\u003c/strong>\u003c/td>\n\u003ctd>Mostly its own mechanism / sister token\u003c/td>\n\u003ctd>Reflexive death spiral when confidence breaks\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Peg mechanics:\u003c/strong> if a stablecoin trades at $0.98 and can be redeemed for\n$1.00, arbitrageurs buy and redeem it, pushing the price back up. The peg is\nonly as strong as \u003cstrong>redemption access and reserve quality\u003c/strong>.\u003c/p>\n\u003cp>History (research these as case studies):\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>May 2022\u003c/strong>: TerraUSD (UST), an algorithmic design, lost its peg and collapsed toward zero.\u003c/li>\n\u003cli>\u003cstrong>March 2023\u003c/strong>: USDC briefly traded well below $1 after part of its reserves were exposed to the failed Silicon Valley Bank, then recovered once reserves were confirmed.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A fiat-backed coin trades at \u003cstrong>$0.97\u003c/strong>. Redemption is \u003cstrong>$1.00 minus a 0.1% fee\u003c/strong>,\nbut only for verified institutional minters.\u003c/p>\n\u003cul>\n\u003cli>A minter makes ~2.9% per coin by buying and redeeming, so arbitrage \u003cem>should\u003c/em> restore the peg.\u003c/li>\n\u003cli>You can&#39;t redeem, so you rely on minters acting and on the reserves being real.\u003c/li>\n\u003cli>If markets doubt the reserves, minters may not step in, and the discount can grow.\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.5:c0\">\u003cspan>I know the type and backing of every stablecoin I hold\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.5:c1\">\u003cspan>I know who can redeem, and how\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.5:c2\">\u003cspan>I don&#39;t treat &quot;different stablecoins&quot; as diversified if they share issuers or collateral\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.5:c3\">\u003cspan>I have a depeg exit rule (e.g. sell or rotate below $0.99 for longer than X hours)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"1.5:q0\">\u003cdiv class=\"qtext\">What keeps a fiat-backed stablecoin near $1?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Redemption for $1 of reserves, plus arbitrageurs who can redeem.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.5:q1\">\u003cdiv class=\"qtext\">Why are algorithmic designs fragile?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>They rely on confidence and their own token. When demand falls, the mechanism can amplify the fall.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.5:q2\">\u003cdiv class=\"qtext\">Two stablecoins both backed by the same collateral. Diversified?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. They share the same failure point.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Classify a stablecoin by design and name what could break its peg. Explanation Type Backing Main risks Fiat backed Cash/treasuries held by an issuer Issuer, bank and custodian risk; freezes; redemption limited to approved parties Crypto backed Over collateralised on chain crypto Collateral crash, liquidations, oracle failure Synthetic / hedged Derivative positions (e.g. spot + short perp) Funding turns negative, exchange/venue risk, model risk Algorithmic Mostly its own mechanism / sister token Reflexive death spiral when confidence breaks Peg mechanics: if a stablecoin trades at $0.98 and can be redeemed for $1.00, arbitrageurs buy and redeem it, pushing the price back up. The peg is only as strong as redemption access and reserve quality . History (research these as case studies): May 2022 : TerraUSD (UST), an algorithmic design, lost its peg and collapsed toward zero. March 2023 : USDC briefly traded well below $1 after part of its reserves were exposed to the failed Silicon Valley Bank, then recovered once reserves were confirmed. Worked example A fiat backed coin trades at $0.97 . Redemption is $1.00 minus a 0.1% fee , but only for verified institutional minters. A minter makes ~2.9% per coin by buying and redeeming, so arbitrage should restore the peg. You can't redeem, so you rely on minters acting and on the reserves being real. If markets doubt the reserves, minters may not step in, and the discount can grow. Checklist [ ] I know the type and backing of every stablecoin I hold [ ] I know who can redeem, and how [ ] I don't treat \"different stablecoins\" as diversified if they share issuers or collateral [ ] I have a depeg exit rule (e.g. sell or rotate below $0.99 for longer than X hours) Quiz 1. What keeps a fiat backed stablecoin near $1? Redemption for $1 of reserves, plus arbitrageurs who can redeem. 2. Why are algorithmic designs fragile? They rely on confidence and their own token. When demand falls, the mechanism can amplify the fall. 3. Two stablecoins both backed by the same collateral. Diversified? No. They share the same failure point.","video":null,"script":"video-scripts/lessons/lesson-01-5.json"},{"id":"1.6","title":"Scam defence","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Recognise the common attacks before they cost you anything.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Attack\u003c/th>\n\u003cth>How it works\u003c/th>\n\u003cth>Defence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Phishing site\u003c/strong>\u003c/td>\n\u003ctd>Look-alike URL / sponsored search ad / fake app\u003c/td>\n\u003ctd>Bookmarks only. Never click links from DMs or ads\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Wallet drainer\u003c/strong>\u003c/td>\n\u003ctd>You sign an approval, Permit or \u003ccode>setApprovalForAll\u003c/code> for an attacker\u003c/td>\n\u003ctd>Read every prompt. Burner wallet for new sites\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Address poisoning\u003c/strong>\u003c/td>\n\u003ctd>Attacker sends $0 transfers from an address that looks like one you use, so it appears in your history\u003c/td>\n\u003ctd>Never copy addresses from history. Use a saved address book and check the \u003cem>full\u003c/em> address\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Fake token / airdrop\u003c/strong>\u003c/td>\n\u003ctd>Unknown tokens appear in your wallet with a &quot;claim&quot; link\u003c/td>\n\u003ctd>Ignore them. Don&#39;t interact or try to sell\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Impersonation\u003c/strong>\u003c/td>\n\u003ctd>&quot;Support&quot;, &quot;admin&quot; or &quot;project team&quot; DMs you\u003c/td>\n\u003ctd>Real teams never DM first and never ask for seeds\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Too-good yields\u003c/strong>\u003c/td>\n\u003ctd>New protocol, huge APY, anonymous team, no audit\u003c/td>\n\u003ctd>Due diligence (Module 6). Burner wallet and small size, or skip\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>You regularly send to \u003ccode>0x7a3F…9c21\u003c/code>. Today your history shows a transfer from\n\u003ccode>0x7a3F…9c21\u003c/code>, but the full address is \u003ccode>0x7a3F\u003c/code>\u003cstrong>\u003ccode>e0b4…d18\u003c/code>\u003c/strong>\u003ccode>9c21\u003c/code>: same\nstart and end, different middle. If you copy it from history you send your\nfunds to the attacker. \u003cstrong>Always paste from your address book and check the\nfull address.\u003c/strong>\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.6:c0\">\u003cspan>Protocol sites bookmarked; never reached through search ads or DMs\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.6:c1\">\u003cspan>Address book in use; full address checked before sending\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.6:c2\">\u003cspan>Unknown tokens ignored\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.6:c3\">\u003cspan>DMs from &quot;support&quot; treated as scams by default\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.6:c4\">\u003cspan>New sites only with the burner wallet\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"1.6:q0\">\u003cdiv class=\"qtext\">A new token worth &quot;$5,000&quot; appears in your wallet with a claim site. What do you do?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Ignore it. It&#39;s bait, and interacting risks a drainer approval.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.6:q1\">\u003cdiv class=\"qtext\">How does address poisoning trick people?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It puts a look-alike address in your history so you copy it by mistake.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.6:q2\">\u003cdiv class=\"qtext\">What&#39;s the single best habit against drainers?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Reading every signature and approval prompt, and using a burner wallet for anything new.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Recognise the common attacks before they cost you anything. Explanation Attack How it works Defence Phishing site Look alike URL / sponsored search ad / fake app Bookmarks only. Never click links from DMs or ads Wallet drainer You sign an approval, Permit or setApprovalForAll for an attacker Read every prompt. Burner wallet for new sites Address poisoning Attacker sends $0 transfers from an address that looks like one you use, so it appears in your history Never copy addresses from history. Use a saved address book and check the full address Fake token / airdrop Unknown tokens appear in your wallet with a \"claim\" link Ignore them. Don't interact or try to sell Impersonation \"Support\", \"admin\" or \"project team\" DMs you Real teams never DM first and never ask for seeds Too good yields New protocol, huge APY, anonymous team, no audit Due diligence (Module 6). Burner wallet and small size, or skip Worked example — address poisoning You regularly send to 0x7a3F…9c21 . Today your history shows a transfer from 0x7a3F…9c21 , but the full address is 0x7a3F e0b4…d18 9c21 : same start and end, different middle. If you copy it from history you send your funds to the attacker. Always paste from your address book and check the full address. Checklist [ ] Protocol sites bookmarked; never reached through search ads or DMs [ ] Address book in use; full address checked before sending [ ] Unknown tokens ignored [ ] DMs from \"support\" treated as scams by default [ ] New sites only with the burner wallet Quiz 1. A new token worth \"$5,000\" appears in your wallet with a claim site. What do you do? Ignore it. It's bait, and interacting risks a drainer approval. 2. How does address poisoning trick people? It puts a look alike address in your history so you copy it by mistake. 3. What's the single best habit against drainers? Reading every signature and approval prompt, and using a burner wallet for anything new.","video":null,"script":"video-scripts/lessons/lesson-01-6.json"},{"id":"1.7","title":"Reading signatures and simulating transactions","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Know exactly what a signature or transaction will do before you approve it.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Transaction simulation:\u003c/strong> good wallets (and tools like transaction simulators) show the \u003cstrong>expected balance changes\u003c/strong> before you sign: &quot;−100 USDC, +0.033 ETH&quot;. If the preview shows assets leaving that you didn&#39;t intend, stop.\u003c/li>\n\u003cli>\u003cstrong>Typed-data signatures (EIP-712):\u003c/strong> structured messages (orders, Permits) that your wallet shows as fields. Read the \u003cstrong>spender\u003c/strong>, \u003cstrong>token\u003c/strong>, \u003cstrong>amount\u003c/strong> and \u003cstrong>deadline\u003c/strong>. A &quot;Permit&quot; or &quot;Permit2&quot; signature can hand over token access without any gas.\u003c/li>\n\u003cli>\u003cstrong>Blind signing:\u003c/strong> when a hardware wallet can&#39;t decode a transaction, it shows only a hash. Keep blind signing \u003cstrong>off\u003c/strong> by default; turn it on only for a specific, verified action, then off again.\u003c/li>\n\u003cli>\u003cstrong>Account delegation (EIP-7702):\u003c/strong> since Ethereum&#39;s 2025 Pectra upgrade, a normal wallet can sign an authorisation that delegates its behaviour to a smart contract. A malicious delegation can hand control of the whole account to an attacker. Only sign delegations from wallets and apps you trust, for a stated purpose.\u003c/li>\n\u003cli>\u003cstrong>Rule:\u003c/strong> if you can&#39;t say in one sentence what a prompt does, don&#39;t sign it.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A site asks you to &quot;verify your wallet&quot;. The wallet shows a typed-data message:\n\u003ccode>Permit2 · token: USDC · spender: 0x9f…c3 · amount: 115792089… (unlimited) · deadline: 2030\u003c/code>.\nThat isn&#39;t verification: it&#39;s unlimited USDC access for an unknown spender. Reject it, close the tab, and check your approvals.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.7:c0\">\u003cspan>My wallet shows simulated balance changes before signing\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.7:c1\">\u003cspan>I read spender, token, amount and deadline on every typed-data prompt\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.7:c2\">\u003cspan>Blind signing is off on my hardware wallet\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.7:c3\">\u003cspan>I never sign account-delegation requests from unknown sites\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"1.7:q0\">\u003cdiv class=\"qtext\">What does transaction simulation show?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The expected balance changes before you sign.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.7:q1\">\u003cdiv class=\"qtext\">Why is a Permit signature risky if you don&#39;t read it?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It can grant token access without a transaction or gas, so it&#39;s easy to approve by accident.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.7:q2\">\u003cdiv class=\"qtext\">When should blind signing be on?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Only briefly, for a specific verified action, then switched off.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Know exactly what a signature or transaction will do before you approve it. Explanation Transaction simulation: good wallets (and tools like transaction simulators) show the expected balance changes before you sign: \"−100 USDC, +0.033 ETH\". If the preview shows assets leaving that you didn't intend, stop. Typed data signatures (EIP 712): structured messages (orders, Permits) that your wallet shows as fields. Read the spender , token , amount and deadline . A \"Permit\" or \"Permit2\" signature can hand over token access without any gas. Blind signing: when a hardware wallet can't decode a transaction, it shows only a hash. Keep blind signing off by default; turn it on only for a specific, verified action, then off again. Account delegation (EIP 7702): since Ethereum's 2025 Pectra upgrade, a normal wallet can sign an authorisation that delegates its behaviour to a smart contract. A malicious delegation can hand control of the whole account to an attacker. Only sign delegations from wallets and apps you trust, for a stated purpose. Rule: if you can't say in one sentence what a prompt does, don't sign it. Worked example A site asks you to \"verify your wallet\". The wallet shows a typed data message: Permit2 · token: USDC · spender: 0x9f…c3 · amount: 115792089… (unlimited) · deadline: 2030 . That isn't verification: it's unlimited USDC access for an unknown spender. Reject it, close the tab, and check your approvals. Checklist [ ] My wallet shows simulated balance changes before signing [ ] I read spender, token, amount and deadline on every typed data prompt [ ] Blind signing is off on my hardware wallet [ ] I never sign account delegation requests from unknown sites Quiz 1. What does transaction simulation show? The expected balance changes before you sign. 2. Why is a Permit signature risky if you don't read it? It can grant token access without a transaction or gas, so it's easy to approve by accident. 3. When should blind signing be on? Only briefly, for a specific verified action, then switched off.","video":null,"script":"video-scripts/lessons/lesson-01-7.json"},{"id":"1.8","title":"Privacy and physical security","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Keep your holdings private and your household safe as your on-chain wealth grows.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Blockchains are public.\u003c/strong> Anyone who links an address to you can see its balance and history, forever.\u003c/li>\n\u003cli>\u003cstrong>Link less:\u003c/strong> don&#39;t post addresses, screenshots or wins publicly; use separate addresses for public activity (e.g. donations, NFTs) and for savings; be aware that exchange withdrawals link your identity (KYC) to the receiving address.\u003c/li>\n\u003cli>\u003cstrong>Name services\u003c/strong> (e.g. an ENS name) are convenient but make an address easy to find and associate with you.\u003c/li>\n\u003cli>\u003cstrong>Physical risk (&quot;wrench attacks&quot;):\u003c/strong> criminals target people known to hold crypto. Low profile is the first defence. Multisig with keys in separate locations means no single person can be forced to move everything.\u003c/li>\n\u003cli>\u003cstrong>Home and devices:\u003c/strong> hardware wallets and backups out of sight; encrypted devices; don&#39;t discuss holdings with people who don&#39;t need to know.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Alex posts a screenshot of a big win, with the address visible. Anyone can now see\nAlex&#39;s balance and follow every future move, and scammers and thieves now have a target.\nBetter: no screenshots, a vault address that has never been shared, and a\n2-of-3 multisig so no single key holder can be coerced into draining it.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.8:c0\">\u003cspan>Savings addresses have never been posted or linked publicly\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.8:c1\">\u003cspan>No holdings screenshots or wins on social media\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.8:c2\">\u003cspan>Vault keys held so no single person can move everything\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.8:c3\">\u003cspan>Backups stored discreetly, away from where people would look\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"1.8:q0\">\u003cdiv class=\"qtext\">What does linking an address to your identity reveal?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Its full balance and history, now and in the future.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.8:q1\">\u003cdiv class=\"qtext\">How does multisig help against physical threats?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No single person can be forced to move everything; other keys are elsewhere.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.8:q2\">\u003cdiv class=\"qtext\">What links your identity to a wallet address?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>For example, KYC exchange withdrawals, name services, or posting the address publicly.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Keep your holdings private and your household safe as your on chain wealth grows. Explanation Blockchains are public. Anyone who links an address to you can see its balance and history, forever. Link less: don't post addresses, screenshots or wins publicly; use separate addresses for public activity (e.g. donations, NFTs) and for savings; be aware that exchange withdrawals link your identity (KYC) to the receiving address. Name services (e.g. an ENS name) are convenient but make an address easy to find and associate with you. Physical risk (\"wrench attacks\"): criminals target people known to hold crypto. Low profile is the first defence. Multisig with keys in separate locations means no single person can be forced to move everything. Home and devices: hardware wallets and backups out of sight; encrypted devices; don't discuss holdings with people who don't need to know. Worked example Alex posts a screenshot of a big win, with the address visible. Anyone can now see Alex's balance and follow every future move, and scammers and thieves now have a target. Better: no screenshots, a vault address that has never been shared, and a 2 of 3 multisig so no single key holder can be coerced into draining it. Checklist [ ] Savings addresses have never been posted or linked publicly [ ] No holdings screenshots or wins on social media [ ] Vault keys held so no single person can move everything [ ] Backups stored discreetly, away from where people would look Quiz 1. What does linking an address to your identity reveal? Its full balance and history, now and in the future. 2. How does multisig help against physical threats? No single person can be forced to move everything; other keys are elsewhere. 3. What links your identity to a wallet address? For example, KYC exchange withdrawals, name services, or posting the address publicly.","video":null,"script":"video-scripts/lessons/lesson-01-8.json"},{"id":"1.9","title":"Smart accounts and account abstraction","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Understand how smart accounts change wallet security, and use their features without adding new risks.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>A normal wallet (an \u003cstrong>EOA\u003c/strong>, externally owned account) is controlled by one private key. A \u003cstrong>smart account\u003c/strong> is a contract wallet whose rules you choose.\u003c/li>\n\u003cli>\u003cstrong>ERC-4337 (account abstraction):\u003c/strong> smart accounts without changing Ethereum itself. Transactions become &quot;user operations&quot; handled by \u003cstrong>bundlers\u003c/strong>; \u003cstrong>paymasters\u003c/strong> can pay gas for you (e.g. in USDC).\u003c/li>\n\u003cli>\u003cstrong>Features:\u003c/strong> multisig and \u003cstrong>social recovery\u003c/strong> (trusted &quot;guardians&quot; can restore access), \u003cstrong>spending limits\u003c/strong>, \u003cstrong>session keys\u003c/strong> (Lesson 14.2), \u003cstrong>batching\u003c/strong> (approve + swap in one step), \u003cstrong>passkeys\u003c/strong> (log in with your device&#39;s biometrics instead of a seed phrase).\u003c/li>\n\u003cli>\u003cstrong>EIP-7702 (2025):\u003c/strong> lets an ordinary wallet temporarily or permanently delegate to smart-account code: powerful, and a phishing target (Lesson 1.7).\u003c/li>\n\u003cli>\u003cstrong>New risks:\u003c/strong> the account&#39;s contract code, module/plugin permissions, guardian collusion, and differences between chains (the same address may not exist on every chain).\u003c/li>\n\u003c/ul>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"The 3-wallet setup\" src=\"../assets/diagrams/three-wallets.png\">\u003cfigcaption>The 3-wallet setup\u003c/figcaption>\u003c/figure>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Your operating wallet becomes a smart account with: a passkey on your phone plus a\nhardware key (2-of-2 for large moves); a $2,000/day limit for small moves with just the\npasskey; 3 guardians (2-of-3) who can recover access after a 48-hour delay you can cancel.\nLose your phone: recover via guardians. Phone stolen: the thief is capped at $2,000/day\nand you have 48 hours to cancel a recovery you didn&#39;t start.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.9:c0\">\u003cspan>I know which of my wallets are EOAs and which are smart accounts\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.9:c1\">\u003cspan>Guardians chosen so no two could plausibly collude; recovery has a cancel delay\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.9:c2\">\u003cspan>Module/plugin permissions reviewed like approvals\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"1.9:c3\">\u003cspan>Smart account deployed (or deployable) on every chain I send to\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"1.9:q0\">\u003cdiv class=\"qtext\">What does a paymaster do?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Pays gas on your behalf, e.g. letting you pay fees in USDC.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.9:q1\">\u003cdiv class=\"qtext\">What is social recovery?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Trusted guardians can restore access to your account, usually after a delay.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"1.9:q2\">\u003cdiv class=\"qtext\">Why check the smart account exists on the destination chain?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Smart-account addresses may not be deployed on every chain; funds sent there may be hard to access.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Understand how smart accounts change wallet security, and use their features without adding new risks. Explanation A normal wallet (an EOA , externally owned account) is controlled by one private key. A smart account is a contract wallet whose rules you choose. ERC 4337 (account abstraction): smart accounts without changing Ethereum itself. Transactions become \"user operations\" handled by bundlers ; paymasters can pay gas for you (e.g. in USDC). Features: multisig and social recovery (trusted \"guardians\" can restore access), spending limits , session keys (Lesson 14.2), batching (approve + swap in one step), passkeys (log in with your device's biometrics instead of a seed phrase). EIP 7702 (2025): lets an ordinary wallet temporarily or permanently delegate to smart account code: powerful, and a phishing target (Lesson 1.7). New risks: the account's contract code, module/plugin permissions, guardian collusion, and differences between chains (the same address may not exist on every chain). Worked example Your operating wallet becomes a smart account with: a passkey on your phone plus a hardware key (2 of 2 for large moves); a $2,000/day limit for small moves with just the passkey; 3 guardians (2 of 3) who can recover access after a 48 hour delay you can cancel. Lose your phone: recover via guardians. Phone stolen: the thief is capped at $2,000/day and you have 48 hours to cancel a recovery you didn't start. Checklist [ ] I know which of my wallets are EOAs and which are smart accounts [ ] Guardians chosen so no two could plausibly collude; recovery has a cancel delay [ ] Module/plugin permissions reviewed like approvals [ ] Smart account deployed (or deployable) on every chain I send to Quiz 1. What does a paymaster do? Pays gas on your behalf, e.g. letting you pay fees in USDC. 2. What is social recovery? Trusted guardians can restore access to your account, usually after a delay. 3. Why check the smart account exists on the destination chain? Smart account addresses may not be deployed on every chain; funds sent there may be hard to access.","video":null,"script":"video-scripts/lessons/lesson-01-9.json"}]},{"n":2,"title":"Trading On-Chain","outcome":"execute a swap or LP position deliberately, understanding price impact, fees, impermanent loss and MEV.","icon":"swap","banner":"../assets/modules/module-02.png","intro":{"src":"../video/module-02-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"2.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>A swap on a DEX trades against a pool of tokens priced by a formula. Providing liquidity to that pool earns fees but changes what you hold. This module teaches you to trade and provide liquidity knowing the real cost.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEX\u003c/td>\n\u003ctd>a decentralised exchange you use from your wallet\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Liquidity pool\u003c/td>\n\u003ctd>a pot of two tokens traders swap against\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Price impact\u003c/td>\n\u003ctd>how much your trade moves the price\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Slippage\u003c/td>\n\u003ctd>the worst price you&#39;ll accept\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Impermanent loss\u003c/td>\n\u003ctd>how far an LP lags simply holding\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.0:c0\">\u003cspan>Modules 0–1\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.0:c1\">\u003cspan>A little ETH for gas and some USDC on a low-fee network\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>Quote a $20 swap on one DEX and on an aggregator; compare what you&#39;d actually receive after gas. Don&#39;t execute yet.\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Makes small swaps with deliberate slippage and protected routing\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Calculates fee APR and IL, and tracks LP vs holding\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Uses limit/TWAP/intent orders and runs LPs with written rules\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…you can predict a swap&#39;s cost and an LP position&#39;s result against holding, before you enter.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version A swap on a DEX trades against a pool of tokens priced by a formula. Providing liquidity to that pool earns fees but changes what you hold. This module teaches you to trade and provide liquidity knowing the real cost. Words you'll need Term Meaning DEX a decentralised exchange you use from your wallet Liquidity pool a pot of two tokens traders swap against Price impact how much your trade moves the price Slippage the worst price you'll accept Impermanent loss how far an LP lags simply holding Before you start [ ] Modules 0–1 [ ] A little ETH for gas and some USDC on a low fee network Your first safe step Quote a $20 swap on one DEX and on an aggregator; compare what you'd actually receive after gas. Don't execute yet. The mastery ladder Level You can… Beginner Makes small swaps with deliberate slippage and protected routing Practitioner Calculates fee APR and IL, and tracks LP vs holding Master Uses limit/TWAP/intent orders and runs LPs with written rules You've mastered this module when… …you can predict a swap's cost and an LP position's result against holding, before you enter.","video":null,"script":"video-scripts/lessons/lesson-02-0.json"},{"id":"2.1","title":"DEXs, aggregators & routing","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Choose where to swap by comparing the \u003cstrong>net amount received\u003c/strong>, not the quoted price.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>AMM DEX\u003c/strong>: you trade against a liquidity pool priced by a formula (Lesson 2.2).\u003c/li>\n\u003cli>\u003cstrong>On-chain order book\u003c/strong>: orders matched by price and time, fully or partly on-chain.\u003c/li>\n\u003cli>\u003cstrong>Aggregator\u003c/strong>: searches many pools and venues and may split your order across routes.\u003c/li>\n\u003cli>\u003cstrong>Price impact\u003c/strong>: how much \u003cem>your\u003c/em> trade moves the price. It grows with size relative to pool depth.\u003c/li>\n\u003cli>\u003cstrong>Slippage tolerance\u003c/strong>: the worst price you&#39;ll accept before the transaction reverts.\u003c/li>\n\u003cli>\u003cstrong>Routing\u003c/strong>: multi-hop routes (A → B → C) can give a better price but touch more contracts.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>What you actually get = quoted output − price impact − pool fees − gas.\u003c/strong>\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Selling \u003cstrong>20 ETH\u003c/strong>:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Route\u003c/th>\n\u003cth>Output\u003c/th>\n\u003cth>Gas\u003c/th>\n\u003cth>Net\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Single pool direct\u003c/td>\n\u003ctd>59,100 USDC\u003c/td>\n\u003ctd>$8\u003c/td>\n\u003ctd>\u003cstrong>59,092\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aggregator (split across 3 pools)\u003c/td>\n\u003ctd>59,420 USDC\u003c/td>\n\u003ctd>$20\u003c/td>\n\u003ctd>\u003cstrong>59,400\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The aggregator wins by ~$308. Now selling \u003cstrong>0.5 ETH\u003c/strong>: the aggregator quotes $3\nbetter but costs $12 more in gas, so the direct pool wins. \u003cstrong>Big trades\nbenefit from routing. Small trades mostly lose to gas.\u003c/strong>\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.1:c0\">\u003cspan>Compare net output after gas, not headline price\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.1:c1\">\u003cspan>Price impact shown and acceptable for the size\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.1:c2\">\u003cspan>Route uses reputable pools and tokens you&#39;ve verified\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.1:c3\">\u003cspan>Slippage set on purpose (see 2.5)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"2.1:q0\">\u003cdiv class=\"qtext\">Why can an aggregator give a better price?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It can split an order across pools, so each pool&#39;s price moves less.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.1:q1\">\u003cdiv class=\"qtext\">When does the best quote lose?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>When the extra gas costs more than the price improvement, which is common for small trades.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.1:q2\">\u003cdiv class=\"qtext\">What drives price impact?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Trade size relative to pool liquidity.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Choose where to swap by comparing the net amount received , not the quoted price. Explanation AMM DEX : you trade against a liquidity pool priced by a formula (Lesson 2.2). On chain order book : orders matched by price and time, fully or partly on chain. Aggregator : searches many pools and venues and may split your order across routes. Price impact : how much your trade moves the price. It grows with size relative to pool depth. Slippage tolerance : the worst price you'll accept before the transaction reverts. Routing : multi hop routes (A → B → C) can give a better price but touch more contracts. What you actually get = quoted output − price impact − pool fees − gas. Worked example Selling 20 ETH : Route Output Gas Net Single pool direct 59,100 USDC $8 59,092 Aggregator (split across 3 pools) 59,420 USDC $20 59,400 The aggregator wins by ~$308. Now selling 0.5 ETH : the aggregator quotes $3 better but costs $12 more in gas, so the direct pool wins. Big trades benefit from routing. Small trades mostly lose to gas. Checklist [ ] Compare net output after gas, not headline price [ ] Price impact shown and acceptable for the size [ ] Route uses reputable pools and tokens you've verified [ ] Slippage set on purpose (see 2.5) Quiz 1. Why can an aggregator give a better price? It can split an order across pools, so each pool's price moves less. 2. When does the best quote lose? When the extra gas costs more than the price improvement, which is common for small trades. 3. What drives price impact? Trade size relative to pool liquidity.","video":null,"script":"video-scripts/lessons/lesson-02-1.json"},{"id":"2.2","title":"AMM Mathematics (x · y = k)","starter":false,"html":"\u003cp>\u003cem>Module 2 · Trading On-Chain · Source: ATLAS ch. 7\u003c/em>\n\u003cem>Template every lesson follows: Objective → Explanation → Worked example → Checklist → Quiz.\u003c/em>\u003c/p>\n\u003cblockquote>\n\u003cp>Educational content only. Not financial advice. Examples are illustrative.\u003c/p>\n\u003c/blockquote>\n\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>By the end of this lesson you can calculate what a swap will actually pay out\nin a constant-product pool, and explain why bigger trades get worse prices.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>A constant-product AMM holds two tokens in a pool. It doesn&#39;t use an order\nbook. It keeps one rule: \u003cstrong>reserves of token A × reserves of token B = k\u003c/strong>, and\nk must stay constant (ignoring fees) after every trade.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Pool price\u003c/strong> is the ratio of reserves. 100 ETH and 300,000 USDC means 1 ETH ≈ 3,000 USDC.\u003c/li>\n\u003cli>When you add ETH to the pool, the pool must \u003cem>remove\u003c/em> enough USDC to keep x·y = k.\u003c/li>\n\u003cli>The more of the pool you move, the further the price moves against you. That gap is \u003cstrong>price impact\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Arbitrageurs\u003c/strong> then trade the pool back in line with other markets, and that changes what LPs hold. You&#39;ll see why that matters in Lesson 2.4.\u003c/li>\n\u003c/ul>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"How a constant-product swap is priced\" src=\"../assets/diagrams/amm-swap-flow.png\">\u003cfigcaption>How a constant-product swap is priced\u003c/figcaption>\u003c/figure>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"The x·y=k curve\" src=\"../assets/charts/amm-curve.png\">\u003cfigcaption>The x·y=k curve\u003c/figcaption>\u003c/figure>\n\u003cp>Pool: \u003cstrong>100 ETH\u003c/strong> and \u003cstrong>300,000 USDC\u003c/strong>, so k = 30,000,000. Spot price = 3,000 USDC/ETH.\u003c/p>\n\u003cp>You swap in \u003cstrong>10 ETH\u003c/strong> (fees ignored):\u003c/p>\n\u003col>\n\u003cli>x&#39; = 100 + 10 = 110\u003c/li>\n\u003cli>y&#39; = 30,000,000 ÷ 110 ≈ 272,727\u003c/li>\n\u003cli>You receive 300,000 − 272,727 ≈ \u003cstrong>27,273 USDC\u003c/strong>\u003c/li>\n\u003cli>Effective price ≈ 27,273 ÷ 10 = \u003cstrong>2,727 USDC/ETH\u003c/strong>, which is \u003cstrong>~9.1% worse\u003c/strong> than spot.\u003c/li>\n\u003c/ol>\n\u003cp>Now try \u003cstrong>1 ETH\u003c/strong>: x&#39; = 101 → y&#39; ≈ 297,030 → you receive ≈ 2,970 USDC, which is ~1% worse.\nTen times the size cost about nine times more in price impact. \u003cstrong>Size relative to\npool depth is what matters, not the size of the trade in dollars.\u003c/strong>\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.2:c0\">\u003cspan>Check the price impact the interface shows; if it isn&#39;t shown, work it out\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.2:c1\">\u003cspan>Compare with an aggregator quote\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.2:c2\">\u003cspan>Set slippage tolerance on purpose (too tight: the swap fails; too loose: you get a bad fill or a sandwich attack, see 2.5)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.2:c3\">\u003cspan>Split large trades or use deeper pools\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.2:c4\">\u003cspan>Run the before-signing checklist (chain, contract, token, amount, spender)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"2.2:q0\">\u003cdiv class=\"qtext\">A pool holds 50 ETH / 150,000 USDC. What is k and the spot price?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>k = 7,500,000; spot = 3,000 USDC/ETH.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.2:q1\">\u003cdiv class=\"qtext\">Why does a 10 ETH swap get a worse average price than a 1 ETH swap in the same pool?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Each unit you add moves the reserve ratio further, so later units in the same trade are priced worse. Price impact grows with trade size relative to reserves.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.2:q2\">\u003cdiv class=\"qtext\">Who moves the pool price back in line after your trade, and why does that matter to LPs?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Arbitrageurs do. Their trades rebalance what the LP holds, which is where impermanent loss comes from (Lesson 2.4).\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Module 2 · Trading On Chain · Source: ATLAS ch. 7 Template every lesson follows: Objective → Explanation → Worked example → Checklist → Quiz. Educational content only. Not financial advice. Examples are illustrative. Objective By the end of this lesson you can calculate what a swap will actually pay out in a constant product pool, and explain why bigger trades get worse prices. Explanation A constant product AMM holds two tokens in a pool. It doesn't use an order book. It keeps one rule: reserves of token A × reserves of token B = k , and k must stay constant (ignoring fees) after every trade. Pool price is the ratio of reserves. 100 ETH and 300,000 USDC means 1 ETH ≈ 3,000 USDC. When you add ETH to the pool, the pool must remove enough USDC to keep x·y = k. The more of the pool you move, the further the price moves against you. That gap is price impact . Arbitrageurs then trade the pool back in line with other markets, and that changes what LPs hold. You'll see why that matters in Lesson 2.4. Worked example Pool: 100 ETH and 300,000 USDC , so k = 30,000,000. Spot price = 3,000 USDC/ETH. You swap in 10 ETH (fees ignored): 1. x' = 100 + 10 = 110 2. y' = 30,000,000 ÷ 110 ≈ 272,727 3. You receive 300,000 − 272,727 ≈ 27,273 USDC 4. Effective price ≈ 27,273 ÷ 10 = 2,727 USDC/ETH , which is ~9.1% worse than spot. Now try 1 ETH : x' = 101 → y' ≈ 297,030 → you receive ≈ 2,970 USDC, which is ~1% worse. Ten times the size cost about nine times more in price impact. Size relative to pool depth is what matters, not the size of the trade in dollars. Checklist before any swap [ ] Check the price impact the interface shows; if it isn't shown, work it out [ ] Compare with an aggregator quote [ ] Set slippage tolerance on purpose (too tight: the swap fails; too loose: you get a bad fill or a sandwich attack, see 2.5) [ ] Split large trades or use deeper pools [ ] Run the before signing checklist (chain, contract, token, amount, spender) Quiz 1. A pool holds 50 ETH / 150,000 USDC. What is k and the spot price? k = 7,500,000; spot = 3,000 USDC/ETH. 2. Why does a 10 ETH swap get a worse average price than a 1 ETH swap in the same pool? Each unit you add moves the reserve ratio further, so later units in the same trade are priced worse. Price impact grows with trade size relative to reserves. 3. Who moves the pool price back in line after your trade, and why does that matter to LPs? Arbitrageurs do. Their trades rebalance what the LP holds, which is where impermanent loss comes from (Lesson 2.4).","video":null,"script":"video-scripts/lessons/lesson-02-2.json"},{"id":"2.3","title":"Providing liquidity","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Estimate an LP position&#39;s fee income from real pool data.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>When you LP you deposit both tokens an
