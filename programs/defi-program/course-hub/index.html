 owe the stablecoin back, plus a stability fee (interest). Minimum collateral ratio (e.g. 150%): below it, the position is liquidated. The stablecoin holds its peg through over collateralisation, liquidations, interest rates and often a peg stability module (PSM) that swaps it 1:1 (minus a small fee) with other stablecoins. Compared with borrowing from a lending pool: you create new money rather than borrow someone's deposit; rates are set by governance, not utilisation. Uses: liquidity without selling (Module 12.3), funding a liquidity ladder, or a yield covered credit line (strategy 25). Worked example 10 ETH at $3,000 ($30,000) with a 150% minimum ratio: you could mint up to $20,000. Mint $10,000 instead: defi calc.py cdp qty 10 price 3000 mint 10000 fee 6 → ratio 300% , liquidation at $1,500 (−50%) , stability fee $600/yr . Operators treat the maximum as a cliff, not a target. Checklist [ ] Collateral ratio target (e.g. ≥ 250%) and action levels written [ ] Stability fee vs alternatives (lending pool borrow rates) compared [ ] Peg mechanism (PSM, rates) understood, and my exit if the stablecoin depegs Quiz 1. What do you owe on a CDP? The minted stablecoin plus the accrued stability fee. 2. Collateral $40,000, 150% minimum ratio. Maximum mint? About $26,667. 3. What does a PSM do? Swaps the stablecoin 1:1 (minus a fee) with other stablecoins, supporting the peg.","video":null,"script":"video-scripts/lessons/lesson-03-7.json"}]},{"n":4,"title":"Yield","outcome":"split any APY into organic vs subsidised, and name the risk being paid for.","icon":"sprout","banner":"../assets/modules/module-04.png","intro":{"src":"../video/module-04-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"4.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>Every yield is payment for a risk. Staking pays you to secure a network, lending pays for borrower demand, farms often pay in newly printed tokens. This module teaches you to see what each yield really pays for.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>APY\u003c/td>\n\u003ctd>yearly return including compounding\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Emissions\u003c/td>\n\u003ctd>new reward tokens printed by a protocol\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Staking\u003c/td>\n\u003ctd>locking tokens to help secure a network\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LST\u003c/td>\n\u003ctd>a token representing staked assets\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RWA\u003c/td>\n\u003ctd>a token representing a real-world asset\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.0:c0\">\u003cspan>Modules 0–3\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>Take any advertised APY and split it into base yield vs incentives using the protocol&#39;s own dashboard.\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Tells base yield from emissions\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Compares vaults vs DIY and prices points/airdrops as bets\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Builds yield from durable sources: lending, staking, savings rates, tokenized treasuries\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…you can name the source and the risk behind any yield in one sentence.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version Every yield is payment for a risk. Staking pays you to secure a network, lending pays for borrower demand, farms often pay in newly printed tokens. This module teaches you to see what each yield really pays for. Words you'll need Term Meaning APY yearly return including compounding Emissions new reward tokens printed by a protocol Staking locking tokens to help secure a network LST a token representing staked assets RWA a token representing a real world asset Before you start [ ] Modules 0–3 Your first safe step Take any advertised APY and split it into base yield vs incentives using the protocol's own dashboard. The mastery ladder Level You can… Beginner Tells base yield from emissions Practitioner Compares vaults vs DIY and prices points/airdrops as bets Master Builds yield from durable sources: lending, staking, savings rates, tokenized treasuries You've mastered this module when… …you can name the source and the risk behind any yield in one sentence.","video":null,"script":"video-scripts/lessons/lesson-04-0.json"},{"id":"4.1","title":"Yield farming: base yield vs emissions","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Split a farm&#39;s APY into what&#39;s earned from real activity and what&#39;s paid in newly minted tokens.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Base yield:\u003c/strong> trading fees or borrower interest. Paid by real users.\u003c/li>\n\u003cli>\u003cstrong>Emissions / incentives:\u003c/strong> new tokens the protocol prints to attract deposits. The reward token often falls while emissions continue.\u003c/li>\n\u003cli>\u003cstrong>Mercenary liquidity:\u003c/strong> capital that leaves when incentives end, often taking the base yield with it.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A farm shows \u003cstrong>60% APY\u003c/strong>: 5% fees + 55% in reward tokens. If the reward token\nfalls 50% on average while you harvest, the emissions are worth ~27.5%, so the\nreal return is ~\u003cstrong>32.5%\u003c/strong>, before impermanent loss and gas. Remove emissions\nentirely and you&#39;re left with 5%. \u003cstrong>Would you take the risk for 5%?\u003c/strong> That&#39;s the real question.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.1:c0\">\u003cspan>APY split into base vs incentives\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.1:c1\">\u003cspan>Reward token valued at a realistic, falling price\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.1:c2\">\u003cspan>Harvest-and-sell schedule set\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"4.1:q0\">\u003cdiv class=\"qtext\">What&#39;s the test for a farm?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Does the base yield alone justify the risk?\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.1:q1\">\u003cdiv class=\"qtext\">Why do emissions APYs fall?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>More capital shares the rewards, and the reward token&#39;s price often declines.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.1:q2\">\u003cdiv class=\"qtext\">What is mercenary liquidity?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Capital that moves on as soon as incentives end.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Split a farm's APY into what's earned from real activity and what's paid in newly minted tokens. Explanation Base yield: trading fees or borrower interest. Paid by real users. Emissions / incentives: new tokens the protocol prints to attract deposits. The reward token often falls while emissions continue. Mercenary liquidity: capital that leaves when incentives end, often taking the base yield with it. Worked example A farm shows 60% APY : 5% fees + 55% in reward tokens. If the reward token falls 50% on average while you harvest, the emissions are worth ~27.5%, so the real return is ~ 32.5% , before impermanent loss and gas. Remove emissions entirely and you're left with 5%. Would you take the risk for 5%? That's the real question. Checklist [ ] APY split into base vs incentives [ ] Reward token valued at a realistic, falling price [ ] Harvest and sell schedule set Quiz 1. What's the test for a farm? Does the base yield alone justify the risk? 2. Why do emissions APYs fall? More capital shares the rewards, and the reward token's price often declines. 3. What is mercenary liquidity? Capital that moves on as soon as incentives end.","video":null,"script":"video-scripts/lessons/lesson-04-1.json"},{"id":"4.2","title":"Native staking","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Understand what staking pays for, and its lock-up and validator risks.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Proof-of-stake networks pay \u003cstrong>stakers\u003c/strong> to secure the chain. You either run a\nvalidator or \u003cstrong>delegate\u003c/strong> to one. Rewards come from issuance and fees. Risks:\n\u003cstrong>slashing\u003c/strong> (penalties for validator misbehaviour on some networks),\n\u003cstrong>unbonding periods\u003c/strong> (waiting time to withdraw) and validator downtime.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Staking yields a few percent a year in the staked asset (e.g. ~3%, illustrative).\nYour dollar return is still dominated by the asset&#39;s price: +3% staking on an\nasset that falls 30% is still a large loss. \u003cstrong>Stake what you&#39;d hold anyway.\u003c/strong>\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.2:c0\">\u003cspan>Validator/provider chosen on uptime, fee, concentration and record\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.2:c1\">\u003cspan>Unbonding period known\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.2:c2\">\u003cspan>Only &quot;hold-anyway&quot; capital staked\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"4.2:q0\">\u003cdiv class=\"qtext\">What do staking rewards pay for?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Securing the network.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.2:q1\">\u003cdiv class=\"qtext\">What is unbonding?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A waiting period before unstaked assets become transferable.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.2:q2\">\u003cdiv class=\"qtext\">Does staking protect against price falls?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. It adds a small yield; price moves dominate.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Understand what staking pays for, and its lock up and validator risks. Explanation Proof of stake networks pay stakers to secure the chain. You either run a validator or delegate to one. Rewards come from issuance and fees. Risks: slashing (penalties for validator misbehaviour on some networks), unbonding periods (waiting time to withdraw) and validator downtime. Worked example Staking yields a few percent a year in the staked asset (e.g. ~3%, illustrative). Your dollar return is still dominated by the asset's price: +3% staking on an asset that falls 30% is still a large loss. Stake what you'd hold anyway. Checklist [ ] Validator/provider chosen on uptime, fee, concentration and record [ ] Unbonding period known [ ] Only \"hold anyway\" capital staked Quiz 1. What do staking rewards pay for? Securing the network. 2. What is unbonding? A waiting period before unstaked assets become transferable. 3. Does staking protect against price falls? No. It adds a small yield; price moves dominate.","video":null,"script":"video-scripts/lessons/lesson-04-2.json"},{"id":"4.3","title":"Liquid staking (LSTs)","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Use liquid staking tokens knowing how they accrue value and how they can depeg.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>A \u003cstrong>liquid staking token (LST)\u003c/strong> represents staked assets plus rewards, and can\nbe traded or used as collateral. Value accrues by \u003cstrong>rebasing\u003c/strong> (your balance\ngrows) or an \u003cstrong>exchange rate\u003c/strong> that rises (each token is worth more of the\nunderlying). In stress, an LST can trade at a \u003cstrong>discount\u003c/strong> to what it redeems for.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>An exchange-rate LST goes from 1.000 to 1.030 of the underlying over a year: \u003cstrong>3%\u003c/strong>.\nIn a panic it trades at 0.98 on the market. Holders who can wait for redemption\n(queue) recover 1.03; holders forced to sell take the 2% discount.\n\u003cstrong>Never borrow so close to the limit that an LST discount liquidates you.\u003c/strong>\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.3:c0\">\u003cspan>Accrual method known (rebase vs exchange rate)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.3:c1\">\u003cspan>Redemption path and queue length known\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.3:c2\">\u003cspan>Discount alert set if used as collateral\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"4.3:q0\">\u003cdiv class=\"qtext\">Two ways LSTs pass on rewards?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Rebasing balances, or a rising exchange rate.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.3:q1\">\u003cdiv class=\"qtext\">What is an LST discount?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Its market price falling below its redemption value.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.3:q2\">\u003cdiv class=\"qtext\">Who is hurt most by a discount?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Forced sellers and leveraged holders who get liquidated.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Use liquid staking tokens knowing how they accrue value and how they can depeg. Explanation A liquid staking token (LST) represents staked assets plus rewards, and can be traded or used as collateral. Value accrues by rebasing (your balance grows) or an exchange rate that rises (each token is worth more of the underlying). In stress, an LST can trade at a discount to what it redeems for. Worked example An exchange rate LST goes from 1.000 to 1.030 of the underlying over a year: 3% . In a panic it trades at 0.98 on the market. Holders who can wait for redemption (queue) recover 1.03; holders forced to sell take the 2% discount. Never borrow so close to the limit that an LST discount liquidates you. Checklist [ ] Accrual method known (rebase vs exchange rate) [ ] Redemption path and queue length known [ ] Discount alert set if used as collateral Quiz 1. Two ways LSTs pass on rewards? Rebasing balances, or a rising exchange rate. 2. What is an LST discount? Its market price falling below its redemption value. 3. Who is hurt most by a discount? Forced sellers and leveraged holders who get liquidated.","video":null,"script":"video-scripts/lessons/lesson-04-3.json"},{"id":"4.4","title":"Restaking & shared security","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Map the extra risk layers restaking adds before accepting its extra yield.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Restaking reuses staked assets to secure additional services, for extra\nrewards and often points. Each service adds its own \u003cstrong>slashing conditions\u003c/strong>,\nand \u003cstrong>operators\u003c/strong> (who run the services) add operational risk. One collateral\nbase securing many services creates \u003cstrong>correlated failure\u003c/strong>. Full strategy\ntreatment: Lesson 10.6.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Stack for one position: ETH → staked → LST → liquid restaking token →\nrestaking protocol → 4 services. That&#39;s \u003cstrong>6 layers\u003c/strong>, each able to fail. The extra\nyield must pay for all of them. Plan with points valued at zero.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.4:c0\">\u003cspan>Every layer of the stack written down\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.4:c1\">\u003cspan>Slashing conditions of each service read\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.4:c2\">\u003cspan>Sized in the speculative bucket\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"4.4:q0\">\u003cdiv class=\"qtext\">What does restaking add?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Extra rewards in exchange for extra slashing and operator risk.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.4:q1\">\u003cdiv class=\"qtext\">Why is correlated failure a concern?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>One collateral base secures many services; a failure can hit them all.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.4:q2\">\u003cdiv class=\"qtext\">How should points be valued when planning?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>At zero.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Map the extra risk layers restaking adds before accepting its extra yield. Explanation Restaking reuses staked assets to secure additional services, for extra rewards and often points. Each service adds its own slashing conditions , and operators (who run the services) add operational risk. One collateral base securing many services creates correlated failure . Full strategy treatment: Lesson 10.6. Worked example Stack for one position: ETH → staked → LST → liquid restaking token → restaking protocol → 4 services. That's 6 layers , each able to fail. The extra yield must pay for all of them. Plan with points valued at zero. Checklist [ ] Every layer of the stack written down [ ] Slashing conditions of each service read [ ] Sized in the speculative bucket Quiz 1. What does restaking add? Extra rewards in exchange for extra slashing and operator risk. 2. Why is correlated failure a concern? One collateral base secures many services; a failure can hit them all. 3. How should points be valued when planning? At zero.","video":null,"script":"video-scripts/lessons/lesson-04-4.json"},{"id":"4.5","title":"Vaults & yield optimisers","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Decide when a vault&#39;s fees are worth paying compared with doing it yourself.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>A \u003cstrong>vault\u003c/strong> pools deposits and runs a strategy (often harvesting and\nreinvesting rewards). You get \u003cstrong>shares\u003c/strong>. Costs: \u003cstrong>performance fee\u003c/strong> (a share of\nprofits), \u003cstrong>management fee\u003c/strong> (a share of assets per year), sometimes\n\u003cstrong>withdrawal fees\u003c/strong>. Risks: the vault&#39;s code plus \u003cstrong>every protocol it uses\u003c/strong>.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Gross 10%, 20% performance fee, 0.5% management → \u003cstrong>7.5%\u003c/strong> net.\nDIY instead, compounding weekly at $2 gas:\u003c/p>\n\u003cul>\n\u003cli>$5,000 position: gas = $104/yr = \u003cstrong>2.08%\u003c/strong> drag → the vault probably wins.\u003c/li>\n\u003cli>$500,000 position: gas = \u003cstrong>0.02%\u003c/strong> drag, while the vault&#39;s fees cost 2.5 points → DIY probably wins.\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.5:c0\">\u003cspan>Net APY after all vault fees computed\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.5:c1\">\u003cspan>Compared with DIY gas drag at my size\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.5:c2\">\u003cspan>Every underlying protocol reviewed\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"4.5:q0\">\u003cdiv class=\"qtext\">Gross 12%, 10% performance fee, 1% management. Net?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>12 × 0.9 − 1 = 9.8%.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.5:q1\">\u003cdiv class=\"qtext\">Why do vaults suit small positions?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>They spread gas costs across all depositors.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.5:q2\">\u003cdiv class=\"qtext\">What risk does a vault add?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Its own code and strategy, on top of every protocol it deposits into.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Decide when a vault's fees are worth paying compared with doing it yourself. Explanation A vault pools deposits and runs a strategy (often harvesting and reinvesting rewards). You get shares . Costs: performance fee (a share of profits), management fee (a share of assets per year), sometimes withdrawal fees . Risks: the vault's code plus every protocol it uses . Worked example Gross 10%, 20% performance fee, 0.5% management → 7.5% net. DIY instead, compounding weekly at $2 gas: $5,000 position: gas = $104/yr = 2.08% drag → the vault probably wins. $500,000 position: gas = 0.02% drag, while the vault's fees cost 2.5 points → DIY probably wins. Checklist [ ] Net APY after all vault fees computed [ ] Compared with DIY gas drag at my size [ ] Every underlying protocol reviewed Quiz 1. Gross 12%, 10% performance fee, 1% management. Net? 12 × 0.9 − 1 = 9.8%. 2. Why do vaults suit small positions? They spread gas costs across all depositors. 3. What risk does a vault add? Its own code and strategy, on top of every protocol it deposits into.","video":null,"script":"video-scripts/lessons/lesson-04-5.json"},{"id":"4.6","title":"Airdrops & points: opportunity cost","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Price airdrop and points farming as a bet, including its costs.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Protocols reward early users with tokens (\u003cstrong>airdrops\u003c/strong>), often tracked by\n\u003cstrong>points\u003c/strong> first. Eligibility rules, snapshots and \u003cstrong>sybil filters\u003c/strong> (removing\npeople who split into many wallets) decide who gets what. Nothing is promised.\nFake claim sites are one of the most common scams (Lesson 1.6).\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>\u003ccode>defi_calc.py airdrop --probability 0.3 --value 1500 --costs 200\u003c/code> → EV \u003cstrong>$250\u003c/strong>.\nIf the same $10,000 could earn 5% ($500/yr) risk-light elsewhere, the farm must\nbeat that plus its extra risk, or it&#39;s the worse choice.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.6:c0\">\u003cspan>Only actions I&#39;d take anyway, or a capped speculative budget\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.6:c1\">\u003cspan>Opportunity cost compared\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.6:c2\">\u003cspan>Claims only from verified official links\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"4.6:q0\">\u003cdiv class=\"qtext\">Are points a promise of tokens?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.6:q1\">\u003cdiv class=\"qtext\">What&#39;s a sybil filter?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Rules that exclude wallets believed to belong to the same person farming many times.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.6:q2\">\u003cdiv class=\"qtext\">What&#39;s the airdrop EV formula?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Probability × value − costs.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Price airdrop and points farming as a bet, including its costs. Explanation Protocols reward early users with tokens ( airdrops ), often tracked by points first. Eligibility rules, snapshots and sybil filters (removing people who split into many wallets) decide who gets what. Nothing is promised. Fake claim sites are one of the most common scams (Lesson 1.6). Worked example defi calc.py airdrop probability 0.3 value 1500 costs 200 → EV $250 . If the same $10,000 could earn 5% ($500/yr) risk light elsewhere, the farm must beat that plus its extra risk, or it's the worse choice. Checklist [ ] Only actions I'd take anyway, or a capped speculative budget [ ] Opportunity cost compared [ ] Claims only from verified official links Quiz 1. Are points a promise of tokens? No. 2. What's a sybil filter? Rules that exclude wallets believed to belong to the same person farming many times. 3. What's the airdrop EV formula? Probability × value − costs.","video":null,"script":"video-scripts/lessons/lesson-04-6.json"},{"id":"4.7","title":"Stablecoin savings rates and yield-bearing stablecoins","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Tell apart the different ways a stablecoin can pay yield, and the risk behind each.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Yield on &quot;dollars&quot; on-chain comes from one of four places:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Lending:\u003c/strong> you lend stablecoins to borrowers (Module 3). Risk: the protocol, collateral and oracles.\u003c/li>\n\u003cli>\u003cstrong>Savings rates:\u003c/strong> some stablecoin protocols pay a set rate to holders who deposit into a savings contract, funded by their own revenue. Risk: the stablecoin&#39;s design and governance setting the rate.\u003c/li>\n\u003cli>\u003cstrong>Treasury-backed:\u003c/strong> the issuer holds short-term government debt and passes on part of the interest (Lesson 4.8). Risk: the issuer, custodian and redemption terms.\u003c/li>\n\u003cli>\u003cstrong>Synthetic / basis-backed:\u003c/strong> yield comes from a hedged derivatives position (spot long + perp short) earning funding. Risk: funding turns negative, exchange failure, and the design itself (Lesson 10.3).\u003c/li>\n\u003c/ol>\n\u003cp>Same &quot;4–10% on dollars&quot;, four completely different risks.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>$10,000 in a yield-bearing stablecoin paying 4.5% earns ~\u003cstrong>$450/yr\u003c/strong> \u003cem>if\u003c/em> the rate\nholds. Before buying, answer: where does the 4.5% come from (1–4 above)? What\nhappens to it in a bear market when funding goes negative? Can you redeem for\n$1, and who can?\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.7:c0\">\u003cspan>Yield source identified (lending, savings rate, treasuries or basis)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.7:c1\">\u003cspan>Redemption path and who can redeem known\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.7:c2\">\u003cspan>Split across different yield sources, not just different tickers\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"4.7:q0\">\u003cdiv class=\"qtext\">Name the four sources of stablecoin yield.\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Lending, protocol savings rates, treasury backing, and synthetic basis/funding positions.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.7:q1\">\u003cdiv class=\"qtext\">Why can a basis-backed stablecoin&#39;s yield fall to zero?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Funding can turn negative in bear markets.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.7:q2\">\u003cdiv class=\"qtext\">Two yield-bearing stablecoins both backed by basis trades: diversified?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Not really. They share the same yield source and failure mode.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Tell apart the different ways a stablecoin can pay yield, and the risk behind each. Explanation Yield on \"dollars\" on chain comes from one of four places: 1. Lending: you lend stablecoins to borrowers (Module 3). Risk: the protocol, collateral and oracles. 2. Savings rates: some stablecoin protocols pay a set rate to holders who deposit into a savings contract, funded by their own revenue. Risk: the stablecoin's design and governance setting the rate. 3. Treasury backed: the issuer holds short term government debt and passes on part of the interest (Lesson 4.8). Risk: the issuer, custodian and redemption terms. 4. Synthetic / basis backed: yield comes from a hedged derivatives position (spot long + perp short) earning funding. Risk: funding turns negative, exchange failure, and the design itself (Lesson 10.3). Same \"4–10% on dollars\", four completely different risks. Worked example $10,000 in a yield bearing stablecoin paying 4.5% earns ~ $450/yr if the rate holds. Before buying, answer: where does the 4.5% come from (1–4 above)? What happens to it in a bear market when funding goes negative? Can you redeem for $1, and who can? Checklist [ ] Yield source identified (lending, savings rate, treasuries or basis) [ ] Redemption path and who can redeem known [ ] Split across different yield sources, not just different tickers Quiz 1. Name the four sources of stablecoin yield. Lending, protocol savings rates, treasury backing, and synthetic basis/funding positions. 2. Why can a basis backed stablecoin's yield fall to zero? Funding can turn negative in bear markets. 3. Two yield bearing stablecoins both backed by basis trades: diversified? Not really. They share the same yield source and failure mode.","video":null,"script":"video-scripts/lessons/lesson-04-7.json"},{"id":"4.8","title":"Tokenized treasuries and real-world assets (RWAs)","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Use tokenized real-world assets knowing what you actually own and who you&#39;re trusting.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>RWAs\u003c/strong> are tokens that represent off-chain assets: short-term government bills (the most common), money-market funds, credit, commodities, property.\u003c/li>\n\u003cli>Tokenized treasury products typically pay close to the short-term government rate \u003cstrong>minus a management fee\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>What you&#39;re trusting:\u003c/strong> the \u003cstrong>issuer\u003c/strong> (legal structure), the \u003cstrong>custodian\u003c/strong> holding the real assets, the \u003cstrong>redemption\u003c/strong> process, and the token&#39;s \u003cstrong>transfer rules\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Access limits:\u003c/strong> many RWA tokens are only for verified (KYC&#39;d) or accredited/qualified investors, and not available in every country. Check eligibility where you live; don&#39;t try to get around restrictions.\u003c/li>\n\u003cli>\u003cstrong>Composability:\u003c/strong> some RWA tokens can be used as collateral in DeFi; others are restricted to allowlisted wallets.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>If short-term government bills yield 4.0% and the product charges 0.15%, you&#39;d\nearn about \u003cstrong>3.85%\u003c/strong> before any on-chain costs. In the own-bank ladder (Module 12.4),\nthis can suit the T1/T2 tiers, but only if redemption times match when you&#39;ll need the money.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.8:c0\">\u003cspan>I&#39;m eligible in my country (and it&#39;s legal to hold)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.8:c1\">\u003cspan>Issuer, custodian and redemption terms read\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.8:c2\">\u003cspan>Transfer restrictions and minimums known\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"4.8:c3\">\u003cspan>Sized within caps, like any other issuer risk\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"4.8:q0\">\u003cdiv class=\"qtext\">What does a tokenized treasury product&#39;s yield track?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Short-term government rates, minus the product&#39;s fees.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.8:q1\">\u003cdiv class=\"qtext\">Name two parties you trust with an RWA token.\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Any two: the issuer, the custodian, the redemption agent, the token&#39;s administrators.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"4.8:q2\">\u003cdiv class=\"qtext\">Why check transfer restrictions?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Some RWA tokens only move between allowlisted wallets, which limits exit and DeFi use.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Use tokenized real world assets knowing what you actually own and who you're trusting. Explanation RWAs are tokens that represent off chain assets: short term government bills (the most common), money market funds, credit, commodities, property. Tokenized treasury products typically pay close to the short term government rate minus a management fee . What you're trusting: the issuer (legal structure), the custodian holding the real assets, the redemption process, and the token's transfer rules . Access limits: many RWA tokens are only for verified (KYC'd) or accredited/qualified investors, and not available in every country. Check eligibility where you live; don't try to get around restrictions. Composability: some RWA tokens can be used as collateral in DeFi; others are restricted to allowlisted wallets. Worked example (illustrative) If short term government bills yield 4.0% and the product charges 0.15%, you'd earn about 3.85% before any on chain costs. In the own bank ladder (Module 12.4), this can suit the T1/T2 tiers, but only if redemption times match when you'll need the money. Checklist [ ] I'm eligible in my country (and it's legal to hold) [ ] Issuer, custodian and redemption terms read [ ] Transfer restrictions and minimums known [ ] Sized within caps, like any other issuer risk Quiz 1. What does a tokenized treasury product's yield track? Short term government rates, minus the product's fees. 2. Name two parties you trust with an RWA token. Any two: the issuer, the custodian, the redemption agent, the token's administrators. 3. Why check transfer restrictions? Some RWA tokens only move between allowlisted wallets, which limits exit and DeFi use.","video":null,"script":"video-scripts/lessons/lesson-04-8.json"}]},{"n":5,"title":"Infrastructure Risk","outcome":"map every bridge, oracle, L2 and contract a position depends on.","icon":"layers","banner":"../assets/modules/module-05.png","intro":{"src":"../video/module-05-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"5.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>Your position is only as safe as the weakest thing it depends on: the bridge that moved your tokens, the oracle that prices your collateral, the admin key that can upgrade the contract. Most big DeFi losses came from this plumbing.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Bridge\u003c/td>\n\u003ctd>moves tokens between chains\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Layer 2\u003c/td>\n\u003ctd>a cheaper network built on Ethereum\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Oracle\u003c/td>\n\u003ctd>feeds prices into contracts\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Proxy\u003c/td>\n\u003ctd>a contract whose logic can be upgraded\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Timelock\u003c/td>\n\u003ctd>a delay before changes take effect\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.0:c0\">\u003cspan>Modules 0–4\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>On a block explorer, open a protocol you use: is it a proxy? Who can upgrade it? Is there a timelock?\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Knows which chain, bridge and oracle each position uses\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Draws a full dependency map and reads audits properly\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Operates across EVM and non-EVM chains with capped bridge and wrapper exposure\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…you can draw the complete dependency map of any position and rate each link.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version Your position is only as safe as the weakest thing it depends on: the bridge that moved your tokens, the oracle that prices your collateral, the admin key that can upgrade the contract. Most big DeFi losses came from this plumbing. Words you'll need Term Meaning Bridge moves tokens between chains Layer 2 a cheaper network built on Ethereum Oracle feeds prices into contracts Proxy a contract whose logic can be upgraded Timelock a delay before changes take effect Before you start [ ] Modules 0–4 Your first safe step On a block explorer, open a protocol you use: is it a proxy? Who can upgrade it? Is there a timelock? The mastery ladder Level You can… Beginner Knows which chain, bridge and oracle each position uses Practitioner Draws a full dependency map and reads audits properly Master Operates across EVM and non EVM chains with capped bridge and wrapper exposure You've mastered this module when… …you can draw the complete dependency map of any position and rate each link.","video":null,"script":"video-scripts/lessons/lesson-05-0.json"},{"id":"5.1","title":"Bridges and trust assumptions","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Choose bridge routes by their trust model, and size bridge exposure accordingly.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Bridges move value between chains:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Canonical bridges:\u003c/strong> the chain&#39;s official route (e.g. a rollup&#39;s native bridge). Usually the strongest security, sometimes slower.\u003c/li>\n\u003cli>\u003cstrong>Lock-and-mint:\u003c/strong> assets locked on chain A, a wrapped copy minted on chain B. The wrapped copy is only as good as the lock.\u003c/li>\n\u003cli>\u003cstrong>Liquidity networks:\u003c/strong> market makers pay you out on the other side. Fast; you rely on their contracts and liquidity.\u003c/li>\n\u003cli>\u003cstrong>Trust model:\u003c/strong> who can approve a transfer: a multisig of a few keys, a validator set, a light client, or fraud/validity proofs? Fewer, weaker signers = more risk.\u003c/li>\n\u003c/ul>\n\u003cp>Bridges hold large pools of value, which makes them prime targets.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Moving $50,000 to a Layer 2: use the canonical route for the bulk (even if\nslower), a reputable fast bridge for a small, time-sensitive amount, and send a\ntest first. Never leave large balances as a \u003cstrong>wrapped\u003c/strong> asset from a weak bridge.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.1:c0\">\u003cspan>Trust model of every bridge I use written down\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.1:c1\">\u003cspan>Canonical route preferred for size\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.1:c2\">\u003cspan>Wrapped-asset exposure capped\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"5.1:q0\">\u003cdiv class=\"qtext\">What backs a lock-and-mint wrapped token?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The locked assets on the source chain, and the bridge&#39;s security.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.1:q1\">\u003cdiv class=\"qtext\">Why are bridges frequent hack targets?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>They concentrate large amounts of value behind complex, cross-chain logic.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.1:q2\">\u003cdiv class=\"qtext\">Fast bridge or canonical for $50k?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Canonical for the bulk; fast only for small, urgent amounts.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Choose bridge routes by their trust model, and size bridge exposure accordingly. Explanation Bridges move value between chains: Canonical bridges: the chain's official route (e.g. a rollup's native bridge). Usually the strongest security, sometimes slower. Lock and mint: assets locked on chain A, a wrapped copy minted on chain B. The wrapped copy is only as good as the lock. Liquidity networks: market makers pay you out on the other side. Fast; you rely on their contracts and liquidity. Trust model: who can approve a transfer: a multisig of a few keys, a validator set, a light client, or fraud/validity proofs? Fewer, weaker signers = more risk. Bridges hold large pools of value, which makes them prime targets. Worked example Moving $50,000 to a Layer 2: use the canonical route for the bulk (even if slower), a reputable fast bridge for a small, time sensitive amount, and send a test first. Never leave large balances as a wrapped asset from a weak bridge. Checklist [ ] Trust model of every bridge I use written down [ ] Canonical route preferred for size [ ] Wrapped asset exposure capped Quiz 1. What backs a lock and mint wrapped token? The locked assets on the source chain, and the bridge's security. 2. Why are bridges frequent hack targets? They concentrate large amounts of value behind complex, cross chain logic. 3. Fast bridge or canonical for $50k? Canonical for the bulk; fast only for small, urgent amounts.","video":null,"script":"video-scripts/lessons/lesson-05-1.json"},{"id":"5.2","title":"Layer 2s, sequencers & withdrawal paths","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Understand how your L2 settles, who orders your transactions, and how you&#39;d exit.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Rollups\u003c/strong> execute transactions off Ethereum and post data or proofs back to it.\u003c/li>\n\u003cli>\u003cstrong>Optimistic rollups\u003c/strong> assume transactions are valid unless challenged. Native withdrawals to Ethereum wait out a \u003cstrong>challenge window\u003c/strong> (about 7 days on major optimistic rollups).\u003c/li>\n\u003cli>\u003cstrong>ZK rollups\u003c/strong> post validity proofs, so native withdrawals can be faster.\u003c/li>\n\u003cli>\u003cstrong>Sequencer:\u003c/strong> the operator that orders transactions. Often a single operator today; if it goes down, the chain may pause.\u003c/li>\n\u003cli>\u003cstrong>Escape hatches:\u003c/strong> most rollups let you force a withdrawal via Ethereum if the sequencer censors you. Know if yours does.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>You hold $20,000 on an optimistic rollup and need it on Ethereum. Native bridge:\nsafest, ~7 days. Fast bridge: minutes, for a fee, relying on its liquidity.\n\u003cstrong>Plan your liquidity ladder (Module 12.4) around the slow path.\u003c/strong>\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.2:c0\">\u003cspan>Rollup type and withdrawal time known for each L2 I use\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.2:c1\">\u003cspan>Sequencer setup and escape hatch known\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.2:c2\">\u003cspan>Liquidity plan assumes the slow path\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"5.2:q0\">\u003cdiv class=\"qtext\">Why do optimistic rollup withdrawals take ~7 days?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The challenge window lets anyone dispute an invalid state before it&#39;s final.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.2:q1\">\u003cdiv class=\"qtext\">What happens if a single sequencer goes down?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The L2 may pause transactions until it recovers.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.2:q2\">\u003cdiv class=\"qtext\">What&#39;s an escape hatch?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A way to force a transaction or withdrawal via the base chain if the sequencer censors you.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Understand how your L2 settles, who orders your transactions, and how you'd exit. Explanation Rollups execute transactions off Ethereum and post data or proofs back to it. Optimistic rollups assume transactions are valid unless challenged. Native withdrawals to Ethereum wait out a challenge window (about 7 days on major optimistic rollups). ZK rollups post validity proofs, so native withdrawals can be faster. Sequencer: the operator that orders transactions. Often a single operator today; if it goes down, the chain may pause. Escape hatches: most rollups let you force a withdrawal via Ethereum if the sequencer censors you. Know if yours does. Worked example You hold $20,000 on an optimistic rollup and need it on Ethereum. Native bridge: safest, ~7 days. Fast bridge: minutes, for a fee, relying on its liquidity. Plan your liquidity ladder (Module 12.4) around the slow path. Checklist [ ] Rollup type and withdrawal time known for each L2 I use [ ] Sequencer setup and escape hatch known [ ] Liquidity plan assumes the slow path Quiz 1. Why do optimistic rollup withdrawals take ~7 days? The challenge window lets anyone dispute an invalid state before it's final. 2. What happens if a single sequencer goes down? The L2 may pause transactions until it recovers. 3. What's an escape hatch? A way to force a transaction or withdrawal via the base chain if the sequencer censors you.","video":null,"script":"video-scripts/lessons/lesson-05-2.json"},{"id":"5.3","title":"Oracles, TWAPs & manipulation","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Know which price feed secures each position, and how it can fail.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Smart contracts can&#39;t see market prices; \u003cstrong>oracles\u003c/strong> bring them in. Lending\nmarkets liquidate based on the oracle price, not the price you see on screen.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Push oracles:\u003c/strong> a network updates prices on a schedule or when price moves past a \u003cstrong>deviation threshold\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Pull oracles:\u003c/strong> prices are fetched and verified when a transaction needs them.\u003c/li>\n\u003cli>\u003cstrong>TWAP\u003c/strong> (time-weighted average price) smooths manipulation, but \u003cstrong>lags\u003c/strong> fast moves.\u003c/li>\n\u003cli>\u003cstrong>Failures:\u003c/strong> stale prices in outages, manipulation of thin markets, misconfigured feeds.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Your collateral is priced by a 30-minute TWAP. The market drops 10% in 5\nminutes. Your screen shows −10%; the oracle shows maybe −2%. You feel liquidated\nand aren&#39;t yet, \u003cstrong>but you also can&#39;t rely on the lag\u003c/strong>: it catches up.\nConversely, a thinly traded collateral token can be pushed up and borrowed against by an attacker.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.3:c0\">\u003cspan>Oracle type and source known for each collateral\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.3:c1\">\u003cspan>Thin-market collateral avoided or capped\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.3:c2\">\u003cspan>Buffers sized for oracle catch-up\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"5.3:q0\">\u003cdiv class=\"qtext\">Which price triggers a DeFi liquidation?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The oracle price used by the protocol.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.3:q1\">\u003cdiv class=\"qtext\">What&#39;s the trade-off of a TWAP?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Harder to manipulate, but it lags fast moves.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.3:q2\">\u003cdiv class=\"qtext\">Why is thin-market collateral dangerous for lenders?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Its price can be manipulated to borrow more than it&#39;s really worth.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Know which price feed secures each position, and how it can fail. Explanation Smart contracts can't see market prices; oracles bring them in. Lending markets liquidate based on the oracle price, not the price you see on screen. Push oracles: a network updates prices on a schedule or when price moves past a deviation threshold . Pull oracles: prices are fetched and verified when a transaction needs them. TWAP (time weighted average price) smooths manipulation, but lags fast moves. Failures: stale prices in outages, manipulation of thin markets, misconfigured feeds. Worked example Your collateral is priced by a 30 minute TWAP. The market drops 10% in 5 minutes. Your screen shows −10%; the oracle shows maybe −2%. You feel liquidated and aren't yet, but you also can't rely on the lag : it catches up. Conversely, a thinly traded collateral token can be pushed up and borrowed against by an attacker. Checklist [ ] Oracle type and source known for each collateral [ ] Thin market collateral avoided or capped [ ] Buffers sized for oracle catch up Quiz 1. Which price triggers a DeFi liquidation? The oracle price used by the protocol. 2. What's the trade off of a TWAP? Harder to manipulate, but it lags fast moves. 3. Why is thin market collateral dangerous for lenders? Its price can be manipulated to borrow more than it's really worth.","video":null,"script":"video-scripts/lessons/lesson-05-3.json"},{"id":"5.4","title":"Smart contracts: state, proxies, admin keys","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Read who controls a contract and whether its code can change after you deposit.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>State:\u003c/strong> what a contract stores (balances, parameters). \u003cstrong>Functions\u003c/strong> change it; \u003cstrong>events\u003c/strong> log what happened.\u003c/li>\n\u003cli>\u003cstrong>Verified source:\u003c/strong> the code published on the explorer matches what&#39;s deployed. That&#39;s good, not proof of safety.\u003c/li>\n\u003cli>\u003cstrong>Proxy / upgradeable contracts:\u003c/strong> the address you use stays the same, but the logic behind it can be swapped. Whoever controls upgrades controls your funds&#39; rules.\u003c/li>\n\u003cli>\u003cstrong>Admin keys and roles:\u003c/strong> owners, guardians, multisigs; can they pause, upgrade or move funds?\u003c/li>\n\u003cli>\u003cstrong>Timelocks:\u003c/strong> a delay between an approved change and it taking effect. Your window to exit.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>On a block explorer, the vault you use shows &quot;Proxy&quot;, with the upgrade admin a\n\u003cstrong>3-of-5 multisig\u003c/strong> behind a \u003cstrong>48-hour timelock\u003c/strong>. That means no instant rug by\none key, and 48 hours to exit if a change you don&#39;t like is queued.\nA 1-of-1 admin with no timelock is a red flag.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.4:c0\">\u003cspan>Proxy or not, and who can upgrade\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.4:c1\">\u003cspan>Admin roles and multisig threshold known\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.4:c2\">\u003cspan>Timelock length known; alert on queued changes for large positions\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"5.4:q0\">\u003cdiv class=\"qtext\">Does verified source code mean safe?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. It means the published code matches the deployed code.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.4:q1\">\u003cdiv class=\"qtext\">Why does a timelock matter to users?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It gives time to see and exit before a change takes effect.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.4:q2\">\u003cdiv class=\"qtext\">Red flag in admin setup?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A single key that can upgrade or move funds instantly.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Read who controls a contract and whether its code can change after you deposit. Explanation State: what a contract stores (balances, parameters). Functions change it; events log what happened. Verified source: the code published on the explorer matches what's deployed. That's good, not proof of safety. Proxy / upgradeable contracts: the address you use stays the same, but the logic behind it can be swapped. Whoever controls upgrades controls your funds' rules. Admin keys and roles: owners, guardians, multisigs; can they pause, upgrade or move funds? Timelocks: a delay between an approved change and it taking effect. Your window to exit. Worked example On a block explorer, the vault you use shows \"Proxy\", with the upgrade admin a 3 of 5 multisig behind a 48 hour timelock . That means no instant rug by one key, and 48 hours to exit if a change you don't like is queued. A 1 of 1 admin with no timelock is a red flag. Checklist [ ] Proxy or not, and who can upgrade [ ] Admin roles and multisig threshold known [ ] Timelock length known; alert on queued changes for large positions Quiz 1. Does verified source code mean safe? No. It means the published code matches the deployed code. 2. Why does a timelock matter to users? It gives time to see and exit before a change takes effect. 3. Red flag in admin setup? A single key that can upgrade or move funds instantly.","video":null,"script":"video-scripts/lessons/lesson-05-4.json"},{"id":"5.5","title":"Smart-contract risk & what audits don't prove","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Weigh contract risk honestly, and read an audit for what it actually covers.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Common failure types:\u003c/strong> logic bugs, \u003cstrong>reentrancy\u003c/strong> (a contract is called back before it updates its state), broken access control, and \u003cstrong>economic exploits\u003c/strong> (correct code, exploitable incentives or oracles).\u003c/li>\n\u003cli>\u003cstrong>Audits\u003c/strong> review specific code at a specific time. Check the \u003cstrong>scope\u003c/strong> (which contracts), \u003cstrong>date\u003c/strong> (before later changes?), \u003cstrong>severity of findings\u003c/strong> and whether they were \u003cstrong>fixed\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Bug bounties\u003c/strong> pay hackers to report instead of exploit. A large, active bounty is a good sign.\u003c/li>\n\u003cli>\u003cstrong>Time and value at risk:\u003c/strong> code that has safely held large value for years has survived more real attacks.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Protocol X: two audits, but the latest upgrade (last month) isn&#39;t in either\nscope; bounty $50k; TVL $400M. The newest code is unaudited and the bounty is\nsmall relative to the value. Size down, or wait.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.5:c0\">\u003cspan>Audit scope matches deployed code; date after last upgrade\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.5:c1\">\u003cspan>Critical/high findings resolved\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.5:c2\">\u003cspan>Bug bounty size relative to TVL checked\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"5.5:q0\">\u003cdiv class=\"qtext\">What does an audit not prove?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>That the code (or later changes, or economic design) is safe.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.5:q1\">\u003cdiv class=\"qtext\">What is reentrancy?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A contract being called back before it finishes updating its state, letting an attacker repeat actions.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.5:q2\">\u003cdiv class=\"qtext\">Why check audit dates?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Code changed after the audit wasn&#39;t reviewed.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Weigh contract risk honestly, and read an audit for what it actually covers. Explanation Common failure types: logic bugs, reentrancy (a contract is called back before it updates its state), broken access control, and economic exploits (correct code, exploitable incentives or oracles). Audits review specific code at a specific time. Check the scope (which contracts), date (before later changes?), severity of findings and whether they were fixed . Bug bounties pay hackers to report instead of exploit. A large, active bounty is a good sign. Time and value at risk: code that has safely held large value for years has survived more real attacks. Worked example Protocol X: two audits, but the latest upgrade (last month) isn't in either scope; bounty $50k; TVL $400M. The newest code is unaudited and the bounty is small relative to the value. Size down, or wait. Checklist [ ] Audit scope matches deployed code; date after last upgrade [ ] Critical/high findings resolved [ ] Bug bounty size relative to TVL checked Quiz 1. What does an audit not prove? That the code (or later changes, or economic design) is safe. 2. What is reentrancy? A contract being called back before it finishes updating its state, letting an attacker repeat actions. 3. Why check audit dates? Code changed after the audit wasn't reviewed.","video":null,"script":"video-scripts/lessons/lesson-05-5.json"},{"id":"5.6","title":"Beyond Ethereum: Solana, Bitcoin and other ecosystems","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Operate safely on non-EVM chains and understand how Bitcoin is used in DeFi.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Solana:\u003c/strong> a separate, high-throughput chain with its own wallets (e.g. Phantom, Solflare), its own address format, very low fees (paid in SOL), and priority fees when busy. Tokens follow its own standard (SPL). Your Ethereum address \u003cstrong>doesn&#39;t\u003c/strong> work there. Sending between ecosystems needs a bridge or an exchange.\u003c/li>\n\u003cli>\u003cstrong>Bitcoin in DeFi:\u003c/strong> BTC itself doesn&#39;t run DeFi apps, so it&#39;s usually used as a \u003cstrong>wrapped\u003c/strong> token on other chains (backed by a custodian, a group of signers, or a protocol), or on Bitcoin layer 2s and sidechains. \u003cstrong>Each wrapper has its own trust model.\u003c/strong> Your &quot;BTC&quot; is only as good as whoever holds the real BTC.\u003c/li>\n\u003cli>\u003cstrong>Other ecosystems\u003c/strong> (e.g. Cosmos chains connected by IBC, Move-based chains) each have their own wallets, fees and bridges. Apply Module 5&#39;s dependency map to each.\u003c/li>\n\u003cli>\u003cstrong>Same rules everywhere:\u003c/strong> official wallet from the official site, test transaction first, correct network, gas token on hand.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>You hold 1 BTC and want to lend it on Ethereum. Options: a custodial wrapper (trust\none company), a decentralised wrapper (trust a signer set or protocol), or not\nwrapping at all. Write each option&#39;s trust model and cap wrapped BTC as bridge risk (5.1).\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.6:c0\">\u003cspan>Separate, official wallet for each non-EVM chain I use\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.6:c1\">\u003cspan>Gas token held on each chain\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.6:c2\">\u003cspan>Wrapped-BTC trust model known and capped\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"5.6:q0\">\u003cdiv class=\"qtext\">Does your Ethereum address work on Solana?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. It&#39;s a different ecosystem with its own address format and wallets.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.6:q1\">\u003cdiv class=\"qtext\">What determines a wrapped BTC token&#39;s safety?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Who holds the real BTC and how it can be redeemed: its trust model.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.6:q2\">\u003cdiv class=\"qtext\">What&#39;s Solana&#39;s gas token?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>SOL.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Operate safely on non EVM chains and understand how Bitcoin is used in DeFi. Explanation Solana: a separate, high throughput chain with its own wallets (e.g. Phantom, Solflare), its own address format, very low fees (paid in SOL), and priority fees when busy. Tokens follow its own standard (SPL). Your Ethereum address doesn't work there. Sending between ecosystems needs a bridge or an exchange. Bitcoin in DeFi: BTC itself doesn't run DeFi apps, so it's usually used as a wrapped token on other chains (backed by a custodian, a group of signers, or a protocol), or on Bitcoin layer 2s and sidechains. Each wrapper has its own trust model. Your \"BTC\" is only as good as whoever holds the real BTC. Other eco
