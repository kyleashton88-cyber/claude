transactions/day, $2M\nfees. B&#39;s users pay 100× more for blockspace, a stronger sign of valuable activity.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.6:c0\">\u003cspan>Fees and app revenue compared, not just transaction counts\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.6:c1\">\u003cspan>Bot activity considered\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"7.6:q0\">\u003cdiv class=\"qtext\">Why are fees a better usage signal than transaction counts?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Paying fees shows real demand; counts are easy to inflate.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.6:q1\">\u003cdiv class=\"qtext\">What distorts transaction counts?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Bots, batching and chain design.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.6:q2\">\u003cdiv class=\"qtext\">Name one strong activity metric.\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Fees, app revenue, stablecoin activity or user retention.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Judge a chain's real usage beyond transaction counts. Explanation Transaction counts depend on architecture and bots. Better: fees paid (real demand for blockspace), stablecoin activity , DEX volume , app revenue , and retention of users over time. Worked example Chain A: 5M transactions/day, $20k fees. Chain B: 500k transactions/day, $2M fees. B's users pay 100× more for blockspace, a stronger sign of valuable activity. Checklist [ ] Fees and app revenue compared, not just transaction counts [ ] Bot activity considered Quiz 1. Why are fees a better usage signal than transaction counts? Paying fees shows real demand; counts are easy to inflate. 2. What distorts transaction counts? Bots, batching and chain design. 3. Name one strong activity metric. Fees, app revenue, stablecoin activity or user retention.","video":null,"script":"video-scripts/lessons/lesson-07-6.json"},{"id":"7.7","title":"DEX & liquidity analytics","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Measure whether a pool can actually absorb your trade and pay you as an LP.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>TVL\u003c/strong> can double count and moves with token prices.\u003c/li>\n\u003cli>\u003cstrong>Depth:\u003c/strong> the price impact for a given trade size. The number that matters for execution.\u003c/li>\n\u003cli>\u003cstrong>Volume/TVL:\u003c/strong> rough capital turnover; higher means more fees per dollar (Lesson 2.3).\u003c/li>\n\u003cli>\u003cstrong>Liquidity migration:\u003c/strong> incentives move liquidity quickly between pools and chains.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Pool A: $50M TVL, $5M daily volume (0.1 turnover). Pool B: $10M TVL, $8M\nvolume (0.8 turnover). B pays LPs far more per dollar, but a $1M trade will\nmove B&#39;s price much more than A&#39;s.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.7:c0\">\u003cspan>Depth checked at my trade size\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.7:c1\">\u003cspan>Volume/TVL used for LP fee estimates\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"7.7:q0\">\u003cdiv class=\"qtext\">Why is depth more useful than TVL for traders?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It measures price impact at a given size.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.7:q1\">\u003cdiv class=\"qtext\">High volume/TVL means?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>More fees per dollar of liquidity.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.7:q2\">\u003cdiv class=\"qtext\">What causes liquidity migration?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Incentives moving between pools and chains.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Measure whether a pool can actually absorb your trade and pay you as an LP. Explanation TVL can double count and moves with token prices. Depth: the price impact for a given trade size. The number that matters for execution. Volume/TVL: rough capital turnover; higher means more fees per dollar (Lesson 2.3). Liquidity migration: incentives move liquidity quickly between pools and chains. Worked example Pool A: $50M TVL, $5M daily volume (0.1 turnover). Pool B: $10M TVL, $8M volume (0.8 turnover). B pays LPs far more per dollar, but a $1M trade will move B's price much more than A's. Checklist [ ] Depth checked at my trade size [ ] Volume/TVL used for LP fee estimates Quiz 1. Why is depth more useful than TVL for traders? It measures price impact at a given size. 2. High volume/TVL means? More fees per dollar of liquidity. 3. What causes liquidity migration? Incentives moving between pools and chains.","video":null,"script":"video-scripts/lessons/lesson-07-7.json"},{"id":"7.8","title":"Derivatives on-chain","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Read funding, open interest and liquidation data as positioning context.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Perpetual futures (perps):\u003c/strong> no expiry; kept near spot by \u003cstrong>funding\u003c/strong> payments.\u003c/li>\n\u003cli>\u003cstrong>Positive funding:\u003c/strong> longs pay shorts (crowded longs). \u003cstrong>Negative:\u003c/strong> shorts pay longs.\u003c/li>\n\u003cli>\u003cstrong>Open interest (OI):\u003c/strong> total open contracts. Rising OI with rising price means leverage building.\u003c/li>\n\u003cli>\u003cstrong>Liquidation data:\u003c/strong> bursts of forced closes.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Price +8% in a week, OI +40%, funding at its highest in months: leverage is\ncrowding into longs. That&#39;s a fragile setup (a drop could cascade) and, for\nLesson 10.3, a funding-carry opportunity with a squeeze risk.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.8:c0\">\u003cspan>Funding and OI checked before leveraged or carry trades\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.8:c1\">\u003cspan>Liquidation clusters noted\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"7.8:q0\">\u003cdiv class=\"qtext\">What does positive funding mean?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Longs are paying shorts.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.8:q1\">\u003cdiv class=\"qtext\">Rising price + rising OI + high funding suggests?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Leveraged longs are crowding in; the setup is fragile.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.8:q2\">\u003cdiv class=\"qtext\">What keeps a perp near spot?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Funding payments.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Read funding, open interest and liquidation data as positioning context. Explanation Perpetual futures (perps): no expiry; kept near spot by funding payments. Positive funding: longs pay shorts (crowded longs). Negative: shorts pay longs. Open interest (OI): total open contracts. Rising OI with rising price means leverage building. Liquidation data: bursts of forced closes. Worked example Price +8% in a week, OI +40%, funding at its highest in months: leverage is crowding into longs. That's a fragile setup (a drop could cascade) and, for Lesson 10.3, a funding carry opportunity with a squeeze risk. Checklist [ ] Funding and OI checked before leveraged or carry trades [ ] Liquidation clusters noted Quiz 1. What does positive funding mean? Longs are paying shorts. 2. Rising price + rising OI + high funding suggests? Leveraged longs are crowding in; the setup is fragile. 3. What keeps a perp near spot? Funding payments.","video":null,"script":"video-scripts/lessons/lesson-07-8.json"},{"id":"7.9","title":"Querying chain data yourself","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Answer your own research questions with on-chain queries, instead of relying on someone else&#39;s dashboard.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Query platforms\u003c/strong> (e.g. Dune, Flipside, Allium) index blockchain data into SQL tables: raw transactions and logs, \u003cstrong>decoded\u003c/strong> tables per protocol, and curated &quot;spellbook&quot; tables (e.g. all DEX trades).\u003c/li>\n\u003cli>\u003cstrong>Indexers / subgraphs\u003c/strong> (e.g. The Graph) serve protocol-specific data via APIs.\u003c/li>\n\u003cli>\u003cstrong>Skills:\u003c/strong> SELECT, WHERE, GROUP BY, date truncation, and joining a token price table to convert amounts to USD.\u003c/li>\n\u003cli>\u003cstrong>Discipline:\u003c/strong> check your numbers against the protocol&#39;s own dashboard; know table definitions (what counts as &quot;volume&quot;); watch out for wash trading and double counting.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cpre>\u003ccode class=\"language-sql\">-- Daily DEX volume on one chain over the last 30 days\nSELECT date_trunc(&#39;day&#39;, block_time) AS day,\n       SUM(amount_usd)              AS volume_usd\nFROM dex.trades\nWHERE blockchain = &#39;arbitrum&#39;\n  AND block_time &gt; now() - interval &#39;30&#39; day\nGROUP BY 1\nORDER BY 1;\n\u003c/code>\u003c/pre>\n\u003cp>Then cross-check one day against another data source. If they differ a lot, find out\nwhy (different pools, wash-trade filters, price sources) before using either number.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.9:c0\">\u003cspan>I can run and adapt a basic query\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.9:c1\">\u003cspan>I cross-check results against a second source\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.9:c2\">\u003cspan>I note table definitions and filters in my research\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"7.9:q0\">\u003cdiv class=\"qtext\">What is a decoded table?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Contract events and calls translated into readable columns for a specific protocol.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.9:q1\">\u003cdiv class=\"qtext\">Why cross-check query results?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Definitions, filters and price sources differ; errors are common.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.9:q2\">\u003cdiv class=\"qtext\">What SQL clause groups results by day?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>GROUP BY on a date-truncated timestamp.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Answer your own research questions with on chain queries, instead of relying on someone else's dashboard. Explanation Query platforms (e.g. Dune, Flipside, Allium) index blockchain data into SQL tables: raw transactions and logs, decoded tables per protocol, and curated \"spellbook\" tables (e.g. all DEX trades). Indexers / subgraphs (e.g. The Graph) serve protocol specific data via APIs. Skills: SELECT, WHERE, GROUP BY, date truncation, and joining a token price table to convert amounts to USD. Discipline: check your numbers against the protocol's own dashboard; know table definitions (what counts as \"volume\"); watch out for wash trading and double counting. Worked example (SQL; table and column names vary by platform) sql Daily DEX volume on one chain over the last 30 days SELECT date trunc('day', block time) AS day, SUM(amount usd) AS volume usd FROM dex.trades WHERE blockchain = 'arbitrum' AND block time now() interval '30' day GROUP BY 1 ORDER BY 1; Then cross check one day against another data source. If they differ a lot, find out why (different pools, wash trade filters, price sources) before using either number. Checklist [ ] I can run and adapt a basic query [ ] I cross check results against a second source [ ] I note table definitions and filters in my research Quiz 1. What is a decoded table? Contract events and calls translated into readable columns for a specific protocol. 2. Why cross check query results? Definitions, filters and price sources differ; errors are common. 3. What SQL clause groups results by day? GROUP BY on a date truncated timestamp.","video":null,"script":"video-scripts/lessons/lesson-07-9.json"}]},{"n":8,"title":"The DeFi Operating System","outcome":"a written portfolio plan with risk buckets, limits and an emergency plan.","icon":"cog","banner":"../assets/modules/module-08.png","intro":{"src":"../video/module-08-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"8.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>Individual positions don&#39;t make a portfolio. This module turns strategies into a system: buckets and caps, a risk register, a strategy library, a routine, honest performance measurement, and rules for your own behaviour.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Bucket\u003c/td>\n\u003ctd>a portion of capital with a job and a cap\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Risk register\u003c/td>\n\u003ctd>a scored list of risks and responses\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kill rule\u003c/td>\n\u003ctd>a pre-written exit trigger\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Benchmark\u003c/td>\n\u003ctd>the simple alternative you must beat\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TWR\u003c/td>\n\u003ctd>return that ignores deposit timing\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.0:c0\">\u003cspan>Modules 0–7\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>Write your current holdings into four buckets (reserve, core, productive, speculative) with a percentage for each.\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Has buckets, caps and a journal\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Keeps a scored risk register, uses the strategy library, measures TWR vs a benchmark\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Runs a disciplined routine with written rules for behaviour, reviewed monthly\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…you have a written portfolio plan and a quarter of honest, benchmarked results.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version Individual positions don't make a portfolio. This module turns strategies into a system: buckets and caps, a risk register, a strategy library, a routine, honest performance measurement, and rules for your own behaviour. Words you'll need Term Meaning Bucket a portion of capital with a job and a cap Risk register a scored list of risks and responses Kill rule a pre written exit trigger Benchmark the simple alternative you must beat TWR return that ignores deposit timing Before you start [ ] Modules 0–7 Your first safe step Write your current holdings into four buckets (reserve, core, productive, speculative) with a percentage for each. The mastery ladder Level You can… Beginner Has buckets, caps and a journal Practitioner Keeps a scored risk register, uses the strategy library, measures TWR vs a benchmark Master Runs a disciplined routine with written rules for behaviour, reviewed monthly You've mastered this module when… …you have a written portfolio plan and a quarter of honest, benchmarked results.","video":null,"script":"video-scripts/lessons/lesson-08-0.json"},{"id":"8.1","title":"DeFi portfolio construction","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Split capital into risk buckets with caps, so no single failure can sink the portfolio.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Buckets:\u003c/strong> liquidity reserve · core (simple, durable) · productive (LP, vaults, carry) · speculative (new, points, experiments).\u003c/li>\n\u003cli>\u003cstrong>Concentration caps:\u003c/strong> per protocol, per chain, per stablecoin issuer, per bridge.\u003c/li>\n\u003cli>\u003cstrong>Genuine diversification:\u003c/strong> two front ends on the same protocol, or two stablecoins with the same backing, are one risk, not two.\u003c/li>\n\u003cli>\u003cstrong>Rebalancing rules:\u003c/strong> thresholds that trigger moving money between buckets.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Bucket\u003c/th>\n\u003cth>Share\u003c/th>\n\u003cth>Example holdings\u003c/th>\n\u003cth>Cap per protocol\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Reserve\u003c/td>\n\u003ctd>15%\u003c/td>\n\u003ctd>Stablecoins split across 2 issuers, instant access\u003c/td>\n\u003ctd>n/a\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Core\u003c/td>\n\u003ctd>45%\u003c/td>\n\u003ctd>Blue-chip stable lending (2 protocols), ETH staking\u003c/td>\n\u003ctd>20%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Productive\u003c/td>\n\u003ctd>30%\u003c/td>\n\u003ctd>Wide concentrated LP, a vault, a PT\u003c/td>\n\u003ctd>10%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Speculative\u003c/td>\n\u003ctd>≤10%\u003c/td>\n\u003ctd>Points, new protocols\u003c/td>\n\u003ctd>5%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Rebalance when any bucket drifts more than 5 points from target, or after any incident.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.1:c0\">\u003cspan>Buckets and targets written\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.1:c1\">\u003cspan>Caps per protocol, chain, issuer, bridge written\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.1:c2\">\u003cspan>Rebalancing rule written\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"8.1:q0\">\u003cdiv class=\"qtext\">Two stablecoins backed by the same collateral: diversified?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. They share one failure point.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.1:q1\">\u003cdiv class=\"qtext\">Why keep a reserve bucket?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>To defend debt, meet needs and redeploy without forced selling.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.1:q2\">\u003cdiv class=\"qtext\">When should you rebalance?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>When buckets drift past the threshold, or after an incident.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Split capital into risk buckets with caps, so no single failure can sink the portfolio. Explanation Buckets: liquidity reserve · core (simple, durable) · productive (LP, vaults, carry) · speculative (new, points, experiments). Concentration caps: per protocol, per chain, per stablecoin issuer, per bridge. Genuine diversification: two front ends on the same protocol, or two stablecoins with the same backing, are one risk, not two. Rebalancing rules: thresholds that trigger moving money between buckets. Worked example — a $100,000 DeFi book (illustrative) Bucket Share Example holdings Cap per protocol Reserve 15% Stablecoins split across 2 issuers, instant access n/a Core 45% Blue chip stable lending (2 protocols), ETH staking 20% Productive 30% Wide concentrated LP, a vault, a PT 10% Speculative ≤10% Points, new protocols 5% Rebalance when any bucket drifts more than 5 points from target, or after any incident. Checklist [ ] Buckets and targets written [ ] Caps per protocol, chain, issuer, bridge written [ ] Rebalancing rule written Quiz 1. Two stablecoins backed by the same collateral: diversified? No. They share one failure point. 2. Why keep a reserve bucket? To defend debt, meet needs and redeploy without forced selling. 3. When should you rebalance? When buckets drift past the threshold, or after an incident.","video":null,"script":"video-scripts/lessons/lesson-08-1.json"},{"id":"8.2","title":"The DeFi risk framework","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Keep a risk register that scores every position&#39;s risks and names the response.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>The eight risk surfaces: \u003cstrong>smart-contract · economic · oracle · liquidity ·\ngovernance · bridge/chain · counterparty · user-operation.\u003c/strong>\nScore each for \u003cstrong>likelihood (1–5) × impact (1–5)\u003c/strong>. Anything ≥ 15 needs a\nmitigation or an exit; anything ≥ 20 shouldn&#39;t be held.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Position\u003c/th>\n\u003cth>Risk\u003c/th>\n\u003cth>L\u003c/th>\n\u003cth>I\u003c/th>\n\u003cth>Score\u003c/th>\n\u003cth>Response\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>USDC lending, Protocol Y\u003c/td>\n\u003ctd>Oracle on one collateral is thin\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>Cap 10%, alert on governance changes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LST loop\u003c/td>\n\u003ctd>Rate spike above break-even\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>Alert at 4.5% borrow; unwind rule\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bridged stablecoin on new L2\u003c/td>\n\u003ctd>Bridge exploit\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>Canonical bridge; cap 5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>New farm\u003c/td>\n\u003ctd>Contract bug (unaudited upgrade)\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>\u003cstrong>20\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Don&#39;t hold\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.2:c0\">\u003cspan>Register covers every position and all eight surfaces\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.2:c1\">\u003cspan>Scores ≥ 15 have a mitigation or exit\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.2:c2\">\u003cspan>Reviewed monthly and after incidents\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"8.2:q0\">\u003cdiv class=\"qtext\">How is a risk scored?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Likelihood × impact, each 1–5.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.2:q1\">\u003cdiv class=\"qtext\">What&#39;s a user-operation risk?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Your own mistakes: wrong network, bad signature, lost keys.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.2:q2\">\u003cdiv class=\"qtext\">Score 20. Action?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Don&#39;t hold it.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Keep a risk register that scores every position's risks and names the response. Explanation The eight risk surfaces: smart contract · economic · oracle · liquidity · governance · bridge/chain · counterparty · user operation. Score each for likelihood (1–5) × impact (1–5) . Anything ≥ 15 needs a mitigation or an exit; anything ≥ 20 shouldn't be held. Worked example — one register row Position Risk L I Score Response USDC lending, Protocol Y Oracle on one collateral is thin 3 4 12 Cap 10%, alert on governance changes LST loop Rate spike above break even 3 3 9 Alert at 4.5% borrow; unwind rule Bridged stablecoin on new L2 Bridge exploit 2 5 10 Canonical bridge; cap 5% New farm Contract bug (unaudited upgrade) 4 5 20 Don't hold Checklist [ ] Register covers every position and all eight surfaces [ ] Scores ≥ 15 have a mitigation or exit [ ] Reviewed monthly and after incidents Quiz 1. How is a risk scored? Likelihood × impact, each 1–5. 2. What's a user operation risk? Your own mistakes: wrong network, bad signature, lost keys. 3. Score 20. Action? Don't hold it.","video":null,"script":"video-scripts/lessons/lesson-08-2.json"},{"id":"8.3","title":"The strategy library","starter":false,"html":"\u003cp>\u003cem>On-Chain Operator Program · Strategy module · Built on ATLAS &quot;DeFi &amp; On-Chain&quot; ch. 7–18, 38–42 and the 16-framework Strategy Library, expanded to 30 strategies.\u003c/em>\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>Read this first.\u003c/strong> This is educational material, not financial advice.\nNo DeFi strategy guarantees profit. Every return in DeFi is payment for\ntaking a risk. This module shows \u003cstrong>where each strategy&#39;s return comes from,\nthe maths to test it before you enter, how to run it, and exactly how it\nloses money\u003c/strong>, so you only keep positions whose expected return still makes\nsense after costs and risk. All numbers below are illustrative. Use live\nrates from protocol dashboards and independent data (e.g. DefiLlama) when\nyou model a real position.\u003c/p>\n\u003c/blockquote>\n\u003cp>Calculator for every formula here:\n\u003ccode>python3 .claude/skills/defi-strategies/scripts/defi_calc.py &lt;command&gt; --help\u003c/code>\u003c/p>\n\u003chr>\n\u003ch3>Part 1 — Where profit actually comes from\u003c/h3>\n\u003cp>There are only five sources of return in DeFi. Every strategy is a mix of them.\u003c/p>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"Where DeFi returns come from\" src=\"../assets/diagrams/profit-sources.png\">\u003cfigcaption>Where DeFi returns come from\u003c/figcaption>\u003c/figure>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Source\u003c/th>\n\u003cth>You are paid for…\u003c/th>\n\u003cth>Example\u003c/th>\n\u003cth>Lasts?\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>\u003cstrong>Service fees\u003c/strong>\u003c/td>\n\u003ctd>providing liquidity traders need\u003c/td>\n\u003ctd>swap fees to LPs\u003c/td>\n\u003ctd>As long as volume lasts\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>\u003cstrong>Interest\u003c/strong>\u003c/td>\n\u003ctd>lending capital borrowers need\u003c/td>\n\u003ctd>stablecoin supply APY\u003c/td>\n\u003ctd>As long as borrow demand lasts\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>\u003cstrong>Security rewards\u003c/strong>\u003c/td>\n\u003ctd>staking to secure a network\u003c/td>\n\u003ctd>ETH staking yield\u003c/td>\n\u003ctd>Structural, but changes over time\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>\u003cstrong>Structural carry\u003c/strong>\u003c/td>\n\u003ctd>taking the other side of crowded positioning\u003c/td>\n\u003ctd>perp funding, basis\u003c/td>\n\u003ctd>Comes and goes with the market\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>\u003cstrong>Incentives\u003c/strong>\u003c/td>\n\u003ctd>bringing capital to a protocol\u003c/td>\n\u003ctd>token emissions, points, airdrops\u003c/td>\n\u003ctd>Temporary, and often dilutive\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Price moves (beta) are not a strategy. If a position only made money because\nETH went up, it was a directional bet with extra steps. Strategies 1–4 can pay\nin flat markets. Source 5 is only real once the tokens are sold.\u003c/p>\n\u003ch3>The one equation that matters\u003c/h3>\n\u003cpre>\u003ccode>Net return = base yield (fees + interest + staking)\n           + incentives (valued at the price you can actually sell at)\n           − impermanent loss / inventory loss\n           − borrow cost\n           − gas + swap + bridge costs\n           − protocol / vault fees\n           − losses from risk events\n           ± price change on assets held\n\u003c/code>\u003c/pre>\n\u003cp>A position is only worth running if \u003cstrong>net return beats the simplest\nalternative\u003c/strong> (holding the assets, or plain stablecoin lending) \u003cstrong>by enough to\npay for the extra risk\u003c/strong>. Masters compare against a benchmark. Beginners\ncompare against zero.\u003c/p>\n\u003ch3>APR vs APY\u003c/h3>\n\u003cp>APY assumes compounding. \u003ccode>APY = (1 + APR/n)^n − 1\u003c/code>. 10% APR compounded daily ≈\n10.52% APY, \u003cstrong>but only if compounding is free\u003c/strong>. On-chain, each compound costs\ngas. Compound only when \u003ccode>pending rewards ≥ ~10–20× the gas cost\u003c/code>, or use a vault\nthat batches it (and charges a fee for doing so).\u003c/p>\n\u003chr>\n\u003ch3>Part 2 — Strategy selector by market regime\u003c/h3>\n\u003cp>This uses the same thinking as the Grid Bot module: \u003cstrong>pick the market regime\nfirst, then the strategy.\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Regime\u003c/th>\n\u003cth>Strategies that tend to work\u003c/th>\n\u003cth>Avoid / reduce\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Sideways, low–moderate volatility\u003c/strong>\u003c/td>\n\u003ctd>Concentrated LP around the range · stable-stable LP · lending · grid bots (CEX)\u003c/td>\n\u003ctd>Leverage loops with thin buffers\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Uptrend\u003c/strong>\u003c/td>\n\u003ctd>Hold + liquid staking · delta-neutral funding carry (longs usually pay) · conservative borrow against collateral\u003c/td>\n\u003ctd>Narrow LP ranges (they sell your winners early)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Downtrend\u003c/strong>\u003c/td>\n\u003ctd>Stablecoin lending · stable-stable LP · cash management\u003c/td>\n\u003ctd>Leveraged loops · volatile/volatile LP · incentive farms paid in falling tokens\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>High volatility / event risk\u003c/strong>\u003c/td>\n\u003ctd>Wider LP ranges or none · larger health-factor buffers · smaller size\u003c/td>\n\u003ctd>New positions right before major news (FOMC, CPI), new or unaudited protocols\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch3>Part 3 — The strategy playbook\u003c/h3>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"The strategy library: 30 strategies in 7 levels\" src=\"../assets/diagrams/strategy-levels.png\">\u003cfigcaption>The strategy library: 30 strategies in 7 levels\u003c/figcaption>\u003c/figure>\n\u003cp>Each strategy card has the same sections:\n\u003cstrong>Profit engine · Key maths · Execute · Monitor · Exit/kill rules · How it loses · Size cap\u003c/strong>.\nSize caps are suggested maximums as a share of the DeFi portfolio. Tighten\nthem to fit your own risk budget.\u003c/p>\n\u003ch3>LEVEL 1 — CORE (start here)\u003c/h3>\n\u003ch4>1. Stablecoin lending\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> interest paid by borrowers (source 2).\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> \u003ccode>supply APY ≈ borrow APY × utilisation × (1 − reserve factor)\u003c/code>.\nExample: 8% borrow × 80% utilisation × 0.9 = \u003cstrong>5.76%\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Execute:\u003c/strong> pick a stablecoin with a clear peg mechanism (Module 1.5) → pick a\nlending market that passed due diligence (\u003ccode>defi-due-diligence\u003c/code>) → check\ncurrent utilisation and withdrawal liquidity → supply → record the receipt token.\u003c/li>\n\u003cli>\u003cstrong>Monitor:\u003c/strong> utilisation (above ~90% = withdrawals may be stuck), stablecoin\npeg, governance changes, incidents.\u003c/li>\n\u003cli>\u003cstrong>Exit/kill:\u003c/strong> peg below ~0.99 for a sustained period, utilisation pinned at\n100%, exploit news, or the rate falls below your benchmark.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> stablecoin depeg, protocol exploit, bad debt, frozen withdrawals.\u003c/li>\n\u003cli>\u003cstrong>Size cap:\u003c/strong> can be the largest bucket, but \u003cstrong>split across ≥2 independent\nprotocols and ≥2 stablecoin issuers\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003ch4>2. Native / liquid staking (LSTs)\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> network security rewards (source 3), minus the provider&#39;s fee.\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> \u003ccode>net yield = staking APR × (1 − provider fee)\u003c/code>. Your real\nreturn is still dominated by the asset&#39;s price, so this only improves on\nholding if you&#39;d hold the asset anyway.\u003c/li>\n\u003cli>\u003cstrong>Execute:\u003c/strong> choose the provider (validator spread, fee, track record,\nredemption path) → stake → confirm how the LST earns (rebasing, or an\nexchange rate that rises).\u003c/li>\n\u003cli>\u003cstrong>Monitor:\u003c/strong> LST/underlying ratio on markets (discount), validator\nincidents/slashing, withdrawal queue length.\u003c/li>\n\u003cli>\u003cstrong>Exit/kill:\u003c/strong> discount widens beyond your threshold, a slashing event,\nor the provider&#39;s governance or custody changes.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> asset price falls (main risk), LST depeg, slashing,\nsmart-contract risk.\u003c/li>\n\u003cli>\u003cstrong>Size cap:\u003c/strong> &quot;hold-anyway&quot; capital only.\u003c/li>\n\u003c/ul>\n\u003ch4>3. Borrowing against collateral (liquidity without selling)\u003c/h4>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"The liquidation cascade\" src=\"../assets/diagrams/liquidation-cascade.png\">\u003cfigcaption>The liquidation cascade\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> none by itself. It&#39;s a tool. The gain comes from what\nthe borrowed funds do, or from not triggering a sale.\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong>\u003cul>\n\u003cli>\u003ccode>Health factor (HF) = Σ(collateral value × liquidation threshold) ÷ debt\u003c/code>\u003c/li>\n\u003cli>\u003ccode>Liquidation price = debt ÷ (collateral qty × liquidation threshold)\u003c/code>\u003c/li>\n\u003cli>Example: 10 ETH at $3,000, LT 0.80, borrow $12,000 → HF = 2.0 → liquidation at \u003cstrong>$1,500\u003c/strong> (−50%).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Execute:\u003c/strong> borrow only enough that liquidation is beyond a move you&#39;d\nrealistically expect to survive (\u003cstrong>HF ≥ 2 for volatile collateral\u003c/strong> is a\nsane starting rule) → write the defence plan before borrowing.\u003c/li>\n\u003cli>\u003cstrong>Monitor:\u003c/strong> HF daily, borrow rate, oracle price.\u003c/li>\n\u003cli>\u003cstrong>Exit/kill:\u003c/strong> HF &lt; 1.5 → repay or add collateral. Don&#39;t wait for 1.1.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> liquidation penalty (commonly 5–10%+ of the collateral\nseized), borrow rate spikes, oracle issues.\u003c/li>\n\u003cli>\u003cstrong>Size cap:\u003c/strong> debt ≤ what you could repay from outside the position.\u003c/li>\n\u003c/ul>\n\u003ch3>LEVEL 2 — LIQUIDITY\u003c/h3>\n\u003ch4>4. 50/50 AMM liquidity (full range)\u003c/h4>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"Impermanent loss vs holding\" src=\"../assets/charts/impermanent-loss.png\">\u003cfigcaption>Impermanent loss vs holding\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>Profit engine:\u003c/strong> swap fees (source 1), sometimes plus incentives.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Key maths — impermanent loss (IL) vs just holding\u003c/strong>, where \u003ccode>r\u003c/code> = price ratio change:\n\u003ccode>IL = 2√r ÷ (1 + r) − 1\u003c/code>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Price change\u003c/th>\n\u003cth>1.25×\u003c/th>\n\u003cth>1.5×\u003c/th>\n\u003cth>2×\u003c/th>\n\u003cth>3×\u003c/th>\n\u003cth>4×\u003c/th>\n\u003cth>5×\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>IL vs holding\u003c/td>\n\u003ctd>−0.6%\u003c/td>\n\u003ctd>−2.0%\u003c/td>\n\u003ctd>−5.7%\u003c/td>\n\u003ctd>−13.4%\u003c/td>\n\u003ctd>−20.0%\u003c/td>\n\u003ctd>−25.5%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>(Same IL whether price goes up or down by the same ratio. 0.5× = 2×.)\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Break-even rule:\u003c/strong> \u003ccode>fees earned over the holding period ≥ IL\u003c/code>.\nExample: expect up to a 1.5× move within 90 days → IL ≈ 2.0% → you need fee\nAPR ≥ \u003cstrong>~8.2%\u003c/strong> just to match holding.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Execute:\u003c/strong> pick a pair you&#39;re happy to own either side of → check real\nfee APR over 30 days (not the peak day) → deposit → record entry prices.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Monitor:\u003c/strong> fees accrued vs IL vs &quot;just hold&quot; benchmark, weekly.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Exit/kill:\u003c/strong> fees stop covering IL, volume dies, or the pair enters a strong trend.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>How it loses:\u003c/strong> strong trends (you end up holding more of the losing asset), low volume, token risk.\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch4>5. Concentrated liquidity (the on-chain grid bot)\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> swap fees on a chosen range. It&#39;s economically very close\nto a grid bot: it sells as price rises through the range and buys as it\nfalls (Module 9).\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> capital efficiency vs full range (price at the geometric\nmiddle of the range) ≈ \u003ccode>1 ÷ (1 − (P_low / P_high)^¼)\u003c/code>.\nA ±10% range (P_high/P_low ≈ 1.22) is ~\u003cstrong>20×\u003c/strong> as capital-efficient, so it\nearns ~20× the fees per dollar \u003cem>while in range\u003c/em>. IL is also amplified by\nabout the same factor, and \u003cstrong>out of range earns 0% and leaves you holding\n100% of one asset.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Execute:\u003c/strong> set the range from structure and volatility, exactly like a\ngrid range (\u003ccode>grid-bot-design\u003c/code>: regime → range → invalidation) → wider in\nhigh volatility → decide the rebalance rule \u003cem>before\u003c/em> entry.\u003c/li>\n\u003cli>\u003cstrong>Monitor:\u003c/strong> % of time in range, fees vs IL, gas cost of each rebalance.\u003c/li>\n\u003cli>\u003cstrong>Exit/kill:\u003c/strong> range invalidated (price breaks structure) → don&#39;t chase\nevery move. Rebalancing too often locks in losses and burns gas.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> trending markets, over-rebalancing, gas on small positions.\u003c/li>\n\u003cli>\u003cstrong>Size cap:\u003c/strong> active capital only. Needs weekly (or better) attention.\u003c/li>\n\u003c/ul>\n\u003ch4>6. Stable-stable LP\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> swap fees between similarly priced assets. Very low IL \u003cem>while the pegs hold\u003c/em>.\u003c/li>\n\u003cli>\u003cstrong>Execute:\u003c/strong> only pair stables you&#39;d accept holding 100% of (in a depeg the\npool fills up with the weaker coin).\u003c/li>\n\u003cli>\u003cstrong>Kill:\u003c/strong> either stable trades below ~0.99, or the pool balance goes heavily one-sided.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> depeg (you end up holding the broken coin), contract risk.\u003c/li>\n\u003c/ul>\n\u003ch3>LEVEL 3 — YIELD\u003c/h3>\n\u003ch4>7. Auto-compounding vaults\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> the underlying strategy, plus compounding without you paying the gas.\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> \u003ccode>net APY = gross APY − performance fee share − management fee\u003c/code>.\nCompare against doing it yourself: vaults win on small positions (gas) and\nlose on large ones (fees).\u003c/li>\n\u003cli>\u003cstrong>Due diligence:\u003c/strong> vault contract + \u003cstrong>every\u003c/strong> protocol it deposits into\n(the risks stack). Read withdrawal limits and fees.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> any protocol in the chain fails, strategy change by the vault operator, withdrawal limits.\u003c/li>\n\u003c/ul>\n\u003ch4>8. Incentive farming\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> token emissions (source 5) on top of a base yield.\u003c/li>\n\u003cli>\u003cstrong>The rule:\u003c/strong> value rewards at the price you can \u003cstrong>actually sell at after\nslippage\u003c/strong>, and assume the token price falls while emissions continue.\nHarvest and sell on a schedule (e.g. weekly) unless you&#39;d buy the token with cash.\u003c/li>\n\u003cli>\u003cstrong>Quick test:\u003c/strong> remove the incentive APR. If the base yield alone doesn&#39;t\njustify the risk, you&#39;re being paid in a token that&#39;s likely to keep falling.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> reward token price collapse, mercenary liquidity leaving,\nIL on the underlying LP.\u003c/li>\n\u003c/ul>\n\u003ch4>9. Airdrops and points\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> possible future token distribution.\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> \u003ccode>EV = P(airdrop) × expected value to you − (gas + bridge + opportunity cost + risk)\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Rule:\u003c/strong> only farm with actions you&#39;d do anyway, or with capital you&#39;ve\ncapped as speculative. Claim only from verified links (scam defence, Module 1.6).\u003c/li>\n\u003c/ul>\n\u003ch3>LEVEL 4 — ADVANCED (only after Levels 1–3 are routine)\u003c/h3>\n\u003ch4>10. Leveraged lending loop\u003c/h4>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"Leveraged loop: net APY vs borrow rate\" src=\"../assets/charts/loop-spread.png\">\u003cfigcaption>Leveraged loop: net APY vs borrow rate\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> amplifies a \u003cem>positive spread\u003c/em> between collateral yield and borrow cost.\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong>\u003cul>\n\u003cli>Leverage after n loops at LTV L: \u003ccode>(1 − L^(n+1)) ÷ (1 − L)\u003c/code>, max \u003ccode>1 ÷ (1 − L)\u003c/code> (L = 0.7 → 3.33×)\u003c/li>\n\u003cli>\u003ccode>Net APY on equity = collateral yield × Lev − borrow rate × (Lev − 1)\u003c/code>\u003c/li>\n\u003cli>Example: 3.5% collateral yield, 2.5% borrow, 3× → \u003cstrong>5.5%\u003c/strong>. If borrow rises\nto 4.5% → \u003cstrong>1.5%\u003c/strong>. If it rises to 5.25% → \u003cstrong>0%\u003c/strong>. The spread is everything.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Execute:\u003c/strong> only loop assets that move closely together (e.g. an LST\nagainst its underlying, or stable against stable) → stay well below max\nleverage → set HF alerts.\u003c/li>\n\u003cli>\u003cstrong>Kill:\u003c/strong> spread turns negative, HF &lt; your floor, depeg of the collateral.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> borrow rate spikes (they can happen quickly), liquidation\ncascades, depeg of correlated collateral, unwind costs.\u003c/li>\n\u003c/ul>\n\u003ch4>11. LST collateral loop\u003c/h4>\n\u003cp>Strategy 10 using an LST as collateral against its own underlying asset.\nLiquidation risk depends mainly on the \u003cstrong>LST/underlying ratio and on how the\nprotocol&#39;s oracle prices it\u003c/strong>, less on the asset&#39;s price. Check which oracle\nthe market uses before assuming &quot;it can&#39;t be liquidated&quot;.\u003c/p>\n\u003ch4>12. Delta-neutral funding carry\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> perpetual funding (source 4). In bullish markets longs\nusually pay shorts. Hold spot long + perp short at equal size, so price\nmoves roughly cancel and you collect funding.\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> \u003ccode>funding APR ≈ rate per 8h × 3 × 365\u003c/code>. 0.01%/8h ≈ \u003cstrong>10.95% APR on the hedged size\u003c/strong>.\nReturn on \u003cem>total capital\u003c/em> is lower because capital sits in both legs:\n$10k spot + $10k margin (1× short) → ~5.5% on $20k; 2× short ($5k margin)\n→ ~7.3% on $15k, but the short gets liquidated if price rises ~50%.\u003c/li>\n\u003cli>\u003cstrong>Execute:\u003c/strong> open both legs at the same time, at the same size → keep a\nmargin buffer → track funding every period.\u003c/li>\n\u003cli>\u003cstrong>Kill:\u003c/strong> funding negative for a sustained period (you now pay), margin\nbuffer thin, venue risk.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> funding flips negative, short-leg liquidation in a squeeze,\nexecution slippage/basis, exchange/venue failure (CEX or perp DEX).\u003c/li>\n\u003c/ul>\n\u003ch4>13. LP hedge\u003c/h4>\n\u003cp>Concentrated or 50/50 LP plus a partial perp short to offset its directional\nexposure. The hedge ratio changes as price moves (LP inventory changes), so it\nneeds rebalancing. It narrows the P&amp;L range but adds funding + execution cost.\nOnly worth doing if fees exceed IL + hedge cost.\u003c/p>\n\u003ch3>LEVEL 5 — TREASURY &amp; RESEARCH\u003c/h3>\n\u003ch4>14. DeFi cash management\u003c/h4>\n\u003cp>Build a ladder for idle stablecoins: instant-access tier (lending), core tier\n(split across protocols and issuers), and a cap per protocol. Goal: earn a\nreasonable return on cash \u003cstrong>without any single failure costing more than\nyou&#39;ve decided you can afford to lose\u003c/strong>.\u003c/p>\n\u003ch4>15–16. On-chain accumulation screen / protocol growth screen\u003c/h4>\n\u003cp>Research, not yield. Track users, fees/revenue, TVL quality, holder\nconcentration, exchange flows and unlocks to decide \u003cem>what\u003c/em> to hold or provide\nliquidity for. Never act on one metric (ATLAS ch. 27–34).\u003c/p>\n\u003chr>\n\u003ch3>LEVEL 6 — PROFESSIONAL (structured, fixed and hedged yield)\u003c/h3>\n\u003cp>These are the strategies professional desks and treasuries use. Each one\nswaps a risk you don&#39;t want for one you&#39;ve chosen, so \u003cstrong>name what you&#39;re\nshort before you enter.\u003c/strong> Full lessons: Module 10 (Advanced Yield\nEngineering), Module 11 (Hedging) and Module 12 (Own Bank).\u003c/p>\n\u003ch4>17. Fixed-rate yield with principal tokens (PT)\u003c/h4>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"PT price converges to 1.00 at maturity\" src=\"../assets/charts/pt-convergence.png\">\u003cfigcaption>PT price converges to 1.00 at maturity\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> yield tokenization splits a yield-bearing asset into a\n\u003cstrong>principal token (PT)\u003c/strong>, which redeems 1:1 for the underlying at maturity,\nand a \u003cstrong>yield token (YT)\u003c/strong>, which collects all the variable yield until then.\nBuying PT at a discount locks in a fixed return (source 2/3, bought forward).\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> \u003ccode>fixed APY = (1 ÷ PT price)^(365 ÷ days) − 1\u003c/code>.\nPT at 0.96 with 180 days left → \u003cstrong>8.63%\u003c/strong> fixed if held to maturity.\n\u003ccode>defi_calc.py pt --price 0.96 --days 180\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>Execute:\u003c/strong> pick a PT on an underlying you&#39;d hold anyway → check pool depth\n(for early exit) → buy → hold to maturity → redeem.\u003c/li>\n\u003cli>\u003cstrong>Kill:\u003c/strong> underlying depeg or exploit. You&#39;re still exposed to the underlying asset; the rate is fixed, the asset risk isn&#39;t.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> underlying fails; selling before maturity at a worse price; illiquid PT pools.\u003c/li>\n\u003c/ul>\n\u003ch4>18. Yield tokens (YT): buying variable yield\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> YT collects all yield (and often points) on the underlying until maturity, then goes to zero.\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> a YT costs ~\u003ccode>1 − PT price\u003c/code> (0.04 above). It profits only if\n\u003cstrong>realised variable yield plus points beats the implied rate (~8.6%)\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Use:\u003c/strong> a speculative, time-decaying position. Size it as speculation.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> yields fall, points turn out worthless; the YT is worth zero at maturity by design.\u003c/li>\n\u003c/ul>\n\u003ch4>19. Cash-and-carry basis\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> dated futures often trade above spot in bull markets.\nBuy spot, short the future at the same size, and the premium (basis) converges to zero at expiry (source 4).\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> \u003ccode>annualised basis = (future ÷ spot − 1) × 365 ÷ days\u003c/code>.\nSpot 3,000, 90-day future 3,060 → 2% → \u003cstrong>8.11%\u003c/strong> annualised.\n\u003ccode>defi_calc.py basis --spot 3000 --future 3060 --days 90\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>Execute:\u003c/strong> open both legs together → keep enough margin that the short survives a large rally → hold to expiry.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> short-leg margin call in a squeeze, venue/counterparty failure, closing early at a wider basis.\u003c/li>\n\u003c/ul>\n\u003ch4>20. Covered calls and options vaults\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> sell upside you&#39;re willing to give away. The option premium is paid to you (source 4: selling volatility).\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> ETH at 3,000, sell a 7-day 3,300 call for 0.4% →\n\u003cstrong>20.9%\u003c/strong> annualised \u003cem>if\u003c/em> repeated at that premium (it won&#39;t be exactly).\nMax gain per week = 0.4% + 10% = 10.4%. Break-even price 2,988.\n\u003ccode>defi_calc.py covered-call --spot 3000 --strike 3300 --premium 0.4\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>Execute:\u003c/strong> only on assets you&#39;d hold anyway → strikes above levels you&#39;d happily sell at → roll weekly or monthly.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> the asset falls (the premium is a small cushion); you miss big rallies; options-vault contract risk.\u003c/li>\n\u003c/ul>\n\u003ch4>21. Cash-secured puts: getting paid to wait for a lower entry\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> sell a put at a price you&#39;d buy at anyway, holding the cash to pay for it.\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> sell a 2,700 put for $12 with $2,700 of stablecoins reserved\n→ \u003cstrong>0.44%\u003c/strong> for the week on the cash. If assigned, your effective entry is \u003cstrong>$2,688\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> price falls far below the strike (you buy at 2,688 while the market is lower); you miss the move if price rips upward.\u003c/li>\n\u003c/ul>\n\u003ch4>22. Fixed-rate borrowing\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> none by itself. It&#39;s insurance on your cost of credit (Module 12.3).\u003c/li>\n\u003cli>\u003cstrong>Worked comparison:\u003c/strong> borrow $50,000 for a year. Fixed at 6% costs \u003cstrong>$3,000\u003c/strong>.\nVariable at 4% for 9 months, then spiking to 12% for 3 months, costs\n50,000 × (4% × 0.75 + 12% × 0.25) = \u003cstrong>$3,000\u003c/strong>. Same cost, but fixed let you plan.\nIf the spike lasted longer, variable costs more; if rates stayed at 4%, fixed cost $1,000 more.\u003c/li>\n\u003cli>\u003cstrong>Use:\u003c/strong> when the borrowing funds something with a fixed payoff, or when a rate spike would force a bad sale.\u003c/li>\n\u003c/ul>\n\u003ch4>23. Being the lender: curated lending vaults\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> supply stablecoins to a vault whose curator spreads them\nacross isolated lending markets (source 2). You&#39;re the bank&#39;s depositor\n\u003cem>and\u003c/em> its credit committee.\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> judge risk-adjusted, not headline: 7% headline with an\nassumed 2%/yr chance of a loss event losing half → \u003cstrong>6.0%\u003c/strong> risk-adjusted.\n\u003ccode>defi_calc.py expected --yield-apy 7 --loss-prob 0.02 --lgd 0.5\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>Due diligence:\u003c/strong> which markets, which collateral, which oracles, what\nliquidation LTVs, the curator&#39;s record, and how fast you can withdraw.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> bad debt in any one market, oracle failure, curator error, withdrawal queues in stress.\u003c/li>\n\u003c/ul>\n\u003ch4>24. Hedged restaking / points farming\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> hold a liquid restaking token (staking yield + points)\nand short the underlying perp to remove price exposure. When funding is\npositive, the short \u003cem>receives\u003c/em> funding too.\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> \u003ccode>net ≈ staking yield + funding received + points value − costs\u003c/code>.\n\u003cstrong>Value the points at zero for planning.\u003c/strong> Anything they pay is upside.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> the restaking token depegs from the asset you hedged with\n(the hedge doesn&#39;t cover that), slashing, funding turns negative, short-leg liquidation.\u003c/li>\n\u003c/ul>\n\u003ch4>25. The yield-covered credit line\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> borrow against yield-bearing collateral where the collateral&#39;s yield pays the interest.\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> $200,000 of an LST at 3.2% earns \u003cstrong>$6,400/yr\u003c/strong>. A $40,000\nstablecoin loan at 5% costs \u003cstrong>$2,000/yr\u003c/strong>, so yield covers interest 3.2×.\nLTV 20%, health factor 4.0 at an 0.8 liquidation threshold.\n\u003ccode>defi_calc.py bank --collateral 200000 --debt 40000 --borrow-apy 5\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>Use:\u003c/strong> access to liquidity without selling, as a bank client would (Module 12.3).\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> the collateral price falls (the LTV rises even if the\ninterest is covered), the borrow rate spikes above the yield, the LST depegs.\u003c/li>\n\u003c/ul>\n\u003ch3>LEVEL 7 — EXPERT (market structure)\u003c/h3>\n\u003cp>Strategies that come from understanding how DeFi&#39;s machinery works: minting,\ngovernance markets, being the counterparty, arbitrage and rates. Full lessons in\nModules 3, 6 and 10 (3.7, 6.6, 10.7, 10.8, 10.9).\u003c/p>\n\u003ch4>26. Minting against collateral (CDP stablecoins)\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> none by itself. It&#39;s how you create liquidity from your assets (Module 12&#39;s credit line), paying a stability fee.\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> 10 ETH at $3,000, 150% minimum ratio: max mint $20,000. Mint $10,000 → ratio 300%, liquidation at $1,500, fee $600/yr at 6%. \u003ccode>defi_calc.py cdp --qty 10 --price 3000 --mint 10000 --fee 6\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> collateral falls through the ratio (liquidation penalty), stability fee rises, the minted stablecoin depegs.\u003c/li>\n\u003c/ul>\n\u003ch4>27. Vote-escrow and bribe income\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> voting incentives (bribes) and fee shares paid to locked governance tokens (source 5, sometimes 1).\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> $10,000 locked earning 15% in bribes = $1,500/yr, \u003cem>valued at the price you can sell the bribe tokens\u003c/em>; subtract the locked token&#39;s price risk over the whole lock.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> the locked token falls while you can&#39;t sell; bribe markets dry up; liquid-locker discounts.\u003c/li>\n\u003c/ul>\n\u003ch4>28. Being the house: perp liquidity vaults\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> trading fees, funding and traders&#39; losses on a perp exchange.\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> split history into fees vs trader P&L; the trader-P&amp;L part can swing from +7% to −20% in a trend.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> profitable traders, one-sided open interest, oracle problems, withdrawal cooldowns.\u003c/li>\n\u003c/ul>\n\u003ch4>29. Peg and redemption arbitrage (patient version)\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> buying an asset below its redemption value and redeeming (source 4: providing liquidity to forced sellers).\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> 2% LST discount with a 20-day redemption queue ≈ 36.5% annualised simple, \u003cem>once\u003c/em>, if redemption works.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> the discount was pricing a real problem; the queue lengthens; redemption is restricted.\u003c/li>\n\u003c/ul>\n\u003ch4>30. Rates positioning: fixed vs floating\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>Profit engine:\u003c/strong> choosing when to lock fixed rates (PTs, fixed borrowing) or stay floating, based on the yield curve (source 2/3).\u003c/li>\n\u003cli>\u003cstrong>Key maths:\u003c/strong> 3-month 7% vs 12-month 9%: lock 12 months at 9% if you need the money in a year and expect rates to fall.\u003c/li>\n\u003cli>\u003cstrong>How it loses:\u003c/strong> rates move the other way (opportunity cost); PT liquidity if you exit early; the underlying&#39;s risk remains.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>Part 4 — Execution system (what turns strategies into results)\u003c/h3>\n\u003ch3>Position sizing rules (starting point, tighten as needed)\u003c/h3>\n\u003cul>\n\u003cli>Max \u003cstrong>20–25%\u003c/strong> of DeFi capital in any one protocol. Max \u003cstrong>10%\u003c/strong> in anything\nunaudited, new (&lt; 6 months) or reliant on a single bridge.\u003c/li>\n\u003cli>Max \u003cstrong>~30–40%\u003c/strong> on any one non-Ethereum chain / L2.\u003c/li>\n\u003cli>Keep \u003cstrong>10–20%\u003c/strong> instantly liquid (not in any position) to defend debt and\ntake opportunities.\u003c/li>\n\u003cli>Leverage: total debt small enough that a −50% market day doesn&#39;t liquidate anything.\u003c/li>\n\u003c/ul>\n\u003ch3>Before every entry (5 gates)\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Due diligence\u003c/strong> file complete (\u003ccode>defi-due-diligence\u003c/code>: 6-step loop).\u003c/li>\n\u003cli>\u003cstrong>Profit engine named.\u003c/strong> Which of the 5 sources pays you?\u003c/li>\n\u003cli>\u003cstrong>Maths done.\u003c/strong> Net return after costs beats the benchmark (use \u003ccode>defi_calc.py\u003c/code>).\u003c/li>\n\u003cli>\u003cstrong>Kill rules written down.\u003c/strong> Exact numbers: HF floor, peg level, spread, range break.\u003c/li>\n\u003cli>\u003cstrong>Before-signing checklist\u003c/strong> (chain, contract, token, amount, spender, slippage, gas).\u003c/li>\n\u003c/ol>\n\u003ch3>Journal (one row per position)\u003c/h3>\n\u003cp>Protocol · chain · strategy # · entry date · amount · entry prices · profit\nengine · expected net APY · benchmark · kill rules · approvals granted ·\nweekly: fees/interest earned, IL, costs, net vs benchmark.\u003c/p>\n\u003ch3>Review rhythm\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Daily:\u003c/strong> health factors, pegs, LP ranges, incident feeds.\u003c/li>\n\u003cli>\u003cstrong>Weekly:\u003c/strong> net P&amp;L vs benchmark per position, harvest and sell incentive\ntokens, revoke unused approvals.\u003c/li>\n\u003cli>\u003cstrong>Monthly:\u003c/strong> cut the bottom performer when judged against its risk, rebalance buckets,\nsimplify anything you can&#39;t explain in one sentence.\u003c/li>\n\u003c/ul>\n\u003ch3>Take profits and keep them\u003c/h3>\n\u003cul>\n\u003cli>Sweep realised yield to stablecoins or cold storage on a schedule. Rewards\nsitting in a farm are still exposed to the farm&#39;s risks.\u003c/li>\n\u003cli>Compound only what still passes the 5 gates. Compounding into a\ndeteriorating position is how gains are given back.\u003c/li>\n\u003cli>Track \u003cstrong>net realised gains\u003c/strong> after all costs. That&#39;s the only number that counts.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>Part 5 — Progression path\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Stage\u003c/th>\n\u003cth>Strategies\u003c/th>\n\u003cth>Graduate when…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1. Foundation\u003c/td>\n\u003ctd>#1 stable lending, #2 staking\u003c/td>\n\u003ctd>You can do the full before-signing checklist without notes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2. Liquidity\u003c/td>\n\u003ctd>#4 50/50 LP, #6 stable LP\u003c/td>\n\u003ctd>You&#39;ve tracked LP vs hold for 30+ days\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3. Active\u003c/td>\n\u003ctd>#5 concentrated LP, #7 vaults, #8 farming\u003c/td>\n\u003ctd>You can say how much of a position&#39;s return is fees, IL and incentives\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4. Leverage\u003c/td>\n\u003ctd>#3 borrowing, #10–11 loops\u003c/td>\n\u003ctd>You&#39;ve written and rehearsed a defence plan\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5. Carry &amp; hedging\u003c/td>\n\u003ctd>#12 funding carry, #13 LP hedge\u003c/td>\n\u003ctd>You understand perp margin, funding and venue risk\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6. Operator\u003c/td>\n\u003ctd>#14 treasury + #15–16 research\u003c/td>\n\u003ctd>Your portfolio has caps, a journal, and a review you actually run\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7. Professional\u003c/td>\n\u003ctd>#17–21 fixed, basis and options yield · #22–25 credit and hedged yield\u003c/td>\n\u003ctd>You can state what every position is short, and your stress test survives a −50% day\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8. Expert\u003c/td>\n\u003ctd>#26 CDP minting · #27 ve/bribe income · #28 perp vaults · #29 peg arbitrage · #30 rates positioning\u003c/td>\n\u003ctd>You understand the machinery (AMM design, MEV, lending internals, rates) well enough to explain why each opportunity exists\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch3>Part 6 — Mastery quiz\u003c/h3>\n\u003cdiv class=\"qq\" data-k=\"8.3:q0\">\u003cdiv class=\"qtext\">A farm shows 60% APY: 5% fees, 55% token emissions. What&#39;s your first question?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>What does the base 5% pay me for the risk, and at what price can I actually sell the reward token? Judge the farm on base yield plus rewards valued at a realistic, falling price.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.3:q1\">\u003cdiv class=\"qtext\">ETH doubles while you&#39;re in a 50/50 ETH/USDC pool. How did you do vs holding?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>About 5.7% behind holding, before fees. Fees need to exceed that for LPing to have been worth it.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.3:q2\">\u003cdiv class=\"qtext\">A loop earns 3.5% on collateral and pays 2.5% to borrow at 3×. What borrow rate wipes out the return?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>0 = 3.5×3 − b×2 → b = 5.25%.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.3:q3\">\u003cdiv class=\"qtext\">Funding is +0.01% per 8 hours. What is the APR on the hedged size, and why is your return on capital lower?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>~10.95%. Capital sits in both the spot leg and the perp margin, so the return on total capital is roughly half to three-quarters of that, depending on the short&#39;s leverage.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.3:q4\">\u003cdiv class=\"qtext\">Your concentrated LP just went out of range after a breakout. What&#39;s the operator move?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Treat it as a range invalidation, just as with a grid bot: follow the pre-written rule (re-centre with a wider range, or exit). Don&#39;t chase every move with narrow rebalances.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003chr>\n\u003cp>\u003cem>Operating rule: if you can&#39;t name the profit engine and explain the unwind,\ndon&#39;t enter the position.\u003c/em>\u003c/p>\n","text":"On Chain Operator Program · Strategy module · Built on ATLAS \"DeFi & On Chain\" ch. 7–18, 38–42 and the 16 framework Strategy Library, expanded to 30 strategies. Read this first. This is educational material, not financial advice. No DeFi strategy guarantees profit. Every return in DeFi is payment for taking a risk. This module shows where each strategy's return comes from, the maths to test it before you enter, how to run it, and exactly how it loses money , so you only keep positions whose expected return still makes sense after costs and risk. All numbers below are illustrative. Use live rates from protocol dashboards and independent data (e.g. DefiLlama) when you model a real position. Calculator for every formula here: python3 .claude/skills/defi strategies/scripts/defi calc.py help Part 1 — Where profit actually comes from There are only five sources of return in DeFi. Every strategy is a mix of them. Source You are paid for… Example Lasts? 1 Service fees providing liquidity traders need swap fees to LPs As long as volume lasts 2 Interest lending capital borrowers need stablecoin supply APY As long as borrow demand lasts 3 Security rewards staking to secure a network ETH staking yield Structural, but changes over time 4 Structural carry taking the other side of crowded positioning perp funding, basis Comes and goes with the market 5 Incentives bringing capital to a protocol token emissions, points, airdrops Temporary, and often dilutive Price moves (beta) are not a strategy. If a position only made money because ETH went up, it was a directional bet with extra steps. Strategies 1–4 can pay in flat markets. Source 5 is only real once the tokens are sold. The one equation that matters Net return = base yield (fees + interest + staking) + incentives (valued at the price you can actually sell at) − impermanent loss / inventory loss − borrow cost − gas + swap + bridge costs − protocol / vault fees − losses from risk events ± price change on assets held A position is only worth running if net return beats the simplest alternative (holding the assets, or plain stablecoin lending) by enough to pay for the extra risk . Masters compare against a benchmark. Beginners compare against zero. APR vs APY APY assumes compounding. APY = (1 + APR/n)^n − 1 . 10% APR compounded daily ≈ 10.52% APY, but only if compounding is free . On chain, each compound costs gas. Compound only when pending rewards ≥ ~10–20× the gas cost , or use a vault that batches it (and charges a fee for doing so). Part 2 — Strategy selector by market regime This uses the same thinking as the Grid Bot module: pick the market regime first, then the strategy. Regime Strategies that tend to work Avoid / reduce Sideways, low–moderate volatility Concentrated LP around the range · stable stable LP · lending · grid bots (CEX) Leverage loops with thin buffers Uptrend Hold + liquid staking · delta neutral funding carry (longs usually pay) · conservative borrow against collateral Narrow LP ranges (they sell your winners early) Downtrend Stablecoin lending · stable stable LP · cash management Leveraged loops · volatile/volatile LP · incentive farms paid in falling tokens High volatility / event risk Wider LP ranges or none · larger health factor buffers · smaller size New positions right before major news (FOMC, CPI), new or unaudited protocols Part 3 — The strategy playbook Each strategy card has the same sections: Profit engine · Key maths · Execute · Monitor · Exit/kill rules · How it loses · Size cap . Size caps are suggested maximums as a share of the DeFi portfolio. Tighten them to fit your own risk budget. LEVEL 1 — CORE (start here) 1. Stablecoin lending Profit engine: interest paid by borrowers (source 2). Key maths: supply APY ≈ borrow APY × utilisation × (1 − reserve factor) . Example: 8% borrow × 80% utilisation × 0.9 = 5.76% . Execute: pick a stablecoin with a clear peg mechanism (Module 1.5) → pick a lending market that passed due diligence ( defi due diligence ) → check current utilisation and withdrawal liquidity → supply → record the receipt token. Monitor: utilisation (above ~90% = withdrawals may be stuck), stablecoin peg, governance changes, incidents. Exit/kill: peg below ~0.99 for a sustained period, utilisation pinned at 100%, exploit news, or the rate falls below your benchmark. How it loses: stablecoin depeg, protocol exploit, bad debt, frozen withdrawals. Size cap: can be the largest bucket, but split across ≥2 independent protocols and ≥2 stablecoin issuers . 2. Native / liquid staking (LSTs) Profit engine: network security rewards (source 3), minus the provider's fee. Key maths: net yield = staking APR × (1 − provider fee) . Your real return is still dominated by the asset's price, so this only improves on holding if you'd hold the asset anyway. Execute: choose the provider (validator spread, fee, track record, redemption path) → stake → confirm how the LST earns (rebasing, or an exchange rate that rises). Monitor: LST/underlying ratio on markets (discount), validator incidents/slashing, withdrawal queue length. Exit/kill: discount widens beyond your threshold, a slashing event, or the provider's governance or custody changes. How it loses: asset price falls (main risk), LST depeg, slashing, smart contract risk. Size cap: \"hold anyway\" capital only. 3. Borrowing against collateral (liquidity without selling) Profit engine: none by itself. It's a tool. The gain comes from what the borrowed funds do, or from not triggering a sale. Key maths: Health factor (HF) = Σ(collateral value × liquidation threshold) ÷ debt Liquidation price = debt ÷ (collateral qty × liquidation threshold) Example: 10 ETH at $3,000, LT 0.80, borrow $12,000 → HF = 2.0 → liquidation at $1,500 (−50%). Execute: borrow only enough that liquidation is beyond a move you'd realistically expect to survive ( HF ≥ 2 for volatile collateral is a sane starting rule) → write the defence plan before borrowing. Monitor: HF daily, borrow rate, oracle price. Ex","video":null,"script":null},
