% of book Review within timelock Checklist [ ] Alerts for all four categories, delivered to phone [ ] Every alert maps to a written action Quiz 1. Why alert on any vault wallet outflow? The vault should almost never move; any movement could be a compromise. 2. Why watch queued upgrades? The timelock is your window to exit before the change takes effect. 3. An alert with no action attached is…? Noise. Every alert needs a written response.","video":null,"script":"video-scripts/lessons/lesson-14-1.json"},{"id":"14.2","title":"Automation: keepers, bots and agents without handing over the keys","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Automate routine actions with the least permission possible.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Keeper / automation networks\u003c/strong> execute pre-defined actions when conditions\nare met (e.g. repay when HF &lt; 1.8, rebalance an LP range).\u003c/li>\n\u003cli>\u003cstrong>Smart-account permissions / session keys:\u003c/strong> grant a bot the right to do\n\u003cem>one thing\u003c/em> (e.g. repay debt on one protocol, up to $X per day), revocable at any time.\u003c/li>\n\u003cli>\u003cstrong>AI agents and bots:\u003c/strong> treat them like any other contract permission. They get\nscoped rights, never your seed phrase or unlimited approvals.\u003c/li>\n\u003cli>\u003cstrong>Test on a testnet or with tiny amounts first; log every automated action.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Automated repay: a session key allowed only to call \u003ccode>repay\u003c/code> on your lending\nposition, from your operating wallet, capped at $5,000/day, expiring in 30 days.\nWorst case if the bot is compromised: it repays your debt, which is annoying, not catastrophic.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.2:c0\">\u003cspan>Each automation has a scoped, capped, expiring permission\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.2:c1\">\u003cspan>No automation holds seed phrases or unlimited approvals\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.2:c2\">\u003cspan>Tested small; actions logged; revoke procedure known\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"14.2:q0\">\u003cdiv class=\"qtext\">What&#39;s a session key?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A limited, revocable permission for a specific action.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"14.2:q1\">\u003cdiv class=\"qtext\">Should an AI agent ever get your seed phrase?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. Give it scoped, revocable permissions only.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"14.2:q2\">\u003cdiv class=\"qtext\">Worst case of a well-scoped repay bot?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It repays debt within its cap. No funds leave your control.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Automate routine actions with the least permission possible. Explanation Keeper / automation networks execute pre defined actions when conditions are met (e.g. repay when HF 1. What's a session key? A limited, revocable permission for a specific action. 2. Should an AI agent ever get your seed phrase? No. Give it scoped, revocable permissions only. 3. Worst case of a well scoped repay bot? It repays debt within its cap. No funds leave your control.","video":null,"script":"video-scripts/lessons/lesson-14-2.json"},{"id":"14.3","title":"Operating procedures: multisig signing, change control, reviews","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Run your bank with procedures that prevent single-point mistakes.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Multisig signing procedure:\u003c/strong> every signer independently verifies the\ntransaction (destination, amount, calldata) on their \u003cstrong>own device screen\u003c/strong>, not a shared screenshot.\u003c/li>\n\u003cli>\u003cstrong>Change control:\u003c/strong> new protocol, new chain, new strategy, or a cap change is\nwritten up (thesis, risk register row, size) and waits 24h before execution.\u003c/li>\n\u003cli>\u003cstrong>Separation:\u003c/strong> the person proposing a vault transaction isn&#39;t the only one approving it.\u003c/li>\n\u003cli>\u003cstrong>Review calendar:\u003c/strong> weekly books · monthly register · quarterly stress test and recovery drill · annual review (Module 13.5).\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A 2-of-3 vault moves $40,000 to the operating wallet. Signer 1 proposes; Signer 2\nchecks the destination against the allowlist and the amount against the ladder\nrefill schedule on their hardware wallet screen, then signs. Logged in the books with both names.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.3:c0\">\u003cspan>Signing procedure written for every signer\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.3:c1\">\u003cspan>Change-control template and 24h rule\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.3:c2\">\u003cspan>Review calendar set\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"14.3:q0\">\u003cdiv class=\"qtext\">Why verify on your own device screen?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Screens and screenshots can be faked; the hardware display shows what you&#39;re actually signing.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"14.3:q1\">\u003cdiv class=\"qtext\">What is change control for?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Forcing new risks through thesis, register and a cooling-off period.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"14.3:q2\">\u003cdiv class=\"qtext\">How often is the stress test re-run?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Quarterly, and after big changes.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Run your bank with procedures that prevent single point mistakes. Explanation Multisig signing procedure: every signer independently verifies the transaction (destination, amount, calldata) on their own device screen , not a shared screenshot. Change control: new protocol, new chain, new strategy, or a cap change is written up (thesis, risk register row, size) and waits 24h before execution. Separation: the person proposing a vault transaction isn't the only one approving it. Review calendar: weekly books · monthly register · quarterly stress test and recovery drill · annual review (Module 13.5). Worked example A 2 of 3 vault moves $40,000 to the operating wallet. Signer 1 proposes; Signer 2 checks the destination against the allowlist and the amount against the ladder refill schedule on their hardware wallet screen, then signs. Logged in the books with both names. Checklist [ ] Signing procedure written for every signer [ ] Change control template and 24h rule [ ] Review calendar set Quiz 1. Why verify on your own device screen? Screens and screenshots can be faked; the hardware display shows what you're actually signing. 2. What is change control for? Forcing new risks through thesis, register and a cooling off period. 3. How often is the stress test re run? Quarterly, and after big changes.","video":null,"script":"video-scripts/lessons/lesson-14-3.json"},{"id":"14.4","title":"Operator capstone and certification","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Assemble your complete on-chain bank and have it assessed.\u003c/p>\n\u003c/section>\u003ch3>Explanation — the operator capstone\u003c/h3>\n\u003cp>Submit one document (template in \u003ccode>07-program-operations.md\u003c/code>) containing:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Balance sheet\u003c/strong> with equity, LTV and runway (12.1)\u003c/li>\n\u003cli>\u003cstrong>Custody policy\u003c/strong> and recovery-test log (12.2)\u003c/li>\n\u003cli>\u003cstrong>Credit policy\u003c/strong> with action levels (12.3)\u003c/li>\n\u003cli>\u003cstrong>Liquidity ladder\u003c/strong> T0–T3 (12.4)\u003c/li>\n\u003cli>\u003cstrong>Lending policy\u003c/strong> with risk assumptions (12.5)\u003c/li>\n\u003cli>\u003cstrong>Books template\u003c/strong> and letter of instruction location (12.6; never the seed)\u003c/li>\n\u003cli>\u003cstrong>Income portfolio\u003c/strong> with risk-adjusted expected income (13.3)\u003c/li>\n\u003cli>\u003cstrong>Payout policy\u003c/strong> (13.4)\u003c/li>\n\u003cli>\u003cstrong>Stress test\u003c/strong>, five scenarios, with fixes (11.4)\u003c/li>\n\u003cli>\u003cstrong>Incident playbook\u003c/strong> (11.5), \u003cstrong>alert sheet\u003c/strong> (14.1) and \u003cstrong>automation permissions\u003c/strong> (14.2)\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Certification levels\u003c/strong> (assessed against the rubric in \u003ccode>07-program-operations.md\u003c/code>):\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Analyst:\u003c/strong> passed the analyst capstone (Modules 6–7)\u003c/li>\n\u003cli>\u003cstrong>Operator:\u003c/strong> passed the operator capstone\u003c/li>\n\u003cli>\u003cstrong>Operator with distinction:\u003c/strong> operator capstone scored ≥ 90%, plus one quarter of books kept to standard\u003c/li>\n\u003c/ul>\n\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.4:c0\">\u003cspan>All ten sections complete\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.4:c1\">\u003cspan>Calculators used for every number\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.4:c2\">\u003cspan>Submitted (Live tier: booked for review)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"14.4:q0\">\u003cdiv class=\"qtext\">What must never appear in the capstone?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Seed phrases, private keys or anything that grants access.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"14.4:q1\">\u003cdiv class=\"qtext\">Which lesson&#39;s output shows income is sustainable?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>13.4: the payout policy, based on risk-adjusted expected income.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"14.4:q2\">\u003cdiv class=\"qtext\">What&#39;s needed for &quot;with distinction&quot;?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>≥ 90% on the operator capstone plus a quarter of books kept to standard.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Assemble your complete on chain bank and have it assessed. Explanation — the operator capstone Submit one document (template in 07 program operations.md ) containing: 1. Balance sheet with equity, LTV and runway (12.1) 2. Custody policy and recovery test log (12.2) 3. Credit policy with action levels (12.3) 4. Liquidity ladder T0–T3 (12.4) 5. Lending policy with risk assumptions (12.5) 6. Books template and letter of instruction location (12.6; never the seed) 7. Income portfolio with risk adjusted expected income (13.3) 8. Payout policy (13.4) 9. Stress test , five scenarios, with fixes (11.4) 10. Incident playbook (11.5), alert sheet (14.1) and automation permissions (14.2) Certification levels (assessed against the rubric in 07 program operations.md ): Analyst: passed the analyst capstone (Modules 6–7) Operator: passed the operator capstone Operator with distinction: operator capstone scored ≥ 90%, plus one quarter of books kept to standard Checklist [ ] All ten sections complete [ ] Calculators used for every number [ ] Submitted (Live tier: booked for review) Quiz 1. What must never appear in the capstone? Seed phrases, private keys or anything that grants access. 2. Which lesson's output shows income is sustainable? 13.4: the payout policy, based on risk adjusted expected income. 3. What's needed for \"with distinction\"? ≥ 90% on the operator capstone plus a quarter of books kept to standard.","video":null,"script":"video-scripts/lessons/lesson-14-4.json"},{"id":"14.5","title":"Building your own tools: reading contracts, data and simple scripts","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Read on-chain data directly and build simple read-only tools, so you&#39;re not dependent on any one dashboard.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Reading without code:\u003c/strong> block explorers&#39; Read tabs show a contract&#39;s public state (e.g. a lending market&#39;s parameters, your position).\u003c/li>\n\u003cli>\u003cstrong>Public data APIs\u003c/strong> (e.g. protocol analytics sites, explorers) return TVL, fees, yields and prices as JSON.\u003c/li>\n\u003cli>\u003cstrong>RPC:\u003c/strong> a node endpoint that lets a script read chain state directly (balances, contract calls). Use a reputable provider; reading is free or cheap.\u003c/li>\n\u003cli>\u003cstrong>Scripts that only read\u003c/strong> (never hold keys) can check health factors, pegs and utilisation, and send you alerts.\u003c/li>\n\u003cli>\u003cstrong>Rule:\u003c/strong> tools that \u003cem>read\u003c/em> are low-risk; tools that \u003cem>sign\u003c/em> follow Lesson 14.2 (scoped, capped, revocable permissions). Never put a seed phrase or private key in a script, a file or an environment variable on a shared machine.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cpre>\u003ccode>every 15 minutes:\n    position = lending_protocol.getUserAccountData(my_address)   # public read call\n    if position.health_factor &lt; 1.8: send_phone_alert(&quot;HF &quot; + position.health_factor)\n    peg = price_api.get(&quot;USDC&quot;)\n    if peg &lt; 0.99: send_phone_alert(&quot;USDC peg &quot; + peg)\n\u003c/code>\u003c/pre>\n\u003cp>Uses only public reads, holds no keys, and can&#39;t move funds. Worst case if it\nbreaks: you miss an alert, so keep your other alerts (14.1) as a backup.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.5:c0\">\u003cspan>I can read a contract&#39;s state on an explorer\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.5:c1\">\u003cspan>My monitoring scripts are read-only and hold no keys\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.5:c2\">\u003cspan>Backup alerts exist if my script fails\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"14.5:q0\">\u003cdiv class=\"qtext\">Why prefer read-only tools?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>They can&#39;t move funds, so a bug or breach costs little.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"14.5:q1\">\u003cdiv class=\"qtext\">Where should a private key go in a script?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Nowhere. Use scoped permissions (14.2) if a tool must act.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"14.5:q2\">\u003cdiv class=\"qtext\">What&#39;s an RPC endpoint?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A node connection that lets software read (and submit to) the blockchain.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Read on chain data directly and build simple read only tools, so you're not dependent on any one dashboard. Explanation Reading without code: block explorers' Read tabs show a contract's public state (e.g. a lending market's parameters, your position). Public data APIs (e.g. protocol analytics sites, explorers) return TVL, fees, yields and prices as JSON. RPC: a node endpoint that lets a script read chain state directly (balances, contract calls). Use a reputable provider; reading is free or cheap. Scripts that only read (never hold keys) can check health factors, pegs and utilisation, and send you alerts. Rule: tools that read are low risk; tools that sign follow Lesson 14.2 (scoped, capped, revocable permissions). Never put a seed phrase or private key in a script, a file or an environment variable on a shared machine. Worked example (read only, pseudo code) every 15 minutes: position = lending protocol.getUserAccountData(my address) public read call if position.health factor 1. Why prefer read only tools? They can't move funds, so a bug or breach costs little. 2. Where should a private key go in a script? Nowhere. Use scoped permissions (14.2) if a tool must act. 3. What's an RPC endpoint? A node connection that lets software read (and submit to) the blockchain.","video":null,"script":"video-scripts/lessons/lesson-14-5.json"},{"id":"14.6","title":"Searchers, keepers and arbitrage bots: how they work","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Understand the professional bot economy that shapes DeFi prices, and why competing in it is hard.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Searchers\u003c/strong> run bots that find and capture opportunities: \u003cstrong>DEX arbitrage\u003c/strong> (price gaps between pools/venues), \u003cstrong>liquidations\u003c/strong> (repay debt, take the bonus), \u003cstrong>backruns\u003c/strong> (trading right after a large swap), and, harmfully, sandwiches.\u003c/li>\n\u003cli>\u003cstrong>Keepers\u003c/strong> perform maintenance jobs for protocols (liquidations, auction bids, rebalancing) for a fee.\u003c/li>\n\u003cli>\u003cstrong>The economics:\u003c/strong> bots bid for inclusion by paying builders/validators (2.8). Competition drives profits towards zero; the winners have the lowest latency, best infrastructure, private order flow and capital.\u003c/li>\n\u003cli>\u003cstrong>Why it matters to you:\u003c/strong> these bots are why pool prices track the market (and cause LVR, 2.7), why liquidations happen within seconds (3.3), and why tight slippage and protected routing matter (2.5).\u003c/li>\n\u003cli>\u003cstrong>For a learner:\u003c/strong> build read-only monitors (14.5) and understand the mechanics. Running competitive bots is a professional engineering business with real losses from failed transactions and bugs.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A liquidation worth a $300 bonus (3.3) appears. Dozens of bots see it in the same block;\nthe winner pays most of the $300 to the block builder to be included first. The\n&quot;profit&quot; left after fees and gas might be a few dollars, and losing bots may still pay gas.\nThat&#39;s why liquidations are near-instant, and why your buffer (not a liquidator&#39;s delay) is your protection.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.6:c0\">\u003cspan>I can name the main searcher strategies and their effect on me\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.6:c1\">\u003cspan>My protections (slippage, private routing, HF buffers) assume bots act within seconds\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"14.6:q0\">\u003cdiv class=\"qtext\">Where does most of a competitive searcher&#39;s profit go?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>To builders/validators, through bids for inclusion.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"14.6:q1\">\u003cdiv class=\"qtext\">What do keepers do?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Paid maintenance for protocols: liquidations, auctions, rebalancing.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"14.6:q2\">\u003cdiv class=\"qtext\">Why do liquidations happen so fast?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Competing bots race to capture the bonus.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Understand the professional bot economy that shapes DeFi prices, and why competing in it is hard. Explanation Searchers run bots that find and capture opportunities: DEX arbitrage (price gaps between pools/venues), liquidations (repay debt, take the bonus), backruns (trading right after a large swap), and, harmfully, sandwiches. Keepers perform maintenance jobs for protocols (liquidations, auction bids, rebalancing) for a fee. The economics: bots bid for inclusion by paying builders/validators (2.8). Competition drives profits towards zero; the winners have the lowest latency, best infrastructure, private order flow and capital. Why it matters to you: these bots are why pool prices track the market (and cause LVR, 2.7), why liquidations happen within seconds (3.3), and why tight slippage and protected routing matter (2.5). For a learner: build read only monitors (14.5) and understand the mechanics. Running competitive bots is a professional engineering business with real losses from failed transactions and bugs. Worked example A liquidation worth a $300 bonus (3.3) appears. Dozens of bots see it in the same block; the winner pays most of the $300 to the block builder to be included first. The \"profit\" left after fees and gas might be a few dollars, and losing bots may still pay gas. That's why liquidations are near instant, and why your buffer (not a liquidator's delay) is your protection. Checklist [ ] I can name the main searcher strategies and their effect on me [ ] My protections (slippage, private routing, HF buffers) assume bots act within seconds Quiz 1. Where does most of a competitive searcher's profit go? To builders/validators, through bids for inclusion. 2. What do keepers do? Paid maintenance for protocols: liquidations, auctions, rebalancing. 3. Why do liquidations happen so fast? Competing bots race to capture the bonus.","video":null,"script":"video-scripts/lessons/lesson-14-6.json"}]}],"welcome":{"src":"../video/welcome.mp4","poster":"","vtt":"","chapters":[]},"totalLessons":107,"icons":{"compass":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M15.5 8.5l-2 5-5 2 2-5z\"/>\u003c/svg>","shield":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z\"/>\u003cpath d=\"M9 12l2 2 4-4\"/>\u003c/svg>","swap":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 8h13l-3-3\"/>\u003cpath d=\"M20 16H7l3 3\"/>\u003c/svg>","bank":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M3 10l9-6 9 6\"/>\u003cpath d=\"M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18\"/>\u003c/svg>","sprout":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 21v-9\"/>\u003cpath d=\"M12 12c0-4 3-7 8-7 0 5-3 7-8 7z\"/>\u003cpath d=\"M12 14c0-3-2.5-5.5-7-5.5 0 4 2.5 5.5 7 5.5z\"/>\u003c/svg>","layers":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l9 5-9 5-9-5z\"/>\u003cpath d=\"M3 13l9 5 9-5\"/>\u003c/svg>","search":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"10.5\" cy=\"10.5\" r=\"6\"/>\u003cpath d=\"M15 15l5 5\"/>\u003c/svg>","chart":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 20V4\"/>\u003cpath d=\"M4 20h16\"/>\u003cpath d=\"M7 15l4-4 3 3 5-6\"/>\u003c/svg>","cog":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>\u003cpath d=\"M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1\"/>\u003c/svg>","grid":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/>\u003cpath d=\"M3 9h18M3 15h18M9 3v18M15 3v18\"/>\u003c/svg>","target":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"5\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"1.5\"/>\u003c/svg>","umbrella":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M3 12a9 9 0 0118 0z\"/>\u003cpath d=\"M12 12v7a2 2 0 01-4 0\"/>\u003c/svg>","vault":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"4\"/>\u003cpath d=\"M12 8v1.5M12 14.5V16M8 12h1.5M14.5 12H16M6 20v1.5M18 20v1.5\"/>\u003c/svg>","coins":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cellipse cx=\"9\" cy=\"7\" rx=\"6\" ry=\"2.5\"/>\u003cpath d=\"M3 7v4c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V7\"/>\u003cpath d=\"M9 16.5c-3.3 0-6-1.1-6-2.5\"/>\u003cpath d=\"M3 11v5c0 1.4 2.7 2.5 6 2.5 1 0 2-.1 2.8-.3\"/>\u003ccircle cx=\"17\" cy=\"16\" r=\"4.5\"/>\u003c/svg>","bot":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"4\" y=\"8\" width=\"16\" height=\"12\" rx=\"3\"/>\u003cpath d=\"M12 4v4\"/>\u003ccircle cx=\"12\" cy=\"3.5\" r=\"1\"/>\u003ccircle cx=\"9\" cy=\"13.5\" r=\"1.3\"/>\u003ccircle cx=\"15\" cy=\"13.5\" r=\"1.3\"/>\u003cpath d=\"M9.5 17h5\"/>\u003c/svg>","check":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12l4 4 10-10\"/>\u003c/svg>","video":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"3\" y=\"6\" width=\"13\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M16 10l5-3v10l-5-3\"/>\u003c/svg>","book":"\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z\"/>\u003cpath d=\"M4 21V5\"/>\u003c/svg>"}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// ---- state (per browser; wrapped because storage can be unavailable)
const KEY = 'oop-hub-v1';
let S = { done: {}, checks: {}, quiz: {}, last: null };
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
try { const t = localStorage.getItem('oop-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$('#theme').onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; try { localStorage.setItem('oop-theme', nx); } catch (e) {} };
$('#menu').onclick = () => document.body.classList.toggle('nav-open');
// ---- index
const ALL = []; D.modules.forEach(m => m.lessons.forEach(l => ALL.push({ ...l, m })));
const byId = Object.fromEntries(ALL.map(l => [l.id, l]));
const stageOf = n => D.stages.find(s => s[2].includes(n));
const countable = ALL.filter(l => !l.starter);
function progress() {
  const d = countable.filter(l => S.done[l.id]).length;
  $('#ovtxt').textContent = d + ' of ' + countable.length + ' lessons complete';
  $('#ovbar').style.width = (d / countable.length * 100) + '%';
}
function tree(active) {
  $('#tree').innerHTML = D.stages.map(([n, name, mods]) => {
    const ls = ALL.filter(l => mods.includes(l.m.n) && !l.starter), d = ls.filter(l => S.done[l.id]).length;
    return '<div class="stage"><div class="sh"><span>Stage ' + n + ' · ' + name + '</span><span>' + d + '/' + ls.length + '</span></div>' + mods.map(mn => {
      const m = D.modules[mn], open = active && active.m.n === mn;
      const md = m.lessons.filter(l => !l.starter && S.done[l.id]).length, mt = m.lessons.filter(l => !l.starter).length;
      return '<details class="mod"' + (open ? ' open' : '') + '><summary><span class="ic">' + D.icons[m.icon] + '</span>' + mn + '. ' + esc(m.title) + '<span class="pc">' + md + '/' + mt + '</span></summary><div class="lessons">' +
        '<a href="#/m/' + mn + '">' + '<span class="id">•</span>Module overview</a>' +
        m.lessons.map(l => '<a href="#/l/' + l.id + '" class="' + (S.done[l.id] ? 'done ' : '') + (active && active.id === l.id ? 'on' : '') + '"><span class="id">' + l.id + '</span>' + esc(l.title) + '</a>').join('') + '</div></details>';
    }).join('') + '</div>';
  }).join('');
  progress();
}
function videoBlock(v, label) {
  if (!v) return '';
  return '<div class="video"><video controls preload="metadata" playsinline ' + (v.poster ? 'poster="' + v.poster + '"' : '') + ' src="' + v.src + '">' + (v.vtt ? '<track kind="captions" srclang="en" label="English" src="' + v.vtt + '">' : '') + '</video>' +
    (v.chapters.length ? '<div class="chapters">' + v.chapters.map(c => '<button data-t="' + c[0] + '"><b>' + c[1] + '</b>' + esc(c[2]) + '</button>').join('') + '</div>' : '') + '</div>';
}
function wireVideo() { document.querySelectorAll('.chapters button').forEach(b => b.onclick = () => { const v = b.closest('.video').querySelector('video'); v.currentTime = +b.dataset.t; v.play(); }); }
// ---- views
function home() {
  const next = S.last && byId[S.last] ? byId[S.last] : ALL[0];
  $('#crumbs').textContent = 'Start here';
  return '<div class="hero">' + "<svg width=\"64\" height=\"64\" viewBox=\"0 0 200 200\">\n    <defs>\n      <linearGradient id=\"lg1g\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#2ee6a6\"/><stop offset=\"1\" stop-color=\"#3987e5\"/></linearGradient>\n      <clipPath id=\"lg1c\"><rect x=\"86\" y=\"58\" width=\"28\" height=\"30\"/></clipPath>\n      <filter id=\"lg1f\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\"><feGaussianBlur stdDeviation=\"6\"/></filter>\n    </defs>\n    <path d=\"M176.21,144.00L100.00,188.00L23.79,144.00L23.79,56.00L100.00,12.00L176.21,56.00Z\" fill=\"none\" stroke=\"url(#lg1g)\" stroke-width=\"10\" opacity=\".45\" filter=\"url(#lg1f)\"/>\n    <path d=\"M176.21,144.00L100.00,188.00L23.79,144.00L23.79,56.00L100.00,12.00L176.21,56.00Z\" fill=\"rgba(255,255,255,.03)\" stroke=\"url(#lg1g)\" stroke-width=\"7\" stroke-linejoin=\"round\"/>\n    \n    <circle cx=\"78\" cy=\"100\" r=\"33\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"13\"/>\n    <circle cx=\"122\" cy=\"100\" r=\"33\" fill=\"none\" stroke=\"url(#lg1g)\" stroke-width=\"13\"/>\n    <circle cx=\"78\" cy=\"100\" r=\"33\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"13\" clip-path=\"url(#lg1c)\"/>\n  </svg>" + '<h1>From zero to your own on-chain bank.</h1><p>Six stages · 15 modules · ' + D.totalLessons + ' lessons, each module opening with a Mastery Starter.</p>' +
    '<a class="cta" href="#/l/' + next.id + '">' + (S.last ? 'Continue: Lesson ' + next.id : 'Begin with Lesson ' + next.id) + ' →</a></div>' +
    (D.welcome ? '<h2 class="sec">Welcome</h2>' + videoBlock(D.welcome) : '') +
    '<h2 class="sec">How every lesson works</h2><div class="grid">' +
    [['1 · Watch', 'The narrated video walks through the idea and the numbers on screen.'], ['2 · Do', 'Tick the checklist for real, with a small test amount. Your ticks are saved in this browser.'], ['3 · Check', 'Answer the quiz, reveal the answer, and mark yourself honestly.']].map(([a, b]) => '<div class="card"><h3>' + a + '</h3><p>' + b + '</p></div>').join('') + '</div>' +
    D.stages.map(([n, name, mods]) => '<h2 class="sec">Stage ' + n + ' · ' + name + '</h2><div class="grid">' + mods.map(mn => { const m = D.modules[mn], mt = m.lessons.filter(l => !l.starter), d = mt.filter(l => S.done[l.id]).length;
      return '<a class="card" href="#/m/' + mn + '"><div class="k">Module ' + mn + '</div><h3>' + esc(m.title) + '</h3><p>' + esc(m.outcome) + '</p><div class="bar" style="background:var(--panel)"><i style="width:' + (d / mt.length * 100) + '%"></i></div></a>'; }).join('') + '</div>').join('') +
    '<p class="disc">Educational content only · Not financial advice · No results are guaranteed · We will never ask for your seed phrase or keys.</p>';
}
function modView(mn) {
  const m = D.modules[mn]; $('#crumbs').textContent = 'Stage ' + stageOf(mn)[0] + ' · Module ' + mn + ' · ' + m.title;
  return '<img class="mod-banner" src="' + m.banner + '" alt="Module ' + mn + '">' + (m.intro ? '<h2 class="sec">Module intro</h2>' + videoBlock(m.intro) : '') +
    '<h2 class="sec">Outcome</h2><p>' + esc(m.outcome) + '</p><h2 class="sec">Lessons</h2><div class="grid">' +
    m.lessons.map(l => '<a class="card" href="#/l/' + l.id + '"><div class="k">' + (l.starter ? 'Start here' : 'Lesson ' + l.id) + (S.done[l.id] ? ' · ✓ done' : '') + '</div><h3>' + esc(l.title) + '</h3></a>').join('') + '</div>';
}
function lessonView(id) {
  const l = byId[id]; if (!l) return home();
  S.last = id; save();
  const i = ALL.indexOf(l), prev = ALL[i - 1], next = ALL[i + 1];
  $('#crumbs').textContent = 'Stage ' + stageOf(l.m.n)[0] + ' · Module ' + l.m.n + ' · ' + l.m.title + ' · ' + (l.starter ? 'Mastery Starter' : 'Lesson ' + l.id);
  return '<div class="lesson-head' + (l.starter ? ' starter' : '') + '"><div class="n">' + l.id + '</div><div><div class="k">' + (l.starter ? 'Mastery Starter · start here' : 'Module ' + l.m.n + ' · ' + esc(l.m.title)) + '</div><h1>' + esc(l.title) + '</h1></div></div>' +
    (l.video ? videoBlock(l.video) : l.script ? '<div class="novideo">' + D.icons.video + '<div>The narrated video for this lesson is scripted (<code>' + l.script + '</code>) and renders with <code>node build_video.js ' + l.script.split('/').pop().replace('.json', '') + '</code>.</div></div>' : '') +
    '<article>' + l.html + '</article>' +
    '<div class="done-row"><div><b>' + (S.done[id] ? 'Lesson complete ✓' : 'Finished the checklist and quiz?') + '</b></div><button class="btn ' + (S.done[id] ? 'ghost' : 'good') + '" id="mark">' + (S.done[id] ? 'Mark as not done' : 'Mark lesson complete') + '</button></div>' +
    '<div class="pager">' + (prev ? '<a href="#/l/' + prev.id + '"><small>← Previous</small>' + prev.id + ' ' + esc(prev.title) + '</a>' : '<span></span>') + (next ? '<a class="next" href="#/l/' + next.id + '"><small>Next →</small>' + next.id + ' ' + esc(next.title) + '</a>' : '') + '</div>' +
    '<p class="disc">Educational content only · Not financial advice · No results are guaranteed.</p>';
}
function wireLesson(id) {
  document.querySelectorAll('li.task input').forEach(cb => { cb.checked = !!S.checks[cb.dataset.k]; cb.onchange = () => { S.checks[cb.dataset.k] = cb.checked; save(); }; });
  document.querySelectorAll('.qq').forEach(q => { const k = q.dataset.k, a = q.querySelector('.ans'), r = q.querySelector('.reveal');
    const paint = () => q.querySelectorAll('.grade button').forEach(b => b.classList.toggle('sel', String(S.quiz[k]) === b.dataset.g));
    if (S.quiz[k] !== undefined) { a.hidden = false; r.hidden = true; }
    r.onclick = () => { a.hidden = false; r.hidden = true; };
    q.querySelectorAll('.grade button').forEach(b => b.onclick = () => { S.quiz[k] = +b.dataset.g; save(); paint(); }); paint(); });
  const mk = $('#mark'); if (mk) mk.onclick = () => { S.done[id] = !S.done[id]; save(); route(); };
}
function searchView(term) {
  $('#crumbs').textContent = 'Search';
  const t = term.toLowerCase().trim(); if (!t) return home();
  const words = t.split(/\s+/);
  const hits = ALL.map(l => { const hay = (l.title + ' ' + l.text).toLowerCase(); const score = words.reduce((a, w) => a + (hay.includes(w) ? 1 + (l.title.toLowerCase().includes(w) ? 3 : 0) : -99), 0); return [score, l]; })
    .filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 40);
  const hl = s => esc(s).replace(new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi'), '<mark>$1</mark>');
  return '<h1 style="margin-top:0">Search: “' + esc(term) + '”</h1><p style="color:var(--text2)">' + hits.length + ' lesson' + (hits.length === 1 ? '' : 's') + '</p><div class="results">' +
    hits.map(([, l]) => { const i = l.text.toLowerCase().indexOf(words[0]); const snip = l.text.slice(Math.max(0, i - 70), i + 150);
      return '<a href="#/l/' + l.id + '"><b>' + l.id + ' · ' + hl(l.title) + '</b><small>Module ' + l.m.n + ' · …' + hl(snip) + '…</small></a>'; }).join('') + '</div>';
}
// ---- calculators (same formulas as defi_calc.py)
const money = x => (x < 0 ? '−$' : '$') + Math.abs(x).toLocaleString('en-US', { maximumFractionDigits: 2 });
const pct = (x, d = 2) => (x * 100).toFixed(d) + '%';
const CALCS = [
  { id: 'health', t: 'Health factor & liquidation price', d: 'Before any borrow. Lesson 3.2.', f: [['qty', 'Collateral quantity', 10], ['price', 'Collateral price ($)', 3000], ['lt', 'Liquidation threshold', 0.8], ['debt', 'Debt ($)', 12000]],
    run: v => { const coll = v.qty * v.price, hf = coll * v.lt / v.debt, liq = v.debt / (v.qty * v.lt);
      return 'Collateral ' + money(coll) + ' · LTV ' + pct(v.debt / coll, 1) + '\nHealth factor ' + hf.toFixed(2) + ' · liquidation price ' + money(liq) + ' (' + ((liq / v.price - 1) * 100).toFixed(1) + '% from now)\nMax debt for HF 1.5: ' + money(coll * v.lt / 1.5) + ' · for HF 2.0: ' + money(coll * v.lt / 2) + (hf < 1.5 ? '\n<span class="warn">Warning: HF below 1.5. Repay or add collateral.</span>' : ''); } },
  { id: 'il', t: 'Impermanent loss', d: '50/50 constant-product pool, before fees. Lesson 2.3.', f: [['ratio', 'Price ratio (new ÷ entry)', 2], ['days', 'Days held', 90], ['fee', 'Fee APR (%)', 20]],
    run: v => { const il = 1 - 2 * Math.sqrt(v.ratio) / (1 + v.ratio), need = il * 365 / v.days, earned = v.fee / 100 * v.days / 365;
      return v.ratio + '× move → impermanent loss ' + pct(il) + '\nFee APR needed over ' + v.days + ' days just to match holding: ' + pct(need) + '\nAt ' + v.fee + '% fee APR you earn ' + pct(earned) + ' → net vs holding ' + (earned - il >= 0 ? '+' : '') + pct(earned - il); } },
  { id: 'loop', t: 'Leveraged loop', d: 'Net yield on equity and the break-even borrow rate. Lesson 3.4.', f: [['lev', 'Leverage (×)', 3], ['capy', 'Collateral APY (%)', 3.5], ['bapy', 'Borrow APY (%)', 2.5]],
    run: v => { const net = v.capy * v.lev - v.bapy * (v.lev - 1), be = v.lev > 1 ? v.capy * v.lev / (v.lev - 1) : Infinity;
      return 'Net APY on equity ' + net.toFixed(2) + '% (unlevered ' + v.capy.toFixed(2) + '%)\nBorrow rate that wipes out the return: ' + be.toFixed(2) + '%' + (net <= v.capy ? '\n<span class="warn">Leverage adds nothing at this spread, only liquidation risk.</span>' : ''); } },
  { id: 'lvr', t: 'Loss-versus-rebalancing', d: 'What arbitrage costs a full-range LP. Lesson 2.7.', f: [['vol', 'Volatility (%/yr)', 80], ['fee', 'Fee APR (%)', 12]],
    run: v => { const r = (v.vol / 100) ** 2 / 8; return 'LVR ≈ ' + pct(r) + ' of pool value per year\nFees minus LVR ≈ ' + (v.fee - r * 100 >= 0 ? '+' : '') + (v.fee - r * 100).toFixed(2) + '%/yr'; } },
  { id: 'pt', t: 'Fixed yield from a principal token (PT)', d: 'Lesson 10.1.', f: [['price', 'PT price (of underlying)', 0.95], ['days', 'Days to maturity', 180]],
    run: v => { const fixed = (1 / v.price) ** (365 / v.days) - 1, simple = (1 / v.price - 1) * 365 / v.days; return 'Fixed APY if held to maturity: ' + pct(fixed) + ' (simple ' + pct(simple) + ')\nYT profits only if realised variable yield beats ≈ ' + pct(fixed) + ' over the period'; } },
  { id: 'expected', t: 'Risk-adjusted yield', d: 'Headline yield minus expected loss and costs. Lesson 13.1.', f: [['y', 'Headline yield (%)', 12], ['p', 'Annual loss probability', 0.05], ['lgd', 'Loss given default (0–1)', 0.6], ['c', 'Costs (%)', 0.5]],
    run: v => { const h = v.p * v.lgd * 100, net = v.y - h - v.c; return 'Headline ' + v.y + '% − expected loss ' + h.toFixed(2) + '% − costs ' + v.c + '% = ' + net.toFixed(2) + '% risk-adjusted'; } },
  { id: 'income', t: 'Income engine payout', d: 'Pay out less than you expect to earn. Module 13.', f: [['cap', 'Capital ($)', 250000], ['ry', 'Risk-adjusted yield (%)', 5], ['payout', 'Payout ratio (0–1)', 0.7]],
    run: v => { const exp = v.cap * v.ry / 100, pay = exp * v.payout; return 'Expected income ' + money(exp) + '/yr\nPay out ' + pct(v.payout, 0) + ' = ' + money(pay) + '/yr (' + money(pay / 12) + '/month)\nRetain ' + money(exp - pay) + ' as a loss buffer' + (v.payout > 0.8 ? '\n<span class="warn">Payout above 80% of expected income leaves little buffer.</span>' : '') + '\nIllustrative only. No income is promised.'; } },
  { id: 'var', t: 'One-day value at risk', d: 'A floor, not a ceiling: crypto tails are fatter. Lesson 11.5.', f: [['pos', 'Position ($)', 100000], ['vol', 'Volatility (%/yr)', 70], ['z', 'Confidence z (1.65 = 95%)', 1.65]],
    run: v => { const d = v.vol / 100 / Math.sqrt(365), x = v.z * d * v.pos; return 'Daily volatility ' + pct(d) + '\n1-day VaR ≈ ' + money(x) + ' on ' + money(v.pos) + ' (' + pct(v.z * d) + ')'; } },
];
function toolsView() {
  $('#crumbs').textContent = 'Calculators';
  return '<h1 style="margin-top:0">Calculators</h1><p style="color:var(--text2)">The same formulas as the program’s <code>defi_calc.py</code>. Every number you act on should be computed, not guessed. Illustrative only; not financial advice.</p>' +
    CALCS.map(c => '<div class="calc" data-c="' + c.id + '"><h3>' + c.t + '</h3><p class="d">' + c.d + '</p><div class="f">' + c.f.map(([k, lab, def]) => '<label>' + lab + '<input type="number" step="any" data-k="' + k + '" value="' + def + '"></label>').join('') + '</div><div class="out"></div></div>').join('');
}
function wireTools() { document.querySelectorAll('.calc').forEach(el => { const c = CALCS.find(x => x.id === el.dataset.c);
  const upd = () => { const v = {}; el.querySelectorAll('input').forEach(i => v[i.dataset.k] = parseFloat(i.value)); el.querySelector('.out').innerHTML = Object.values(v).some(isNaN) ? 'Enter every value.' : c.run(v); };
  el.querySelectorAll('input').forEach(i => i.oninput = upd); upd(); }); }
// ---- router
function route() {
  const h = location.hash.replace(/^#\/?/, ''), [kind, arg] = h.split('/');
  let html, active = null;
  if (kind === 'l') { active = byId[decodeURIComponent(arg)]; html = lessonView(decodeURIComponent(arg)); }
  else if (kind === 'm') html = modView(+arg);
  else if (kind === 'tools') html = toolsView();
  else if (kind === 's') html = searchView(decodeURIComponent(arg || ''));
  else html = home();
  $('#view').innerHTML = html; tree(active);
  document.querySelectorAll('.nav-top a').forEach(a => a.classList.toggle('on', (a.dataset.r === 'tools' && kind === 'tools') || (a.dataset.r === 'home' && !kind)));
  if (kind === 'l') wireLesson(decodeURIComponent(arg)); if (kind === 'tools') wireTools(); wireVideo();
  document.body.classList.remove('nav-open'); if (kind !== 's') window.scrollTo(0, 0);
  const on = document.querySelector('.lessons a.on'); if (on) on.scrollIntoView({ block: 'nearest' });
}
let st; $('#q').oninput = e => { clearTimeout(st); st = setTimeout(() => { location.hash = e.target.value.trim() ? '#/s/' + encodeURIComponent(e.target.value) : '#/'; }, 180); };
addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  const m = location.hash.match(/^#\/l\/(.+)$/); if (!m) return; const i = ALL.findIndex(l => l.id === decodeURIComponent(m[1]));
  if (e.key === 'ArrowRight' && ALL[i + 1]) location.hash = '#/l/' + ALL[i + 1].id;
  if (e.key === 'ArrowLeft' && ALL[i - 1]) location.hash = '#/l/' + ALL[i - 1].id;
});
addEventListener('hashchange', route); route();
</script></body></html>
