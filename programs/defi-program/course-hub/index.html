i>\n\u003cli>Prefer collateral whose \u003cstrong>yield covers the interest\u003c/strong> (strategy #25)\u003c/li>\n\u003cli>Consider \u003cstrong>fixed-rate\u003c/strong> borrowing when a rate spike would force a sale (strategy #22)\u003c/li>\n\u003cli>\u003cstrong>Repayment source\u003c/strong> named before borrowing (income, reserve, maturing PT)\u003c/li>\n\u003cli>Tax treatment of borrowing varies by country: \u003cstrong>check with a tax professional\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>$200,000 of liquid-staked ETH earning 3.2% ($6,400/yr). Borrow \u003cstrong>$40,000\u003c/strong> stablecoins at 5% ($2,000/yr).\u003c/p>\n\u003cul>\n\u003cli>Yield covers interest \u003cstrong>3.2×\u003c/strong>. LTV 20%. HF \u003cstrong>4.0\u003c/strong> at a 0.8 threshold.\u003c/li>\n\u003cli>ETH would have to fall \u003cstrong>~75%\u003c/strong> before liquidation (HF falls in proportion to price).\u003c/li>\n\u003cli>Defence plan: at HF 2.0, repay from reserve; at HF 1.7, sell part of the collateral deliberately rather than let a liquidator do it at a penalty.\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.3:c0\">\u003cspan>Credit policy written: max LTV, HF floor, action levels\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.3:c1\">\u003cspan>Repayment source named\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.3:c2\">\u003cspan>Alerts set at the action levels (Module 14.1)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.3:c3\">\u003cspan>Fixed vs variable decision made on purpose\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"12.3:q0\">\u003cdiv class=\"qtext\">Why borrow against assets instead of selling them?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>You keep the asset and its upside (and in some jurisdictions avoid a taxable sale), at the cost of interest and liquidation risk.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.3:q1\">\u003cdiv class=\"qtext\">HF is 4.0. Roughly how far can collateral fall before liquidation?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>About 75%, since HF scales with collateral price (HF 1.0 at a quarter of the current price).\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.3:q2\">\u003cdiv class=\"qtext\">What should happen at your action level?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Repay or add collateral per the written plan. Sell deliberately before a liquidator does it at a penalty.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Use your assets as collateral for liquidity without selling, under a written credit policy. Explanation Wealthy clients rarely sell appreciating assets to raise cash; they borrow against them. DeFi money markets offer the same: deposit collateral, borrow stablecoins, repay when it suits you, with no credit check. The collateral is liquidated if you breach the threshold , and nobody calls first. A credit policy (write yours): Max LTV 25–30% on volatile collateral (liquidation is often near 80%+) Health factor floor 2.5 ; act at 2.0 Prefer collateral whose yield covers the interest (strategy 25) Consider fixed rate borrowing when a rate spike would force a sale (strategy 22) Repayment source named before borrowing (income, reserve, maturing PT) Tax treatment of borrowing varies by country: check with a tax professional Worked example $200,000 of liquid staked ETH earning 3.2% ($6,400/yr). Borrow $40,000 stablecoins at 5% ($2,000/yr). Yield covers interest 3.2× . LTV 20%. HF 4.0 at a 0.8 threshold. ETH would have to fall ~75% before liquidation (HF falls in proportion to price). Defence plan: at HF 2.0, repay from reserve; at HF 1.7, sell part of the collateral deliberately rather than let a liquidator do it at a penalty. Checklist [ ] Credit policy written: max LTV, HF floor, action levels [ ] Repayment source named [ ] Alerts set at the action levels (Module 14.1) [ ] Fixed vs variable decision made on purpose Quiz 1. Why borrow against assets instead of selling them? You keep the asset and its upside (and in some jurisdictions avoid a taxable sale), at the cost of interest and liquidation risk. 2. HF is 4.0. Roughly how far can collateral fall before liquidation? About 75%, since HF scales with collateral price (HF 1.0 at a quarter of the current price). 3. What should happen at your action level? Repay or add collateral per the written plan. Sell deliberately before a liquidator does it at a penalty.","video":null,"script":"video-scripts/lessons/lesson-12-3.json"},{"id":"12.4","title":"Treasury and the liquidity ladder","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Structure reserves so money is available when it&#39;s needed, earning a return at every tier.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Banks match the timing of assets to the timing of what they owe. Your ladder:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tier\u003c/th>\n\u003cth>Access\u003c/th>\n\u003cth>Holds\u003c/th>\n\u003cth>Size (example: $5,000/month spend)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>T0 Instant\u003c/strong>\u003c/td>\n\u003ctd>Seconds\u003c/td>\n\u003ctd>Stablecoins in the operating wallet\u003c/td>\n\u003ctd>1 month: $5,000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>T1 Same day\u003c/strong>\u003c/td>\n\u003ctd>Hours\u003c/td>\n\u003ctd>Blue-chip stablecoin lending, split across 2 protocols\u003c/td>\n\u003ctd>5 months: $25,000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>T2 Term\u003c/strong>\u003c/td>\n\u003ctd>Scheduled\u003c/td>\n\u003ctd>PTs maturing on dates you&#39;ll need the money (Lesson 10.1)\u003c/td>\n\u003ctd>Next 6–12 months of planned spending\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>T3 Growth\u003c/strong>\u003c/td>\n\u003ctd>Days–weeks\u003c/td>\n\u003ctd>Strategy positions, LPs, staking\u003c/td>\n\u003ctd>The rest, within caps\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"The liquidity ladder\" src=\"../assets/diagrams/liquidity-ladder.png\">\u003cfigcaption>The liquidity ladder\u003c/figcaption>\u003c/figure>\n\u003cp>Refill downward on a schedule: T1 tops up T0 monthly; maturing PTs top up T1.\nNever fund a T0 need by selling a T3 position in a bad market. That&#39;s what the\nladder exists to prevent.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>T0 $5,000 + T1 $25,000 = \u003cstrong>6 months\u003c/strong> instantly available. T2 holds three PTs\nmaturing in 3, 6 and 9 months, each sized for 3 months of spending. A −50%\nmarket day touches none of it.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.4:c0\">\u003cspan>T0 + T1 ≥ 6 months of obligations\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.4:c1\">\u003cspan>T2 maturities matched to planned spending\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.4:c2\">\u003cspan>Monthly refill schedule set\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.4:c3\">\u003cspan>T3 never used for day-to-day needs\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"12.4:q0\">\u003cdiv class=\"qtext\">Why hold T0 in plain stablecoins earning little?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Instant, certain access. It&#39;s the tier that pays today&#39;s bills without selling anything.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.4:q1\">\u003cdiv class=\"qtext\">What&#39;s T2 for?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Known future spending, with maturities matched to when the money is needed and a fixed return locked in.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.4:q2\">\u003cdiv class=\"qtext\">What does the ladder prevent?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Forced selling of growth positions at bad prices to meet short-term needs.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Structure reserves so money is available when it's needed, earning a return at every tier. Explanation Banks match the timing of assets to the timing of what they owe. Your ladder: Tier Access Holds Size (example: $5,000/month spend) T0 Instant Seconds Stablecoins in the operating wallet 1 month: $5,000 T1 Same day Hours Blue chip stablecoin lending, split across 2 protocols 5 months: $25,000 T2 Term Scheduled PTs maturing on dates you'll need the money (Lesson 10.1) Next 6–12 months of planned spending T3 Growth Days–weeks Strategy positions, LPs, staking The rest, within caps Refill downward on a schedule: T1 tops up T0 monthly; maturing PTs top up T1. Never fund a T0 need by selling a T3 position in a bad market. That's what the ladder exists to prevent. Worked example T0 $5,000 + T1 $25,000 = 6 months instantly available. T2 holds three PTs maturing in 3, 6 and 9 months, each sized for 3 months of spending. A −50% market day touches none of it. Checklist [ ] T0 + T1 ≥ 6 months of obligations [ ] T2 maturities matched to planned spending [ ] Monthly refill schedule set [ ] T3 never used for day to day needs Quiz 1. Why hold T0 in plain stablecoins earning little? Instant, certain access. It's the tier that pays today's bills without selling anything. 2. What's T2 for? Known future spending, with maturities matched to when the money is needed and a fixed return locked in. 3. What does the ladder prevent? Forced selling of growth positions at bad prices to meet short term needs.","video":null,"script":"video-scripts/lessons/lesson-12-4.json"},{"id":"12.5","title":"Being the lender: supplying, curating and pricing credit risk","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Act as the lending side of the bank: choose markets, price the risk, and know when to pull liquidity.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>When you supply to a money market, you&#39;re the bank&#39;s depositor, and\neffectively its credit desk. Your return:\n\u003ccode>supply APY ≈ borrow APY × utilisation × (1 − reserve factor)\u003c/code>.\u003c/p>\n\u003cp>Modern designs split lending into \u003cstrong>isolated markets\u003c/strong> (one collateral, one\nloan asset, one oracle, one liquidation LTV). \u003cstrong>Curated vaults\u003c/strong> spread\ndeposits across several of these; the curator decides the allocation.\u003c/p>\n\u003cp>What a lender must check:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Collateral quality and liquidation LTV:\u003c/strong> the higher the LTV, the thinner the buffer before bad debt\u003c/li>\n\u003cli>\u003cstrong>Oracle:\u003c/strong> what prices the collateral, and can it be manipulated? (Module 5.3)\u003c/li>\n\u003cli>\u003cstrong>Utilisation:\u003c/strong> near 100% means you may not be able to withdraw\u003c/li>\n\u003cli>\u003cstrong>Curator:\u003c/strong> track record, how allocations are changed, timelocks\u003c/li>\n\u003cli>\u003cstrong>Risk-adjusted return\u003c/strong>, not headline\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Vault A: 7% headline, exposure to newer collateral; you assume a 2%/yr chance of a loss event losing half the deposit → \u003cstrong>6.0%\u003c/strong> risk-adjusted.\nVault B: 4.5% headline, blue-chip collateral; 0.5%/yr, total loss assumed → \u003cstrong>4.0%\u003c/strong>.\n\u003ccode>defi_calc.py expected --yield-apy 7 --loss-prob 0.02 --lgd 0.5\u003c/code>\u003c/p>\n\u003cp>A pays more after the haircut, \u003cem>if\u003c/em> your loss estimates are honest. Split\nbetween them, and cap A lower because its tail is fatter and less known.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.5:c0\">\u003cspan>Every market&#39;s collateral, oracle and LTV listed\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.5:c1\">\u003cspan>Loss probability and loss-given-default written down (your assumptions)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.5:c2\">\u003cspan>Utilisation alert (e.g. &gt; 90%)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.5:c3\">\u003cspan>Per-vault and per-curator caps\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"12.5:q0\">\u003cdiv class=\"qtext\">Borrow APY 10%, utilisation 70%, reserve factor 10%. Supply APY?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>6.3%.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.5:q1\">\u003cdiv class=\"qtext\">Why is utilisation at 100% a lender&#39;s problem?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>All liquidity is lent out, so withdrawals wait until borrowers repay or new deposits arrive.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.5:q2\">\u003cdiv class=\"qtext\">What&#39;s a curated vault&#39;s extra risk?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The curator&#39;s allocation decisions and permissions, on top of each market&#39;s risk.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Act as the lending side of the bank: choose markets, price the risk, and know when to pull liquidity. Explanation When you supply to a money market, you're the bank's depositor, and effectively its credit desk. Your return: supply APY ≈ borrow APY × utilisation × (1 − reserve factor) . Modern designs split lending into isolated markets (one collateral, one loan asset, one oracle, one liquidation LTV). Curated vaults spread deposits across several of these; the curator decides the allocation. What a lender must check: Collateral quality and liquidation LTV: the higher the LTV, the thinner the buffer before bad debt Oracle: what prices the collateral, and can it be manipulated? (Module 5.3) Utilisation: near 100% means you may not be able to withdraw Curator: track record, how allocations are changed, timelocks Risk adjusted return , not headline Worked example Vault A: 7% headline, exposure to newer collateral; you assume a 2%/yr chance of a loss event losing half the deposit → 6.0% risk adjusted. Vault B: 4.5% headline, blue chip collateral; 0.5%/yr, total loss assumed → 4.0% . defi calc.py expected yield apy 7 loss prob 0.02 lgd 0.5 A pays more after the haircut, if your loss estimates are honest. Split between them, and cap A lower because its tail is fatter and less known. Checklist [ ] Every market's collateral, oracle and LTV listed [ ] Loss probability and loss given default written down (your assumptions) [ ] Utilisation alert (e.g. 90%) [ ] Per vault and per curator caps Quiz 1. Borrow APY 10%, utilisation 70%, reserve factor 10%. Supply APY? 6.3%. 2. Why is utilisation at 100% a lender's problem? All liquidity is lent out, so withdrawals wait until borrowers repay or new deposits arrive. 3. What's a curated vault's extra risk? The curator's allocation decisions and permissions, on top of each market's risk.","video":null,"script":"video-scripts/lessons/lesson-12-5.json"},{"id":"12.6","title":"Books, records and succession","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Keep books a stranger could follow, and make sure your family could recover everything if you couldn&#39;t.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>\u003cstrong>Books\u003c/strong> (update weekly from your journal, Module 8):\u003c/p>\n\u003cul>\n\u003cli>Every position: protocol, chain, contract, amount, entry date and price, cost basis\u003c/li>\n\u003cli>Every loan: collateral, debt, rate, HF, action levels\u003c/li>\n\u003cli>Every approval granted, and when it was revoked\u003c/li>\n\u003cli>Income received, by source and date\u003c/li>\n\u003cli>Keep exportable records for tax. Rules differ by country, so \u003cstrong>use a crypto-aware tax professional.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Succession:\u003c/strong> self-custody means that if you&#39;re gone and nobody can sign,\nthe money is gone too.\u003c/p>\n\u003cul>\n\u003cli>A \u003cstrong>letter of instruction\u003c/strong> that explains the setup (wallets, multisig, where\nthe documents are, who to contact), \u003cstrong>stored separately from any seed or key\u003c/strong>\u003c/li>\n\u003cli>Multisig with a trusted co-signer or professional service, so recovery doesn&#39;t depend on one person\u003c/li>\n\u003cli>Legal documents (will, powers of attorney) that reference the digital assets: \u003cstrong>use a lawyer\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Annual drill:\u003c/strong> walk a trusted person through the letter without revealing secrets\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A 2-of-3 vault: you hold two keys (home + safe-deposit box); a professional\nco-signer holds the third under an agreed recovery process. Your letter of\ninstruction, stored with your will, explains how your executor works with\nthe co-signer. No single document contains enough to steal the funds.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.6:c0\">\u003cspan>Books current within a week\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.6:c1\">\u003cspan>Tax records exportable; professional engaged\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.6:c2\">\u003cspan>Letter of instruction written and stored apart from keys\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.6:c3\">\u003cspan>Annual succession drill done\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"12.6:q0\">\u003cdiv class=\"qtext\">Why keep the letter of instruction apart from seeds and keys?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>So finding the letter isn&#39;t enough to steal the funds.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.6:q1\">\u003cdiv class=\"qtext\">What&#39;s the risk of single-key self-custody for your family?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>If you can&#39;t sign and no one else can, the assets are unrecoverable.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.6:q2\">\u003cdiv class=\"qtext\">What goes in the books for each loan?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Collateral, debt, rate, health factor and your action levels.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Keep books a stranger could follow, and make sure your family could recover everything if you couldn't. Explanation Books (update weekly from your journal, Module 8): Every position: protocol, chain, contract, amount, entry date and price, cost basis Every loan: collateral, debt, rate, HF, action levels Every approval granted, and when it was revoked Income received, by source and date Keep exportable records for tax. Rules differ by country, so use a crypto aware tax professional. Succession: self custody means that if you're gone and nobody can sign, the money is gone too. A letter of instruction that explains the setup (wallets, multisig, where the documents are, who to contact), stored separately from any seed or key Multisig with a trusted co signer or professional service, so recovery doesn't depend on one person Legal documents (will, powers of attorney) that reference the digital assets: use a lawyer Annual drill: walk a trusted person through the letter without revealing secrets Worked example A 2 of 3 vault: you hold two keys (home + safe deposit box); a professional co signer holds the third under an agreed recovery process. Your letter of instruction, stored with your will, explains how your executor works with the co signer. No single document contains enough to steal the funds. Checklist [ ] Books current within a week [ ] Tax records exportable; professional engaged [ ] Letter of instruction written and stored apart from keys [ ] Annual succession drill done Quiz 1. Why keep the letter of instruction apart from seeds and keys? So finding the letter isn't enough to steal the funds. 2. What's the risk of single key self custody for your family? If you can't sign and no one else can, the assets are unrecoverable. 3. What goes in the books for each loan? Collateral, debt, rate, health factor and your action levels.","video":null,"script":"video-scripts/lessons/lesson-12-6.json"},{"id":"12.7","title":"Tax, regulation and compliance awareness","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Know which on-chain actions may have tax or legal consequences, keep the records to handle them, and know when to get professional help.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>\u003cstrong>This lesson is awareness, not advice. Rules differ by country and change. Use a crypto-aware tax professional and, for legal questions, a lawyer.\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Events that may be taxable\u003c/strong> in many countries: selling crypto for cash, swapping one token for another, spending crypto, and receiving income (interest, staking rewards, LP fees, airdrops). Some treat borrowing, wrapping, LP deposits or bridging differently. Ask.\u003c/li>\n\u003cli>\u003cstrong>Cost basis:\u003c/strong> what you paid, including fees. Methods (e.g. FIFO, specific identification) depend on local rules.\u003c/li>\n\u003cli>\u003cstrong>Records:\u003c/strong> every buy, sell, swap, transfer, fee and income event, with dates, amounts and prices (W1 records sheet). On-chain data can be exported, but self-transfers must be labelled or they may look like disposals.\u003c/li>\n\u003cli>\u003cstrong>Regulation:\u003c/strong> use services legally available where you live; don&#39;t use tools to get around geo-restrictions; never interact with sanctioned addresses or services; exchanges must run KYC/AML checks, and some DeFi front ends block certain regions.\u003c/li>\n\u003cli>\u003cstrong>Reporting:\u003c/strong> some countries require reporting of foreign accounts or digital assets. Ask your professional.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>In one year: bought ETH, swapped half to USDC, lent USDC for interest, received an\nairdrop, bridged to an L2 and moved funds between your own wallets. For your tax\nprofessional, you&#39;d prepare: the records sheet, labelled self-transfers (not\ndisposals), interest and airdrop income with dates and values, and exchange\nstatements. \u003cstrong>They\u003c/strong> tell you what&#39;s taxable where you live.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.7:c0\">\u003cspan>Records sheet complete, with self-transfers labelled\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.7:c1\">\u003cspan>Crypto-aware tax professional engaged\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.7:c2\">\u003cspan>Only legally available services used; no geo-restriction workarounds\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.7:c3\">\u003cspan>Sanctions awareness: never interact with sanctioned addresses or services\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"12.7:q0\">\u003cdiv class=\"qtext\">Name three events that are often taxable.\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Any three: selling for cash, swapping tokens, spending crypto, receiving interest, staking rewards, LP fees or airdrops.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.7:q1\">\u003cdiv class=\"qtext\">Why label self-transfers?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>So moves between your own wallets aren&#39;t mistaken for disposals.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.7:q2\">\u003cdiv class=\"qtext\">Who decides what&#39;s taxable for you?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Your local rules, applied by a qualified tax professional.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Know which on chain actions may have tax or legal consequences, keep the records to handle them, and know when to get professional help. Explanation This lesson is awareness, not advice. Rules differ by country and change. Use a crypto aware tax professional and, for legal questions, a lawyer. Events that may be taxable in many countries: selling crypto for cash, swapping one token for another, spending crypto, and receiving income (interest, staking rewards, LP fees, airdrops). Some treat borrowing, wrapping, LP deposits or bridging differently. Ask. Cost basis: what you paid, including fees. Methods (e.g. FIFO, specific identification) depend on local rules. Records: every buy, sell, swap, transfer, fee and income event, with dates, amounts and prices (W1 records sheet). On chain data can be exported, but self transfers must be labelled or they may look like disposals. Regulation: use services legally available where you live; don't use tools to get around geo restrictions; never interact with sanctioned addresses or services; exchanges must run KYC/AML checks, and some DeFi front ends block certain regions. Reporting: some countries require reporting of foreign accounts or digital assets. Ask your professional. Worked example In one year: bought ETH, swapped half to USDC, lent USDC for interest, received an airdrop, bridged to an L2 and moved funds between your own wallets. For your tax professional, you'd prepare: the records sheet, labelled self transfers (not disposals), interest and airdrop income with dates and values, and exchange statements. They tell you what's taxable where you live. Checklist [ ] Records sheet complete, with self transfers labelled [ ] Crypto aware tax professional engaged [ ] Only legally available services used; no geo restriction workarounds [ ] Sanctions awareness: never interact with sanctioned addresses or services Quiz 1. Name three events that are often taxable. Any three: selling for cash, swapping tokens, spending crypto, receiving interest, staking rewards, LP fees or airdrops. 2. Why label self transfers? So moves between your own wallets aren't mistaken for disposals. 3. Who decides what's taxable for you? Your local rules, applied by a qualified tax professional.","video":null,"script":"video-scripts/lessons/lesson-12-7.json"},{"id":"12.8","title":"Institutional-grade custody: MPC, custodians and policy engines","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Know the custody options institutions use, and when they make sense for a large personal or family book.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Multisig\u003c/strong> (12.2): several keys, rules enforced \u003cstrong>on-chain\u003c/strong>, transparent and verifiable.\u003c/li>\n\u003cli>\u003cstrong>MPC (multi-party computation):\u003c/strong> one key is split into shares held by different devices or parties; signatures are created together without ever assembling the key. The rules are enforced \u003cstrong>off-chain\u003c/strong> by the provider&#39;s software. It works on any chain, but you depend on the vendor and can&#39;t verify the policy on-chain.\u003c/li>\n\u003cli>\u003cstrong>Qualified custodians:\u003c/strong> regulated firms that hold assets for clients. Strong legal protections in some jurisdictions; you give up self-custody and on-chain flexibility.\u003c/li>\n\u003cli>\u003cstrong>Policy engines:\u003c/strong> approval workflows (who can approve what, above which amount), allowlists, time windows and velocity limits, available in both institutional MPC platforms and smart-account setups.\u003c/li>\n\u003cli>\u003cstrong>Hybrid:\u003c/strong> many large holders use a custodian or MPC for long-term reserves and multisig/smart accounts for active DeFi.\u003c/li>\n\u003c/ul>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"Custody architecture\" src=\"../assets/diagrams/custody-architecture.png\">\u003cfigcaption>Custody architecture\u003c/figcaption>\u003c/figure>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A $5M family book: cold reserves ($3M) with a qualified custodian (legal title,\ninsurance terms read); active DeFi ($1.5M) in a 2-of-3 multisig with a policy of\ntwo approvers above $50,000 and an allowlist; hot float ($20,000) in a limited smart\naccount. The succession plan (12.6) covers all three.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.8:c0\">\u003cspan>Custody option chosen per tier, with reasons\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.8:c1\">\u003cspan>Vendor/custodian terms, insurance and recovery read\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.8:c2\">\u003cspan>Policy engine rules written: approvers, thresholds, allowlists\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"12.8:q0\">\u003cdiv class=\"qtext\">MPC vs multisig: where are the rules enforced?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>MPC: off-chain by the provider&#39;s software. Multisig: on-chain by the contract.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.8:q1\">\u003cdiv class=\"qtext\">What do you give up with a qualified custodian?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Self-custody and on-chain flexibility.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.8:q2\">\u003cdiv class=\"qtext\">What is a policy engine?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Rules for approvals, thresholds, allowlists and limits on transactions.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Know the custody options institutions use, and when they make sense for a large personal or family book. Explanation Multisig (12.2): several keys, rules enforced on chain , transparent and verifiable. MPC (multi party computation): one key is split into shares held by different devices or parties; signatures are created together without ever assembling the key. The rules are enforced off chain by the provider's software. It works on any chain, but you depend on the vendor and can't verify the policy on chain. Qualified custodians: regulated firms that hold assets for clients. Strong legal protections in some jurisdictions; you give up self custody and on chain flexibility. Policy engines: approval workflows (who can approve what, above which amount), allowlists, time windows and velocity limits, available in both institutional MPC platforms and smart account setups. Hybrid: many large holders use a custodian or MPC for long term reserves and multisig/smart accounts for active DeFi. Worked example A $5M family book: cold reserves ($3M) with a qualified custodian (legal title, insurance terms read); active DeFi ($1.5M) in a 2 of 3 multisig with a policy of two approvers above $50,000 and an allowlist; hot float ($20,000) in a limited smart account. The succession plan (12.6) covers all three. Checklist [ ] Custody option chosen per tier, with reasons [ ] Vendor/custodian terms, insurance and recovery read [ ] Policy engine rules written: approvers, thresholds, allowlists Quiz 1. MPC vs multisig: where are the rules enforced? MPC: off chain by the provider's software. Multisig: on chain by the contract. 2. What do you give up with a qualified custodian? Self custody and on chain flexibility. 3. What is a policy engine? Rules for approvals, thresholds, allowlists and limits on transactions.","video":null,"script":"video-scripts/lessons/lesson-12-8.json"}]},{"n":13,"title":"The Income Engine","outcome":"design an income portfolio, measure expected income after expected losses, and set a payout you can sustain.","icon":"coins","banner":"../assets/modules/module-13.png","intro":{"src":"../video/module-13-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"13.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>Income from DeFi should be planned like a pension, not chased like a jackpot: build it from durable sources, subtract the losses you should expect, and pay yourself less than that.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Durability\u003c/td>\n\u003ctd>how long and reliably a source tends to pay\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Risk-adjusted yield\u003c/td>\n\u003ctd>yield minus expected losses\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LGD\u003c/td>\n\u003ctd>how much you lose if a loss event happens\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Payout ratio\u003c/td>\n\u003ctd>share of expected income you take out\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Principal\u003c/td>\n\u003ctd>the capital itself, never spent as income\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.0:c0\">\u003cspan>Modules 0–12\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>Take one position and compute its risk-adjusted yield with \u003ccode>defi_calc.py expected\u003c/code>.\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Ranks income sources by durability\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Builds an income portfolio with risk-adjusted expected income\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Runs a payout policy that survives bad years, with annual reviews and scaling rules\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…your payout is set below risk-adjusted expected income and never draws on principal.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version Income from DeFi should be planned like a pension, not chased like a jackpot: build it from durable sources, subtract the losses you should expect, and pay yourself less than that. Words you'll need Term Meaning Durability how long and reliably a source tends to pay Risk adjusted yield yield minus expected losses LGD how much you lose if a loss event happens Payout ratio share of expected income you take out Principal the capital itself, never spent as income Before you start [ ] Modules 0–12 Your first safe step Take one position and compute its risk adjusted yield with defi calc.py expected . The mastery ladder Level You can… Beginner Ranks income sources by durability Practitioner Builds an income portfolio with risk adjusted expected income Master Runs a payout policy that survives bad years, with annual reviews and scaling rules You've mastered this module when… …your payout is set below risk adjusted expected income and never draws on principal.","video":null,"script":"video-scripts/lessons/lesson-13-0.json"},{"id":"13.1","title":"Income sources ranked by durability","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Rank income sources by how long and how reliably they&#39;re likely to pay, not by their headline rate.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Source\u003c/th>\n\u003cth>Typical driver\u003c/th>\n\u003cth>Durability\u003c/th>\n\u003cth>Variability\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Blue-chip stablecoin lending\u003c/td>\n\u003ctd>Borrower demand\u003c/td>\n\u003ctd>High\u003c/td>\n\u003ctd>Medium: moves with demand\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Staking / LSTs\u003c/td>\n\u003ctd>Network security rewards\u003c/td>\n\u003ctd>High\u003c/td>\n\u003ctd>Low–medium\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fixed-rate PTs to maturity\u003c/td>\n\u003ctd>Locked at purchase\u003c/td>\n\u003ctd>Fixed for the term\u003c/td>\n\u003ctd>None until maturity\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Curated lending vaults\u003c/td>\n\u003ctd>Borrower demand in isolated markets\u003c/td>\n\u003ctd>Medium\u003c/td>\n\u003ctd>Medium\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LP fees (major pairs)\u003c/td>\n\u003ctd>Trading volume\u003c/td>\n\u003ctd>Medium\u003c/td>\n\u003ctd>High\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Funding / basis carry\u003c/td>\n\u003ctd>Market positioning\u003c/td>\n\u003ctd>Low–medium\u003c/td>\n\u003ctd>High: can turn negative\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Options premium\u003c/td>\n\u003ctd>Volatility\u003c/td>\n\u003ctd>Medium\u003c/td>\n\u003ctd>High\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Incentives / points\u003c/td>\n\u003ctd>Protocol budgets\u003c/td>\n\u003ctd>Low\u003c/td>\n\u003ctd>Very high\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>A durable income engine is built mostly from the top of this table. The\nbottom rows are \u003cstrong>boosters\u003c/strong> you size small and expect to switch off.\u003c/p>\n\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.1:c0\">\u003cspan>Every income position tagged with its source and durability\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.1:c1\">\u003cspan>Core income from high-durability sources\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"13.1:q0\">\u003cdiv class=\"qtext\">Why is funding carry low durability?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It depends on market positioning and can turn negative for long periods.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"13.1:q1\">\u003cdiv class=\"qtext\">Which source gives a known rate for a set term?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Fixed-rate PTs held to maturity.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"13.1:q2\">\u003cdiv class=\"qtext\">How should incentive income be treated?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>As a temporary booster, sold on a schedule and not relied on.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Rank income sources by how long and how reliably they're likely to pay, not by their headline rate. Explanation Source Typical driver Durability Variability Blue chip stablecoin lending Borrower demand High Medium: moves with demand Staking / LSTs Network security rewards High Low–medium Fixed rate PTs to maturity Locked at purchase Fixed for the term None until maturity Curated lending vaults Borrower demand in isolated markets Medium Medium LP fees (major pairs) Trading volume Medium High Funding / basis carry Market positioning Low–medium High: can turn negative Options premium Volatility Medium High Incentives / points Protocol budgets Low Very high A durable income engine is built mostly from the top of this table. The bottom rows are boosters you size small and expect to switch off. Checklist [ ] Every income position tagged with its source and durability [ ] Core income from high durability sources Quiz 1. Why is funding carry low durability? It depends on market positioning and can turn negative for long periods. 2. Which source gives a known rate for a set term? Fixed rate PTs held to maturity. 3. How should incentive income be treated? As a temporary booster, sold on a schedule and not relied on.","video":null,"script":"video-scripts/lessons/lesson-13-1.json"},{"id":"13.2","title":"Risk-adjusted yield: subtracting expected losses","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Convert every headline yield into an expected yield after the losses it statistically carries.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>\u003ccode>risk-adjusted yield = headline − (annual loss probability × loss given default) − costs\u003c/code>\u003c/p>\n\u003cp>You don&#39;t know the true loss probability, so \u003cstrong>write down an assumption and\nbe conservative.\u003c/strong> Newer protocols, more dependencies and higher leverage\ndeserve higher numbers. The point isn&#39;t precision; it&#39;s making you compare\npositions on the same footing.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Position\u003c/th>\n\u003cth>Headline\u003c/th>\n\u003cth>Assumed loss prob.\u003c/th>\n\u003cth>LGD\u003c/th>\n\u003cth>Risk-adjusted\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>New protocol vault\u003c/td>\n\u003ctd>9.0%\u003c/td>\n\u003ctd>3%/yr\u003c/td>\n\u003ctd>100%\u003c/td>\n\u003ctd>\u003cstrong>6.0%\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Blue-chip lending\u003c/td>\n\u003ctd>4.5%\u003c/td>\n\u003ctd>0.5%/yr\u003c/td>\n\u003ctd>100%\u003c/td>\n\u003ctd>\u003cstrong>4.0%\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003ccode>defi_calc.py expected --yield-apy 9 --loss-prob 0.03\u003c/code>\u003c/p>\n\u003cp>The 9% vault still wins on expectation, but by 2 points, not 4.5. Its bad\noutcome is also far worse, so size it smaller (Lesson 13.3).\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.2:c0\">\u003cspan>Loss probability and LGD written for every position\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.2:c1\">\u003cspan>Decisions made on risk-adjusted, not headline\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"13.2:q0\">\u003cdiv class=\"qtext\">12% headline, 5%/yr loss probability, 60% LGD. Risk-adjusted?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>12 − 3 = 9%.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"13.2:q1\">\u003cdiv class=\"qtext\">Why assume conservatively?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Losses cluster in stress, when many positions fail together; optimistic assumptions overstate income.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"13.2:q2\">\u003cdiv class=\"qtext\">Two positions, same risk-adjusted yield. Which gets more capital?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The one with the smaller and better-understood worst case.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Convert every headline yield into an expected yield after the losses it statistically carries. Explanation risk adjusted yield = headline − (annual loss probability × loss given default) − costs You don't know the true loss probability, so write down an assumption and be conservative. Newer protocols, more dependencies and higher leverage deserve higher numbers. The point isn't precision; it's making you compare positions on the same footing. Worked example Position Headline Assumed loss prob. LGD Risk adjusted New protocol vault 9.0% 3%/yr 100% 6.0% Blue chip lending 4.5% 0.5%/yr 100% 4.0% defi calc.py expected yield apy 9 loss prob 0.03 The 9% vault still wins on expectation, but by 2 points, not 4.5. Its bad outcome is also far worse, so size it smaller (Lesson 13.3). Checklist [ ] Loss probability and LGD written for every position [ ] Decisions made on risk adjusted, not headline Quiz 1. 12% headline, 5%/yr loss probability, 60% LGD. Risk adjusted? 12 − 3 = 9%. 2. Why assume conservatively? Losses cluster in stress, when many positions fail together; optimistic assumptions overstate income. 3. Two positions, same risk adjusted yield. Which gets more capital? The one with the smaller and better understood worst case.","video":null,"script":"video-scripts/lessons/lesson-13-2.json"},{"id":"13.3","title":"Building the income portfolio","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Assemble an income portfolio and calculate its blended risk-adjusted yield and expected income.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Build in layers: \u003cstrong>core\u003c/strong> (high-durability, 60–80%), \u003cstrong>term\u003c/strong> (fixed PTs matched\nto the liquidity ladder), \u003cstrong>boosters\u003c/strong> (carry, options, LP; small). Apply\nModule 8&#39;s caps: per protocol, per chain, per stablecoin issuer.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>\u003ccode>defi_calc.py income --pos &quot;Stable lending A:100000:5:0.005:1&quot; --pos &quot;Stable lending B:100000:4.5:0.005:1&quot; --pos &quot;LST staking:150000:3.2:0.01:0.5&quot; --pos &quot;PT fixed stable:100000:8:0.02:0.5&quot; --pos &quot;Funding carry:50000:9:0.05:0.3&quot;\u003c/code>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Position\u003c/th>\n\u003cth>Amount\u003c/th>\n\u003cth>Yield\u003c/th>\n\u003cth>Expected loss\u003c/th>\n\u003cth>Net\u003c/th>\n\u003cth>Income/yr\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Stable lending A\u003c/td>\n\u003ctd>100,000\u003c/td>\n\u003ctd>5.0%\u003c/td>\n\u003ctd>0.5%\u003c/td>\n\u003ctd>4.5%\u003c/td>\n\u003ctd>4,500\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stable lending B\u003c/td>\n\u003ctd>100,000\u003c/td>\n\u003ctd>4.5%\u003c/td>\n\u003ctd>0.5%\u003c/td>\n\u003ctd>4.0%\u003c/td>\n\u003ctd>4,000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LST staking\u003c/td>\n\u003ctd>150,000\u003c/td>\n\u003ctd>3.2%\u003c/td>\n\u003ctd>0.5%\u003c/td>\n\u003ctd>2.7%\u003c/td>\n\u003ctd>4,050\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PT fixed stable\u003c/td>\n\u003ctd>100,000\u003c/td>\n\u003ctd>8.0%\u003c/td>\n\u003ctd>1.0%\u003c/td>\n\u003ctd>7.0%\u003c/td>\n\u003ctd>7,000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Funding carry\u003c/td>\n\u003ctd>50,000\u003c/td>\n\u003ctd>9.0%\u003c/td>\n\u003ctd>1.5%\u003c/td>\n\u003ctd>7.5%\u003c/td>\n\u003ctd>3,750\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Total\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>500,000\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>4.66%\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>23,300\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"From headline yield to sustainable payout\" src=\"../assets/charts/income-waterfall.png\">\u003cfigcaption>From headline yield to sustainable payout\u003c/figcaption>\u003c/figure>\n\u003cp>Note: the LST line is priced in ETH, so its dollar value, and therefore the\ndollar income, moves with ETH. The rest is stablecoin-denominated.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.3:c0\">\u003cspan>Core ≥ 60% from high-durability sources\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.3:c1\">\u003cspan>Caps respected per protocol, chain and issuer\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.3:c2\">\u003cspan>Blended risk-adjusted yield calculated\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"13.3:q0\">\u003cdiv class=\"qtext\">Which line contributes the most expected income, and why?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>PT fixed stable ($7,000): a high locked rate on a sizeable allocation, even after the haircut.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"13.3:q1\">\u003cdiv class=\"qtext\">Why is the carry line only $50,000?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It&#39;s a low-durability booster with a higher assumed loss rate.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"13.3:q2\">\u003cdiv class=\"qtext\">What makes the LST income variable in dollars?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It&#39;s denominated in ETH, so the dollar value moves with the ETH price.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Assemble an income portfolio and calculate its blended risk adjusted yield and expected income. Explanation Build in layers: core (high durability, 60–80%), term (fixed PTs matched to the liquidity ladder), boosters (carry, options, LP; small). Apply Module 8's caps: per protocol, per chain, per stablecoin issuer. Worked example — $500,000 income portfolio defi calc.py income pos \"Stable lending A:100000:5:0.005:1\" pos \"Stable lending B:100000:4.5:0.005:1\" pos \"LST staking:150000:3.2:0.01:0.5\" pos \"PT fixed stable:100000:8:0.02:0.5\" pos \"Funding carry:50000:9:0.05:0.3\" Position Amount Yield Expected loss Net Income/yr Stable lending A 100,000 5.0% 0.5% 4.5% 4,500 Stable lending B 100,000 4.5% 0.5% 4.0% 4,000 LST staking 150,000 3.2% 0.5% 2.7% 4,050 PT fixed stable 100,000 8.0% 1.0% 7.0% 7,000 Funding carry 50,000 9.0% 1.5% 7.5% 3,750 Total 500,000 4.66% 23,300 Note: the LST line is priced in ETH, so its dollar value, and therefore the dollar income, moves with ETH. The rest is stablecoin denominated. Checklist [ ] Core ≥ 60% from high durability sources [ ] Caps respected per protocol, chain and issuer [ ] Blended risk adjusted yield calculated Quiz 1. Which line contributes the most expected income, and why? PT fixed stable ($7,000): a high locked rate on a sizeable allocation, even after the haircut. 2. Why is the carry line only $50,000? It's a low durability booster with a higher assumed loss rate. 3. What makes the LST income variable in dollars? It's denominated in ETH, so the dollar value moves with the ETH price.","video":null,"script":"video-scripts/lessons/lesson-13-3.json"},{"id":"13.4","title":"The payout policy: how much you can take out","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Set a payout you can sustain through bad years, and the rules that change it.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Pay out a share of \u003cem>expected\u003c/em> income, not headline\u003c/strong> (e.g. 70%).\u003c/li>\n\u003cli>\u003cstrong>Retain the rest\u003c/strong> as a loss buffer; it absorbs the losses you assumed in 13.2.\u003c/li>\n\u003cli>\u003cstrong>Pay from the T0/T1 ladder\u003c/strong> (Module 12.4), refilled by income, so payouts never depend on selling anything that day.\u003c/li>\n\u003cli>\u003cstrong>Never pay from principal.\u003c/strong> If income falls short, the payout falls.\u003c/li>\n\u003cli>\u003cstrong>Review quarterly:\u003c/strong> if realised income is below expected for two quarters, cut the payout to 70% of the new realised level.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Expected income \u003cstrong>$23,300/yr\u003c/strong> × 70% = \u003cstrong>$16,310/yr\u003c/strong> paid out (\u003cstrong>$1,359/month\u003c/strong>).\n\u003cstrong>$6,990/yr\u003c/strong> retained. If a position fails as assumed, the buffer absorbs it\nand the payout continues.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.4:c0\">\u003cspan>Payout ratio written (≤ 70–80% of expected income)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.4:c1\">\u003cspan>Paid from the ladder, not from positions\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.4:c2\">\u003cspan>Quarterly review rule written\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.4:c3\">\u003cspan>&quot;Never from principal&quot; rule written\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"13.4:q0\">\u003cdiv class=\"qtext\">Expected income $40,000. Payout at 70%?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>$28,000/yr (~$2,333/month).\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"13.4:q1\">\u003cdiv class=\"qtext\">What&#39;s the retained 30% for?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Absorbing expected losses and bad years without cutting into principal.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"13.4:q2\">\u003cdiv class=\"qtext\">Realised income lags expected for two quarters. What happens?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Cut the payout to the policy share of the new realised level.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Set a payout you can sustain through bad years, and the rules that change it. Explanation Pay out a share of expected income, not headline (e.g. 70%). Retain the rest as a loss buffer; it absorbs the losses you assumed in 13.2. Pay from the T0/T1 ladder (Module 12.4), refilled by income, so payouts never depend on selling anything that day. Never pay from principal. If income falls short, the payout falls. Review quarterly: if realised income is below expected for two quarters, cut the payout to 70% of the new realised level. Worked example Expected income $23,300/yr × 70% = $16,310/yr paid out ( $1,359/month ). $6,990/yr retained. If a position fails as assumed, the buffer absorbs it and the payout continues. Checklist [ ] Payout ratio written (≤ 70–80% of expected income) [ ] Paid from the ladder, not from positions [ ] Quarterly review rule written [ ] \"Never from principal\" rule written Quiz 1. Expected income $40,000. Payout at 70%? $28,000/yr (~$2,333/month). 2. What's the retained 30% for? Absorbing expected losses and bad years without cutting into principal. 3. Realised income lags expected for two quarters. What happens? Cut the payout to the policy share of the new realised level.","video":null,"script":"video-scripts/lessons/lesson-13-4.json"},{"id":"13.5","title":"Scaling, compounding and the annual review","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Grow the engine safely and review it like a bank&#39;s annual report.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>\u003cstrong>Compounding:\u003c/strong> reinvesting the retained share grows principal, and income\nwith it. At a 4.66% risk-adjusted yield with 30% retained, principal grows\n~\u003cstrong>1.4%/yr\u003c/strong> from retention alone. The payout grows at about the same rate:\n$16,310 → ~$17,480 after five years (before any new capital).\u003c/p>\n\u003cp>\u003cstrong>Scaling rules as the book grows:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Caps are \u003cstrong>percentages\u003c/strong>, so position sizes rise, and so does market impact.\nCheck pool depth and exit liquidity at the new size.\u003c/li>\n\u003cli>Add independent protocols and issuers before adding size to existing ones.\u003c/li>\n\u003cli>More size means more value at stake in custody: revisit Module 12.2.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Annual review (one page):\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Balance sheet: start vs end equity, LTV, runway\u003c/li>\n\u003cli>Income: expected vs realised, by source\u003c/li>\n\u003cli>Losses and near-misses: what happened, what changed\u003c/li>\n\u003cli>Payout: paid vs policy\u003c/li>\n\u003cli>Risk assumptions: update loss probabilities from the year&#39;s incidents\u003c/li>\n\u003cli>Custody and succession drill: done?\u003c/li>\n\u003c/ol>\n\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.5:c0\">\u003cspan>Retained income reinvested per policy\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.5:c1\">\u003cspan>Exit liquidity checked at current size\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"13.5:c2\">\u003cspan>Annual review completed and filed with the books\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"13.5:q0\">\u003cdiv class=\"qtext\">Yield 5%, 40% retained. Growth from retention alone?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>~2% a year.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"13.5:q1\">\u003cdiv class=\"qtext\">Why check exit liquidity as the book grows?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A position that was easy to exit at $50k may move the market at $500k.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"13.5:q2\">\u003cdiv class=\"qtext\">What should the annual review update?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Loss-probability assumptions, from the year&#39;s incidents and near-misses.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Grow the engine safely and review it like a bank's annual report. Explanation Compounding: reinvesting the retained share grows principal, and income with it. At a 4.66% risk adjusted yield with 30% retained, principal grows ~ 1.4%/yr from retention alone. The payout grows at about the same rate: $16,310 → ~$17,480 after five years (before any new capital). Scaling rules as the book grows: Caps are percentages , so position sizes rise, and so does market impact. Check pool depth and exit liquidity at the new size. Add independent protocols and issuers before adding size to existing ones. More size means more value at stake in custody: revisit Module 12.2. Annual review (one page): 1. Balance sheet: start vs end equity, LTV, runway 2. Income: expected vs realised, by source 3. Losses and near misses: what happened, what changed 4. Payout: paid vs policy 5. Risk assumptions: update loss probabilities from the year's incidents 6. Custody and succession drill: done? Checklist [ ] Retained income reinvested per policy [ ] Exit liquidity checked at current size [ ] Annual review completed and filed with the books Quiz 1. Yield 5%, 40% retained. Growth from retention alone? ~2% a year. 2. Why check exit liquidity as the book grows? A position that was easy to exit at $50k may move the market at $500k. 3. What should the annual review update? Loss probability assumptions, from the year's incidents and near misses.","video":null,"script":"video-scripts/lessons/lesson-13-5.json"}]},{"n":14,"title":"Automation & Mastery","outcome":"monitor and automate safely, run multisig operations, and complete the operator capstone.","icon":"bot","banner":"../assets/modules/module-14.png","intro":{"src":"../video/module-14-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"14.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>At mastery, you watch everything automatically and act through rules and limited permissions, never by handing over keys. Then you prove it with the operator capstone.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Alert\u003c/td>\n\u003ctd>an automatic notification tied to an action\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Keeper\u003c/td>\n\u003ctd>an automated service that executes conditions\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Session key\u003c/td>\n\u003ctd>a limited, revocable permission\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Change control\u003c/td>\n\u003ctd>a written, delayed process for new risks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RPC\u003c/td>\n\u003ctd>a connection that lets software read the chain\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.0:c0\">\u003cspan>Modules 0–13\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>Set one alert today: a health factor, a peg or any outflow from your vault wallet.\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Has alerts mapped to actions\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Automates one task with scoped permissions and writes signing procedures\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Builds read-only tools and passes the operator capstone\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…you&#39;ve passed the operator capstone.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version At mastery, you watch everything automatically and act through rules and limited permissions, never by handing over keys. Then you prove it with the operator capstone. Words you'll need Term Meaning Alert an automatic notification tied to an action Keeper an automated service that executes conditions Session key a limited, revocable permission Change control a written, delayed process for new risks RPC a connection that lets software read the chain Before you start [ ] Modules 0–13 Your first safe step Set one alert today: a health factor, a peg or any outflow from your vault wallet. The mastery ladder Level You can… Beginner Has alerts mapped to actions Practitioner Automates one task with scoped permissions and writes signing procedures Master Builds read only tools and passes the operator capstone You've mastered this module when… …you've passed the operator capstone.","video":null,"script":"video-scripts/lessons/lesson-14-0.json"},{"id":"14.1","title":"Monitoring: dashboards, alerts and on-chain watchers","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Set up monitoring so you hear about problems before they cost money.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Watch four things:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Positions:\u003c/strong> health factors, LP ranges, pegs, utilisation of markets you lend to.\u003c/li>\n\u003cli>\u003cstrong>Protocols:\u003c/strong> governance proposals, queued upgrades (timelocks), incidents.\u003c/li>\n\u003cli>\u003cstrong>Wallets:\u003c/strong> any outgoing transaction or new approval from your vault/operating wallets.\u003c/li>\n\u003cli>\u003cstrong>Market:\u003c/strong> funding, large depegs, liquidations.\u003c/li>\n\u003c/ol>\n\u003cp>Tools: portfolio dashboards, protocol-native alerts, wallet-activity watchers,\nblock-explorer address alerts, and official status/X accounts. Alerts should reach your \u003cstrong>phone\u003c/strong>.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Alert\u003c/th>\n\u003cth>Threshold\u003c/th>\n\u003cth>Action (from your policies)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>HF, credit line\u003c/td>\n\u003ctd>&lt; 2.0 / &lt; 1.7\u003c/td>\n\u003ctd>Repay per 11.3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stablecoin peg\u003c/td>\n\u003ctd>&lt; 0.99 for 2h\u003c/td>\n\u003ctd>Peg rule\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Market utilisation\u003c/td>\n\u003ctd>&gt; 95% for 24h\u003c/td>\n\u003ctd>Withdraw per kill rule\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Vault wallet outflow\u003c/td>\n\u003ctd>Any\u003c/td>\n\u003ctd>Verify immediately (11.5)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Queued upgrade\u003c/td>\n\u003ctd>Any, on protocols &gt; 10% of book\u003c/td>\n\u003ctd>Review within timelock\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.1:c0\">\u003cspan>Alerts for all four categories, delivered to phone\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"14.1:c1\">\u003cspan>Every alert maps to a written action\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"14.1:q0\">\u003cdiv class=\"qtext\">Why alert on any vault-wallet outflow?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The vault should almost never move; any movement could be a compromise.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"14.1:q1\">\u003cdiv class=\"qtext\">Why watch queued upgrades?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The timelock is your window to exit before the change takes effect.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"14.1:q2\">\u003cdiv class=\"qtext\">An alert with no action attached is…?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Noise. Every alert needs a written response.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Set up monitoring so you hear about problems before they cost money. Explanation Watch four things: 1. Positions: health factors, LP ranges, pegs, utilisation of markets you lend to. 2. Protocols: governance proposals, queued upgrades (timelocks), incidents. 3. Wallets: any outgoing transaction or new approval from your vault/operating wallets. 4. Market: funding, large depegs, liquidations. Tools: portfolio dashboards, protocol native alerts, wallet activity watchers, block explorer address alerts, and official status/X accounts. Alerts should reach your phone . Worked example — alert sheet Alert Threshold Action (from your policies) HF, credit line 95% for 24h Withdraw per kill rule Vault wallet outflow Any Verify immediately (11.5) Queued upgrade Any, on protocols 10
