{"id":"8.4","title":"The operating playbook: deploy, monitor, respond, review","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Run every position through the same four-phase routine.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Deploy:\u003c/strong> due diligence done · before-signing checklist · test amount · journal row (protocol, chain, contracts, amount, entry, thesis, kill rules, approvals).\u003c/li>\n\u003cli>\u003cstrong>Monitor:\u003c/strong> daily HF/pegs/ranges/incidents; weekly P&amp;L vs benchmark, harvest, revoke; monthly register review.\u003c/li>\n\u003cli>\u003cstrong>Respond:\u003c/strong> pre-written actions for each trigger (see Module 11.5 for incidents).\u003c/li>\n\u003cli>\u003cstrong>Review:\u003c/strong> net return after all costs vs benchmark; simplify anything you can&#39;t explain in one sentence.\u003c/li>\n\u003c/ol>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Field\u003c/th>\n\u003cth>Entry\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Position\u003c/td>\n\u003ctd>USDC supply, Protocol Y, Arbitrum\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Amount / date\u003c/td>\n\u003ctd>$10,000 · 2026-09-01\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Thesis\u003c/td>\n\u003ctd>~5% from real borrow demand\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kill rules\u003c/td>\n\u003ctd>Utilisation &gt; 95% for 48h; oracle or collateral change; any incident\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Approvals\u003c/td>\n\u003ctd>USDC → Protocol Y pool, limited to $10,000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Weekly\u003c/td>\n\u003ctd>Interest earned, utilisation, governance notes\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.4:c0\">\u003cspan>Journal row for every position\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.4:c1\">\u003cspan>Daily / weekly / monthly routine in the calendar\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.4:c2\">\u003cspan>Response actions written per trigger\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"8.4:q0\">\u003cdiv class=\"qtext\">The four phases?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Deploy, monitor, respond, review.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.4:q1\">\u003cdiv class=\"qtext\">What goes in a journal row?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Position, amount, date, thesis, kill rules, approvals and ongoing results.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.4:q2\">\u003cdiv class=\"qtext\">What to do with a strategy you can&#39;t explain simply?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Simplify it or exit.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Run every position through the same four phase routine. Explanation 1. Deploy: due diligence done · before signing checklist · test amount · journal row (protocol, chain, contracts, amount, entry, thesis, kill rules, approvals). 2. Monitor: daily HF/pegs/ranges/incidents; weekly P&L vs benchmark, harvest, revoke; monthly register review. 3. Respond: pre written actions for each trigger (see Module 11.5 for incidents). 4. Review: net return after all costs vs benchmark; simplify anything you can't explain in one sentence. Worked example — a journal row Field Entry Position USDC supply, Protocol Y, Arbitrum Amount / date $10,000 · 2026 09 01 Thesis ~5% from real borrow demand Kill rules Utilisation 95% for 48h; oracle or collateral change; any incident Approvals USDC → Protocol Y pool, limited to $10,000 Weekly Interest earned, utilisation, governance notes Checklist [ ] Journal row for every position [ ] Daily / weekly / monthly routine in the calendar [ ] Response actions written per trigger Quiz 1. The four phases? Deploy, monitor, respond, review. 2. What goes in a journal row? Position, amount, date, thesis, kill rules, approvals and ongoing results. 3. What to do with a strategy you can't explain simply? Simplify it or exit.","video":null,"script":"video-scripts/lessons/lesson-08-4.json"},{"id":"8.5","title":"Measuring performance honestly","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Measure your results so deposits, withdrawals and lucky markets don&#39;t fool you.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Time-weighted return (TWR):\u003c/strong> chains the return of each period, ignoring when you added or removed money. It measures your \u003cem>decisions\u003c/em>.\u003c/li>\n\u003cli>\u003cstrong>Money-weighted / simple gain:\u003c/strong> what your total capital actually did, including the timing of deposits.\u003c/li>\n\u003cli>\u003cstrong>Benchmark:\u003c/strong> compare against what you&#39;d have got doing something simple: holding the same assets, or plain stablecoin lending. Beating zero isn&#39;t the test.\u003c/li>\n\u003cli>\u003cstrong>Attribution:\u003c/strong> split the result into sources: price moves, fees, interest, incentives, costs, losses. Only the parts you control show skill.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Start $100,000 → +10% in Q1 ($110,000) → deposit $50,000 ($160,000) → −5% in Q2 → $152,000.\n\u003ccode>defi_calc.py twr --period 10 --period -5 --start 100000 --end 152000 --net-deposits 50000\u003c/code>\u003c/p>\n\u003cul>\n\u003cli>TWR: 1.10 × 0.95 − 1 = \u003cstrong>4.50%\u003c/strong> (your decisions)\u003c/li>\n\u003cli>Simple gain on $150,000 put in: \u003cstrong>1.33%\u003c/strong> (hurt by the deposit landing before a down quarter)\nThen compare 4.50% with holding ETH over the same period, and with stablecoin lending.\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.5:c0\">\u003cspan>TWR calculated quarterly\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.5:c1\">\u003cspan>Benchmark chosen and compared\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.5:c2\">\u003cspan>Results attributed by source\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"8.5:q0\">\u003cdiv class=\"qtext\">What does TWR remove?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The effect of when deposits and withdrawals happened.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.5:q1\">\u003cdiv class=\"qtext\">Why use a benchmark?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>To see whether the strategy beat doing something simple, not just beat zero.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.5:q2\">\u003cdiv class=\"qtext\">Two quarters, +8% then +2%. TWR?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>1.08 × 1.02 − 1 = 10.16%.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Measure your results so deposits, withdrawals and lucky markets don't fool you. Explanation Time weighted return (TWR): chains the return of each period, ignoring when you added or removed money. It measures your decisions . Money weighted / simple gain: what your total capital actually did, including the timing of deposits. Benchmark: compare against what you'd have got doing something simple: holding the same assets, or plain stablecoin lending. Beating zero isn't the test. Attribution: split the result into sources: price moves, fees, interest, incentives, costs, losses. Only the parts you control show skill. Worked example Start $100,000 → +10% in Q1 ($110,000) → deposit $50,000 ($160,000) → −5% in Q2 → $152,000. defi calc.py twr period 10 period 5 start 100000 end 152000 net deposits 50000 TWR: 1.10 × 0.95 − 1 = 4.50% (your decisions) Simple gain on $150,000 put in: 1.33% (hurt by the deposit landing before a down quarter) Then compare 4.50% with holding ETH over the same period, and with stablecoin lending. Checklist [ ] TWR calculated quarterly [ ] Benchmark chosen and compared [ ] Results attributed by source Quiz 1. What does TWR remove? The effect of when deposits and withdrawals happened. 2. Why use a benchmark? To see whether the strategy beat doing something simple, not just beat zero. 3. Two quarters, +8% then +2%. TWR? 1.08 × 1.02 − 1 = 10.16%.","video":null,"script":"video-scripts/lessons/lesson-08-5.json"},{"id":"8.6","title":"Psychology and discipline","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Recognise the behaviours that turn good strategies into losses, and build rules that stop them.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Bias\u003c/th>\n\u003cth>What it looks like\u003c/th>\n\u003cth>Rule that stops it\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>FOMO\u003c/strong>\u003c/td>\n\u003ctd>Jumping into a farm because everyone&#39;s posting about it\u003c/td>\n\u003ctd>24-hour change-control wait (14.3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Loss aversion\u003c/strong>\u003c/td>\n\u003ctd>Holding a broken position hoping to &quot;get back to even&quot;\u003c/td>\n\u003ctd>Kill rules written at entry, then followed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sunk cost\u003c/strong>\u003c/td>\n\u003ctd>&quot;I&#39;ve spent so much gas, I can&#39;t exit now&quot;\u003c/td>\n\u003ctd>Judge only the future: would you enter today?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Overconfidence\u003c/strong>\u003c/td>\n\u003ctd>Raising size after a winning streak\u003c/td>\n\u003ctd>Caps are percentages; size changes only at review\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Revenge trading\u003c/strong>\u003c/td>\n\u003ctd>Adding leverage to win back a loss\u003c/td>\n\u003ctd>No new leverage within 7 days of a loss event\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Anchoring\u003c/strong>\u003c/td>\n\u003ctd>Refusing to sell below a past price\u003c/td>\n\u003ctd>Decisions based on current data and the thesis\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>The operator&#39;s defence\u003c/strong> is structure: written theses, kill rules, caps, a\njournal, cooling-off periods and scheduled reviews. Willpower in the moment is unreliable.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>After a 20% loss on a farm, Jordan wants to put 3× leverage on the next idea &quot;to\nmake it back&quot;. The rulebook says: no new leverage within 7 days of a loss event,\nand size only changes at the monthly review. Jordan journals the urge, waits,\nand at review decides the idea doesn&#39;t meet the thesis standard at all.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.6:c0\">\u003cspan>Personal rulebook written (cooling-off, loss rules, sizing rules)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.6:c1\">\u003cspan>Emotions noted in the journal next to decisions\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.6:c2\">\u003cspan>Monthly review includes &quot;which rule did I break?&quot;\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"8.6:q0\">\u003cdiv class=\"qtext\">What&#39;s the sunk-cost question?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Would I enter this position today, knowing what I know now?\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.6:q1\">\u003cdiv class=\"qtext\">Why rely on structure rather than willpower?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Decisions under stress are unreliable; pre-written rules decide for you.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.6:q2\">\u003cdiv class=\"qtext\">Rule against revenge trading?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>For example, no new leverage within 7 days of a loss event.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Recognise the behaviours that turn good strategies into losses, and build rules that stop them. Explanation Bias What it looks like Rule that stops it FOMO Jumping into a farm because everyone's posting about it 24 hour change control wait (14.3) Loss aversion Holding a broken position hoping to \"get back to even\" Kill rules written at entry, then followed Sunk cost \"I've spent so much gas, I can't exit now\" Judge only the future: would you enter today? Overconfidence Raising size after a winning streak Caps are percentages; size changes only at review Revenge trading Adding leverage to win back a loss No new leverage within 7 days of a loss event Anchoring Refusing to sell below a past price Decisions based on current data and the thesis The operator's defence is structure: written theses, kill rules, caps, a journal, cooling off periods and scheduled reviews. Willpower in the moment is unreliable. Worked example After a 20% loss on a farm, Jordan wants to put 3× leverage on the next idea \"to make it back\". The rulebook says: no new leverage within 7 days of a loss event, and size only changes at the monthly review. Jordan journals the urge, waits, and at review decides the idea doesn't meet the thesis standard at all. Checklist [ ] Personal rulebook written (cooling off, loss rules, sizing rules) [ ] Emotions noted in the journal next to decisions [ ] Monthly review includes \"which rule did I break?\" Quiz 1. What's the sunk cost question? Would I enter this position today, knowing what I know now? 2. Why rely on structure rather than willpower? Decisions under stress are unreliable; pre written rules decide for you. 3. Rule against revenge trading? For example, no new leverage within 7 days of a loss event.","video":null,"script":"video-scripts/lessons/lesson-08-6.json"},{"id":"8.7","title":"Quantitative risk: volatility, VaR, drawdown, correlation and sizing","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Put numbers on portfolio risk and size positions from them.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Volatility (σ):\u003c/strong> annualised standard deviation of returns. \u003cstrong>Daily σ ≈ annual σ ÷ √365\u003c/strong> (crypto trades every day).\u003c/li>\n\u003cli>\u003cstrong>Value at risk (VaR):\u003c/strong> a loss level you&#39;d expect to exceed only rarely (e.g. 1 day in 20 at 95%). Parametric 1-day VaR ≈ 1.65 × daily σ × position. \u003cstrong>It assumes normal returns; crypto has fat tails\u003c/strong>, so real losses exceed VaR more often. Use it as a floor, plus stress tests (11.4).\u003c/li>\n\u003cli>\u003cstrong>Max drawdown:\u003c/strong> the largest peak-to-trough fall. Ask: could I live through it, and would my policies survive it?\u003c/li>\n\u003cli>\u003cstrong>Correlation:\u003c/strong> in crashes, correlations between crypto assets rise towards 1. Diversifying within crypto helps less when you need it most.\u003c/li>\n\u003cli>\u003cstrong>Sizing:\u003c/strong> \u003cstrong>volatility targeting\u003c/strong> (size so each position contributes similar risk); the \u003cstrong>Kelly criterion\u003c/strong> gives a theoretical maximum bet size from edge and odds, but estimates are noisy, so professionals use a small fraction of it or skip it.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>$100,000 of ETH at 70% annual volatility:\n\u003ccode>defi_calc.py var --position 100000 --vol 70\u003c/code> → daily σ ≈ \u003cstrong>3.66%\u003c/strong>, 1-day 95% VaR ≈ \u003cstrong>$6,046\u003c/strong>.\nReal single-day falls have been far larger (in March 2020, ETH fell by roughly 40% in a day).\nSo: VaR for day-to-day sizing, stress tests for survival.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.7:c0\">\u003cspan>Volatility and VaR computed for my largest positions\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.7:c1\">\u003cspan>Portfolio survives the worst historical drawdown of what it holds\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.7:c2\">\u003cspan>Correlation assumed to rise in stress\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"8.7:c3\">\u003cspan>Sizing rule written (e.g. volatility targeting)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"8.7:q0\">\u003cdiv class=\"qtext\">Annual volatility 50%. Daily σ?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>About 2.6% (50 ÷ √365).\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.7:q1\">\u003cdiv class=\"qtext\">Why is VaR a floor, not a ceiling?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It assumes normal returns; crypto&#39;s fat tails make big losses more common.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"8.7:q2\">\u003cdiv class=\"qtext\">What happens to correlations in a crash?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>They tend to rise towards 1.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Put numbers on portfolio risk and size positions from them. Explanation Volatility (σ): annualised standard deviation of returns. Daily σ ≈ annual σ ÷ √365 (crypto trades every day). Value at risk (VaR): a loss level you'd expect to exceed only rarely (e.g. 1 day in 20 at 95%). Parametric 1 day VaR ≈ 1.65 × daily σ × position. It assumes normal returns; crypto has fat tails , so real losses exceed VaR more often. Use it as a floor, plus stress tests (11.4). Max drawdown: the largest peak to trough fall. Ask: could I live through it, and would my policies survive it? Correlation: in crashes, correlations between crypto assets rise towards 1. Diversifying within crypto helps less when you need it most. Sizing: volatility targeting (size so each position contributes similar risk); the Kelly criterion gives a theoretical maximum bet size from edge and odds, but estimates are noisy, so professionals use a small fraction of it or skip it. Worked example $100,000 of ETH at 70% annual volatility: defi calc.py var position 100000 vol 70 → daily σ ≈ 3.66% , 1 day 95% VaR ≈ $6,046 . Real single day falls have been far larger (in March 2020, ETH fell by roughly 40% in a day). So: VaR for day to day sizing, stress tests for survival. Checklist [ ] Volatility and VaR computed for my largest positions [ ] Portfolio survives the worst historical drawdown of what it holds [ ] Correlation assumed to rise in stress [ ] Sizing rule written (e.g. volatility targeting) Quiz 1. Annual volatility 50%. Daily σ? About 2.6% (50 ÷ √365). 2. Why is VaR a floor, not a ceiling? It assumes normal returns; crypto's fat tails make big losses more common. 3. What happens to correlations in a crash? They tend to rise towards 1.","video":null,"script":"video-scripts/lessons/lesson-08-7.json"}]},{"n":9,"title":"DeFi vs Grid Bots","outcome":"choose the right tool for the market, and run both as one system.","icon":"grid","banner":"../assets/modules/module-09.png","intro":{"src":"../video/module-09-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"9.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>A grid bot on an exchange and a liquidity position on a DEX both buy as price falls and sell as it rises inside a range. This module shows when each is the better tool, and how to run both without doubling your risk.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Grid bot\u003c/td>\n\u003ctd>automated buy/sell orders at set price levels\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Range\u003c/td>\n\u003ctd>the price band a strategy works in\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Concentrated liquidity\u003c/td>\n\u003ctd>LP capital placed in a chosen range\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Correlation\u003c/td>\n\u003ctd>positions that move together\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Invalidation\u003c/td>\n\u003ctd>the event that ends a range thesis\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"9.0:c0\">\u003cspan>Modules 0–8 (Grid Bot Builder helpful but not required)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>Take one asset and write the range you&#39;d use for a grid bot and for an LP. Would they be the same?\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Explains the grid–LP similarity\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Chooses the right tool by size, custody and pair\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Runs grid bots and DeFi as one system with exposure counted by asset and range\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…your exposure is counted by underlying asset and range, not by number of positions.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version A grid bot on an exchange and a liquidity position on a DEX both buy as price falls and sell as it rises inside a range. This module shows when each is the better tool, and how to run both without doubling your risk. Words you'll need Term Meaning Grid bot automated buy/sell orders at set price levels Range the price band a strategy works in Concentrated liquidity LP capital placed in a chosen range Correlation positions that move together Invalidation the event that ends a range thesis Before you start [ ] Modules 0–8 (Grid Bot Builder helpful but not required) Your first safe step Take one asset and write the range you'd use for a grid bot and for an LP. Would they be the same? The mastery ladder Level You can… Beginner Explains the grid–LP similarity Practitioner Chooses the right tool by size, custody and pair Master Runs grid bots and DeFi as one system with exposure counted by asset and range You've mastered this module when… …your exposure is counted by underlying asset and range, not by number of positions.","video":null,"script":"video-scripts/lessons/lesson-09-0.json"},{"id":"9.1","title":"Same idea, different machine","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Explain why a concentrated liquidity position and a grid bot are\neconomically close cousins, and where they differ.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Both strategies do the same basic thing inside a price range:\n\u003cstrong>sell as price rises, buy as price falls, and profit from price moving back and forth.\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Grid bot (e.g. Grid Bot Builder on an exchange)\u003c/th>\n\u003cth>Concentrated LP (on-chain AMM)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>How it trades\u003c/td>\n\u003ctd>Discrete orders at set levels\u003c/td>\n\u003ctd>Continuous. Every trade in range moves your inventory\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>What it earns\u003c/td>\n\u003ctd>Spread between grid levels, minus exchange fees\u003c/td>\n\u003ctd>Share of the pool&#39;s swap fee on every trade in range\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Who pays whom\u003c/td>\n\u003ctd>You pay trading fees\u003c/td>\n\u003ctd>Traders pay \u003cem>you\u003c/em> fees\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>At the range low\u003c/td>\n\u003ctd>Holds mostly/all the base asset\u003c/td>\n\u003ctd>Holds 100% of the base asset\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>At the range high\u003c/td>\n\u003ctd>Holds mostly/all quote (USDT/USDC)\u003c/td>\n\u003ctd>Holds 100% of the quote asset\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Outside the range\u003c/td>\n\u003ctd>Stops trading, holding one side\u003c/td>\n\u003ctd>Stops earning, holding one side\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Custody\u003c/td>\n\u003ctd>Exchange holds funds (you keep API control)\u003c/td>\n\u003ctd>You hold keys, and the contract holds the position\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Main extra risk\u003c/td>\n\u003ctd>Exchange / counterparty\u003c/td>\n\u003ctd>Smart contract, oracle, MEV, gas\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Automation\u003c/td>\n\u003ctd>Built into the tool\u003c/td>\n\u003ctd>Manual, or a third-party manager (extra contract risk)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"Grid bot vs concentrated LP\" src=\"../assets/diagrams/grid-vs-lp.png\">\u003cfigcaption>Grid bot vs concentrated LP\u003c/figcaption>\u003c/figure>\n\u003cp>Range \u003cstrong>$2,700–$3,300\u003c/strong>, ETH at \u003cstrong>$3,000\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Price falls to $2,700:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cem>Grid\u003c/em> (20 arithmetic levels, $30 apart): buys at 2,970, 2,940 … 2,700 → average buy ≈ \u003cstrong>$2,835\u003c/strong>.\u003c/li>\n\u003cli>\u003cem>Concentrated LP:\u003c/em> converts USDC to ETH continuously on the way down at the\ngeometric average \u003ccode>√(2,700 × 3,000)\u003c/code> ≈ \u003cstrong>$2,846\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Price rises to $3,300:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cem>Grid\u003c/em>: sells at 3,030 … 3,300 → average ≈ \u003cstrong>$3,165\u003c/strong>.\u003c/li>\n\u003cli>\u003cem>LP:\u003c/em> sells ETH at \u003ccode>√(3,000 × 3,300)\u003c/code> ≈ \u003cstrong>$3,146\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>Almost the same inventory path. The real difference is \u003cstrong>how money is made on\nthe way\u003c/strong>: grid profit per completed level (after paying fees), versus LP fee\nincome on all trading volume in range (after impermanent loss).\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"9.1:c0\">\u003cspan>I can explain why both end up 100% in one asset at a range edge\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"9.1:c1\">\u003cspan>I know which one pays fees and which one earns them\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"9.1:c2\">\u003cspan>I treat a range break as an invalidation event in both\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"9.1:q0\">\u003cdiv class=\"qtext\">Price breaks below the range. What do the grid bot and the LP both hold?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>All, or nearly all, the base asset, bought on the way down. Both stop earning until price returns or you act.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"9.1:q1\">\u003cdiv class=\"qtext\">Who pays trading fees in each?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The grid bot pays exchange fees. The LP earns fees from traders.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"9.1:q2\">\u003cdiv class=\"qtext\">Name one risk the LP has that the grid bot doesn&#39;t, and vice versa.\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>LP: smart-contract/MEV/gas risk. Grid bot: exchange/counterparty risk.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Explain why a concentrated liquidity position and a grid bot are economically close cousins, and where they differ. Explanation Both strategies do the same basic thing inside a price range: sell as price rises, buy as price falls, and profit from price moving back and forth. Grid bot (e.g. Grid Bot Builder on an exchange) Concentrated LP (on chain AMM) How it trades Discrete orders at set levels Continuous. Every trade in range moves your inventory What it earns Spread between grid levels, minus exchange fees Share of the pool's swap fee on every trade in range Who pays whom You pay trading fees Traders pay you fees At the range low Holds mostly/all the base asset Holds 100% of the base asset At the range high Holds mostly/all quote (USDT/USDC) Holds 100% of the quote asset Outside the range Stops trading, holding one side Stops earning, holding one side Custody Exchange holds funds (you keep API control) You hold keys, and the contract holds the position Main extra risk Exchange / counterparty Smart contract, oracle, MEV, gas Automation Built into the tool Manual, or a third party manager (extra contract risk) Worked example — same range, same inventory behaviour Range $2,700–$3,300 , ETH at $3,000 . Price falls to $2,700: Grid (20 arithmetic levels, $30 apart): buys at 2,970, 2,940 … 2,700 → average buy ≈ $2,835 . Concentrated LP: converts USDC to ETH continuously on the way down at the geometric average √(2,700 × 3,000) ≈ $2,846 . Price rises to $3,300: Grid : sells at 3,030 … 3,300 → average ≈ $3,165 . LP: sells ETH at √(3,000 × 3,300) ≈ $3,146 . Almost the same inventory path. The real difference is how money is made on the way : grid profit per completed level (after paying fees), versus LP fee income on all trading volume in range (after impermanent loss). Checklist [ ] I can explain why both end up 100% in one asset at a range edge [ ] I know which one pays fees and which one earns them [ ] I treat a range break as an invalidation event in both Quiz 1. Price breaks below the range. What do the grid bot and the LP both hold? All, or nearly all, the base asset, bought on the way down. Both stop earning until price returns or you act. 2. Who pays trading fees in each? The grid bot pays exchange fees. The LP earns fees from traders. 3. Name one risk the LP has that the grid bot doesn't, and vice versa. LP: smart contract/MEV/gas risk. Grid bot: exchange/counterparty risk.","video":null,"script":"video-scripts/lessons/lesson-09-1.json"},{"id":"9.2","title":"When each one wins","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Pick grid bot, LP, both, or neither, for a given market and account.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Factor\u003c/th>\n\u003cth>Favours grid bot\u003c/th>\n\u003cth>Favours on-chain LP\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Position size\u003c/td>\n\u003ctd>Small–medium (no gas per action)\u003c/td>\n\u003ctd>Larger (gas becomes a smaller share of returns)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pair\u003c/td>\n\u003ctd>Major pairs listed on your exchange\u003c/td>\n\u003ctd>Tokens only traded on-chain; pairs with deep pool volume\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fee economics\u003c/td>\n\u003ctd>Low maker fees on your exchange\u003c/td>\n\u003ctd>High-volume pools with a good fee tier (e.g. 0.05% / 0.3% / 1%)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Management\u003c/td>\n\u003ctd>Want automation (Grid Bot Builder)\u003c/td>\n\u003ctd>Happy to set ranges and rebalance by hand\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Custody preference\u003c/td>\n\u003ctd>Comfortable with exchange custody\u003c/td>\n\u003ctd>Want self-custody\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Counterparty view\u003c/td>\n\u003ctd>Trust the exchange more than contracts\u003c/td>\n\u003ctd>Trust audited contracts more than an exchange\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Leverage wanted\u003c/td>\n\u003ctd>Futures grid (advanced)\u003c/td>\n\u003ctd>Not applicable (LP is unlevered unless you borrow)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Neither\u003c/strong>, same as in the grid module: strong breakouts, parabolic moves,\nmajor news, thin liquidity. Waiting is a position.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003col>\n\u003cli>\u003cstrong>$3k, trades BTC/ETH, wants automation\u003c/strong> → grid bot. Gas would eat a small on-chain LP.\u003c/li>\n\u003cli>\u003cstrong>$80k, holds ETH long-term, self-custody, checks weekly\u003c/strong> → a wide-range\nETH/USDC concentrated LP could earn fees on part of the stack. Size it as\nETH they&#39;re willing to sell higher and USDC they&#39;re willing to spend lower.\u003c/li>\n\u003cli>\u003cstrong>A token that&#39;s only liquid on a DEX\u003c/strong> → only an LP is possible. Apply\nfull due diligence (Module 6) and small size.\u003c/li>\n\u003c/ol>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"9.2:c0\">\u003cspan>I&#39;ve matched the tool to position size, pair, custody and management time\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"9.2:c1\">\u003cspan>I&#39;ve compared expected fee income to costs (gas or exchange fees)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"9.2:c2\">\u003cspan>I&#39;ve checked the regime before choosing either\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"9.2:q0\">\u003cdiv class=\"qtext\">Why does position size matter more on-chain?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Gas is a roughly fixed cost per action, so it&#39;s a bigger percentage of a small position.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"9.2:q1\">\u003cdiv class=\"qtext\">When is an LP the only option?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>When the pair trades only on-chain.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"9.2:q2\">\u003cdiv class=\"qtext\">Market just broke out on huge news. Grid or LP?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Neither, until a new range forms.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Pick grid bot, LP, both, or neither, for a given market and account. Explanation Factor Favours grid bot Favours on chain LP Position size Small–medium (no gas per action) Larger (gas becomes a smaller share of returns) Pair Major pairs listed on your exchange Tokens only traded on chain; pairs with deep pool volume Fee economics Low maker fees on your exchange High volume pools with a good fee tier (e.g. 0.05% / 0.3% / 1%) Management Want automation (Grid Bot Builder) Happy to set ranges and rebalance by hand Custody preference Comfortable with exchange custody Want self custody Counterparty view Trust the exchange more than contracts Trust audited contracts more than an exchange Leverage wanted Futures grid (advanced) Not applicable (LP is unlevered unless you borrow) Neither , same as in the grid module: strong breakouts, parabolic moves, major news, thin liquidity. Waiting is a position. Worked example — three traders 1. $3k, trades BTC/ETH, wants automation → grid bot. Gas would eat a small on chain LP. 2. $80k, holds ETH long term, self custody, checks weekly → a wide range ETH/USDC concentrated LP could earn fees on part of the stack. Size it as ETH they're willing to sell higher and USDC they're willing to spend lower. 3. A token that's only liquid on a DEX → only an LP is possible. Apply full due diligence (Module 6) and small size. Checklist [ ] I've matched the tool to position size, pair, custody and management time [ ] I've compared expected fee income to costs (gas or exchange fees) [ ] I've checked the regime before choosing either Quiz 1. Why does position size matter more on chain? Gas is a roughly fixed cost per action, so it's a bigger percentage of a small position. 2. When is an LP the only option? When the pair trades only on chain. 3. Market just broke out on huge news. Grid or LP? Neither, until a new range forms.","video":null,"script":"video-scripts/lessons/lesson-09-2.json"},{"id":"9.3","title":"Building a combined system","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Design a portfolio that uses exchange grid bots and DeFi together without\ndoubling up on the same risk.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Each tool is good at a different job:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Grid bots\u003c/strong> → capture oscillation in range-bound major pairs, fully automated.\u003c/li>\n\u003cli>\u003cstrong>DeFi lending / stable LP\u003c/strong> → earn on idle stablecoins and reserves.\u003c/li>\n\u003cli>\u003cstrong>Staking / LSTs\u003c/strong> → earn on assets you&#39;d hold anyway.\u003c/li>\n\u003cli>\u003cstrong>Concentrated LP\u003c/strong> → earn fees on-chain in ranges, for larger, self-custodied sizes.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>The trap: correlation.\u003c/strong> An ETH grid bot + an ETH/USDC LP + an LST loop are\n\u003cem>three\u003c/em> bets on ETH staying in a range. If ETH breaks down, they all lose\ntogether. Add up your exposure by \u003cstrong>underlying asset and by range\u003c/strong>, not by\nnumber of positions.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>\u003cem>Percentages are an example structure, not a recommendation. Set your own from your risk budget.\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Bucket\u003c/th>\n\u003cth>Share\u003c/th>\n\u003cth>Tool\u003c/th>\n\u003cth>Job\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Reserve\u003c/td>\n\u003ctd>15%\u003c/td>\n\u003ctd>Stablecoin lending (split across 2 protocols)\u003c/td>\n\u003ctd>Liquidity to defend positions and redeploy after range breaks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Core yield\u003c/td>\n\u003ctd>25%\u003c/td>\n\u003ctd>Stable-stable LP / stable lending\u003c/td>\n\u003ctd>Base return on cash\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hold-anyway assets\u003c/td>\n\u003ctd>25%\u003c/td>\n\u003ctd>Staking / LSTs\u003c/td>\n\u003ctd>Earn on long-term holdings\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Range income\u003c/td>\n\u003ctd>30%\u003c/td>\n\u003ctd>Grid bots on liquid majors (+ optional wide on-chain LP)\u003c/td>\n\u003ctd>Capture oscillation\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Speculative\u003c/td>\n\u003ctd>≤5%\u003c/td>\n\u003ctd>Burner-wallet farms, airdrops, new protocols\u003c/td>\n\u003ctd>Capped experiments\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Rules for this system:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>One range thesis per asset.\u003c/strong> If a grid bot and an LP both run on ETH, their combined size must fit your ETH range-risk cap.\u003c/li>\n\u003cli>\u003cstrong>Reserve funds the defence.\u003c/strong> Range breaks and health-factor defence draw from reserve, never from other positions.\u003c/li>\n\u003cli>\u003cstrong>Sweep profits up.\u003c/strong> Realised grid profits and harvested yield go to reserve or vault on a schedule.\u003c/li>\n\u003cli>\u003cstrong>Review together.\u003c/strong> One weekly review across CEX and on-chain positions, using the same journal.\u003c/li>\n\u003c/ol>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"9.3:c0\">\u003cspan>Exposure added up by underlying asset, not by bot/position count\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"9.3:c1\">\u003cspan>Reserve sized and kept out of positions\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"9.3:c2\">\u003cspan>Profit sweep schedule set\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"9.3:c3\">\u003cspan>One journal covering bots and DeFi positions\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"9.3:q0\">\u003cdiv class=\"qtext\">ETH grid bot + ETH/USDC LP + ETH LST loop. How many independent bets?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Essentially one: ETH staying in range or rising. They&#39;re correlated.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"9.3:q1\">\u003cdiv class=\"qtext\">What is the reserve for?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Defending debt positions and redeploying after invalidations, without forced selling.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"9.3:q2\">\u003cdiv class=\"qtext\">Why sweep profits out of positions?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Profits left in a position stay exposed to its risks. Sweeping locks them in.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Design a portfolio that uses exchange grid bots and DeFi together without doubling up on the same risk. Explanation Each tool is good at a different job: Grid bots → capture oscillation in range bound major pairs, fully automated. DeFi lending / stable LP → earn on idle stablecoins and reserves. Staking / LSTs → earn on assets you'd hold anyway. Concentrated LP → earn fees on chain in ranges, for larger, self custodied sizes. The trap: correlation. An ETH grid bot + an ETH/USDC LP + an LST loop are three bets on ETH staying in a range. If ETH breaks down, they all lose together. Add up your exposure by underlying asset and by range , not by number of positions. Worked example — an illustrative allocation framework Percentages are an example structure, not a recommendation. Set your own from your risk budget. Bucket Share Tool Job Reserve 15% Stablecoin lending (split across 2 protocols) Liquidity to defend positions and redeploy after range breaks Core yield 25% Stable stable LP / stable lending Base return on cash Hold anyway assets 25% Staking / LSTs Earn on long term holdings Range income 30% Grid bots on liquid majors (+ optional wide on chain LP) Capture oscillation Speculative ≤5% Burner wallet farms, airdrops, new protocols Capped experiments Rules for this system: 1. One range thesis per asset. If a grid bot and an LP both run on ETH, their combined size must fit your ETH range risk cap. 2. Reserve funds the defence. Range breaks and health factor defence draw from reserve, never from other positions. 3. Sweep profits up. Realised grid profits and harvested yield go to reserve or vault on a schedule. 4. Review together. One weekly review across CEX and on chain positions, using the same journal. Checklist [ ] Exposure added up by underlying asset, not by bot/position count [ ] Reserve sized and kept out of positions [ ] Profit sweep schedule set [ ] One journal covering bots and DeFi positions Quiz 1. ETH grid bot + ETH/USDC LP + ETH LST loop. How many independent bets? Essentially one: ETH staying in range or rising. They're correlated. 2. What is the reserve for? Defending debt positions and redeploying after invalidations, without forced selling. 3. Why sweep profits out of positions? Profits left in a position stay exposed to its risks. Sweeping locks them in.","video":null,"script":"video-scripts/lessons/lesson-09-3.json"}]},{"n":10,"title":"Advanced Yield Engineering","outcome":"build fixed, hedged and structured yield, and know exactly what each position is short.","icon":"target","banner":"../assets/modules/module-10.png","intro":{"src":"../video/module-10-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"10.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>Professionals don&#39;t just take the yield on offer: they engineer it. Fixed rates, hedged carry, option income and managed ranges each swap one risk for another. This module teaches you to build them and say exactly what each one is short.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>PT / YT\u003c/td>\n\u003ctd>principal and yield tokens splitting a yield-bearing asset\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Basis\u003c/td>\n\u003ctd>a future&#39;s premium over spot\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Funding\u003c/td>\n\u003ctd>payments between perp longs and shorts\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Covered call\u003c/td>\n\u003ctd>selling upside for a premium\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Delta-neutral\u003c/td>\n\u003ctd>price moves roughly cancel out\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.0:c0\">\u003cspan>Modules 0–9, including perps (3.5) and LP maths (Module 2)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>Price one live PT with \u003ccode>defi_calc.py pt\u003c/code> and write: &quot;This position is short ___.&quot;\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Understands each structure and its payoff\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Sizes and runs one structured position with written exits\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Combines fixed, carry, options and LP yield inside caps, naming every short exposure\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…you can complete &quot;this position is short ___&quot; for every structured position you hold.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version Professionals don't just take the yield on offer: they engineer it. Fixed rates, hedged carry, option income and managed ranges each swap one risk for another. This module teaches you to build them and say exactly what each one is short. Words you'll need Term Meaning PT / YT principal and yield tokens splitting a yield bearing asset Basis a future's premium over spot Funding payments between perp longs and shorts Covered call selling upside for a premium Delta neutral price moves roughly cancel out Before you start [ ] Modules 0–9, including perps (3.5) and LP maths (Module 2) Your first safe step Price one live PT with defi calc.py pt and write: \"This position is short .\" The mastery ladder Level You can… Beginner Understands each structure and its payoff Practitioner Sizes and runs one structured position with written exits Master Combines fixed, carry, options and LP yield inside caps, naming every short exposure You've mastered this module when… …you can complete \"this position is short \" for every structured position you hold.","video":null,"script":"video-scripts/lessons/lesson-10-0.json"},{"id":"10.1","title":"Fixed-rate yield: principal and yield tokens (PT/YT)","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Lock a fixed return using principal tokens, and price a yield token against its implied rate.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>\u003cstrong>Yield tokenization\u003c/strong> takes a yield-bearing asset (a staked asset, a lending\nreceipt, a stablecoin savings token) and splits it into two tokens that\nmature on a set date:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>PT (principal token):\u003c/strong> redeems 1:1 for the underlying at maturity. It\ntrades at a \u003cstrong>discount\u003c/strong> before then. Buy the discount, hold to maturity,\nand your return is fixed.\u003c/li>\n\u003cli>\u003cstrong>YT (yield token):\u003c/strong> receives \u003cem>all\u003c/em> the variable yield (and often points)\nthe underlying earns until maturity, then is worth zero.\u003c/li>\n\u003c/ul>\n\u003cp>PT + YT = one unit of the underlying. The PT price implies a fixed rate; the\nYT is a bet that realised yield beats it.\u003c/p>\n\u003cp>\u003ccode>fixed APY = (1 ÷ PT price)^(365 ÷ days) − 1\u003c/code>\u003c/p>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"PT price converges to 1.00 at maturity\" src=\"../assets/charts/pt-convergence.png\">\u003cfigcaption>PT price converges to 1.00 at maturity\u003c/figcaption>\u003c/figure>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A stablecoin savings token has a PT maturing in \u003cstrong>180 days\u003c/strong>, priced at \u003cstrong>0.96\u003c/strong>.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>defi_calc.py pt --price 0.96 --days 180\u003c/code> → \u003cstrong>8.63%\u003c/strong> fixed APY if held to maturity.\u003c/li>\n\u003cli>$100,000 buys ~104,167 PT → redeems for ~104,167 of the underlying at maturity.\u003c/li>\n\u003cli>The YT costs ~0.04 per unit. It only profits if the underlying&#39;s realised\nyield (plus any points) averages above ~8.6% for the 180 days.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Near maturity, small discounts are big rates:\u003c/strong> PT at 0.985 with 60 days left\n→ \u003cstrong>9.63%\u003c/strong> APY. Check liquidity before chasing these; exiting early means\nselling into the pool.\u003c/p>\n\u003c/section>\u003ch3>What this position is short\u003c/h3>\n\u003cp>PT: the underlying&#39;s credit/depeg risk, and liquidity if you exit early.\nYT: falling yields, and time (it decays to zero).\u003c/p>\n\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.1:c0\">\u003cspan>I&#39;d hold the underlying asset anyway\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.1:c1\">\u003cspan>Maturity date matches when I&#39;ll need the money (Module 12.4 ladder)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.1:c2\">\u003cspan>Pool depth checked for an early exit\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.1:c3\">\u003cspan>YT sized as speculation, not income\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"10.1:q0\">\u003cdiv class=\"qtext\">PT at 0.97, 120 days to maturity. Fixed APY?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>(1/0.97)^(365/120) − 1 ≈ 9.7%.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.1:q1\">\u003cdiv class=\"qtext\">Does buying PT remove the underlying&#39;s risk?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. It fixes the rate. If the underlying depegs or is exploited, the PT redeems into a damaged asset.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.1:q2\">\u003cdiv class=\"qtext\">What must happen for a YT to profit?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Realised variable yield plus points must beat the implied rate priced into the PT.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Lock a fixed return using principal tokens, and price a yield token against its implied rate. Explanation Yield tokenization takes a yield bearing asset (a staked asset, a lending receipt, a stablecoin savings token) and splits it into two tokens that mature on a set date: PT (principal token): redeems 1:1 for the underlying at maturity. It trades at a discount before then. Buy the discount, hold to maturity, and your return is fixed. YT (yield token): receives all the variable yield (and often points) the underlying earns until maturity, then is worth zero. PT + YT = one unit of the underlying. The PT price implies a fixed rate; the YT is a bet that realised yield beats it. fixed APY = (1 ÷ PT price)^(365 ÷ days) − 1 Worked example A stablecoin savings token has a PT maturing in 180 days , priced at 0.96 . defi calc.py pt price 0.96 days 180 → 8.63% fixed APY if held to maturity. $100,000 buys ~104,167 PT → redeems for ~104,167 of the underlying at maturity. The YT costs ~0.04 per unit. It only profits if the underlying's realised yield (plus any points) averages above ~8.6% for the 180 days. Near maturity, small discounts are big rates: PT at 0.985 with 60 days left → 9.63% APY. Check liquidity before chasing these; exiting early means selling into the pool. What this position is short PT: the underlying's credit/depeg risk, and liquidity if you exit early. YT: falling yields, and time (it decays to zero). Checklist [ ] I'd hold the underlying asset anyway [ ] Maturity date matches when I'll need the money (Module 12.4 ladder) [ ] Pool depth checked for an early exit [ ] YT sized as speculation, not income Quiz 1. PT at 0.97, 120 days to maturity. Fixed APY? (1/0.97)^(365/120) − 1 ≈ 9.7%. 2. Does buying PT remove the underlying's risk? No. It fixes the rate. If the underlying depegs or is exploited, the PT redeems into a damaged asset. 3. What must happen for a YT to profit? Realised variable yield plus points must beat the implied rate priced into the PT.","video":null,"script":"video-scripts/lessons/lesson-10-1.json"},{"id":"10.2","title":"Cash-and-carry basis trades","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Capture the premium of a dated future over spot without taking a view on price.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>In rising markets, dated futures usually trade \u003cstrong>above\u003c/strong> spot. The gap (basis)\nshrinks to zero at expiry because the future settles at spot.\n\u003cstrong>Buy spot + short the future at the same size\u003c/strong> and you lock that gap,\nwhatever the price does, as long as both legs survive to expiry.\u003c/p>\n\u003cp>\u003ccode>annualised basis = (future ÷ spot − 1) × 365 ÷ days\u003c/code>\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>ETH spot \u003cstrong>3,000\u003c/strong>, 90-day future \u003cstrong>3,060\u003c/strong>.\u003c/p>\n\u003cul>\n\u003cli>Basis = 2.0% → \u003cstrong>8.11%\u003c/strong> annualised (\u003ccode>defi_calc.py basis --spot 3000 --future 3060 --days 90\u003c/code>).\u003c/li>\n\u003cli>At expiry, if ETH is 2,000: spot leg −1,000, short future +1,060 → +60 per ETH.\u003c/li>\n\u003cli>At expiry, if ETH is 4,500: spot leg +1,500, short future −1,440 → +60 per ETH.\u003c/li>\n\u003cli>\u003cstrong>The catch:\u003c/strong> before expiry, a rally to 4,500 means the short leg shows\n−1,440 per ETH. Without enough margin on the futures venue, it&#39;s closed out\nand you&#39;re left long spot at the top.\u003c/li>\n\u003c/ul>\n\u003c/section>\u003ch3>What this position is short\u003c/h3>\n\u003cp>Margin and venue risk: a squeeze on the short leg, or the venue failing.\u003c/p>\n\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.2:c0\">\u003cspan>Both legs opened together, same size\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.2:c1\">\u003cspan>Futures margin survives at least a +100% move, or a rule to top up\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.2:c2\">\u003cspan>Venue risk sized (cap per venue)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.2:c3\">\u003cspan>Plan to hold to expiry; early exit may be at a worse basis\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"10.2:q0\">\u003cdiv class=\"qtext\">Spot 2,000, 180-day future 2,080. Annualised basis?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>4% × 365/180 ≈ 8.1%.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.2:q1\">\u003cdiv class=\"qtext\">Why is the return &quot;locked&quot; at expiry?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The future settles at spot, so the gain on one leg offsets the loss on the other, leaving the entry basis.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.2:q2\">\u003cdiv class=\"qtext\">What breaks the trade before expiry?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A margin call or liquidation on the short future during a rally, or venue failure.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Capture the premium of a dated future over spot without taking a view on price. Explanation In rising markets, dated futures usually trade above spot. The gap (basis) shrinks to zero at expiry because the future settles at spot. Buy spot + short the future at the same size and you lock that gap, whatever the price does, as long as both legs survive to expiry. annualised basis = (future ÷ spot − 1) × 365 ÷ days Worked example ETH spot 3,000 , 90 day future 3,060 . Basis = 2.0% → 8.11% annualised ( defi calc.py basis spot 3000 future 3060 days 90 ). At expiry, if ETH is 2,000: spot leg −1,000, short future +1,060 → +60 per ETH. At expiry, if ETH is 4,500: spot leg +1,500, short future −1,440 → +60 per ETH. The catch: before expiry, a rally to 4,500 means the short leg shows −1,440 per ETH. Without enough margin on the futures venue, it's closed out and you're left long spot at the top. What this position is short Margin and venue risk: a squeeze on the short leg, or the venue failing. Checklist [ ] Both legs opened together, same size [ ] Futures margin survives at least a +100% move, or a rule to top up [ ] Venue risk sized (cap per venue) [ ] Plan to hold to expiry; early exit may be at a worse basis Quiz 1. Spot 2,000, 180 day future 2,080. Annualised basis? 4% × 365/180 ≈ 8.1%. 2. Why is the return \"locked\" at expiry? The future settles at spot, so the gain on one leg offsets the loss on the other, leaving the entry basis. 3. What breaks the trade before expiry? A margin call or liquidation on the short future during a rally, or venue failure.","video":null,"script":"video-scripts/lessons/lesson-10-2.json"},{"id":"10.3","title":"Delta-neutral funding carry, done properly","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Run a funding-carry position with proper sizing, venue limits and exit rules.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Perpetual futures pay \u003cstrong>funding\u003c/strong> between longs and shorts to keep the perp\nnear spot. In bullish markets longs usually pay shorts. Long spot + short\nperp at the same size = no net price exposure, while collecting funding.\u003c/p>\n\u003cp>Professional rules:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Measure funding over time, not today.\u003c/strong> Use a 7- and 30-day average.\u003c/li>\n\u003cli>\u003cstrong>Exit rule:\u003c/strong> close when the 7-day average turns negative (you&#39;d start paying).\u003c/li>\n\u003cli>\u003cstrong>Margin buffer:\u003c/strong> the short leg&#39;s leverage decides how big a rally it survives.\u003c/li>\n\u003cli>\u003cstrong>Venue limits:\u003c/strong> split across venues; cap each one.\u003c/li>\n\u003c/ol>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Funding \u003cstrong>+0.01% per 8h\u003c/strong> ≈ \u003cstrong>10.95% APR\u003c/strong> on the hedged size.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Short-leg leverage\u003c/th>\n\u003cth>Capital per $1 hedged\u003c/th>\n\u003cth>Return on capital\u003c/th>\n\u003cth>Short liquidates on a rally of roughly\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1×\u003c/td>\n\u003ctd>$2.00\u003c/td>\n\u003ctd>~5.5%\u003c/td>\n\u003ctd>+100%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2×\u003c/td>\n\u003ctd>$1.50\u003c/td>\n\u003ctd>~7.3%\u003c/td>\n\u003ctd>+50%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3×\u003c/td>\n\u003ctd>$1.33\u003c/td>\n\u003ctd>~8.2%\u003c/td>\n\u003ctd>+33%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003ccode>defi_calc.py carry --rate-8h 0.01 --short-lev 3\u003c/code>\u003c/p>\n\u003cp>Higher leverage improves return on capital a little and makes the position\nmuch more fragile. Most operators stay at 1–2× and top up margin from reserve.\u003c/p>\n\u003c/section>\u003ch3>What this position is short\u003c/h3>\n\u003cp>Funding turning negative, short squeezes, and venue failure.\u003c/p>\n\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.3:c0\">\u003cspan>7- and 30-day funding averages checked\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.3:c1\">\u003cspan>Exit rule written (e.g. 7-day average &lt; 0)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.3:c2\">\u003cspan>Short-leg leverage ≤ 2×, top-up plan from reserve\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.3:c3\">\u003cspan>Per-venue cap set\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"10.3:q0\">\u003cdiv class=\"qtext\">Funding is +0.005%/8h. APR on hedged size?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>≈ 5.5%.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.3:q1\">\u003cdiv class=\"qtext\">Why not run the short at 5×?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A ~20% rally would liquidate the short and leave you unhedged long.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.3:q2\">\u003cdiv class=\"qtext\">What&#39;s the exit signal?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Average funding turning negative, meaning shorts start paying.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Run a funding carry position with proper sizing, venue limits and exit rules. Explanation Perpetual futures pay funding between longs and shorts to keep the perp near spot. In bullish markets longs usually pay shorts. Long spot + short perp at the same size = no net price exposure, while collecting funding. Professional rules: 1. Measure funding over time, not today. Use a 7 and 30 day average. 2. Exit rule: close when the 7 day average turns negative (you'd start paying). 3. Margin buffer: the short leg's leverage decides how big a rally it survives. 4. Venue limits: split across venues; cap each one. Worked example Funding +0.01% per 8h ≈ 10.95% APR on the hedged size. Short leg leverage Capital per $1 hedged Return on capital Short liquidates on a rally of roughly 1× $2.00 ~5.5% +100% 2× $1.50 ~7.3% +50% 3× $1.33 ~8.2% +33% defi calc.py carry rate 8h 0.01 short lev 3 Higher leverage improves return on capital a little and makes the position much more fragile. Most operators stay at 1–2× and top up margin from reserve. What this position is short Funding turning negative, short squeezes, and venue failure. Checklist [ ] 7 and 30 day funding averages checked [ ] Exit rule written (e.g. 7 day average 1. Funding is +0.005%/8h. APR on hedged size? ≈ 5.5%. 2. Why not run the short at 5×? A ~20% rally would liquidate the short and leave you unhedged long. 3. What's the exit signal? Average funding turning negative, meaning shorts start paying.","video":null,"script":"video-scripts/lessons/lesson-10-3.json"},{"id":"10.4","title":"Options income: covered calls, cash-secured puts, options vaults","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Earn option premium on assets you&#39;d hold or buy anyway, knowing exactly what you give up.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Covered call:\u003c/strong> you hold the asset and sell someone the right to buy it\nfrom you at a higher \u003cstrong>strike\u003c/strong>. You keep the premium, and your upside is capped at the strike.\u003c/li>\n\u003cli>\u003cstrong>Cash-secured put:\u003c/strong> you hold stablecoins and sell someone the right to sell\nyou the asset at a lower strike. You keep the premium. If price falls below\nthe strike, you buy at the strike.\u003c/li>\n\u003cli>\u003cstrong>The wheel:\u003c/strong> sell puts until assigned → hold the asset → sell calls until\ncalled away → repeat.\u003c/li>\n\u003cli>\u003cstrong>Options vaults\u003c/strong> automate this on-chain. They add contract risk and you\ndon&#39;t choose the strikes.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>ETH at \u003cstrong>3,000\u003c/strong>.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Covered call:\u003c/strong> sell a 7-day \u003cstrong>3,300\u003c/strong> call for \u003cstrong>0.4%\u003c/strong> ($12).\n≈ \u003cstrong>20.9%\u003c/strong> annualised \u003cem>if\u003c/em> repeated at that premium, which it won&#39;t be exactly.\nMax gain for the week 10.4%. Break-even \u003cstrong>2,988\u003c/strong>.\n\u003ccode>defi_calc.py covered-call --spot 3000 --strike 3300 --premium 0.4\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>Cash-secured put:\u003c/strong> sell a 7-day \u003cstrong>2,700\u003c/strong> put for \u003cstrong>$12\u003c/strong> with $2,700 reserved\n→ \u003cstrong>0.44%\u003c/strong> on the cash for the week. If assigned, effective entry \u003cstrong>$2,688\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003c/section>\u003ch3>What this position is short\u003c/h3>\n\u003cp>Covered call: upside above the strike, plus the full downside of the asset.\nCash-secured put: a crash through the strike.\u003c/p>\n\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.4:c0\">\u003cspan>Only on assets I&#39;d hold (calls) or buy at the strike (puts)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.4:c1\">\u003cspan>Strike chosen from levels, not from the premium\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.4:c2\">\u003cspan>Annualised premium treated as &quot;if repeated&quot;, never promised\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.4:c3\">\u003cspan>Vault due diligence done if automating\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"10.4:q0\">\u003cdiv class=\"qtext\">What do you give up by selling a covered call?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Gains above the strike for that period.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.4:q1\">\u003cdiv class=\"qtext\">Put strike 2,700, premium $15. Effective entry if assigned?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>$2,685.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.4:q2\">\u003cdiv class=\"qtext\">Does premium protect you in a crash?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Only by the size of the premium. The asset&#39;s downside remains.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Earn option premium on assets you'd hold or buy anyway, knowing exactly wha
