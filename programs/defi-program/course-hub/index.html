systems (e.g. Cosmos chains connected by IBC, Move based chains) each have their own wallets, fees and bridges. Apply Module 5's dependency map to each. Same rules everywhere: official wallet from the official site, test transaction first, correct network, gas token on hand. Worked example You hold 1 BTC and want to lend it on Ethereum. Options: a custodial wrapper (trust one company), a decentralised wrapper (trust a signer set or protocol), or not wrapping at all. Write each option's trust model and cap wrapped BTC as bridge risk (5.1). Checklist [ ] Separate, official wallet for each non EVM chain I use [ ] Gas token held on each chain [ ] Wrapped BTC trust model known and capped Quiz 1. Does your Ethereum address work on Solana? No. It's a different ecosystem with its own address format and wallets. 2. What determines a wrapped BTC token's safety? Who holds the real BTC and how it can be redeemed: its trust model. 3. What's Solana's gas token? SOL.","video":null,"script":"video-scripts/lessons/lesson-05-6.json"},{"id":"5.7","title":"Operating across chains: gas, routes and chain abstraction","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Move value between chains cheaply and safely, without getting stranded without gas.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Gas stranding:\u003c/strong> tokens on a chain where you have no gas token can&#39;t move. Keep a small gas float on every chain you use.\u003c/li>\n\u003cli>\u003cstrong>Route choice:\u003c/strong> canonical bridge (safest, sometimes slow), fast bridge/liquidity network, exchange deposit-withdraw (often simplest for large amounts, but custodial for a moment), or intent-based cross-chain swaps (solvers deliver on the other chain).\u003c/li>\n\u003cli>\u003cstrong>Chain abstraction:\u003c/strong> wallets and apps increasingly hide chains (&quot;pay gas in USDC&quot;, &quot;one balance across chains&quot;) using smart accounts, paymasters and solvers. It&#39;s convenient, and every layer that hides complexity is also a dependency.\u003c/li>\n\u003cli>\u003cstrong>Always:\u003c/strong> check the destination network, send a test first, and record the route in your journal.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Moving $30,000 USDC from Arbitrum to Base: compare a canonical route via Ethereum\n(two transactions, slower, higher gas), a reputable fast bridge ($5–$15 fee, minutes),\nand an exchange (withdraw on Base; check the exchange supports USDC on both networks).\nSend $50 first by the chosen route, keep ~$5 of ETH on Base for gas, then send the rest.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.7:c0\">\u003cspan>Gas float on every chain I use\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.7:c1\">\u003cspan>Route chosen by trust model and size, not just speed\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.7:c2\">\u003cspan>Test amount first; route recorded\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"5.7:q0\">\u003cdiv class=\"qtext\">What is gas stranding?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Having tokens on a chain with no gas token to move them.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.7:q1\">\u003cdiv class=\"qtext\">Risk of chain abstraction?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Each hidden layer (smart accounts, paymasters, solvers) is an extra dependency.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.7:q2\">\u003cdiv class=\"qtext\">First step on any new route?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Send a small test amount.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Move value between chains cheaply and safely, without getting stranded without gas. Explanation Gas stranding: tokens on a chain where you have no gas token can't move. Keep a small gas float on every chain you use. Route choice: canonical bridge (safest, sometimes slow), fast bridge/liquidity network, exchange deposit withdraw (often simplest for large amounts, but custodial for a moment), or intent based cross chain swaps (solvers deliver on the other chain). Chain abstraction: wallets and apps increasingly hide chains (\"pay gas in USDC\", \"one balance across chains\") using smart accounts, paymasters and solvers. It's convenient, and every layer that hides complexity is also a dependency. Always: check the destination network, send a test first, and record the route in your journal. Worked example Moving $30,000 USDC from Arbitrum to Base: compare a canonical route via Ethereum (two transactions, slower, higher gas), a reputable fast bridge ($5–$15 fee, minutes), and an exchange (withdraw on Base; check the exchange supports USDC on both networks). Send $50 first by the chosen route, keep ~$5 of ETH on Base for gas, then send the rest. Checklist [ ] Gas float on every chain I use [ ] Route chosen by trust model and size, not just speed [ ] Test amount first; route recorded Quiz 1. What is gas stranding? Having tokens on a chain with no gas token to move them. 2. Risk of chain abstraction? Each hidden layer (smart accounts, paymasters, solvers) is an extra dependency. 3. First step on any new route? Send a small test amount.","video":null,"script":"video-scripts/lessons/lesson-05-7.json"},{"id":"5.8","title":"Reading smart-contract code: enough to verify claims","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Read verified contract code well enough to check the claims a protocol makes about itself.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>You don&#39;t need to be a developer to spot the things that matter. In verified Solidity code on an explorer, look for:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Access control:\u003c/strong> \u003ccode>onlyOwner\u003c/code>, \u003ccode>onlyRole(...)\u003c/code>, \u003ccode>onlyGovernance\u003c/code>. Who can call what? Search for functions guarded by them.\u003c/li>\n\u003cli>\u003cstrong>Dangerous powers:\u003c/strong> \u003ccode>mint\u003c/code>, \u003ccode>pause\u003c/code>, \u003ccode>upgradeTo\u003c/code>, \u003ccode>setOracle\u003c/code>, \u003ccode>setFee\u003c/code>, \u003ccode>withdraw\u003c/code>/\u003ccode>sweep\u003c/code>/\u003ccode>rescue\u003c/code> functions that move user funds.\u003c/li>\n\u003cli>\u003cstrong>Upgradeability:\u003c/strong> proxy patterns (\u003ccode>delegatecall\u003c/code>, \u003ccode>implementation\u003c/code>, \u003ccode>upgradeTo\u003c/code>), and who the admin is (5.4).\u003c/li>\n\u003cli>\u003cstrong>External calls and state order:\u003c/strong> calling another contract before updating balances is the classic reentrancy pattern (5.5).\u003c/li>\n\u003cli>\u003cstrong>Parameters with no limits:\u003c/strong> a fee that can be set to 100%, or an oracle address that can be swapped instantly.\u003c/li>\n\u003cli>\u003cstrong>Events:\u003c/strong> what&#39;s logged tells you what you can monitor.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A token claims &quot;fixed supply&quot;. In its code you find:\u003c/p>\n\u003cpre>\u003ccode>function mint(address to, uint256 amount) external onlyOwner { _mint(to, amount); }\n\u003c/code>\u003c/pre>\n\u003cp>The owner can mint unlimited tokens: the claim is false unless ownership is renounced\nor held by a timelocked governance contract. Check the \u003ccode>owner()\u003c/code> value on the Read tab.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.8:c0\">\u003cspan>Searched the code for owner/role-guarded functions\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.8:c1\">\u003cspan>Listed every function that can mint, pause, upgrade, change fees/oracles or move funds\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"5.8:c2\">\u003cspan>Checked who holds those roles (Read tab) and behind what timelock\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"5.8:q0\">\u003cdiv class=\"qtext\">What does \u003ccode>onlyOwner\u003c/code> on a mint function mean?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The owner can mint new tokens whenever they like.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.8:q1\">\u003cdiv class=\"qtext\">Why check parameter limits?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>An unlimited setter (fee, oracle) can be changed to harm users instantly.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"5.8:q2\">\u003cdiv class=\"qtext\">What code pattern suggests reentrancy risk?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>An external call made before the contract updates its own state.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Read verified contract code well enough to check the claims a protocol makes about itself. Explanation You don't need to be a developer to spot the things that matter. In verified Solidity code on an explorer, look for: Access control: onlyOwner , onlyRole(...) , onlyGovernance . Who can call what? Search for functions guarded by them. Dangerous powers: mint , pause , upgradeTo , setOracle , setFee , withdraw / sweep / rescue functions that move user funds. Upgradeability: proxy patterns ( delegatecall , implementation , upgradeTo ), and who the admin is (5.4). External calls and state order: calling another contract before updating balances is the classic reentrancy pattern (5.5). Parameters with no limits: a fee that can be set to 100%, or an oracle address that can be swapped instantly. Events: what's logged tells you what you can monitor. Worked example A token claims \"fixed supply\". In its code you find: function mint(address to, uint256 amount) external onlyOwner { mint(to, amount); } The owner can mint unlimited tokens: the claim is false unless ownership is renounced or held by a timelocked governance contract. Check the owner() value on the Read tab. Checklist [ ] Searched the code for owner/role guarded functions [ ] Listed every function that can mint, pause, upgrade, change fees/oracles or move funds [ ] Checked who holds those roles (Read tab) and behind what timelock Quiz 1. What does onlyOwner on a mint function mean? The owner can mint new tokens whenever they like. 2. Why check parameter limits? An unlimited setter (fee, oracle) can be changed to harm users instantly. 3. What code pattern suggests reentrancy risk? An external call made before the contract updates its own state.","video":null,"script":"video-scripts/lessons/lesson-05-8.json"}]},{"n":6,"title":"Protocol Research","outcome":"complete a full due-diligence file on a real protocol.","icon":"search","banner":"../assets/modules/module-06.png","intro":{"src":"../video/module-06-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"6.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>Before trusting a protocol with money, a professional researches it the same way every time: what it does, where its money comes from, what it depends on, whether it&#39;s solvent, what the evidence says, and how to get out.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Due diligence\u003c/td>\n\u003ctd>structured research before investing\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TVL\u003c/td>\n\u003ctd>total value deposited in a protocol\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FDV\u003c/td>\n\u003ctd>token price × maximum supply\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Governance\u003c/td>\n\u003ctd>how holders vote on changes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Thesis\u003c/td>\n\u003ctd>what must be true for the position to work\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.0:c0\">\u003cspan>Modules 0–5\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>Pick a protocol you&#39;ve heard of and write one sentence for each of the six research steps, even if it&#39;s &quot;don&#39;t know yet&quot;.\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Completes the six-step loop with sources\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Reads tokenomics and governance and writes a thesis with invalidation\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Spots failure patterns early and writes verdicts others can act on\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…your due-diligence file ends in a verdict with size, conditions and an exit.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version Before trusting a protocol with money, a professional researches it the same way every time: what it does, where its money comes from, what it depends on, whether it's solvent, what the evidence says, and how to get out. Words you'll need Term Meaning Due diligence structured research before investing TVL total value deposited in a protocol FDV token price × maximum supply Governance how holders vote on changes Thesis what must be true for the position to work Before you start [ ] Modules 0–5 Your first safe step Pick a protocol you've heard of and write one sentence for each of the six research steps, even if it's \"don't know yet\". The mastery ladder Level You can… Beginner Completes the six step loop with sources Practitioner Reads tokenomics and governance and writes a thesis with invalidation Master Spots failure patterns early and writes verdicts others can act on You've mastered this module when… …your due diligence file ends in a verdict with size, conditions and an exit.","video":null,"script":"video-scripts/lessons/lesson-06-0.json"},{"id":"6.1","title":"Protocol due diligence","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Run the 6-step research loop on a protocol and reach a written verdict.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Mechanism:\u003c/strong> what the contracts do; users, assets, incentives.\u003c/li>\n\u003cli>\u003cstrong>Cash flow:\u003c/strong> real fees and interest vs emissions.\u003c/li>\n\u003cli>\u003cstrong>Dependencies:\u003c/strong> oracles, bridges, admin keys, stablecoins, other protocols.\u003c/li>\n\u003cli>\u003cstrong>Solvency:\u003c/strong> collateral quality, liquidation design, bad-debt paths.\u003c/li>\n\u003cli>\u003cstrong>Evidence:\u003c/strong> explorers, audits, governance, independent data.\u003c/li>\n\u003cli>\u003cstrong>Exit:\u003c/strong> exact unwind, gas, slippage, approvals to revoke.\u003c/li>\n\u003c/ol>\n\u003cp>Log it in the \u003cstrong>DeFi Protocol Due Diligence Tracker\u003c/strong> (Notion) and tick a box\nonly when the step is \u003cstrong>evidenced\u003c/strong>, not assumed.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>\u003cem>&quot;Protocol Y (lending, Arbitrum). Risk: Medium. Fees are real (borrow demand\n$2M/yr), but one collateral uses a thin-market oracle and upgrades have a\n24h timelock. Verdict: supply stablecoins only, cap at 10% of the DeFi book,\nalert on queued upgrades.&quot;\u003c/em>\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.1:c0\">\u003cspan>All six steps written with sources\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.1:c1\">\u003cspan>Risk rating = worst material risk, not an average\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.1:c2\">\u003cspan>Verdict states size, conditions and exit\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"6.1:q0\">\u003cdiv class=\"qtext\">Why is the rating the worst risk, not the average?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>One failure point is enough to lose the position.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"6.1:q1\">\u003cdiv class=\"qtext\">Which step prevents getting stuck?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Step 6: Exit.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"6.1:q2\">\u003cdiv class=\"qtext\">When do you tick a tracker box?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Only when there&#39;s evidence for it.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Run the 6 step research loop on a protocol and reach a written verdict. Explanation 1. Mechanism: what the contracts do; users, assets, incentives. 2. Cash flow: real fees and interest vs emissions. 3. Dependencies: oracles, bridges, admin keys, stablecoins, other protocols. 4. Solvency: collateral quality, liquidation design, bad debt paths. 5. Evidence: explorers, audits, governance, independent data. 6. Exit: exact unwind, gas, slippage, approvals to revoke. Log it in the DeFi Protocol Due Diligence Tracker (Notion) and tick a box only when the step is evidenced , not assumed. Worked example (template verdict) \"Protocol Y (lending, Arbitrum). Risk: Medium. Fees are real (borrow demand $2M/yr), but one collateral uses a thin market oracle and upgrades have a 24h timelock. Verdict: supply stablecoins only, cap at 10% of the DeFi book, alert on queued upgrades.\" Checklist [ ] All six steps written with sources [ ] Risk rating = worst material risk, not an average [ ] Verdict states size, conditions and exit Quiz 1. Why is the rating the worst risk, not the average? One failure point is enough to lose the position. 2. Which step prevents getting stuck? Step 6: Exit. 3. When do you tick a tracker box? Only when there's evidence for it.","video":null,"script":"video-scripts/lessons/lesson-06-1.json"},{"id":"6.2","title":"Tokenomics: supply, unlocks, FDV, value capture","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Read a token&#39;s supply schedule and judge whether protocol success reaches the token.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Circulating supply:\u003c/strong> tokens tradable now. \u003cstrong>Max/total supply:\u003c/strong> all that will exist.\u003c/li>\n\u003cli>\u003cstrong>Market cap\u003c/strong> = price × circulating. \u003cstrong>FDV\u003c/strong> (fully diluted valuation) = price × max supply.\u003c/li>\n\u003cli>\u003cstrong>Unlocks/vesting:\u003c/strong> team and investor tokens released on a schedule; new supply that may be sold.\u003c/li>\n\u003cli>\u003cstrong>Emissions:\u003c/strong> ongoing new tokens (rewards).\u003c/li>\n\u003cli>\u003cstrong>Value capture:\u003c/strong> does protocol revenue actually reach token holders (fee share, buybacks), and how is it enforced?\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Price $2, circulating 100M, max 1B: market cap \u003cstrong>$200M\u003c/strong>, FDV \u003cstrong>$2B\u003c/strong>.\nNext month 50M unlock: circulating supply rises \u003cstrong>50%\u003c/strong>. Unless demand grows\nto match, that&#39;s heavy selling pressure. A low market cap with a huge FDV is a warning.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.2:c0\">\u003cspan>Market cap vs FDV compared\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.2:c1\">\u003cspan>Next 12 months of unlocks listed\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.2:c2\">\u003cspan>Value-capture mechanism identified (or &quot;none&quot;)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"6.2:q0\">\u003cdiv class=\"qtext\">Price $5, circulating 20M, max 100M. FDV?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>$500M.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"6.2:q1\">\u003cdiv class=\"qtext\">Why do unlocks matter?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>They add supply that recipients may sell.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"6.2:q2\">\u003cdiv class=\"qtext\">What is value capture?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>An enforceable way protocol success benefits the token.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Read a token's supply schedule and judge whether protocol success reaches the token. Explanation Circulating supply: tokens tradable now. Max/total supply: all that will exist. Market cap = price × circulating. FDV (fully diluted valuation) = price × max supply. Unlocks/vesting: team and investor tokens released on a schedule; new supply that may be sold. Emissions: ongoing new tokens (rewards). Value capture: does protocol revenue actually reach token holders (fee share, buybacks), and how is it enforced? Worked example Price $2, circulating 100M, max 1B: market cap $200M , FDV $2B . Next month 50M unlock: circulating supply rises 50% . Unless demand grows to match, that's heavy selling pressure. A low market cap with a huge FDV is a warning. Checklist [ ] Market cap vs FDV compared [ ] Next 12 months of unlocks listed [ ] Value capture mechanism identified (or \"none\") Quiz 1. Price $5, circulating 20M, max 100M. FDV? $500M. 2. Why do unlocks matter? They add supply that recipients may sell. 3. What is value capture? An enforceable way protocol success benefits the token.","video":null,"script":"video-scripts/lessons/lesson-06-2.json"},{"id":"6.3","title":"Governance & DAOs","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Read how a protocol is controlled and spot governance risk before it hits your position.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Governance tokens\u003c/strong> vote on parameters, upgrades and treasury.\u003c/li>\n\u003cli>\u003cstrong>Proposal lifecycle:\u003c/strong> forum discussion → vote → timelock → execution.\u003c/li>\n\u003cli>\u003cstrong>Delegation\u003c/strong> lets holders assign votes to representatives.\u003c/li>\n\u003cli>\u003cstrong>Risks:\u003c/strong> low turnout, concentrated voting power, borrowed votes, rushed proposals, weak timelocks.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A proposal to raise a collateral&#39;s LTV passes with 8% turnout, 70% of it from\nthree wallets. Lenders now carry more bad-debt risk, decided by a few voters.\n\u003cstrong>Track governance for markets you&#39;re in.\u003c/strong> It changes your risk without you doing anything.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.3:c0\">\u003cspan>Governance forum/alerts followed for protocols I use\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.3:c1\">\u003cspan>Voting concentration checked\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.3:c2\">\u003cspan>Timelock length known\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"6.3:q0\">\u003cdiv class=\"qtext\">What&#39;s a governance attack?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Using concentrated or borrowed voting power to pass harmful changes.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"6.3:q1\">\u003cdiv class=\"qtext\">Why follow governance as a user?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Parameter changes alter your risk.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"6.3:q2\">\u003cdiv class=\"qtext\">Order of the proposal lifecycle?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Discussion → vote → timelock → execution.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Read how a protocol is controlled and spot governance risk before it hits your position. Explanation Governance tokens vote on parameters, upgrades and treasury. Proposal lifecycle: forum discussion → vote → timelock → execution. Delegation lets holders assign votes to representatives. Risks: low turnout, concentrated voting power, borrowed votes, rushed proposals, weak timelocks. Worked example A proposal to raise a collateral's LTV passes with 8% turnout, 70% of it from three wallets. Lenders now carry more bad debt risk, decided by a few voters. Track governance for markets you're in. It changes your risk without you doing anything. Checklist [ ] Governance forum/alerts followed for protocols I use [ ] Voting concentration checked [ ] Timelock length known Quiz 1. What's a governance attack? Using concentrated or borrowed voting power to pass harmful changes. 2. Why follow governance as a user? Parameter changes alter your risk. 3. Order of the proposal lifecycle? Discussion → vote → timelock → execution.","video":null,"script":"video-scripts/lessons/lesson-06-3.json"},{"id":"6.4","title":"The on-chain research workflow","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Turn research into a written thesis with invalidation and monitoring.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>\u003cstrong>Question first\u003c/strong> → primary sources (docs, contracts, governance) → economic\nreality (fees vs incentives) → cross-check with independent data → \u003cstrong>thesis\u003c/strong>:\nwhat must be true, what would prove it wrong, what to monitor.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>\u003cem>&quot;Thesis: stablecoin lending on Protocol Z earns ~5% from real borrow demand.\nMust be true: utilisation 60–85%, oracle unchanged, no new risky collateral.\nInvalidation: utilisation &gt; 95% for 48h, a governance change adding thin\ncollateral, or an incident. Monitor: weekly utilisation, governance feed.&quot;\u003c/em>\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.4:c0\">\u003cspan>Research question written first\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.4:c1\">\u003cspan>Thesis, invalidation and monitoring written\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.4:c2\">\u003cspan>Evidence from at least two independent sources\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"6.4:q0\">\u003cdiv class=\"qtext\">Why start with a question?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>To avoid hunting for data that confirms what you already believe.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"6.4:q1\">\u003cdiv class=\"qtext\">What makes a thesis useful?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A clear invalidation you&#39;ll act on.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"6.4:q2\">\u003cdiv class=\"qtext\">What should monitoring track?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Only the metrics that would change the thesis.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Turn research into a written thesis with invalidation and monitoring. Explanation Question first → primary sources (docs, contracts, governance) → economic reality (fees vs incentives) → cross check with independent data → thesis : what must be true, what would prove it wrong, what to monitor. Worked example (thesis template) \"Thesis: stablecoin lending on Protocol Z earns ~5% from real borrow demand. Must be true: utilisation 60–85%, oracle unchanged, no new risky collateral. Invalidation: utilisation 95% for 48h, a governance change adding thin collateral, or an incident. Monitor: weekly utilisation, governance feed.\" Checklist [ ] Research question written first [ ] Thesis, invalidation and monitoring written [ ] Evidence from at least two independent sources Quiz 1. Why start with a question? To avoid hunting for data that confirms what you already believe. 2. What makes a thesis useful? A clear invalidation you'll act on. 3. What should monitoring track? Only the metrics that would change the thesis.","video":null,"script":"video-scripts/lessons/lesson-06-4.json"},{"id":"6.5","title":"Case studies: how DeFi failures happened","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Learn the patterns behind major failures so you recognise them early.\u003c/p>\n\u003c/section>\u003ch3>Explanation — seven failures, seven patterns\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Case\u003c/th>\n\u003cth>What broke\u003c/th>\n\u003cth>Pattern\u003c/th>\n\u003cth>Warning signs\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Black Thursday, March 2020\u003c/strong> (Maker)\u003c/td>\n\u003ctd>ETH crashed; congested network and failing keeper bots let some collateral auctions clear at 0 DAI bids (~$8M lost)\u003c/td>\n\u003ctd>Liquidation mechanism failure under stress\u003c/td>\n\u003ctd>Auctions relying on keepers during congestion; no minimum bid\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>TerraUSD (UST), May 2022\u003c/strong>\u003c/td>\n\u003ctd>Algorithmic stablecoin lost its peg and collapsed\u003c/td>\n\u003ctd>Reflexive design: confidence was the collateral\u003c/td>\n\u003ctd>Yield (~20%) far above any real cash flow; peg defended by a sister token\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Ronin bridge, March 2022\u003c/strong> (~$600M)\u003c/td>\n\u003ctd>Attackers got 5 of 9 validator keys\u003c/td>\n\u003ctd>Weak bridge trust model\u003c/td>\n\u003ctd>Small signer set; keys concentrated\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Mango Markets, Oct 2022\u003c/strong> (~$110M)\u003c/td>\n\u003ctd>Collateral price pumped on thin markets, then borrowed against\u003c/td>\n\u003ctd>Oracle manipulation\u003c/td>\n\u003ctd>Thin-market collateral valued at spot\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>FTX, Nov 2022\u003c/strong>\u003c/td>\n\u003ctd>Exchange used customer funds\u003c/td>\n\u003ctd>Custodial (CeFi) counterparty failure\u003c/td>\n\u003ctd>Opaque reserves; &quot;not your keys&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Euler Finance, March 2023\u003c/strong> (~$197M, later largely returned)\u003c/td>\n\u003ctd>Logic flaw in a lending function\u003c/td>\n\u003ctd>Contract bug missed by audits\u003c/td>\n\u003ctd>Complex new function added after earlier audits\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Curve pools, July 2023\u003c/strong>\u003c/td>\n\u003ctd>Reentrancy guard broken by a compiler bug\u003c/td>\n\u003ctd>Toolchain risk\u003c/td>\n\u003ctd>Rare. Shows audited code can fail from below\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Figures are approximate, from public reporting.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Using the table: a new stablecoin offers 18% &quot;sustainable&quot; yield, backed by its own\ngovernance token. That&#39;s the UST pattern: reflexive collateral and yield with no\nmatching cash flow. Rating: High. Verdict: don&#39;t hold.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.5:c0\">\u003cspan>For every position, I&#39;ve asked which failure pattern it resembles\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.5:c1\">\u003cspan>My register (8.2) includes these seven patterns\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"6.5:q0\">\u003cdiv class=\"qtext\">What pattern did Mango Markets show?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Oracle manipulation of thin-market collateral.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"6.5:q1\">\u003cdiv class=\"qtext\">What did FTX show DeFi users?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Custodial counterparty risk: &quot;not your keys, not your coins&quot;.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"6.5:q2\">\u003cdiv class=\"qtext\">UST&#39;s main warning sign?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>High yield with no matching real cash flow, backed by a reflexive sister token.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Learn the patterns behind major failures so you recognise them early. Explanation — seven failures, seven patterns Case What broke Pattern Warning signs Black Thursday, March 2020 (Maker) ETH crashed; congested network and failing keeper bots let some collateral auctions clear at 0 DAI bids (~$8M lost) Liquidation mechanism failure under stress Auctions relying on keepers during congestion; no minimum bid TerraUSD (UST), May 2022 Algorithmic stablecoin lost its peg and collapsed Reflexive design: confidence was the collateral Yield (~20%) far above any real cash flow; peg defended by a sister token Ronin bridge, March 2022 (~$600M) Attackers got 5 of 9 validator keys Weak bridge trust model Small signer set; keys concentrated Mango Markets, Oct 2022 (~$110M) Collateral price pumped on thin markets, then borrowed against Oracle manipulation Thin market collateral valued at spot FTX, Nov 2022 Exchange used customer funds Custodial (CeFi) counterparty failure Opaque reserves; \"not your keys\" Euler Finance, March 2023 (~$197M, later largely returned) Logic flaw in a lending function Contract bug missed by audits Complex new function added after earlier audits Curve pools, July 2023 Reentrancy guard broken by a compiler bug Toolchain risk Rare. Shows audited code can fail from below Figures are approximate, from public reporting. Worked example Using the table: a new stablecoin offers 18% \"sustainable\" yield, backed by its own governance token. That's the UST pattern: reflexive collateral and yield with no matching cash flow. Rating: High. Verdict: don't hold. Checklist [ ] For every position, I've asked which failure pattern it resembles [ ] My register (8.2) includes these seven patterns Quiz 1. What pattern did Mango Markets show? Oracle manipulation of thin market collateral. 2. What did FTX show DeFi users? Custodial counterparty risk: \"not your keys, not your coins\". 3. UST's main warning sign? High yield with no matching real cash flow, backed by a reflexive sister token.","video":null,"script":"video-scripts/lessons/lesson-06-5.json"},{"id":"6.6","title":"Vote-escrow tokenomics, bribes and governance markets","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Understand vote-escrow (&quot;ve&quot;) systems and bribe markets, a major source of DeFi yield and power.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Vote-escrow:\u003c/strong> you lock a governance token for a period (often up to 4 years) and get \u003cstrong>ve-tokens\u003c/strong> with voting power that decays as the unlock approaches. Longer lock = more power.\u003c/li>\n\u003cli>\u003cstrong>Gauges:\u003c/strong> ve-holders vote on which pools receive the protocol&#39;s token \u003cstrong>emissions\u003c/strong>. Emissions attract liquidity, so votes are valuable.\u003c/li>\n\u003cli>\u003cstrong>Bribes / voting incentives:\u003c/strong> protocols that want liquidity pay ve-holders to vote for their pool. Voters earn this as yield (plus a share of fees in some designs).\u003c/li>\n\u003cli>\u003cstrong>Liquid lockers / meta-governance:\u003c/strong> protocols that lock on your behalf and give you a tradable token. It&#39;s liquid, but it can trade at a discount, and it adds a layer of risk.\u003c/li>\n\u003cli>\u003cstrong>Risks:\u003c/strong> long locks (you can&#39;t sell), the token&#39;s price over the lock, emissions diluting holders, and governance capture.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>$10,000 of a ve-token earning ~15% APR in bribes ≈ \u003cstrong>$1,500/yr\u003c/strong>, paid in various tokens.\nBut the underlying is locked for 4 years: if the token falls 60%, the position is worth\n$4,000 plus the bribes collected. A liquid-locker version lets you exit, but it traded at a\n20% discount during the last sell-off. Price the lock, not just the APR.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.6:c0\">\u003cspan>Lock length and decay understood\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.6:c1\">\u003cspan>Bribe income valued at a realistic sale price\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.6:c2\">\u003cspan>Liquid-locker discount history checked before using one\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"6.6:q0\">\u003cdiv class=\"qtext\">What do ve-holders vote on?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Which pools receive emissions (gauge weights) and other governance decisions.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"6.6:q1\">\u003cdiv class=\"qtext\">Why do protocols pay bribes?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Votes direct emissions to their pools, attracting liquidity.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"6.6:q2\">\u003cdiv class=\"qtext\">Main cost of a 4-year lock?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>You can&#39;t sell during the lock, whatever the token&#39;s price does.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Understand vote escrow (\"ve\") systems and bribe markets, a major source of DeFi yield and power. Explanation Vote escrow: you lock a governance token for a period (often up to 4 years) and get ve tokens with voting power that decays as the unlock approaches. Longer lock = more power. Gauges: ve holders vote on which pools receive the protocol's token emissions . Emissions attract liquidity, so votes are valuable. Bribes / voting incentives: protocols that want liquidity pay ve holders to vote for their pool. Voters earn this as yield (plus a share of fees in some designs). Liquid lockers / meta governance: protocols that lock on your behalf and give you a tradable token. It's liquid, but it can trade at a discount, and it adds a layer of risk. Risks: long locks (you can't sell), the token's price over the lock, emissions diluting holders, and governance capture. Worked example $10,000 of a ve token earning ~15% APR in bribes ≈ $1,500/yr , paid in various tokens. But the underlying is locked for 4 years: if the token falls 60%, the position is worth $4,000 plus the bribes collected. A liquid locker version lets you exit, but it traded at a 20% discount during the last sell off. Price the lock, not just the APR. Checklist [ ] Lock length and decay understood [ ] Bribe income valued at a realistic sale price [ ] Liquid locker discount history checked before using one Quiz 1. What do ve holders vote on? Which pools receive emissions (gauge weights) and other governance decisions. 2. Why do protocols pay bribes? Votes direct emissions to their pools, attracting liquidity. 3. Main cost of a 4 year lock? You can't sell during the lock, whatever the token's price does.","video":null,"script":"video-scripts/lessons/lesson-06-6.json"},{"id":"6.7","title":"Valuing DeFi protocols: fees, revenue, earnings and multiples","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Compare protocols on their economics, not their narratives.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Fees:\u003c/strong> everything users pay. \u003cstrong>Revenue:\u003c/strong> the part that goes to the protocol or token holders (the rest goes to LPs/lenders). \u003cstrong>Earnings:\u003c/strong> revenue minus token incentives paid out.\u003c/li>\n\u003cli>\u003cstrong>Multiples:\u003c/strong> price-to-fees (P/F), price-to-sales (P/S, on revenue), price-to-earnings (P/E). Use \u003cstrong>FDV\u003c/strong> as well as market cap, since unlocks will arrive (6.2).\u003c/li>\n\u003cli>\u003cstrong>Quality checks:\u003c/strong> is revenue growing without rising incentives? Is it concentrated in one pool or chain? Does it survive a bear market? Does the token actually receive it (value capture)?\u003c/li>\n\u003cli>Multiples compare protocols; they don&#39;t set a &quot;right&quot; price.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>FDV \u003cstrong>$2B\u003c/strong>, annual revenue \u003cstrong>$100M\u003c/strong>, token incentives \u003cstrong>$60M\u003c/strong> → earnings \u003cstrong>$40M\u003c/strong>.\nP/S (FDV) = \u003cstrong>20×\u003c/strong>; P/E (FDV) = \u003cstrong>50×\u003c/strong>. A rival with the same revenue but no incentives\nhas earnings of $100M: at the same FDV its P/E is 20×. Same revenue, very different economics.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.7:c0\">\u003cspan>Fees, revenue and earnings separated, with sources\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.7:c1\">\u003cspan>Multiples on FDV and market cap\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"6.7:c2\">\u003cspan>Revenue quality and value capture assessed\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"6.7:q0\">\u003cdiv class=\"qtext\">Revenue vs earnings?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Earnings are revenue minus token incentives (and other costs).\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"6.7:q1\">\u003cdiv class=\"qtext\">Why use FDV in multiples?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Future unlocks will add supply; FDV shows the fully diluted price.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"6.7:q2\">\u003cdiv class=\"qtext\">FDV $600M, earnings $20M. P/E?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>30×.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Compare protocols on their economics, not their narratives. Explanation Fees: everything users pay. Revenue: the part that goes to the protocol or token holders (the rest goes to LPs/lenders). Earnings: revenue minus token incentives paid out. Multiples: price to fees (P/F), price to sales (P/S, on revenue), price to earnings (P/E). Use FDV as well as market cap, since unlocks will arrive (6.2). Quality checks: is revenue growing without rising incentives? Is it concentrated in one pool or chain? Does it survive a bear market? Does the token actually receive it (value capture)? Multiples compare protocols; they don't set a \"right\" price. Worked example FDV $2B , annual revenue $100M , token incentives $60M → earnings $40M . P/S (FDV) = 20× ; P/E (FDV) = 50× . A rival with the same revenue but no incentives has earnings of $100M: at the same FDV its P/E is 20×. Same revenue, very different economics. Checklist [ ] Fees, revenue and earnings separated, with sources [ ] Multiples on FDV and market cap [ ] Revenue quality and value capture assessed Quiz 1. Revenue vs earnings? Earnings are revenue minus token incentives (and other costs). 2. Why use FDV in multiples? Future unlocks will add supply; FDV shows the fully diluted price. 3. FDV $600M, earnings $20M. P/E? 30×.","video":null,"script":"video-scripts/lessons/lesson-06-7.json"}]},{"n":7,"title":"On-Chain Analytics","outcome":"read on-chain data without over-interpreting it.","icon":"chart","banner":"../assets/modules/module-07.png","intro":{"src":"../video/module-07-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"7.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>Everything on a public blockchain can be seen, but not everything can be understood. On-chain analytics means reading that data carefully: who moved what, where liquidity sits, how positioned the market is, without jumping to conclusions.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Explorer\u003c/td>\n\u003ctd>a site showing every transaction\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Netflow\u003c/td>\n\u003ctd>exchange inflows minus outflows\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MVRV\u003c/td>\n\u003ctd>market value ÷ realised value\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Open interest\u003c/td>\n\u003ctd>total open futures contracts\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Depth\u003c/td>\n\u003ctd>how much a trade moves price\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.0:c0\">\u003cspan>Modules 0–6\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>Find your own last transaction on an explorer and identify: status, fee, method and token transfers.\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Reads transactions and addresses on explorers\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Uses flows, holder, activity and liquidity metrics with caveats\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Combines on-chain, derivatives and liquidity data into a research view without over-interpreting\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…every metric in your research has a definition, a source and a caveat.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version Everything on a public blockchain can be seen, but not everything can be understood. On chain analytics means reading that data carefully: who moved what, where liquidity sits, how positioned the market is, without jumping to conclusions. Words you'll need Term Meaning Explorer a site showing every transaction Netflow exchange inflows minus outflows MVRV market value ÷ realised value Open interest total open futures contracts Depth how much a trade moves price Before you start [ ] Modules 0–6 Your first safe step Find your own last transaction on an explorer and identify: status, fee, method and token transfers. The mastery ladder Level You can… Beginner Reads transactions and addresses on explorers Practitioner Uses flows, holder, activity and liquidity metrics with caveats Master Combines on chain, derivatives and liquidity data into a research view without over interpreting You've mastered this module when… …every metric in your research has a definition, a source and a caveat.","video":null,"script":"video-scripts/lessons/lesson-07-0.json"},{"id":"7.1","title":"On-chain data foundations","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Avoid the classic misreads of on-chain data.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Address ≠ person:\u003c/strong> one person can have many addresses; one exchange address serves millions.\u003c/li>\n\u003cli>\u003cstrong>Transfer ≠ trade:\u003c/strong> moving tokens isn&#39;t buying or selling.\u003c/li>\n\u003cli>\u003cstrong>Labels are probabilistic:\u003c/strong> providers guess who owns what; they can be wrong.\u003c/li>\n\u003cli>\u003cstrong>Active addresses\u003c/strong> can be inflated by bots or airdrop farming.\u003c/li>\n\u003cli>\u003cstrong>Data provenance:\u003c/strong> know chain coverage, indexing method and delay.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>&quot;Whale moves $100M of BTC!&quot; It&#39;s an exchange shuffling between its own cold and\nhot wallets. No trade happened. Check labels, destination and history before reacting.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.1:c0\">\u003cspan>I check what an address is before interpreting a move\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.1:c1\">\u003cspan>I note each metric&#39;s source and definition\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"7.1:q0\">\u003cdiv class=\"qtext\">Does an address equal a person?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.1:q1\">\u003cdiv class=\"qtext\">Is a large transfer a sale?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Not necessarily. It may be internal or custodial.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.1:q2\">\u003cdiv class=\"qtext\">Why can active-address counts mislead?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Bots and farming inflate them.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Avoid the classic misreads of on chain data. Explanation Address ≠ person: one person can have many addresses; one exchange address serves millions. Transfer ≠ trade: moving tokens isn't buying or selling. Labels are probabilistic: providers guess who owns what; they can be wrong. Active addresses can be inflated by bots or airdrop farming. Data provenance: know chain coverage, indexing method and delay. Worked example \"Whale moves $100M of BTC!\" It's an exchange shuffling between its own cold and hot wallets. No trade happened. Check labels, destination and history before reacting. Checklist [ ] I check what an address is before interpreting a move [ ] I note each metric's source and definition Quiz 1. Does an address equal a person? No. 2. Is a large transfer a sale? Not necessarily. It may be internal or custodial. 3. Why can active address counts mislead? Bots and farming inflate them.","video":null,"script":"video-scripts/lessons/lesson-07-1.json"},{"id":"7.2","title":"Block explorer mastery","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Read any transaction on an explorer without using the app&#39;s interface.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>For a transaction: \u003cstrong>status\u003c/strong> (success/fail), \u003cstrong>block\u003c/strong>, \u003cstrong>from/to\u003c/strong>, \u003cstrong>value\u003c/strong>,\n\u003cstrong>fee\u003c/strong>, \u003cstrong>method\u003c/strong> called, \u003cstrong>token transfers\u003c/strong> (events), \u003cstrong>internal calls\u003c/strong>, and\n\u003cstrong>logs\u003c/strong>. For a contract: \u003cstrong>read\u003c/strong> (state, parameters) and \u003cstrong>write\u003c/strong> (call\nfunctions directly, carefully) tabs; \u003cstrong>proxy\u003c/strong> info; \u003cstrong>verified source\u003c/strong>.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Your swap on an L2: status Success · method \u003ccode>swap\u003c/code> · token transfers: 100 USDC\nout, 0.0331 ETH in · fee 0.00002 ETH. The event log confirms the router and\npool. You&#39;ve verified the trade without trusting the website.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.2:c0\">\u003cspan>I can find status, fee, method and token transfers\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.2:c1\">\u003cspan>I can read a contract&#39;s parameters on the Read tab\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.2:c2\">\u003cspan>I can check and revoke approvals\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"7.2:q0\">\u003cdiv class=\"qtext\">Where do you see tokens that actually moved?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Token transfers (event logs).\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.2:q1\">\u003cdiv class=\"qtext\">What does the Read tab show?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A contract&#39;s public state and parameters.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.2:q2\">\u003cdiv class=\"qtext\">Why verify on the explorer?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It&#39;s the ground truth, independent of any website.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Read any transaction on an explorer without using the app's interface. Explanation For a transaction: status (success/fail), block , from/to , value , fee , method called, token transfers (events), internal calls , and logs . For a contract: read (state, parameters) and write (call functions directly, carefully) tabs; proxy info; verified source . Worked example Your swap on an L2: status Success · method swap · token transfers: 100 USDC out, 0.0331 ETH in · fee 0.00002 ETH. The event log confirms the router and pool. You've verified the trade without trusting the website. Checklist [ ] I can find status, fee, method and token transfers [ ] I can read a contract's parameters on the Read tab [ ] I can check and revoke approvals Quiz 1. Where do you see tokens that actually moved? Token transfers (event logs). 2. What does the Read tab show? A contract's public state and parameters. 3. Why verify on the explorer? It's the ground truth, independent of any website.","video":null,"script":"video-scripts/lessons/lesson-07-2.json"},{"id":"7.3","title":"Exchange flows","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Interpret exchange inflows and outflows with the right caveats.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>\u003cstrong>Inflows\u003c/strong> to exchanges \u003cem>may\u003c/em> precede selling (or collateral posting,\ninternal moves). \u003cstrong>Outflows\u003c/strong> \u003cem>may\u003c/em> mean self-custody or DeFi use.\n\u003cstrong>Netflow\u003c/strong> = inflows − outflows. Exchange reserves on-chain aren&#39;t proof of\nsolvency (liabilities aren&#39;t visible).\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Netflow +20,000 ETH in a day. Before concluding &quot;selling pressure&quot;: check if it&#39;s\none exchange reshuffling, whether derivatives open interest rose (collateral), and\nwhether price and volume confirm. One metric is a hypothesis, not a signal.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.3:c0\">\u003cspan>Flows cross-checked with price, volume and derivatives\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.3:c1\">\u003cspan>Internal exchange moves ruled out\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"7.3:q0\">\u003cdiv class=\"qtext\">What is netflow?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Inflows minus outflows over a period.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.3:q1\">\u003cdiv class=\"qtext\">Do exchange reserves prove solvency?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. Liabilities aren&#39;t visible on-chain.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.3:q2\">\u003cdiv class=\"qtext\">Is a large inflow always bearish?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. It can be collateral or an internal move.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Interpret exchange inflows and outflows with the right caveats. Explanation Inflows to exchanges may precede selling (or collateral posting, internal moves). Outflows may mean self custody or DeFi use. Netflow = inflows − outflows. Exchange reserves on chain aren't proof of solvency (liabilities aren't visible). Worked example Netflow +20,000 ETH in a day. Before concluding \"selling pressure\": check if it's one exchange reshuffling, whether derivatives open interest rose (collateral), and whether price and volume confirm. One metric is a hypothesis, not a signal. Checklist [ ] Flows cross checked with price, volume and derivatives [ ] Internal exchange moves ruled out Quiz 1. What is netflow? Inflows minus outflows over a period. 2. Do exchange reserves prove solvency? No. Liabilities aren't visible on chain. 3. Is a large inflow always bearish? No. It can be collateral or an internal move.","video":null,"script":"video-scripts/lessons/lesson-07-3.json"},{"id":"7.4","title":"Whale & entity analysis","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Use large-holder data without copying wallets blindly.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Separate exchanges and contracts from individuals before measuring\nconcentration. \u003cstrong>Accumulation/distribution\u003c/strong> is inferred, not known.\n\u003cstrong>&quot;Smart money&quot; labels\u003c/strong> carry survivorship bias. \u003cstrong>Copying wallets\u003c/strong> ignores\ntheir hedges, size and private information.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A &quot;smart money&quot; wallet buys a token. You don&#39;t see its perp short elsewhere; it\nmay be hedged and farming. Copying the visible leg makes you the unhedged one.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.4:c0\">\u003cspan>Contracts/exchanges excluded from concentration figures\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.4:c1\">\u003cspan>Wallet-following treated as a lead to research, not a signal\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"7.4:q0\">\u003cdiv class=\"qtext\">Why is wallet-copying risky?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>You can&#39;t see the wallet&#39;s hedges, size or intent.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.4:q1\">\u003cdiv class=\"qtext\">What is survivorship bias in labels?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Only wallets that did well get labelled &quot;smart&quot;.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.4:q2\">\u003cdiv class=\"qtext\">First step in measuring holder concentration?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Remove exchange and contract addresses.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Use large holder data without copying wallets blindly. Explanation Separate exchanges and contracts from individuals before measuring concentration. Accumulation/distribution is inferred, not known. \"Smart money\" labels carry survivorship bias. Copying wallets ignores their hedges, size and private information. Worked example A \"smart money\" wallet buys a token. You don't see its perp short elsewhere; it may be hedged and farming. Copying the visible leg makes you the unhedged one. Checklist [ ] Contracts/exchanges excluded from concentration figures [ ] Wallet following treated as a lead to research, not a signal Quiz 1. Why is wallet copying risky? You can't see the wallet's hedges, size or intent. 2. What is survivorship bias in labels? Only wallets that did well get labelled \"smart\". 3. First step in measuring holder concentration? Remove exchange and contract addresses.","video":null,"script":"video-scripts/lessons/lesson-07-4.json"},{"id":"7.5","title":"Holder & supply metrics","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Read MVRV, SOPR and HODL waves as context, not signals.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Realised cap:\u003c/strong> values each coin at the price it last moved (a cost-basis estimate).\u003c/li>\n\u003cli>\u003cstrong>MVRV\u003c/strong> = market cap ÷ realised cap. High = holders in large aggregate profit.\u003c/li>\n\u003cli>\u003cstrong>SOPR\u003c/strong> (spent output profit ratio): &gt;1 means coins moved today were, on average, sold at a profit.\u003c/li>\n\u003cli>\u003cstrong>HODL waves:\u003c/strong> supply by coin age.\u003c/li>\n\u003cli>Definitions differ by provider; strongest on UTXO chains like Bitcoin.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Market cap $1.2T, realised cap $0.6T → \u003cstrong>MVRV 2.0\u003c/strong>: the average holder is at\nroughly 2× their cost basis. That&#39;s context for risk management (e.g. how much to\nde-risk), not a precise top signal.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.5:c0\">\u003cspan>Provider methodology read before using a metric\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"7.5:c1\">\u003cspan>Metrics used for context and sizing, not as triggers alone\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"7.5:q0\">\u003cdiv class=\"qtext\">MVRV formula?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Market cap ÷ realised cap.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.5:q1\">\u003cdiv class=\"qtext\">SOPR above 1 means?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Coins moved were, on average, in profit.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"7.5:q2\">\u003cdiv class=\"qtext\">Why read the provider&#39;s methodology?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Definitions vary, and interpretations depend on them.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Read MVRV, SOPR and HODL waves as context, not signals. Explanation Realised cap: values each coin at the price it last moved (a cost basis estimate). MVRV = market cap ÷ realised cap. High = holders in large aggregate profit. SOPR (spent output profit ratio): 1 means coins moved today were, on average, sold at a profit. HODL waves: supply by coin age. Definitions differ by provider; strongest on UTXO chains like Bitcoin. Worked example Market cap $1.2T, realised cap $0.6T → MVRV 2.0 : the average holder is at roughly 2× their cost basis. That's context for risk management (e.g. how much to de risk), not a precise top signal. Checklist [ ] Provider methodology read before using a metric [ ] Metrics used for context and sizing, not as triggers alone Quiz 1. MVRV formula? Market cap ÷ realised cap. 2. SOPR above 1 means? Coins moved were, on average, in profit. 3. Why read the provider's methodology? Definitions vary, and interpretations depend on them.","video":null,"script":"video-scripts/lessons/lesson-07-5.json"},{"id":"7.6","title":"Network activity","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Judge a chain&#39;s real usage beyond transaction counts.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Transaction counts depend on architecture and bots. Better: \u003cstrong>fees paid\u003c/strong>\n(real demand for blockspace), \u003cstrong>stablecoin activity\u003c/strong>, \u003cstrong>DEX volume\u003c/strong>, \u003cstrong>app\nrevenue\u003c/strong>, and retention of users over time.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Chain A: 5M transactions/day, $20k fees. Chain B: 500k
