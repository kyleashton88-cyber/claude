t you give up. Explanation Covered call: you hold the asset and sell someone the right to buy it from you at a higher strike . You keep the premium, and your upside is capped at the strike. Cash secured put: you hold stablecoins and sell someone the right to sell you the asset at a lower strike. You keep the premium. If price falls below the strike, you buy at the strike. The wheel: sell puts until assigned → hold the asset → sell calls until called away → repeat. Options vaults automate this on chain. They add contract risk and you don't choose the strikes. Worked example ETH at 3,000 . Covered call: sell a 7 day 3,300 call for 0.4% ($12). ≈ 20.9% annualised if repeated at that premium, which it won't be exactly. Max gain for the week 10.4%. Break even 2,988 . defi calc.py covered call spot 3000 strike 3300 premium 0.4 Cash secured put: sell a 7 day 2,700 put for $12 with $2,700 reserved → 0.44% on the cash for the week. If assigned, effective entry $2,688 . What this position is short Covered call: upside above the strike, plus the full downside of the asset. Cash secured put: a crash through the strike. Checklist [ ] Only on assets I'd hold (calls) or buy at the strike (puts) [ ] Strike chosen from levels, not from the premium [ ] Annualised premium treated as \"if repeated\", never promised [ ] Vault due diligence done if automating Quiz 1. What do you give up by selling a covered call? Gains above the strike for that period. 2. Put strike 2,700, premium $15. Effective entry if assigned? $2,685. 3. Does premium protect you in a crash? Only by the size of the premium. The asset's downside remains.","video":null,"script":"video-scripts/lessons/lesson-10-4.json"},{"id":"10.5","title":"Active concentrated-liquidity management","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Choose a range width and a rebalance rule that fee income can actually pay for.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Narrower ranges earn more fees per dollar \u003cem>while in range\u003c/em> and go out of range sooner.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Range around $3,000\u003c/th>\n\u003cth>Capital efficiency vs full range\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>$2,400–$3,600 (±20%)\u003c/td>\n\u003ctd>~10.4×\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>$2,700–$3,300 (±10%)\u003c/td>\n\u003ctd>~20.4×\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>$2,850–$3,150 (±5%)\u003c/td>\n\u003ctd>~40.5×\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003ccode>defi_calc.py cl --low 2850 --high 3150\u003c/code>\u003c/p>\n\u003cp>Every rebalance costs gas and swap fees and \u003cstrong>locks in\u003c/strong> the impermanent loss\nso far. Professionals set a rule before entering:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Width from volatility:\u003c/strong> at least ~1.5× the typical weekly move.\u003c/li>\n\u003cli>\u003cstrong>Rebalance trigger:\u003c/strong> out of range for 24h+, \u003cem>and\u003c/em> the range thesis still holds.\u003c/li>\n\u003cli>\u003cstrong>Invalidation:\u003c/strong> a structural break (as with a grid bot) means exit, not re-centre.\u003c/li>\n\u003cli>\u003cstrong>Budget:\u003c/strong> rebalancing costs capped at a share of expected fees (e.g. ≤ 25%).\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>ETH typically moves ±7% a week. A ±5% range would be out of range most\nweeks. The rule points to \u003cstrong>±10–12%\u003c/strong>: ~20× efficiency, and time in range to earn.\u003c/p>\n\u003c/section>\u003ch3>What this position is short\u003c/h3>\n\u003cp>Trending markets and volatility above what the range was sized for.\u003c/p>\n\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.5:c0\">\u003cspan>Width ≥ 1.5× typical weekly move\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.5:c1\">\u003cspan>Rebalance trigger and invalidation written\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.5:c2\">\u003cspan>Rebalance cost budget set\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.5:c3\">\u003cspan>P&amp;L tracked against holding (Lesson 2.4)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"10.5:q0\">\u003cdiv class=\"qtext\">Why does a ±5% range earn ~2× the fees of ±10% while in range?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The same capital is concentrated in half the price range, so it provides about twice the liquidity there.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.5:q1\">\u003cdiv class=\"qtext\">What does a rebalance lock in?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The impermanent loss accrued so far, plus gas and swap costs.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.5:q2\">\u003cdiv class=\"qtext\">Price breaks structure and exits the range. Re-centre?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. That&#39;s an invalidation. Exit per plan.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Choose a range width and a rebalance rule that fee income can actually pay for. Explanation Narrower ranges earn more fees per dollar while in range and go out of range sooner. Range around $3,000 Capital efficiency vs full range $2,400–$3,600 (±20%) ~10.4× $2,700–$3,300 (±10%) ~20.4× $2,850–$3,150 (±5%) ~40.5× defi calc.py cl low 2850 high 3150 Every rebalance costs gas and swap fees and locks in the impermanent loss so far. Professionals set a rule before entering: Width from volatility: at least ~1.5× the typical weekly move. Rebalance trigger: out of range for 24h+, and the range thesis still holds. Invalidation: a structural break (as with a grid bot) means exit, not re centre. Budget: rebalancing costs capped at a share of expected fees (e.g. ≤ 25%). Worked example ETH typically moves ±7% a week. A ±5% range would be out of range most weeks. The rule points to ±10–12% : ~20× efficiency, and time in range to earn. What this position is short Trending markets and volatility above what the range was sized for. Checklist [ ] Width ≥ 1.5× typical weekly move [ ] Rebalance trigger and invalidation written [ ] Rebalance cost budget set [ ] P&L tracked against holding (Lesson 2.4) Quiz 1. Why does a ±5% range earn ~2× the fees of ±10% while in range? The same capital is concentrated in half the price range, so it provides about twice the liquidity there. 2. What does a rebalance lock in? The impermanent loss accrued so far, plus gas and swap costs. 3. Price breaks structure and exits the range. Re centre? No. That's an invalidation. Exit per plan.","video":null,"script":"video-scripts/lessons/lesson-10-5.json"},{"id":"10.6","title":"Restaking and points: pricing speculative yield","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Value restaking and points programmes without letting unknown rewards drive position size.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Restaking reuses staked assets to secure more services, paying extra rewards\nand often \u003cstrong>points\u003c/strong>: an off-chain score that may or may not become a token.\nThe risk stack grows at each layer: staking → liquid restaking token →\nrestaking protocol → each service it secures → slashing conditions.\u003c/p>\n\u003cp>Professional rules:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Plan with points at zero.\u003c/strong> Base the decision on yield you can measure.\u003c/li>\n\u003cli>\u003cstrong>Treat points as an airdrop bet:\u003c/strong> \u003ccode>EV = P(payout) × value − costs\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Hedge price if you only want the yield:\u003c/strong> short the underlying perp (strategy #24), knowing the hedge doesn&#39;t cover a depeg of the restaking token.\u003c/li>\n\u003cli>\u003cstrong>Cap it:\u003c/strong> speculative bucket only (≤ 5–10% of DeFi capital).\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>$20,000 in a liquid restaking token: base staking yield ~3% ($600/yr).\nPoints: you estimate a 30% chance of a payout worth $1,500, costing $200 in\ngas and bridging: \u003ccode>defi_calc.py airdrop --probability 0.3 --value 1500 --costs 200\u003c/code>\n→ EV \u003cstrong>$250\u003c/strong>. Worth doing only if the position still makes sense at $600/yr\nand the risk stack is acceptable.\u003c/p>\n\u003c/section>\u003ch3>What this position is short\u003c/h3>\n\u003cp>Slashing, depeg of the restaking token, and the chance that points never become anything.\u003c/p>\n\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.6:c0\">\u003cspan>Decision still works with points valued at zero\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.6:c1\">\u003cspan>Full risk stack written, layer by layer\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.6:c2\">\u003cspan>Sized inside the speculative bucket\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.6:c3\">\u003cspan>Hedge (if any) and its gap understood\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"10.6:q0\">\u003cdiv class=\"qtext\">Why value points at zero?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>They&#39;re not guaranteed to become anything, so a decision that needs them is a speculation.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.6:q1\">\u003cdiv class=\"qtext\">What does a perp hedge on the underlying miss?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The restaking token depegging from the underlying.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.6:q2\">\u003cdiv class=\"qtext\">Name three layers of the restaking risk stack.\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Any three: staking/validators, the liquid restaking token, the restaking protocol, each service secured, slashing conditions.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Value restaking and points programmes without letting unknown rewards drive position size. Explanation Restaking reuses staked assets to secure more services, paying extra rewards and often points : an off chain score that may or may not become a token. The risk stack grows at each layer: staking → liquid restaking token → restaking protocol → each service it secures → slashing conditions. Professional rules: Plan with points at zero. Base the decision on yield you can measure. Treat points as an airdrop bet: EV = P(payout) × value − costs . Hedge price if you only want the yield: short the underlying perp (strategy 24), knowing the hedge doesn't cover a depeg of the restaking token. Cap it: speculative bucket only (≤ 5–10% of DeFi capital). Worked example $20,000 in a liquid restaking token: base staking yield ~3% ($600/yr). Points: you estimate a 30% chance of a payout worth $1,500, costing $200 in gas and bridging: defi calc.py airdrop probability 0.3 value 1500 costs 200 → EV $250 . Worth doing only if the position still makes sense at $600/yr and the risk stack is acceptable. What this position is short Slashing, depeg of the restaking token, and the chance that points never become anything. Checklist [ ] Decision still works with points valued at zero [ ] Full risk stack written, layer by layer [ ] Sized inside the speculative bucket [ ] Hedge (if any) and its gap understood Quiz 1. Why value points at zero? They're not guaranteed to become anything, so a decision that needs them is a speculation. 2. What does a perp hedge on the underlying miss? The restaking token depegging from the underlying. 3. Name three layers of the restaking risk stack. Any three: staking/validators, the liquid restaking token, the restaking protocol, each service secured, slashing conditions.","video":null,"script":"video-scripts/lessons/lesson-10-6.json"},{"id":"10.7","title":"Being the house: perp-exchange liquidity vaults","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Understand what you&#39;re really taking on when you provide liquidity to a perpetuals exchange.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Many on-chain perp exchanges let you deposit into a \u003cstrong>liquidity vault\u003c/strong> that acts as the\n\u003cstrong>counterparty\u003c/strong> to traders (the &quot;house&quot;). The vault earns trading fees, borrowing/funding fees\nand part of liquidations, and \u003cstrong>loses when traders win\u003c/strong>.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Returns:\u003c/strong> fees + traders&#39; losses − traders&#39; profits.\u003c/li>\n\u003cli>\u003cstrong>Risks:\u003c/strong> a run of profitable traders (or a few very large ones), open interest concentrated on one side, oracle manipulation or latency, the market-making strategy of the vault (some vaults actively trade), and exchange contract risk.\u003c/li>\n\u003cli>\u003cstrong>Check:\u003c/strong> the vault&#39;s historical P&amp;L split (fees vs trader P&amp;L), its open-interest caps, how it prices assets (oracle), and withdrawal rules (cooldowns, fees).\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A vault shows 25% APR: 18% from fees, 7% from traders&#39; net losses over the last 6 months.\nIn a strong one-directional trend, traders who are long win, so the vault&#39;s &quot;trader P&amp;L&quot;\ncomponent can swing to −20% or worse, wiping out the fees. Size it as an \u003cstrong>active trading\nexposure\u003c/strong>, not as fixed income, and check whether withdrawals are delayed in stress.\u003c/p>\n\u003c/section>\u003ch3>What this position is short\u003c/h3>\n\u003cp>Trader skill and trending markets; oracle quality; the exchange&#39;s own risk controls.\u003c/p>\n\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.7:c0\">\u003cspan>Vault returns split into fees vs trader P&amp;L, with history\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.7:c1\">\u003cspan>Open-interest caps and oracle design reviewed\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.7:c2\">\u003cspan>Withdrawal cooldowns and stress behaviour known\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"10.7:q0\">\u003cdiv class=\"qtext\">When does a perp liquidity vault lose money?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>When traders are net profitable, e.g. in strong trends.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.7:q1\">\u003cdiv class=\"qtext\">Why isn&#39;t it fixed income?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Part of the return is traders&#39; losses, which can reverse sharply.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.7:q2\">\u003cdiv class=\"qtext\">Name two things to check before depositing.\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Any two: fee vs trader-P&amp;L history, OI caps, oracle design, withdrawal rules, contract risk.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Understand what you're really taking on when you provide liquidity to a perpetuals exchange. Explanation Many on chain perp exchanges let you deposit into a liquidity vault that acts as the counterparty to traders (the \"house\"). The vault earns trading fees, borrowing/funding fees and part of liquidations, and loses when traders win . Returns: fees + traders' losses − traders' profits. Risks: a run of profitable traders (or a few very large ones), open interest concentrated on one side, oracle manipulation or latency, the market making strategy of the vault (some vaults actively trade), and exchange contract risk. Check: the vault's historical P&L split (fees vs trader P&L), its open interest caps, how it prices assets (oracle), and withdrawal rules (cooldowns, fees). Worked example A vault shows 25% APR: 18% from fees, 7% from traders' net losses over the last 6 months. In a strong one directional trend, traders who are long win, so the vault's \"trader P&L\" component can swing to −20% or worse, wiping out the fees. Size it as an active trading exposure , not as fixed income, and check whether withdrawals are delayed in stress. What this position is short Trader skill and trending markets; oracle quality; the exchange's own risk controls. Checklist [ ] Vault returns split into fees vs trader P&L, with history [ ] Open interest caps and oracle design reviewed [ ] Withdrawal cooldowns and stress behaviour known Quiz 1. When does a perp liquidity vault lose money? When traders are net profitable, e.g. in strong trends. 2. Why isn't it fixed income? Part of the return is traders' losses, which can reverse sharply. 3. Name two things to check before depositing. Any two: fee vs trader P&L history, OI caps, oracle design, withdrawal rules, contract risk.","video":null,"script":"video-scripts/lessons/lesson-10-7.json"},{"id":"10.8","title":"DeFi rates: term structure, fixed vs floating","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Read DeFi&#39;s interest-rate curve and position for fixed or floating rates deliberately.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Floating rates:\u003c/strong> lending and borrowing APYs that change with utilisation (Module 3).\u003c/li>\n\u003cli>\u003cstrong>Fixed rates:\u003c/strong> PTs (10.1), fixed-rate lending markets and fixed-rate borrowing (#22).\u003c/li>\n\u003cli>\u003cstrong>Term structure:\u003c/strong> PT implied yields across maturities form a \u003cstrong>yield curve\u003c/strong> (e.g. 3-month vs 12-month). Upward sloping: the market expects rates to stay high or rise. Inverted: it expects them to fall.\u003c/li>\n\u003cli>\u003cstrong>Positioning:\u003c/strong> buying PT = receiving a fixed rate (you win if floating rates fall). Buying YT = receiving the floating rate (you win if floating rates rise). Fixed-rate borrowing = paying a fixed rate (you win if floating borrow rates rise).\u003c/li>\n\u003cli>\u003cstrong>Basis between venues:\u003c/strong> the same asset&#39;s rates can differ across protocols and chains; the gap reflects risk, liquidity and friction as much as opportunity.\u003c/li>\n\u003c/ul>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"PT price converges to 1.00 at maturity\" src=\"../assets/charts/pt-convergence.png\">\u003cfigcaption>PT price converges to 1.00 at maturity\u003c/figcaption>\u003c/figure>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Stablecoin PT implied yields: 3-month \u003cstrong>7%\u003c/strong>, 12-month \u003cstrong>9%\u003c/strong>. You need the money in\n12 months and think rates will fall: buy the 12-month PT and lock 9%. If you think rates\nwill rise instead, stay floating (supply to lending) or buy YT with a small, capped amount.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.8:c0\">\u003cspan>I can state whether each position is fixed or floating\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.8:c1\">\u003cspan>I compare implied rates across maturities before locking\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.8:c2\">\u003cspan>Maturities match my liquidity ladder (12.4)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"10.8:q0\">\u003cdiv class=\"qtext\">You buy a PT. Are you receiving fixed or floating?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Fixed.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.8:q1\">\u003cdiv class=\"qtext\">An inverted curve suggests?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The market expects rates to fall.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.8:q2\">\u003cdiv class=\"qtext\">You think borrow rates will spike. How do you protect a loan?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Switch to fixed-rate borrowing.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Read DeFi's interest rate curve and position for fixed or floating rates deliberately. Explanation Floating rates: lending and borrowing APYs that change with utilisation (Module 3). Fixed rates: PTs (10.1), fixed rate lending markets and fixed rate borrowing ( 22). Term structure: PT implied yields across maturities form a yield curve (e.g. 3 month vs 12 month). Upward sloping: the market expects rates to stay high or rise. Inverted: it expects them to fall. Positioning: buying PT = receiving a fixed rate (you win if floating rates fall). Buying YT = receiving the floating rate (you win if floating rates rise). Fixed rate borrowing = paying a fixed rate (you win if floating borrow rates rise). Basis between venues: the same asset's rates can differ across protocols and chains; the gap reflects risk, liquidity and friction as much as opportunity. Worked example Stablecoin PT implied yields: 3 month 7% , 12 month 9% . You need the money in 12 months and think rates will fall: buy the 12 month PT and lock 9%. If you think rates will rise instead, stay floating (supply to lending) or buy YT with a small, capped amount. Checklist [ ] I can state whether each position is fixed or floating [ ] I compare implied rates across maturities before locking [ ] Maturities match my liquidity ladder (12.4) Quiz 1. You buy a PT. Are you receiving fixed or floating? Fixed. 2. An inverted curve suggests? The market expects rates to fall. 3. You think borrow rates will spike. How do you protect a loan? Switch to fixed rate borrowing.","video":null,"script":"video-scripts/lessons/lesson-10-8.json"},{"id":"10.9","title":"Peg and redemption arbitrage","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Understand the arbitrages that keep stablecoins and LSTs near their value, and when a retail operator can take part.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Stablecoin peg arbitrage:\u003c/strong> if a stablecoin trades at 0.995 on a DEX and a \u003cstrong>PSM\u003c/strong> or issuer redeems it at 1.00 (minus a fee), buy-and-redeem closes the gap. It&#39;s competitive, needs fast execution, and is often limited to whoever can redeem.\u003c/li>\n\u003cli>\u003cstrong>LST discount arbitrage:\u003c/strong> if an LST trades below its redemption value, buy it and \u003cstrong>queue a redemption\u003c/strong>. Your return is the discount over the waiting time, with the risk that the discount reflects a real problem (slashing, a bug) or that the queue lengthens.\u003c/li>\n\u003cli>\u003cstrong>Who wins:\u003c/strong> professional searchers take most instant arbitrage (14.6). What&#39;s left to patient operators is the \u003cstrong>slow\u003c/strong> kind: buying discounts and waiting, sized small.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>An LST trades at a \u003cstrong>2% discount\u003c/strong>; the redemption queue is about 20 days.\nReturn ≈ 2% over 20 days ≈ \u003cstrong>36.5% annualised (simple)\u003c/strong>, but only this once, only if\nredemption works as expected, and only if the discount wasn&#39;t pricing a real problem.\nResearch why the discount exists first (Module 6); cap it in the speculative bucket.\u003c/p>\n\u003c/section>\u003ch3>What this position is short\u003c/h3>\n\u003cp>The reason the discount exists: an actual problem with the asset, or redemption delays.\u003c/p>\n\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.9:c0\">\u003cspan>Redemption path and eligibility confirmed\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.9:c1\">\u003cspan>Reason for the discount researched\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"10.9:c2\">\u003cspan>Queue length and worst case written\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"10.9:q0\">\u003cdiv class=\"qtext\">What closes a stablecoin&#39;s discount?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Arbitrageurs buying below peg and redeeming at 1.00 (e.g. via a PSM or issuer).\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.9:q1\">\u003cdiv class=\"qtext\">1% discount, 10-day redemption. Simple annualised return?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>About 36.5%.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"10.9:q2\">\u003cdiv class=\"qtext\">Why might a discount be a warning, not an opportunity?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It may reflect a real problem (slashing, exploit, insolvency).\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Understand the arbitrages that keep stablecoins and LSTs near their value, and when a retail operator can take part. Explanation Stablecoin peg arbitrage: if a stablecoin trades at 0.995 on a DEX and a PSM or issuer redeems it at 1.00 (minus a fee), buy and redeem closes the gap. It's competitive, needs fast execution, and is often limited to whoever can redeem. LST discount arbitrage: if an LST trades below its redemption value, buy it and queue a redemption . Your return is the discount over the waiting time, with the risk that the discount reflects a real problem (slashing, a bug) or that the queue lengthens. Who wins: professional searchers take most instant arbitrage (14.6). What's left to patient operators is the slow kind: buying discounts and waiting, sized small. Worked example An LST trades at a 2% discount ; the redemption queue is about 20 days. Return ≈ 2% over 20 days ≈ 36.5% annualised (simple) , but only this once, only if redemption works as expected, and only if the discount wasn't pricing a real problem. Research why the discount exists first (Module 6); cap it in the speculative bucket. What this position is short The reason the discount exists: an actual problem with the asset, or redemption delays. Checklist [ ] Redemption path and eligibility confirmed [ ] Reason for the discount researched [ ] Queue length and worst case written Quiz 1. What closes a stablecoin's discount? Arbitrageurs buying below peg and redeeming at 1.00 (e.g. via a PSM or issuer). 2. 1% discount, 10 day redemption. Simple annualised return? About 36.5%. 3. Why might a discount be a warning, not an opportunity? It may reflect a real problem (slashing, exploit, insolvency).","video":null,"script":"video-scripts/lessons/lesson-10-9.json"}]},{"n":11,"title":"Hedging & Risk Engineering","outcome":"hedge the risks you don't want, stress-test the portfolio, and have an incident plan ready.","icon":"umbrella","banner":"../assets/modules/module-11.png","intro":{"src":"../video/module-11-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"11.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>Risk you don&#39;t want can often be hedged, insured or engineered away, at a cost. This module covers hedging, cover, liquidation protection, stress testing and what to do in the first hour of a crisis.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Hedge\u003c/td>\n\u003ctd>a position that offsets another&#39;s risk\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Protective put\u003c/td>\n\u003ctd>an option capping downside below a price\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cover\u003c/td>\n\u003ctd>on-chain insurance for defined events\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stress test\u003c/td>\n\u003ctd>a what-if shock on your book\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Incident\u003c/td>\n\u003ctd>an exploit, depeg or compromise\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.0:c0\">\u003cspan>Modules 0–10\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>Write down the single event that would hurt your portfolio most, and what you&#39;d do in the first 10 minutes.\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Knows the hedge tools and what they cost\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Hedges one real exposure and runs the five stress tests\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Runs a stress-tested book with a rehearsed incident playbook\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…your book survives all five stress scenarios and your incident playbook is saved offline.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version Risk you don't want can often be hedged, insured or engineered away, at a cost. This module covers hedging, cover, liquidation protection, stress testing and what to do in the first hour of a crisis. Words you'll need Term Meaning Hedge a position that offsets another's risk Protective put an option capping downside below a price Cover on chain insurance for defined events Stress test a what if shock on your book Incident an exploit, depeg or compromise Before you start [ ] Modules 0–10 Your first safe step Write down the single event that would hurt your portfolio most, and what you'd do in the first 10 minutes. The mastery ladder Level You can… Beginner Knows the hedge tools and what they cost Practitioner Hedges one real exposure and runs the five stress tests Master Runs a stress tested book with a rehearsed incident playbook You've mastered this module when… …your book survives all five stress scenarios and your incident playbook is saved offline.","video":null,"script":"video-scripts/lessons/lesson-11-0.json"},{"id":"11.1","title":"Hedging price exposure with perps and options","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Reduce price exposure deliberately, and know what each hedge costs.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Perp hedge:\u003c/strong> short a perpetual future against spot you hold. Cheap to open;\npays or earns funding; needs margin; the hedge ratio is your choice.\u003c/li>\n\u003cli>\u003cstrong>Protective put:\u003c/strong> buy the right to sell at a strike. Costs a premium, and your loss is capped below the strike.\u003c/li>\n\u003cli>\u003cstrong>Collar:\u003c/strong> buy a put and sell a call to pay for it. Cheaper protection in exchange for capped upside.\u003c/li>\n\u003cli>A hedge \u003cstrong>costs\u003c/strong> something (premium, funding, capped upside). Hedge the risk you can&#39;t afford, not every risk.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>You hold \u003cstrong>10 ETH at $3,000\u003c/strong> ($30,000).\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>50% perp hedge\u003c/strong> (short 5 ETH): ETH falls 30% → spot −$9,000, short +$4,500 → \u003cstrong>−$4,500\u003c/strong> (−15%) instead of −30%.\u003c/li>\n\u003cli>\u003cstrong>Protective put:\u003c/strong> buy a 30-day $2,700 put for 2% ($60/ETH). Worst case per ETH = $300 drop to the strike + $60 premium = \u003cstrong>$360 (12%)\u003c/strong>, however far ETH falls in that month.\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.1:c0\">\u003cspan>Hedge target stated (which risk, how much)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.1:c1\">\u003cspan>Cost computed (premium, funding, capped upside)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.1:c2\">\u003cspan>Margin buffer for perp hedges set\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"11.1:q0\">\u003cdiv class=\"qtext\">What does a protective put cap?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Your loss below the strike, for the option&#39;s term, at the cost of the premium.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"11.1:q1\">\u003cdiv class=\"qtext\">What does a collar trade away?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Upside above the call strike, to pay for the put.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"11.1:q2\">\u003cdiv class=\"qtext\">20 ETH, 25% perp hedge, ETH −40%. Net loss if ETH was $3,000?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Spot −$24,000, short +$6,000 → −$18,000.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Reduce price exposure deliberately, and know what each hedge costs. Explanation Perp hedge: short a perpetual future against spot you hold. Cheap to open; pays or earns funding; needs margin; the hedge ratio is your choice. Protective put: buy the right to sell at a strike. Costs a premium, and your loss is capped below the strike. Collar: buy a put and sell a call to pay for it. Cheaper protection in exchange for capped upside. A hedge costs something (premium, funding, capped upside). Hedge the risk you can't afford, not every risk. Worked example You hold 10 ETH at $3,000 ($30,000). 50% perp hedge (short 5 ETH): ETH falls 30% → spot −$9,000, short +$4,500 → −$4,500 (−15%) instead of −30%. Protective put: buy a 30 day $2,700 put for 2% ($60/ETH). Worst case per ETH = $300 drop to the strike + $60 premium = $360 (12%) , however far ETH falls in that month. Checklist [ ] Hedge target stated (which risk, how much) [ ] Cost computed (premium, funding, capped upside) [ ] Margin buffer for perp hedges set Quiz 1. What does a protective put cap? Your loss below the strike, for the option's term, at the cost of the premium. 2. What does a collar trade away? Upside above the call strike, to pay for the put. 3. 20 ETH, 25% perp hedge, ETH −40%. Net loss if ETH was $3,000? Spot −$24,000, short +$6,000 → −$18,000.","video":null,"script":"video-scripts/lessons/lesson-11-1.json"},{"id":"11.2","title":"Depeg, protocol and smart-contract cover","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Evaluate on-chain cover products as insurance: what they pay, when, and what they don&#39;t.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Cover protocols sell protection against defined events (a protocol hack, a\ndepeg beyond a threshold). Read: \u003cstrong>what&#39;s covered\u003c/strong> (exact wording), \u003cstrong>exclusions\u003c/strong>,\n\u003cstrong>claim process\u003c/strong> (who decides, how long), \u003cstrong>payout asset\u003c/strong>, and the cover\nprovider&#39;s \u003cstrong>own\u003c/strong> solvency and contract risk.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Cover $50,000 in a lending protocol at 2.5%/yr = \u003cstrong>$1,250/yr\u003c/strong>. If your\nrisk-adjusted yield there is 4.5%, cover takes more than half of it. Worth it\nfor a large, concentrated position; often not for a small, diversified one.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.2:c0\">\u003cspan>Cover wording and exclusions read\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.2:c1\">\u003cspan>Claim process and payout asset understood\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.2:c2\">\u003cspan>Cost compared with the yield it protects\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"11.2:q0\">\u003cdiv class=\"qtext\">Name two things to check in cover terms.\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Any two: covered events, exclusions, claim process, payout asset, provider solvency.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"11.2:q1\">\u003cdiv class=\"qtext\">Cover costs 3%/yr on a 5% yield. Net?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>About 2%.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"11.2:q2\">\u003cdiv class=\"qtext\">Does cover remove all risk?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. The cover provider has its own claim, solvency and contract risks.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Evaluate on chain cover products as insurance: what they pay, when, and what they don't. Explanation Cover protocols sell protection against defined events (a protocol hack, a depeg beyond a threshold). Read: what's covered (exact wording), exclusions , claim process (who decides, how long), payout asset , and the cover provider's own solvency and contract risk. Worked example Cover $50,000 in a lending protocol at 2.5%/yr = $1,250/yr . If your risk adjusted yield there is 4.5%, cover takes more than half of it. Worth it for a large, concentrated position; often not for a small, diversified one. Checklist [ ] Cover wording and exclusions read [ ] Claim process and payout asset understood [ ] Cost compared with the yield it protects Quiz 1. Name two things to check in cover terms. Any two: covered events, exclusions, claim process, payout asset, provider solvency. 2. Cover costs 3%/yr on a 5% yield. Net? About 2%. 3. Does cover remove all risk? No. The cover provider has its own claim, solvency and contract risks.","video":null,"script":"video-scripts/lessons/lesson-11-2.json"},{"id":"11.3","title":"Liquidation protection: buffers, alerts and automated deleveraging","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Make liquidation practically impossible with buffers, alerts and pre-computed repayment.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Three layers: \u003cstrong>buffer\u003c/strong> (HF ≥ 2–2.5 at entry) → \u003cstrong>alerts\u003c/strong> (HF 2.0 and 1.7,\nModule 14.1) → \u003cstrong>action\u003c/strong> (repay, add collateral, or automated deleveraging tools\nthat repay debt when HF crosses a trigger; these add their own contract and permission risk).\n\u003cstrong>Pre-compute\u003c/strong> the repayment needed to restore your target HF:\n\u003ccode>debt to keep = collateral value × LT ÷ target HF\u003c/code>.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>10 ETH falls to $2,400 → collateral $24,000, LT 0.8, debt $12,000 → \u003cstrong>HF 1.6\u003c/strong>.\nTo restore HF 2.5: debt must be 24,000 × 0.8 ÷ 2.5 = $7,680 → \u003cstrong>repay $4,320\u003c/strong> from the reserve.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.3:c0\">\u003cspan>Alerts at HF 2.0 and 1.7\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.3:c1\">\u003cspan>Repayment to restore target HF pre-computed\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.3:c2\">\u003cspan>Reserve covers that repayment\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"11.3:q0\">\u003cdiv class=\"qtext\">Collateral $40,000, LT 0.8, target HF 2. Max debt?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>$16,000.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"11.3:q1\">\u003cdiv class=\"qtext\">What do automated deleveraging tools add?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Their own contract and permission risk.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"11.3:q2\">\u003cdiv class=\"qtext\">Why pre-compute the repayment?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>So you act immediately, not while calculating under stress.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Make liquidation practically impossible with buffers, alerts and pre computed repayment. Explanation Three layers: buffer (HF ≥ 2–2.5 at entry) → alerts (HF 2.0 and 1.7, Module 14.1) → action (repay, add collateral, or automated deleveraging tools that repay debt when HF crosses a trigger; these add their own contract and permission risk). Pre compute the repayment needed to restore your target HF: debt to keep = collateral value × LT ÷ target HF . Worked example 10 ETH falls to $2,400 → collateral $24,000, LT 0.8, debt $12,000 → HF 1.6 . To restore HF 2.5: debt must be 24,000 × 0.8 ÷ 2.5 = $7,680 → repay $4,320 from the reserve. Checklist [ ] Alerts at HF 2.0 and 1.7 [ ] Repayment to restore target HF pre computed [ ] Reserve covers that repayment Quiz 1. Collateral $40,000, LT 0.8, target HF 2. Max debt? $16,000. 2. What do automated deleveraging tools add? Their own contract and permission risk. 3. Why pre compute the repayment? So you act immediately, not while calculating under stress.","video":null,"script":"video-scripts/lessons/lesson-11-3.json"},{"id":"11.4","title":"Stress-testing a portfolio","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Run standard shock scenarios on your book and fix what fails before markets test it.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Scenarios every operator runs: \u003cstrong>crypto −50% in a day\u003c/strong> · \u003cstrong>a stablecoin depegs 10%\u003c/strong>\n· \u003cstrong>borrow rates spike to 20%\u003c/strong> · \u003cstrong>your largest protocol is hacked\u003c/strong> · \u003cstrong>your main L2 halts for 48h\u003c/strong>.\nFor each: loss, liquidations, liquidity, and whether the payout policy survives.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Holdings: ETH spot $60k · LST collateral $60k with $12k debt · stable lending $50k\n($25k each in two protocols) · ETH/USDC LP $20k · PT stable $10k.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Impact\u003c/th>\n\u003cth>Passes?\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>ETH −50%\u003c/td>\n\u003ctd>Spot −$30k; collateral −$30k (HF 4.0 → 2.0, no liquidation); LP $20k → $14.1k (−$5.9k) → \u003cstrong>−$65.9k (−32.9%)\u003c/strong>\u003c/td>\n\u003ctd>Survives, but the payout must fall\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One stablecoin −10%\u003c/td>\n\u003ctd>−$2.5k on $25k\u003c/td>\n\u003ctd>Yes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Borrow rate 20%\u003c/td>\n\u003ctd>Interest on $12k rises from ~$600 to $2,400/yr\u003c/td>\n\u003ctd>Yes: covered by reserve\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One lending protocol hacked (total loss)\u003c/td>\n\u003ctd>−$25k (−12.5%)\u003c/td>\n\u003ctd>Survives; cap was 12.5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>L2 halted 48h\u003c/td>\n\u003ctd>Positions frozen; the reserve on another chain covers needs\u003c/td>\n\u003ctd>Yes, \u003cem>if\u003c/em> the reserve isn&#39;t on the same L2\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.4:c0\">\u003cspan>Five scenarios run on the current book\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.4:c1\">\u003cspan>Every &quot;fail&quot; has a fix (smaller cap, bigger buffer, move the reserve)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.4:c2\">\u003cspan>Re-run quarterly and after big changes\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"11.4:q0\">\u003cdiv class=\"qtext\">Why did the collateral position survive −50%?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It started at HF 4.0; halving the price took it to 2.0.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"11.4:q1\">\u003cdiv class=\"qtext\">What does the L2-halt scenario test?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Whether your liquidity depends on a single chain.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"11.4:q2\">\u003cdiv class=\"qtext\">What&#39;s the output of a stress test?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Fixes: smaller caps, bigger buffers, better-placed reserves.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Run standard shock scenarios on your book and fix what fails before markets test it. Explanation Scenarios every operator runs: crypto −50% in a day · a stablecoin depegs 10% · borrow rates spike to 20% · your largest protocol is hacked · your main L2 halts for 48h . For each: loss, liquidations, liquidity, and whether the payout policy survives. Worked example — $200,000 book Holdings: ETH spot $60k · LST collateral $60k with $12k debt · stable lending $50k ($25k each in two protocols) · ETH/USDC LP $20k · PT stable $10k. Scenario Impact Passes? ETH −50% Spot −$30k; collateral −$30k (HF 4.0 → 2.0, no liquidation); LP $20k → $14.1k (−$5.9k) → −$65.9k (−32.9%) Survives, but the payout must fall One stablecoin −10% −$2.5k on $25k Yes Borrow rate 20% Interest on $12k rises from ~$600 to $2,400/yr Yes: covered by reserve One lending protocol hacked (total loss) −$25k (−12.5%) Survives; cap was 12.5% L2 halted 48h Positions frozen; the reserve on another chain covers needs Yes, if the reserve isn't on the same L2 Checklist [ ] Five scenarios run on the current book [ ] Every \"fail\" has a fix (smaller cap, bigger buffer, move the reserve) [ ] Re run quarterly and after big changes Quiz 1. Why did the collateral position survive −50%? It started at HF 4.0; halving the price took it to 2.0. 2. What does the L2 halt scenario test? Whether your liquidity depends on a single chain. 3. What's the output of a stress test? Fixes: smaller caps, bigger buffers, better placed reserves.","video":null,"script":"video-scripts/lessons/lesson-11-4.json"},{"id":"11.5","title":"Incident response: the first 60 minutes","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Know exactly what to do when a protocol you use is exploited, a stablecoin depegs, or your wallet is compromised.\u003c/p>\n\u003c/section>\u003ch3>Explanation — the 60-minute playbook\u003c/h3>\n\u003cp>\u003cstrong>0–5 min: Verify.\u003c/strong> Official channels only (bookmarked X/Discord/status page,\nsecurity firms). Don&#39;t click links in DMs, and don&#39;t sign anything &quot;to protect funds&quot;.\n\u003cstrong>5–20 min: Contain.\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cem>Protocol exploit:\u003c/em> withdraw if still possible and safe; revoke approvals to affected contracts.\u003c/li>\n\u003cli>\u003cem>Depeg:\u003c/em> follow your written peg rule (e.g. exit below 0.99 for X hours); don&#39;t panic-sell far below it on a thin book.\u003c/li>\n\u003cli>\u003cem>Wallet compromise:\u003c/em> move remaining assets to a \u003cstrong>fresh\u003c/strong> wallet (new seed, clean device); revoke approvals; assume the old seed is burned.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>20–60 min: Stabilise.\u003c/strong> Check HFs across all positions (prices may be\nmoving), top up from the reserve, and journal every action with timestamps.\n\u003cstrong>After: Review.\u003c/strong> What was the signal, what worked, and what changes in the caps and the register?\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A lending protocol you use announces a paused market after an exploit. You\nverify on its bookmarked status page, see withdrawals still work on unaffected\nmarkets, withdraw your USDC, revoke the pool approval, check your other HFs,\nand journal it. Total time: 25 minutes. Loss: none. Because the steps were written in advance.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.5:c0\">\u003cspan>Incident playbook printed/saved offline\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.5:c1\">\u003cspan>Official channels bookmarked for every protocol I use\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"11.5:c2\">\u003cspan>A clean &quot;fresh wallet&quot; procedure written\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"11.5:q0\">\u003cdiv class=\"qtext\">First thing to do in an incident?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Verify through official, bookmarked channels.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"11.5:q1\">\u003cdiv class=\"qtext\">Someone offers a link to &quot;rescue your funds&quot;. What do you do?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Ignore it. It&#39;s a common scam during incidents.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"11.5:q2\">\u003cdiv class=\"qtext\">Wallet compromised: can you keep using the seed?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>No. Move to a fresh wallet with a new seed; the old one is burned.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Know exactly what to do when a protocol you use is exploited, a stablecoin depegs, or your wallet is compromised. Explanation — the 60 minute playbook 0–5 min: Verify. Official channels only (bookmarked X/Discord/status page, security firms). Don't click links in DMs, and don't sign anything \"to protect funds\". 5–20 min: Contain. Protocol exploit: withdraw if still possible and safe; revoke approvals to affected contracts. Depeg: follow your written peg rule (e.g. exit below 0.99 for X hours); don't panic sell far below it on a thin book. Wallet compromise: move remaining assets to a fresh wallet (new seed, clean device); revoke approvals; assume the old seed is burned. 20–60 min: Stabilise. Check HFs across all positions (prices may be moving), top up from the reserve, and journal every action with timestamps. After: Review. What was the signal, what worked, and what changes in the caps and the register? Worked example A lending protocol you use announces a paused market after an exploit. You verify on its bookmarked status page, see withdrawals still work on unaffected markets, withdraw your USDC, revoke the pool approval, check your other HFs, and journal it. Total time: 25 minutes. Loss: none. Because the steps were written in advance. Checklist [ ] Incident playbook printed/saved offline [ ] Official channels bookmarked for every protocol I use [ ] A clean \"fresh wallet\" procedure written Quiz 1. First thing to do in an incident? Verify through official, bookmarked channels. 2. Someone offers a link to \"rescue your funds\". What do you do? Ignore it. It's a common scam during incidents. 3. Wallet compromised: can you keep using the seed? No. Move to a fresh wallet with a new seed; the old one is burned.","video":null,"script":"video-scripts/lessons/lesson-11-5.json"}]},{"n":12,"title":"Operate as Your Own Bank","outcome":"run your crypto the way a bank runs its book: a balance sheet, a custody policy, a credit line, a liquidity ladder, a lending desk and records someone else could follow.","icon":"vault","banner":"../assets/modules/module-12.png","intro":{"src":"../video/module-12-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"12.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>A bank keeps assets safe, lends, borrows and always has cash for what it owes. With DeFi you can run those four jobs yourself, with written policies, because there&#39;s nobody to call when something goes wrong.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Balance sheet\u003c/td>\n\u003ctd>assets, liabilities and equity\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Liquidity ladder\u003c/td>\n\u003ctd>reserves tiered by how fast you can access them\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Credit line\u003c/td>\n\u003ctd>borrowing against assets under a policy\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Runway\u003c/td>\n\u003ctd>months your reserve can cover\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Succession\u003c/td>\n\u003ctd>how others recover your assets if you can&#39;t\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.0:c0\">\u003cspan>Modules 0–11\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>Fill in the balance sheet worksheet (W6) with rough numbers: equity, LTV and runway.\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Has a balance sheet and a basic custody split\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Runs written custody, credit, ladder and lending policies\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Operates a complete bank with books, tax-ready records, succession and quarterly reviews\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…a stranger could run your bank from your written policies, with no keys in any document.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version A bank keeps assets safe, lends, borrows and always has cash for what it owes. With DeFi you can run those four jobs yourself, with written policies, because there's nobody to call when something goes wrong. Words you'll need Term Meaning Balance sheet assets, liabilities and equity Liquidity ladder reserves tiered by how fast you can access them Credit line borrowing against assets under a policy Runway months your reserve can cover Succession how others recover your assets if you can't Before you start [ ] Modules 0–11 Your first safe step Fill in the balance sheet worksheet (W6) with rough numbers: equity, LTV and runway. The mastery ladder Level You can… Beginner Has a balance sheet and a basic custody split Practitioner Runs written custody, credit, ladder and lending policies Master Operates a complete bank with books, tax ready records, succession and quarterly reviews You've mastered this module when… …a stranger could run your bank from your written policies, with no keys in any document.","video":null,"script":"video-scripts/lessons/lesson-12-0.json"},{"id":"12.1","title":"Your balance sheet","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Build a personal on-chain balance sheet and read the three numbers that matter: equity, LTV and liquidity runway.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Assets:\u003c/strong> everything you own, at market value: collateral, yield positions, reserves.\u003c/li>\n\u003cli>\u003cstrong>Liabilities:\u003c/strong> everything you owe: loans, margin, any payables.\u003c/li>\n\u003cli>\u003cstrong>Equity\u003c/strong> = assets − liabilities. This is what&#39;s actually yours.\u003c/li>\n\u003cli>\u003cstrong>LTV\u003c/strong> = debt ÷ collateral. Your bank&#39;s leverage.\u003c/li>\n\u003cli>\u003cstrong>Liquidity runway\u003c/strong> = liquid reserve ÷ monthly obligations (spending + interest).\u003c/li>\n\u003c/ul>\n\u003cp>Banks fail from \u003cstrong>liquidity\u003c/strong> (can&#39;t pay today) more often than from\n\u003cstrong>solvency\u003c/strong> (owe more than they own). Track both.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>$300,000 collateral, $60,000 debt at 5%, $40,000 stablecoin reserve, $5,000/month spending:\u003c/p>\n\u003cp>\u003ccode>defi_calc.py bank --collateral 300000 --debt 60000 --borrow-apy 5 --reserve 40000 --monthly-spend 5000\u003c/code>\u003c/p>\n\u003cul>\n\u003cli>Equity \u003cstrong>$280,000\u003c/strong> · LTV \u003cstrong>20%\u003c/strong> · health factor \u003cstrong>4.0\u003c/strong>\u003c/li>\n\u003cli>Obligations $5,250/month ($250 of it interest) → reserve covers \u003cstrong>7.6 months\u003c/strong>\u003c/li>\n\u003cli>Policy checks: LTV ≤ 30% ✓ · HF ≥ 2 ✓ · reserve ≥ 6 months ✓\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.1:c0\">\u003cspan>Balance sheet updated weekly\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.1:c1\">\u003cspan>Equity, LTV and runway tracked over time\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.1:c2\">\u003cspan>Policy limits written (max LTV, min HF, min runway)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"12.1:q0\">\u003cdiv class=\"qtext\">Assets $500k, debt $100k. Equity?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>$400k.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.1:q1\">\u003cdiv class=\"qtext\">Reserve $30k, obligations $6k/month. Runway?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>5 months, below a 6-month policy.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.1:q2\">\u003cdiv class=\"qtext\">Why track liquidity separately from equity?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>You can be solvent and still be forced to sell at the worst time if you can&#39;t meet obligations today.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Build a personal on chain balance sheet and read the three numbers that matter: equity, LTV and liquidity runway. Explanation Assets: everything you own, at market value: collateral, yield positions, reserves. Liabilities: everything you owe: loans, margin, any payables. Equity = assets − liabilities. This is what's actually yours. LTV = debt ÷ collateral. Your bank's leverage. Liquidity runway = liquid reserve ÷ monthly obligations (spending + interest). Banks fail from liquidity (can't pay today) more often than from solvency (owe more than they own). Track both. Worked example $300,000 collateral, $60,000 debt at 5%, $40,000 stablecoin reserve, $5,000/month spending: defi calc.py bank collateral 300000 debt 60000 borrow apy 5 reserve 40000 monthly spend 5000 Equity $280,000 · LTV 20% · health factor 4.0 Obligations $5,250/month ($250 of it interest) → reserve covers 7.6 months Policy checks: LTV ≤ 30% ✓ · HF ≥ 2 ✓ · reserve ≥ 6 months ✓ Checklist [ ] Balance sheet updated weekly [ ] Equity, LTV and runway tracked over time [ ] Policy limits written (max LTV, min HF, min runway) Quiz 1. Assets $500k, debt $100k. Equity? $400k. 2. Reserve $30k, obligations $6k/month. Runway? 5 months, below a 6 month policy. 3. Why track liquidity separately from equity? You can be solvent and still be forced to sell at the worst time if you can't meet obligations today.","video":null,"script":"video-scripts/lessons/lesson-12-1.json"},{"id":"12.2","title":"Custody architecture: vault, multisig and spending policies","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Design custody so that no single lost device, stolen key or mistaken signature can drain the bank.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Scale Module 1&#39;s three wallets into a bank-grade setup:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tier\u003c/th>\n\u003cth>Holds\u003c/th>\n\u003cth>Control\u003c/th>\n\u003cth>Rules\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Vault\u003c/strong>\u003c/td>\n\u003ctd>Most of your equity\u003c/td>\n\u003ctd>\u003cstrong>Multisig\u003c/strong>, e.g. 2-of-3 hardware keys in separate locations\u003c/td>\n\u003ctd>No DeFi approvals. Moves only to the Operating tier, to allowlisted addresses\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Operating\u003c/strong>\u003c/td>\n\u003ctd>Active positions\u003c/td>\n\u003ctd>Hardware wallet or a smart account with limits\u003c/td>\n\u003ctd>Verified protocols only. Spending limit per day\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Hot\u003c/strong>\u003c/td>\n\u003ctd>Small float\u003c/td>\n\u003ctd>Hot wallet\u003c/td>\n\u003ctd>Anything new or experimental. Refilled on schedule\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Smart-account features to use where available:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Spending limits\u003c/strong> per day/week\u003c/li>\n\u003cli>\u003cstrong>Allowlists\u003c/strong> (it can only send to addresses you pre-approved)\u003c/li>\n\u003cli>\u003cstrong>Timelocks\u003c/strong> on large moves (a delay you can cancel if it wasn&#39;t you)\u003c/li>\n\u003cli>\u003cstrong>Recovery\u003c/strong> paths agreed and tested in advance\u003c/li>\n\u003c/ul>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"Custody architecture\" src=\"../assets/diagrams/custody-architecture.png\">\u003cfigcaption>Custody architecture\u003c/figcaption>\u003c/figure>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Vault: 2-of-3 multisig, with key A at home, key B in a safe-deposit box and\nkey C with a trusted person or a professional co-signer. Losing any one key\nis survivable; stealing any one key is useless. \u003cstrong>Test it:\u003c/strong> move $10 through\nevery path once a quarter.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.2:c0\">\u003cspan>Vault is multisig; keys in separate physical locations\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.2:c1\">\u003cspan>Operating tier has a daily limit\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.2:c2\">\u003cspan>Allowlist on vault outflows\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"12.2:c3\">\u003cspan>Quarterly recovery test done and logged\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"12.2:q0\">\u003cdiv class=\"qtext\">Why 2-of-3 rather than 1-of-1?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>One key can be lost or stolen without losing the funds or giving an attacker control.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.2:q1\">\u003cdiv class=\"qtext\">What does a timelock buy you?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Time to notice and cancel an unauthorised large move.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"12.2:q2\">\u003cdiv class=\"qtext\">Why test recovery with a small amount?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A recovery plan you&#39;ve never run is an assumption. Testing proves every key and path works.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Design custody so that no single lost device, stolen key or mistaken signature can drain the bank. Explanation Scale Module 1's three wallets into a bank grade setup: Tier Holds Control Rules Vault Most of your equity Multisig , e.g. 2 of 3 hardware keys in separate locations No DeFi approvals. Moves only to the Operating tier, to allowlisted addresses Operating Active positions Hardware wallet or a smart account with limits Verified protocols only. Spending limit per day Hot Small float Hot wallet Anything new or experimental. Refilled on schedule Smart account features to use where available: Spending limits per day/week Allowlists (it can only send to addresses you pre approved) Timelocks on large moves (a delay you can cancel if it wasn't you) Recovery paths agreed and tested in advance Worked example Vault: 2 of 3 multisig, with key A at home, key B in a safe deposit box and key C with a trusted person or a professional co signer. Losing any one key is survivable; stealing any one key is useless. Test it: move $10 through every path once a quarter. Checklist [ ] Vault is multisig; keys in separate physical locations [ ] Operating tier has a daily limit [ ] Allowlist on vault outflows [ ] Quarterly recovery test done and logged Quiz 1. Why 2 of 3 rather than 1 of 1? One key can be lost or stolen without losing the funds or giving an attacker control. 2. What does a timelock buy you? Time to notice and cancel an unauthorised large move. 3. Why test recovery with a small amount? A recovery plan you've never run is an assumption. Testing proves every key and path works.","video":null,"script":"video-scripts/lessons/lesson-12-2.json"},{"id":"12.3","title":"The credit line: borrowing like a bank client","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Use your assets as collateral for liquidity without selling, under a written credit policy.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>Wealthy clients rarely sell appreciating assets to raise cash; they borrow\nagainst them. DeFi money markets offer the same: deposit collateral, borrow\nstablecoins, repay when it suits you, with no credit check. \u003cstrong>The collateral\nis liquidated if you breach the threshold\u003c/strong>, and nobody calls first.\u003c/p>\n\u003cp>\u003cstrong>A credit policy (write yours):\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Max LTV \u003cstrong>25–30%\u003c/strong> on volatile collateral (liquidation is often near 80%+)\u003c/li>\n\u003cli>Health factor floor \u003cstrong>2.5\u003c/strong>; act at \u003cstrong>2.0\u003c/strong>\u003c/l
