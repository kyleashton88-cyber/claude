d receive a share of the pool (a token,\nor an NFT for concentrated positions). You earn your share of swap fees. In\nreturn, \u003cstrong>your token mix changes as traders move the price\u003c/strong>: you become\nthe counterparty to every trade.\u003c/p>\n\u003cp>\u003cstrong>Fee APR estimate:\u003c/strong>\n\u003ccode>fee APR ≈ (daily volume × fee tier × your pool share × 365) ÷ your deposit\u003c/code>\nFor a full-range pool your share = deposit ÷ pool TVL, so this simplifies to\n\u003ccode>daily volume × fee tier × 365 ÷ TVL\u003c/code>.\u003c/p>\n\u003cp>Use a \u003cstrong>30-day average volume\u003c/strong>, not today&#39;s. Volume spikes on volatile days,\nwhich are also the days you take the most impermanent loss.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Pool TVL \u003cstrong>$10M\u003c/strong>, 30-day average daily volume \u003cstrong>$2M\u003c/strong>, fee tier \u003cstrong>0.3%\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>Daily pool fees = 2,000,000 × 0.003 = \u003cstrong>$6,000\u003c/strong>\u003c/li>\n\u003cli>Your $10,000 = 0.1% share → \u003cstrong>$6/day\u003c/strong> → ~\u003cstrong>21.9% fee APR\u003c/strong> (before impermanent loss and gas)\u003c/li>\n\u003c/ul>\n\u003cp>If volume halves, your fee APR halves. If a lot more TVL joins the pool, your share shrinks.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.3:c0\">\u003cspan>Fee APR calculated from 30-day volume\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.3:c1\">\u003cspan>I&#39;m OK holding 100% of either token\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.3:c2\">\u003cspan>Entry prices recorded for the &quot;vs hold&quot; benchmark\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.3:c3\">\u003cspan>Exit rule written (volume drops, trend starts, fees stop covering IL)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"2.3:q0\">\u003cdiv class=\"qtext\">Pool TVL $5M, daily volume $1M, 0.05% fee. Full-range fee APR?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>1,000,000 × 0.0005 × 365 ÷ 5,000,000 = 3.65%.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.3:q1\">\u003cdiv class=\"qtext\">Why use 30-day volume?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Single-day spikes overstate fee income, and they happen on the days you take the most impermanent loss.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.3:q2\">\u003cdiv class=\"qtext\">What happens to your share if TVL doubles?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It halves, and so do your fees, at the same volume.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Estimate an LP position's fee income from real pool data. Explanation When you LP you deposit both tokens and receive a share of the pool (a token, or an NFT for concentrated positions). You earn your share of swap fees. In return, your token mix changes as traders move the price : you become the counterparty to every trade. Fee APR estimate: fee APR ≈ (daily volume × fee tier × your pool share × 365) ÷ your deposit For a full range pool your share = deposit ÷ pool TVL, so this simplifies to daily volume × fee tier × 365 ÷ TVL . Use a 30 day average volume , not today's. Volume spikes on volatile days, which are also the days you take the most impermanent loss. Worked example Pool TVL $10M , 30 day average daily volume $2M , fee tier 0.3% : Daily pool fees = 2,000,000 × 0.003 = $6,000 Your $10,000 = 0.1% share → $6/day → ~ 21.9% fee APR (before impermanent loss and gas) If volume halves, your fee APR halves. If a lot more TVL joins the pool, your share shrinks. Checklist [ ] Fee APR calculated from 30 day volume [ ] I'm OK holding 100% of either token [ ] Entry prices recorded for the \"vs hold\" benchmark [ ] Exit rule written (volume drops, trend starts, fees stop covering IL) Quiz 1. Pool TVL $5M, daily volume $1M, 0.05% fee. Full range fee APR? 1,000,000 × 0.0005 × 365 ÷ 5,000,000 = 3.65%. 2. Why use 30 day volume? Single day spikes overstate fee income, and they happen on the days you take the most impermanent loss. 3. What happens to your share if TVL doubles? It halves, and so do your fees, at the same volume.","video":null,"script":"video-scripts/lessons/lesson-02-3.json"},{"id":"2.4","title":"Impermanent loss & true LP P&L","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Calculate an LP position&#39;s full P&amp;L and judge it against simply holding.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>\u003cstrong>Impermanent loss (IL)\u003c/strong> is how much the LP position lags \u003cem>simply holding the\nsame starting tokens\u003c/em> when their relative price changes:\n\u003ccode>IL = 2√r ÷ (1 + r) − 1\u003c/code> (r = new price ÷ entry price). It&#39;s &quot;impermanent&quot; only\nif price returns. Withdraw after the move and it&#39;s permanent.\u003c/p>\n\u003cp>\u003cstrong>Full LP P&amp;L = LP value + fees + incentives − gas\u003c/strong>, compared to \u003cstrong>hold value\u003c/strong>.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"Impermanent loss vs holding\" src=\"../assets/charts/impermanent-loss.png\">\u003cfigcaption>Impermanent loss vs holding\u003c/figcaption>\u003c/figure>\n\u003cp>Deposit \u003cstrong>1 ETH + 3,000 USDC\u003c/strong> at ETH = $3,000 (total $6,000). ETH rises to \u003cstrong>$4,000\u003c/strong>.\u003c/p>\n\u003cul>\n\u003cli>Pool rebalances you to √(3,000 ÷ 4,000) = \u003cstrong>0.866 ETH\u003c/strong> and √(3,000 × 4,000) = \u003cstrong>3,464 USDC\u003c/strong>\u003c/li>\n\u003cli>LP value = 0.866 × 4,000 + 3,464 = \u003cstrong>$6,928\u003c/strong>\u003c/li>\n\u003cli>Hold value = 4,000 + 3,000 = \u003cstrong>$7,000\u003c/strong> → IL = −$72 (\u003cstrong>−1.03%\u003c/strong>)\u003c/li>\n\u003cli>Fees earned $150, gas $20 → LP total \u003cstrong>$7,058\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Compared with\u003c/th>\n\u003cth>Result\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Starting $6,000\u003c/td>\n\u003ctd>+$1,058 (mostly from ETH going up, not from LPing)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Holding\u003c/td>\n\u003ctd>\u003cstrong>+$58\u003c/strong>, the actual value added by LPing\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>A master judges the LP on the \u003cstrong>+$58\u003c/strong>, not the +$1,058.\u003c/p>\n\u003cp>Calculator: \u003ccode>defi_calc.py il --ratio 1.3333\u003c/code> · \u003ccode>defi_calc.py lp-breakeven --ratio 1.5 --days 90 --fee-apr 12\u003c/code>\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.4:c0\">\u003cspan>P&amp;L tracked against hold, weekly\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.4:c1\">\u003cspan>IL, fees, incentives and gas recorded separately\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.4:c2\">\u003cspan>Exit if fees consistently fail to cover IL\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"2.4:q0\">\u003cdiv class=\"qtext\">ETH doubles. IL on a 50/50 pool?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>About −5.7% vs holding.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.4:q1\">\u003cdiv class=\"qtext\">Your LP is up 20% since deposit. Did LPing work?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Unknown until you compare with holding. The 20% could be all price.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.4:q2\">\u003cdiv class=\"qtext\">When does IL become permanent?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>When you withdraw while the price ratio is different from entry.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Calculate an LP position's full P&L and judge it against simply holding. Explanation Impermanent loss (IL) is how much the LP position lags simply holding the same starting tokens when their relative price changes: IL = 2√r ÷ (1 + r) − 1 (r = new price ÷ entry price). It's \"impermanent\" only if price returns. Withdraw after the move and it's permanent. Full LP P&L = LP value + fees + incentives − gas , compared to hold value . Worked example Deposit 1 ETH + 3,000 USDC at ETH = $3,000 (total $6,000). ETH rises to $4,000 . Pool rebalances you to √(3,000 ÷ 4,000) = 0.866 ETH and √(3,000 × 4,000) = 3,464 USDC LP value = 0.866 × 4,000 + 3,464 = $6,928 Hold value = 4,000 + 3,000 = $7,000 → IL = −$72 ( −1.03% ) Fees earned $150, gas $20 → LP total $7,058 Compared with Result Starting $6,000 +$1,058 (mostly from ETH going up, not from LPing) Holding +$58 , the actual value added by LPing A master judges the LP on the +$58 , not the +$1,058. Calculator: defi calc.py il ratio 1.3333 · defi calc.py lp breakeven ratio 1.5 days 90 fee apr 12 Checklist [ ] P&L tracked against hold, weekly [ ] IL, fees, incentives and gas recorded separately [ ] Exit if fees consistently fail to cover IL Quiz 1. ETH doubles. IL on a 50/50 pool? About −5.7% vs holding. 2. Your LP is up 20% since deposit. Did LPing work? Unknown until you compare with holding. The 20% could be all price. 3. When does IL become permanent? When you withdraw while the price ratio is different from entry.","video":null,"script":"video-scripts/lessons/lesson-02-4.json"},{"id":"2.5","title":"MEV and protecting your trades","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Set slippage and routing so your trades aren&#39;t easy targets.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>\u003cstrong>MEV\u003c/strong> (maximal extractable value) is profit taken by whoever orders\ntransactions in a block. Some is harmless (arbitrage realigning prices). The\nkind that hurts you:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Sandwich attack\u003c/strong>: a bot sees your pending swap, buys just before you\n(pushing the price up), lets your trade execute at the worse price, then\nsells just after. Your slippage tolerance is its profit ceiling.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Defences:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Tight but realistic slippage (e.g. 0.1–0.5% for liquid majors, more only when you understand why)\u003c/li>\n\u003cli>MEV-protected / private transaction routing (many wallets and aggregators offer this)\u003c/li>\n\u003cli>Split large trades. Avoid thin pools\u003c/li>\n\u003cli>Don&#39;t broadcast huge swaps in illiquid pairs\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Swapping \u003cstrong>$20,000\u003c/strong>:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Slippage tolerance\u003c/th>\n\u003cth>Max a sandwich can take (before its own costs)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>3%\u003c/td>\n\u003ctd>up to ~$600\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0.5%\u003c/td>\n\u003ctd>up to ~$100\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Private / protected route\u003c/td>\n\u003ctd>Transaction isn&#39;t visible in the public mempool, so it can&#39;t be sandwiched from there\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Too tight a tolerance (e.g. 0.05% on a volatile pair) just makes the transaction\nfail, and failed transactions still cost gas (Lesson 1.2).\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.5:c0\">\u003cspan>Slippage set for this pair and size, never left at a high default\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.5:c1\">\u003cspan>Protected routing on for larger swaps\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.5:c2\">\u003cspan>Large orders split or routed through deep liquidity\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"2.5:q0\">\u003cdiv class=\"qtext\">What limits how much a sandwich bot can take?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Your slippage tolerance (and the pool&#39;s depth).\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.5:q1\">\u003cdiv class=\"qtext\">Why not set slippage near zero?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Normal price movement makes the transaction revert, and you still pay gas.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.5:q2\">\u003cdiv class=\"qtext\">Name two MEV defences.\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Any two: tight slippage, private/protected routing, splitting trades, using deep pools.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Set slippage and routing so your trades aren't easy targets. Explanation MEV (maximal extractable value) is profit taken by whoever orders transactions in a block. Some is harmless (arbitrage realigning prices). The kind that hurts you: Sandwich attack : a bot sees your pending swap, buys just before you (pushing the price up), lets your trade execute at the worse price, then sells just after. Your slippage tolerance is its profit ceiling. Defences: Tight but realistic slippage (e.g. 0.1–0.5% for liquid majors, more only when you understand why) MEV protected / private transaction routing (many wallets and aggregators offer this) Split large trades. Avoid thin pools Don't broadcast huge swaps in illiquid pairs Worked example Swapping $20,000 : Slippage tolerance Max a sandwich can take (before its own costs) 3% up to ~$600 0.5% up to ~$100 Private / protected route Transaction isn't visible in the public mempool, so it can't be sandwiched from there Too tight a tolerance (e.g. 0.05% on a volatile pair) just makes the transaction fail, and failed transactions still cost gas (Lesson 1.2). Checklist [ ] Slippage set for this pair and size, never left at a high default [ ] Protected routing on for larger swaps [ ] Large orders split or routed through deep liquidity Quiz 1. What limits how much a sandwich bot can take? Your slippage tolerance (and the pool's depth). 2. Why not set slippage near zero? Normal price movement makes the transaction revert, and you still pay gas. 3. Name two MEV defences. Any two: tight slippage, private/protected routing, splitting trades, using deep pools.","video":null,"script":"video-scripts/lessons/lesson-02-5.json"},{"id":"2.6","title":"Advanced execution: limit, TWAP and intent-based orders","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Use order types that give you better prices and protection than a plain swap.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>On-chain limit orders:\u003c/strong> you sign an order off-chain (&quot;sell 1 ETH at 3,300 or better&quot;); it fills only if the price is reached. Usually gasless until filled.\u003c/li>\n\u003cli>\u003cstrong>TWAP orders:\u003c/strong> split a large trade into equal slices over time to reduce price impact.\u003c/li>\n\u003cli>\u003cstrong>Intent-based / RFQ trading:\u003c/strong> you state what you want (&quot;100,000 USDC → ETH, at least X&quot;); competing \u003cstrong>solvers\u003c/strong> or market makers fill it, often with MEV protection and no failed-transaction gas.\u003c/li>\n\u003cli>\u003cstrong>Trade-offs:\u003c/strong> limit orders may never fill; TWAP takes time and the price can move away; intents rely on the protocol&#39;s solver design.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Buying $50,000 of ETH in a pool where a single $50,000 trade has \u003cdel>1.5% price impact\n(\u003c/del>$750). A TWAP of 10 × $5,000 over an hour has far less impact per slice, as long\nas the price doesn&#39;t trend against you during the hour. An intent-based order may\nbeat both by sourcing liquidity from several venues at once. Compare the quotes.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.6:c0\">\u003cspan>I compare a plain swap, a TWAP and an intent quote for large trades\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.6:c1\">\u003cspan>Limit orders have an expiry I&#39;ve chosen\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.6:c2\">\u003cspan>I know which order types include MEV protection\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"2.6:q0\">\u003cdiv class=\"qtext\">Why split a large trade into a TWAP?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Smaller slices cause less price impact each.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.6:q1\">\u003cdiv class=\"qtext\">What&#39;s the risk of a limit order?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>It may never fill.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.6:q2\">\u003cdiv class=\"qtext\">Who fills an intent-based order?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Competing solvers or market makers.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Use order types that give you better prices and protection than a plain swap. Explanation On chain limit orders: you sign an order off chain (\"sell 1 ETH at 3,300 or better\"); it fills only if the price is reached. Usually gasless until filled. TWAP orders: split a large trade into equal slices over time to reduce price impact. Intent based / RFQ trading: you state what you want (\"100,000 USDC → ETH, at least X\"); competing solvers or market makers fill it, often with MEV protection and no failed transaction gas. Trade offs: limit orders may never fill; TWAP takes time and the price can move away; intents rely on the protocol's solver design. Worked example Buying $50,000 of ETH in a pool where a single $50,000 trade has ~1.5% price impact (~$750). A TWAP of 10 × $5,000 over an hour has far less impact per slice, as long as the price doesn't trend against you during the hour. An intent based order may beat both by sourcing liquidity from several venues at once. Compare the quotes. Checklist [ ] I compare a plain swap, a TWAP and an intent quote for large trades [ ] Limit orders have an expiry I've chosen [ ] I know which order types include MEV protection Quiz 1. Why split a large trade into a TWAP? Smaller slices cause less price impact each. 2. What's the risk of a limit order? It may never fill. 3. Who fills an intent based order? Competing solvers or market makers.","video":null,"script":"video-scripts/lessons/lesson-02-6.json"},{"id":"2.7","title":"Advanced AMM design and LVR","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Know the major AMM designs and measure an LP&#39;s real cost with loss-versus-rebalancing (LVR).\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Constant product (x·y=k):\u003c/strong> works for any pair; spreads liquidity across all prices.\u003c/li>\n\u003cli>\u003cstrong>StableSwap:\u003c/strong> for assets that should trade near 1:1 (stablecoins, LST/ETH). Blends constant-sum (flat, low slippage near the peg) with constant-product (safety away from it), tuned by an \u003cstrong>amplification\u003c/strong> parameter.\u003c/li>\n\u003cli>\u003cstrong>Weighted pools:\u003c/strong> more than two tokens or uneven weights (e.g. 80/20), with invariant ∏ xᵢ^wᵢ = k. An 80/20 pool has less impermanent loss on the 80% token.\u003c/li>\n\u003cli>\u003cstrong>Concentrated liquidity:\u003c/strong> positions in price ranges (&quot;ticks&quot;); the pool tracks √price internally.\u003c/li>\n\u003cli>\u003cstrong>Hooks and dynamic fees:\u003c/strong> newer designs (e.g. Uniswap v4, 2025) let pools run custom code at swap time: dynamic fees, limit orders, oracles. Each hook is extra contract risk.\u003c/li>\n\u003cli>\u003cstrong>LVR (loss-versus-rebalancing):\u003c/strong> pool prices only update when arbitrageurs trade against LPs after prices move elsewhere. LVR measures what LPs lose to that arbitrage, versus a portfolio that rebalances at market prices. For a full-range constant-product pool, \u003cstrong>LVR ≈ σ²/8 of pool value per year\u003c/strong> (σ = annual volatility). \u003cstrong>Fees must beat LVR\u003c/strong>, not just impermanent loss.\u003c/li>\n\u003c/ul>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"Loss-versus-rebalancing vs volatility\" src=\"../assets/charts/lvr.png\">\u003cfigcaption>Loss-versus-rebalancing vs volatility\u003c/figcaption>\u003c/figure>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>An ETH/USDC full-range pool with ETH volatility \u003cstrong>80%/yr\u003c/strong>:\n\u003ccode>defi_calc.py lvr --vol 80 --fee-apr 12\u003c/code> → LVR ≈ \u003cstrong>8.0%/yr\u003c/strong>. With 12% fee APR, LPs keep\n≈ \u003cstrong>+4%/yr\u003c/strong> before gas. If volatility rises to 110%, LVR ≈ 15%/yr, and the same fees now lose money.\nHigher-volatility pairs need much higher fee tiers.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.7:c0\">\u003cspan>I choose pool type by pair: StableSwap for pegged pairs, weighted/CL otherwise\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.7:c1\">\u003cspan>I compare fee APR with LVR, not just IL\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.7:c2\">\u003cspan>Hook contracts reviewed like any other contract\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"2.7:q0\">\u003cdiv class=\"qtext\">Why do stable pairs use StableSwap curves?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>They give very low slippage near the peg, where these pairs trade.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.7:q1\">\u003cdiv class=\"qtext\">What does LVR measure?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>What LPs lose to arbitrageurs because pool prices lag the market.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.7:q2\">\u003cdiv class=\"qtext\">Volatility 60%/yr: approximate LVR for a full-range pool?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>0.6²/8 = 4.5% of pool value per year.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Know the major AMM designs and measure an LP's real cost with loss versus rebalancing (LVR). Explanation Constant product (x·y=k): works for any pair; spreads liquidity across all prices. StableSwap: for assets that should trade near 1:1 (stablecoins, LST/ETH). Blends constant sum (flat, low slippage near the peg) with constant product (safety away from it), tuned by an amplification parameter. Weighted pools: more than two tokens or uneven weights (e.g. 80/20), with invariant ∏ xᵢ^wᵢ = k. An 80/20 pool has less impermanent loss on the 80% token. Concentrated liquidity: positions in price ranges (\"ticks\"); the pool tracks √price internally. Hooks and dynamic fees: newer designs (e.g. Uniswap v4, 2025) let pools run custom code at swap time: dynamic fees, limit orders, oracles. Each hook is extra contract risk. LVR (loss versus rebalancing): pool prices only update when arbitrageurs trade against LPs after prices move elsewhere. LVR measures what LPs lose to that arbitrage, versus a portfolio that rebalances at market prices. For a full range constant product pool, LVR ≈ σ²/8 of pool value per year (σ = annual volatility). Fees must beat LVR , not just impermanent loss. Worked example An ETH/USDC full range pool with ETH volatility 80%/yr : defi calc.py lvr vol 80 fee apr 12 → LVR ≈ 8.0%/yr . With 12% fee APR, LPs keep ≈ +4%/yr before gas. If volatility rises to 110%, LVR ≈ 15%/yr, and the same fees now lose money. Higher volatility pairs need much higher fee tiers. Checklist [ ] I choose pool type by pair: StableSwap for pegged pairs, weighted/CL otherwise [ ] I compare fee APR with LVR, not just IL [ ] Hook contracts reviewed like any other contract Quiz 1. Why do stable pairs use StableSwap curves? They give very low slippage near the peg, where these pairs trade. 2. What does LVR measure? What LPs lose to arbitrageurs because pool prices lag the market. 3. Volatility 60%/yr: approximate LVR for a full range pool? 0.6²/8 = 4.5% of pool value per year.","video":{"src":"../video/lesson-02-7.mp4","poster":"","vtt":"","chapters":[]},"script":"video-scripts/lessons/lesson-02-7.json"},{"id":"2.8","title":"The MEV supply chain","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Understand who sees, orders and profits from your transactions, and how to get some of that value back.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>The path of an Ethereum transaction today:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>You / your wallet\u003c/strong> send it, either to the \u003cstrong>public mempool\u003c/strong> or to a \u003cstrong>private RPC\u003c/strong> (e.g. an MEV-protection endpoint).\u003c/li>\n\u003cli>\u003cstrong>Searchers\u003c/strong> scan for opportunities (arbitrage, liquidations, backruns, sandwiches) and submit \u003cstrong>bundles\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Builders\u003c/strong> assemble the most profitable blocks from transactions and bundles.\u003c/li>\n\u003cli>\u003cstrong>Relays\u003c/strong> pass blocks to \u003cstrong>proposers\u003c/strong> (validators), who pick the highest-paying block (\u003cstrong>proposer-builder separation\u003c/strong>, via MEV-Boost).\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>\u003cstrong>Order-flow auctions / MEV rebates:\u003c/strong> some private RPCs and wallets let searchers bid to backrun your transaction and \u003cstrong>refund you part\u003c/strong> of the value.\u003c/li>\n\u003cli>\u003cstrong>Intent systems\u003c/strong> (Lesson 2.6) move competition to solvers, often with built-in protection.\u003c/li>\n\u003cli>L2s usually have a \u003cstrong>single sequencer\u003c/strong> ordering transactions, which changes MEV dynamics (e.g. first-come-first-served or priority-fee ordering).\u003c/li>\n\u003c/ul>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"The MEV supply chain\" src=\"../assets/diagrams/mev-supply-chain.png\">\u003cfigcaption>The MEV supply chain\u003c/figcaption>\u003c/figure>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>A $100,000 swap sent publicly with 1% slippage could leak up to ~$1,000 to a sandwich.\nSent through a protected RPC with rebates: no sandwich, and if the trade creates a\nbackrun opportunity (e.g. arbitrage between pools), you may receive a share of it back.\nSame trade, very different outcome, decided by where you send it.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.8:c0\">\u003cspan>Large trades go through a protected RPC, an intent system or an aggregator with MEV protection\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.8:c1\">\u003cspan>I know whether my wallet&#39;s RPC offers rebates\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"2.8:c2\">\u003cspan>I understand my L2&#39;s sequencer ordering rules\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"2.8:q0\">\u003cdiv class=\"qtext\">What do builders do?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Assemble blocks from transactions and searcher bundles to maximise value.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.8:q1\">\u003cdiv class=\"qtext\">What is an MEV rebate?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A refund of part of the value searchers extract from backrunning your transaction.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"2.8:q2\">\u003cdiv class=\"qtext\">Who orders transactions on most L2s today?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>A sequencer, often a single operator.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Understand who sees, orders and profits from your transactions, and how to get some of that value back. Explanation The path of an Ethereum transaction today: 1. You / your wallet send it, either to the public mempool or to a private RPC (e.g. an MEV protection endpoint). 2. Searchers scan for opportunities (arbitrage, liquidations, backruns, sandwiches) and submit bundles . 3. Builders assemble the most profitable blocks from transactions and bundles. 4. Relays pass blocks to proposers (validators), who pick the highest paying block ( proposer builder separation , via MEV Boost). Order flow auctions / MEV rebates: some private RPCs and wallets let searchers bid to backrun your transaction and refund you part of the value. Intent systems (Lesson 2.6) move competition to solvers, often with built in protection. L2s usually have a single sequencer ordering transactions, which changes MEV dynamics (e.g. first come first served or priority fee ordering). Worked example A $100,000 swap sent publicly with 1% slippage could leak up to ~$1,000 to a sandwich. Sent through a protected RPC with rebates: no sandwich, and if the trade creates a backrun opportunity (e.g. arbitrage between pools), you may receive a share of it back. Same trade, very different outcome, decided by where you send it. Checklist [ ] Large trades go through a protected RPC, an intent system or an aggregator with MEV protection [ ] I know whether my wallet's RPC offers rebates [ ] I understand my L2's sequencer ordering rules Quiz 1. What do builders do? Assemble blocks from transactions and searcher bundles to maximise value. 2. What is an MEV rebate? A refund of part of the value searchers extract from backrunning your transaction. 3. Who orders transactions on most L2s today? A sequencer, often a single operator.","video":null,"script":"video-scripts/lessons/lesson-02-8.json"}]},{"n":3,"title":"Lending & Leverage","outcome":"borrow against collateral with a buffer and a written defence plan.","icon":"bank","banner":"../assets/modules/module-03.png","intro":{"src":"../video/module-03-intro.mp4","poster":"","vtt":"","chapters":[]},"lessons":[{"id":"3.0","title":"Mastery Starter","starter":true,"html":"\u003cp>\u003cem>New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module.\u003c/em>\u003c/p>\n\u003csection class=\"box sixty\">\u003cdiv class=\"tag\">The 60-second version\u003c/div>\n\u003cp>Lending markets let you earn interest by lending, or borrow against what you own without selling it. Borrowing comes with one hard rule: if your collateral falls too far, it&#39;s sold automatically, at a penalty.\u003c/p>\n\u003c/section>\u003csection class=\"box words\">\u003cdiv class=\"tag\">Words you’ll need\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Collateral\u003c/td>\n\u003ctd>what you lock up to borrow\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LTV\u003c/td>\n\u003ctd>debt ÷ collateral value\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Health factor\u003c/td>\n\u003ctd>your safety margin; below 1 means liquidation\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Liquidation\u003c/td>\n\u003ctd>forced sale of collateral to repay debt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Utilisation\u003c/td>\n\u003ctd>how much of a pool is borrowed\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box safe\">\u003cdiv class=\"tag\">Before you start\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.0:c0\">\u003cspan>Modules 0–2\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.0:c1\">\u003cspan>Comfort using a DEX on a low-fee network\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box step\">\u003cdiv class=\"tag\">Your first safe step\u003c/div>\n\u003cp>Supply $20 of USDC to a blue-chip lending market, read its utilisation, then withdraw it. No borrowing yet.\u003c/p>\n\u003c/section>\u003csection class=\"box ladder\">\u003cdiv class=\"tag\">The mastery ladder\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>You can…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Beginner\u003c/strong>\u003c/td>\n\u003ctd>Supplies stablecoins and reads utilisation and rates\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Practitioner\u003c/strong>\u003c/td>\n\u003ctd>Borrows with HF ≥ 2 and a written defence ladder\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Master\u003c/strong>\u003c/td>\n\u003ctd>Runs correlated loops and perps with computed liquidation prices and break-even rates\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\u003csection class=\"box mastered\">\u003cdiv class=\"tag\">You’ve mastered this module when…\u003c/div>\n\u003cp>…you can open, monitor and unwind a borrow without ever approaching liquidation.\u003c/p>\n\u003c/section>","text":"New to this topic? Start here. It takes about 10 minutes and gets you from zero to ready for this module. The 60 second version Lending markets let you earn interest by lending, or borrow against what you own without selling it. Borrowing comes with one hard rule: if your collateral falls too far, it's sold automatically, at a penalty. Words you'll need Term Meaning Collateral what you lock up to borrow LTV debt ÷ collateral value Health factor your safety margin; below 1 means liquidation Liquidation forced sale of collateral to repay debt Utilisation how much of a pool is borrowed Before you start [ ] Modules 0–2 [ ] Comfort using a DEX on a low fee network Your first safe step Supply $20 of USDC to a blue chip lending market, read its utilisation, then withdraw it. No borrowing yet. The mastery ladder Level You can… Beginner Supplies stablecoins and reads utilisation and rates Practitioner Borrows with HF ≥ 2 and a written defence ladder Master Runs correlated loops and perps with computed liquidation prices and break even rates You've mastered this module when… …you can open, monitor and unwind a borrow without ever approaching liquidation.","video":null,"script":"video-scripts/lessons/lesson-03-0.json"},{"id":"3.1","title":"How lending markets work","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Explain where lending yields come from and why rates jump when a market is nearly fully borrowed.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>A DeFi \u003cstrong>money market\u003c/strong> is a pool: lenders \u003cstrong>supply\u003c/strong> assets, borrowers\n\u003cstrong>borrow\u003c/strong> them against collateral, and a smart contract sets the rates.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Utilisation\u003c/strong> = borrowed ÷ supplied. It drives the rates.\u003c/li>\n\u003cli>\u003cstrong>Interest-rate curve:\u003c/strong> most markets use a &quot;kinked&quot; curve. Rates rise gently\nup to an \u003cstrong>optimal utilisation\u003c/strong> (e.g. 80%), then steeply above it, to pull in\nlenders and push out borrowers.\u003c/li>\n\u003cli>\u003cstrong>Supply APY ≈ borrow APY × utilisation × (1 − reserve factor).\u003c/strong> The reserve\nfactor is the protocol&#39;s cut.\u003c/li>\n\u003cli>\u003cstrong>Receipt tokens:\u003c/strong> when you supply, you get a token representing your\ndeposit plus interest.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Utilisation\u003c/th>\n\u003cth>Borrow APY\u003c/th>\n\u003cth>Supply APY (10% reserve factor)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>50%\u003c/td>\n\u003ctd>2.5%\u003c/td>\n\u003ctd>1.1%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70%\u003c/td>\n\u003ctd>3.5%\u003c/td>\n\u003ctd>2.2%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>80%\u003c/td>\n\u003ctd>4.0%\u003c/td>\n\u003ctd>2.9%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90%\u003c/td>\n\u003ctd>34.0%\u003c/td>\n\u003ctd>27.5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>95%\u003c/td>\n\u003ctd>49.0%\u003c/td>\n\u003ctd>41.9%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Near 100% utilisation, rates spike \u003cstrong>and lenders may not be able to withdraw\u003c/strong>,\nbecause the money is lent out. A sudden high supply APY is often a warning, not a gift.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.1:c0\">\u003cspan>I check utilisation before supplying\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.1:c1\">\u003cspan>I know the market&#39;s optimal-utilisation kink\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.1:c2\">\u003cspan>I treat a sudden rate spike as a liquidity warning\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"3.1:q0\">\u003cdiv class=\"qtext\">What sets the rates in a money market?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Mainly utilisation, through the protocol&#39;s interest-rate curve.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"3.1:q1\">\u003cdiv class=\"qtext\">Why does the curve kink?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>To make borrowing expensive and supplying attractive when liquidity runs low, restoring withdrawal capacity.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"3.1:q2\">\u003cdiv class=\"qtext\">Utilisation is 99%. Risk for lenders?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Withdrawals may be blocked until borrowers repay or new supply arrives.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Explain where lending yields come from and why rates jump when a market is nearly fully borrowed. Explanation A DeFi money market is a pool: lenders supply assets, borrowers borrow them against collateral, and a smart contract sets the rates. Utilisation = borrowed ÷ supplied. It drives the rates. Interest rate curve: most markets use a \"kinked\" curve. Rates rise gently up to an optimal utilisation (e.g. 80%), then steeply above it, to pull in lenders and push out borrowers. Supply APY ≈ borrow APY × utilisation × (1 − reserve factor). The reserve factor is the protocol's cut. Receipt tokens: when you supply, you get a token representing your deposit plus interest. Worked example (illustrative curve: 4% at 80% optimal, +60% slope above) Utilisation Borrow APY Supply APY (10% reserve factor) 50% 2.5% 1.1% 70% 3.5% 2.2% 80% 4.0% 2.9% 90% 34.0% 27.5% 95% 49.0% 41.9% Near 100% utilisation, rates spike and lenders may not be able to withdraw , because the money is lent out. A sudden high supply APY is often a warning, not a gift. Checklist [ ] I check utilisation before supplying [ ] I know the market's optimal utilisation kink [ ] I treat a sudden rate spike as a liquidity warning Quiz 1. What sets the rates in a money market? Mainly utilisation, through the protocol's interest rate curve. 2. Why does the curve kink? To make borrowing expensive and supplying attractive when liquidity runs low, restoring withdrawal capacity. 3. Utilisation is 99%. Risk for lenders? Withdrawals may be blocked until borrowers repay or new supply arrives.","video":null,"script":"video-scripts/lessons/lesson-03-1.json"},{"id":"3.2","title":"LTV, liquidation threshold & health factor","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Calculate your LTV, health factor and liquidation price before you borrow.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>LTV (loan-to-value)\u003c/strong> = debt ÷ collateral value.\u003c/li>\n\u003cli>\u003cstrong>Max LTV:\u003c/strong> the most you can borrow against an asset.\u003c/li>\n\u003cli>\u003cstrong>Liquidation threshold (LT):\u003c/strong> the LTV at which your position can be liquidated. It&#39;s higher than max LTV.\u003c/li>\n\u003cli>\u003cstrong>Health factor (HF)\u003c/strong> = (collateral value × LT) ÷ debt. \u003cstrong>Below 1.0 = liquidatable.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Liquidation price\u003c/strong> = debt ÷ (collateral quantity × LT).\u003c/li>\n\u003c/ul>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"The liquidation cascade\" src=\"../assets/diagrams/liquidation-cascade.png\">\u003cfigcaption>The liquidation cascade\u003c/figcaption>\u003c/figure>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>10 ETH at $3,000 ($30,000), LT 0.80, borrow $12,000:\u003c/p>\n\u003cul>\n\u003cli>LTV \u003cstrong>40%\u003c/strong> · HF \u003cstrong>2.0\u003c/strong> · liquidation at \u003cstrong>$1,500\u003c/strong> (−50%)\u003c/li>\n\u003cli>\u003ccode>defi_calc.py health --qty 10 --price 3000 --lt 0.8 --debt 12000\u003c/code>\u003c/li>\n\u003cli>Max debt for HF 2.0 = $12,000; for HF 1.5 = $16,000.\u003c/li>\n\u003c/ul>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"Health factor as the price of ETH moves\" src=\"../assets/charts/health-factor.png\">\u003cfigcaption>Health factor as the price of ETH moves\u003c/figcaption>\u003c/figure>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.2:c0\">\u003cspan>HF and liquidation price calculated before borrowing\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.2:c1\">\u003cspan>HF ≥ 2 for volatile collateral\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.2:c2\">\u003cspan>Alerts set (Module 14.1)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"3.2:q0\">\u003cdiv class=\"qtext\">Collateral $50,000, LT 0.8, debt $20,000. HF?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>2.0.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"3.2:q1\">\u003cdiv class=\"qtext\">Why keep HF well above 1?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Collateral prices can fall fast; the buffer is your time to react.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"3.2:q2\">\u003cdiv class=\"qtext\">Max LTV vs liquidation threshold?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Max LTV caps new borrowing; the liquidation threshold is where liquidation becomes possible.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Calculate your LTV, health factor and liquidation price before you borrow. Explanation LTV (loan to value) = debt ÷ collateral value. Max LTV: the most you can borrow against an asset. Liquidation threshold (LT): the LTV at which your position can be liquidated. It's higher than max LTV. Health factor (HF) = (collateral value × LT) ÷ debt. Below 1.0 = liquidatable. Liquidation price = debt ÷ (collateral quantity × LT). Worked example 10 ETH at $3,000 ($30,000), LT 0.80, borrow $12,000: LTV 40% · HF 2.0 · liquidation at $1,500 (−50%) defi calc.py health qty 10 price 3000 lt 0.8 debt 12000 Max debt for HF 2.0 = $12,000; for HF 1.5 = $16,000. Checklist [ ] HF and liquidation price calculated before borrowing [ ] HF ≥ 2 for volatile collateral [ ] Alerts set (Module 14.1) Quiz 1. Collateral $50,000, LT 0.8, debt $20,000. HF? 2.0. 2. Why keep HF well above 1? Collateral prices can fall fast; the buffer is your time to react. 3. Max LTV vs liquidation threshold? Max LTV caps new borrowing; the liquidation threshold is where liquidation becomes possible.","video":null,"script":"video-scripts/gold/lesson-03-2.json"},{"id":"3.3","title":"Liquidations and cascades","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Know exactly what a liquidation costs you, and how to avoid ever reaching one.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cp>When HF drops below 1, a \u003cstrong>liquidator\u003c/strong> (usually a bot) repays part of your debt\n(up to the \u003cstrong>close factor\u003c/strong>, often 50%) and takes that value of your\ncollateral \u003cstrong>plus a bonus\u003c/strong> (the liquidation penalty, often 5–10%).\nLiquidations sell collateral into a falling market, which can push prices\nlower and trigger more liquidations: a \u003cstrong>cascade\u003c/strong>.\u003c/p>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Your position from 3.2. ETH falls to \u003cstrong>$1,490\u003c/strong>, HF just under 1:\u003c/p>\n\u003cul>\n\u003cli>A liquidator repays \u003cstrong>$6,000\u003c/strong> (50% close factor) and seizes $6,000 × 1.05 = \u003cstrong>$6,300\u003c/strong> of ETH ≈ \u003cstrong>4.228 ETH\u003c/strong>.\u003c/li>\n\u003cli>The \u003cstrong>$300\u003c/strong> bonus is a pure loss to you, on top of having sold ETH near the low.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Defence ladder:\u003c/strong> HF 2.0 → alert; HF 1.7 → repay from reserve or add\ncollateral; HF 1.5 → sell part of the collateral yourself. Never wait for 1.1.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.3:c0\">\u003cspan>Defence ladder written with exact HF levels\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.3:c1\">\u003cspan>Reserve set aside to repay (Module 12.4)\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.3:c2\">\u003cspan>Oracle for my collateral known (Module 5.3)\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"3.3:q0\">\u003cdiv class=\"qtext\">What does a liquidator receive?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Collateral equal to the debt repaid plus a bonus (penalty).\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"3.3:q1\">\u003cdiv class=\"qtext\">Why is self-deleveraging better than being liquidated?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>You avoid the penalty and choose the size and timing.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"3.3:q2\">\u003cdiv class=\"qtext\">How do cascades form?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Liquidations sell collateral, pushing prices down, which pushes more positions below HF 1.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Know exactly what a liquidation costs you, and how to avoid ever reaching one. Explanation When HF drops below 1, a liquidator (usually a bot) repays part of your debt (up to the close factor , often 50%) and takes that value of your collateral plus a bonus (the liquidation penalty, often 5–10%). Liquidations sell collateral into a falling market, which can push prices lower and trigger more liquidations: a cascade . Worked example Your position from 3.2. ETH falls to $1,490 , HF just under 1: A liquidator repays $6,000 (50% close factor) and seizes $6,000 × 1.05 = $6,300 of ETH ≈ 4.228 ETH . The $300 bonus is a pure loss to you, on top of having sold ETH near the low. Defence ladder: HF 2.0 → alert; HF 1.7 → repay from reserve or add collateral; HF 1.5 → sell part of the collateral yourself. Never wait for 1.1. Checklist [ ] Defence ladder written with exact HF levels [ ] Reserve set aside to repay (Module 12.4) [ ] Oracle for my collateral known (Module 5.3) Quiz 1. What does a liquidator receive? Collateral equal to the debt repaid plus a bonus (penalty). 2. Why is self deleveraging better than being liquidated? You avoid the penalty and choose the size and timing. 3. How do cascades form? Liquidations sell collateral, pushing prices down, which pushes more positions below HF 1.","video":null,"script":"video-scripts/lessons/lesson-03-3.json"},{"id":"3.4","title":"Borrowing strategies & looping","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Use borrowing deliberately, and know when looping adds return and when it just adds risk.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Liquidity without selling:\u003c/strong> borrow stablecoins against assets you want to keep (Module 12.3 turns this into a credit policy).\u003c/li>\n\u003cli>\u003cstrong>Looping:\u003c/strong> deposit → borrow → re-deposit → repeat, to multiply exposure. After n loops at LTV L: leverage = \u003ccode>(1 − L^(n+1)) ÷ (1 − L)\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Net APY on equity\u003c/strong> = collateral yield × leverage − borrow rate × (leverage − 1).\u003c/li>\n\u003cli>\u003cstrong>Correlated loops\u003c/strong> (an LST against its underlying, or stablecoin against stablecoin) are far safer than volatile-against-stable loops.\u003c/li>\n\u003c/ul>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"Leveraged loop: the spread is everything\" src=\"../assets/charts/loop-spread.png\">\u003cfigcaption>Leveraged loop: the spread is everything\u003c/figcaption>\u003c/figure>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>LTV 0.7, 3 loops, 3.5% collateral yield, 2.5% borrow:\n\u003ccode>defi_calc.py loop --ltv 0.7 --loops 3 --collateral-apy 3.5 --borrow-apy 2.5\u003c/code>\n→ \u003cstrong>2.53×\u003c/strong> leverage, \u003cstrong>5.03%\u003c/strong> net on equity. The return is wiped out if borrow rises to \u003cstrong>5.78%\u003c/strong>.\nSection 3.1 showed borrow rates can jump from 4% to 34% in hours. That&#39;s the risk.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.4:c0\">\u003cspan>Repayment source named before borrowing\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.4:c1\">\u003cspan>Loops only on correlated pairs, below max leverage\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.4:c2\">\u003cspan>Break-even borrow rate known and alerted\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"3.4:q0\">\u003cdiv class=\"qtext\">Max leverage at LTV 0.75?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>4×.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"3.4:q1\">\u003cdiv class=\"qtext\">What single number decides whether a loop is worth it?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The spread between collateral yield and borrow rate.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"3.4:q2\">\u003cdiv class=\"qtext\">Why prefer correlated loops?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Collateral and debt move together, so price moves barely change HF.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Use borrowing deliberately, and know when looping adds return and when it just adds risk. Explanation Liquidity without selling: borrow stablecoins against assets you want to keep (Module 12.3 turns this into a credit policy). Looping: deposit → borrow → re deposit → repeat, to multiply exposure. After n loops at LTV L: leverage = (1 − L^(n+1)) ÷ (1 − L) . Net APY on equity = collateral yield × leverage − borrow rate × (leverage − 1). Correlated loops (an LST against its underlying, or stablecoin against stablecoin) are far safer than volatile against stable loops. Worked example LTV 0.7, 3 loops, 3.5% collateral yield, 2.5% borrow: defi calc.py loop ltv 0.7 loops 3 collateral apy 3.5 borrow apy 2.5 → 2.53× leverage, 5.03% net on equity. The return is wiped out if borrow rises to 5.78% . Section 3.1 showed borrow rates can jump from 4% to 34% in hours. That's the risk. Checklist [ ] Repayment source named before borrowing [ ] Loops only on correlated pairs, below max leverage [ ] Break even borrow rate known and alerted Quiz 1. Max leverage at LTV 0.75? 4×. 2. What single number decides whether a loop is worth it? The spread between collateral yield and borrow rate. 3. Why prefer correlated loops? Collateral and debt move together, so price moves barely change HF.","video":null,"script":"video-scripts/lessons/lesson-03-4.json"},{"id":"3.5","title":"Perpetual futures and margin on-chain","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Understand perp positions well enough to use them for hedging (Module 11) and carry (10.3), and to see why high leverage fails.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>A \u003cstrong>perpetual future (perp)\u003c/strong> tracks an asset&#39;s price with no expiry. You post \u003cstrong>margin\u003c/strong> and choose \u003cstrong>leverage\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Isolated margin:\u003c/strong> only the margin in that position is at risk. \u003cstrong>Cross margin:\u003c/strong> your whole account backs every position (one bad trade can drain the rest).\u003c/li>\n\u003cli>\u003cstrong>Mark price\u003c/strong> (used for liquidation) vs \u003cstrong>index price\u003c/strong> (spot reference). \u003cstrong>Funding\u003c/strong> is paid between longs and shorts, usually every hour or 8 hours.\u003c/li>\n\u003cli>\u003cstrong>Liquidation\u003c/strong> happens when your margin falls to the \u003cstrong>maintenance margin\u003c/strong>. Roughly, a long is liquidated after a fall of \u003ccode>1 ÷ leverage − maintenance margin\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>Long ETH from $3,000 at \u003cstrong>5×\u003c/strong>, 0.5% maintenance margin:\n\u003ccode>defi_calc.py perp --entry 3000 --leverage 5 --mmr 0.5\u003c/code> → liquidation ≈ \u003cstrong>$2,415 (−19.5%)\u003c/strong>.\nThe same short at \u003cstrong>20×\u003c/strong> is liquidated at ≈ \u003cstrong>$3,135 (+4.5%)\u003c/strong>, a move ETH can make in an hour.\nLeverage doesn&#39;t just magnify gains: it shrinks how wrong you&#39;re allowed to be.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.5:c0\">\u003cspan>Isolated margin by default\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.5:c1\">\u003cspan>Liquidation price computed before opening\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.5:c2\">\u003cspan>Leverage ≤ 2–3× for anything but a hedge I fully understand\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.5:c3\">\u003cspan>Funding cost checked for how long I&#39;ll hold\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"3.5:q0\">\u003cdiv class=\"qtext\">Isolated vs cross margin?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Isolated risks only that position&#39;s margin; cross puts the whole account behind every position.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"3.5:q1\">\u003cdiv class=\"qtext\">Roughly how far can a 10× long fall before liquidation (0.5% maintenance)?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>About 9.5%.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"3.5:q2\">\u003cdiv class=\"qtext\">Which price triggers liquidation?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The mark price.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Understand perp positions well enough to use them for hedging (Module 11) and carry (10.3), and to see why high leverage fails. Explanation A perpetual future (perp) tracks an asset's price with no expiry. You post margin and choose leverage . Isolated margin: only the margin in that position is at risk. Cross margin: your whole account backs every position (one bad trade can drain the rest). Mark price (used for liquidation) vs index price (spot reference). Funding is paid between longs and shorts, usually every hour or 8 hours. Liquidation happens when your margin falls to the maintenance margin . Roughly, a long is liquidated after a fall of 1 ÷ leverage − maintenance margin . Worked example Long ETH from $3,000 at 5× , 0.5% maintenance margin: defi calc.py perp entry 3000 leverage 5 mmr 0.5 → liquidation ≈ $2,415 (−19.5%) . The same short at 20× is liquidated at ≈ $3,135 (+4.5%) , a move ETH can make in an hour. Leverage doesn't just magnify gains: it shrinks how wrong you're allowed to be. Checklist [ ] Isolated margin by default [ ] Liquidation price computed before opening [ ] Leverage ≤ 2–3× for anything but a hedge I fully understand [ ] Funding cost checked for how long I'll hold Quiz 1. Isolated vs cross margin? Isolated risks only that position's margin; cross puts the whole account behind every position. 2. Roughly how far can a 10× long fall before liquidation (0.5% maintenance)? About 9.5%. 3. Which price triggers liquidation? The mark price.","video":null,"script":"video-scripts/lessons/lesson-03-5.json"},{"id":"3.6","title":"Lending design deep dive: e-mode, caps, auctions, soft liquidation, bad debt","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Read a lending protocol&#39;s risk parameters like a risk manager.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Efficiency mode (e-mode):\u003c/strong> higher LTVs for \u003cstrong>correlated\u003c/strong> assets (e.g. an LST against ETH, or stablecoin against stablecoin). Great for correlated loops; dangerous if the correlation breaks (a depeg).\u003c/li>\n\u003cli>\u003cstrong>Isolation mode / isolated markets:\u003c/strong> newer or riskier collateral can only back limited borrowing, so its failure can&#39;t infect the whole pool.\u003c/li>\n\u003cli>\u003cstrong>Supply and borrow caps:\u003c/strong> limits on how much of an asset can be deposited or borrowed, protecting against manipulation and illiquid collateral.\u003c/li>\n\u003cli>\u003cstrong>Liquidation mechanisms:\u003c/strong> a \u003cstrong>fixed bonus\u003c/strong> (liquidators get e.g. 5% extra) vs \u003cstrong>Dutch auctions\u003c/strong> (the price falls until someone buys, a better price discovery in calm markets but vulnerable if keepers fail) vs \u003cstrong>soft liquidation\u003c/strong> (collateral is converted gradually across price bands as the price falls, and can convert back if the price recovers; losses come from the conversions rather than one penalty).\u003c/li>\n\u003cli>\u003cstrong>Bad debt:\u003c/strong> when collateral is worth less than the debt it backs. Who pays: a reserve or insurance fund, a staking &quot;safety module&quot;, or \u003cstrong>lenders pro rata\u003c/strong> (socialised).\u003c/li>\n\u003cli>\u003cstrong>Risk curators / risk managers\u003c/strong> set these parameters; governance approves them.\u003c/li>\n\u003c/ul>\n\u003cfigure>\u003cimg loading=\"lazy\" alt=\"The liquidation cascade\" src=\"../assets/diagrams/liquidation-cascade.png\">\u003cfigcaption>The liquidation cascade\u003c/figcaption>\u003c/figure>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>An LST loop in e-mode at 90% LTV looks safe because LST and ETH move together.\nIf the LST trades at a 6% discount on the oracle during a panic, the &quot;correlated&quot;\nposition can be liquidated even though ETH&#39;s price didn&#39;t move. Check what\noracle prices the LST (market price vs exchange rate) before trusting e-mode.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.6:c0\">\u003cspan>For each market: LTV, liquidation threshold, bonus/mechanism, caps, oracle\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.6:c1\">\u003cspan>I know who absorbs bad debt in each protocol I lend to\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.6:c2\">\u003cspan>E-mode positions have a depeg scenario in my stress test\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"3.6:q0\">\u003cdiv class=\"qtext\">What is e-mode for?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Higher LTVs on correlated assets.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"3.6:q1\">\u003cdiv class=\"qtext\">How does soft liquidation differ from a fixed-bonus liquidation?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Collateral is converted gradually across price bands (and can convert back) instead of being seized in one go with a penalty.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"3.6:q2\">\u003cdiv class=\"qtext\">Who can end up paying for bad debt?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Protocol reserves, a safety module, or lenders pro rata.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Read a lending protocol's risk parameters like a risk manager. Explanation Efficiency mode (e mode): higher LTVs for correlated assets (e.g. an LST against ETH, or stablecoin against stablecoin). Great for correlated loops; dangerous if the correlation breaks (a depeg). Isolation mode / isolated markets: newer or riskier collateral can only back limited borrowing, so its failure can't infect the whole pool. Supply and borrow caps: limits on how much of an asset can be deposited or borrowed, protecting against manipulation and illiquid collateral. Liquidation mechanisms: a fixed bonus (liquidators get e.g. 5% extra) vs Dutch auctions (the price falls until someone buys, a better price discovery in calm markets but vulnerable if keepers fail) vs soft liquidation (collateral is converted gradually across price bands as the price falls, and can convert back if the price recovers; losses come from the conversions rather than one penalty). Bad debt: when collateral is worth less than the debt it backs. Who pays: a reserve or insurance fund, a staking \"safety module\", or lenders pro rata (socialised). Risk curators / risk managers set these parameters; governance approves them. Worked example An LST loop in e mode at 90% LTV looks safe because LST and ETH move together. If the LST trades at a 6% discount on the oracle during a panic, the \"correlated\" position can be liquidated even though ETH's price didn't move. Check what oracle prices the LST (market price vs exchange rate) before trusting e mode. Checklist [ ] For each market: LTV, liquidation threshold, bonus/mechanism, caps, oracle [ ] I know who absorbs bad debt in each protocol I lend to [ ] E mode positions have a depeg scenario in my stress test Quiz 1. What is e mode for? Higher LTVs on correlated assets. 2. How does soft liquidation differ from a fixed bonus liquidation? Collateral is converted gradually across price bands (and can convert back) instead of being seized in one go with a penalty. 3. Who can end up paying for bad debt? Protocol reserves, a safety module, or lenders pro rata.","video":null,"script":"video-scripts/lessons/lesson-03-6.json"},{"id":"3.7","title":"CDP stablecoins: minting your own dollars","starter":false,"html":"\u003csection class=\"box obj\">\u003cdiv class=\"tag\">Objective\u003c/div>\n\u003cp>Mint stablecoins against your own collateral (as your own bank would), and manage the position safely.\u003c/p>\n\u003c/section>\u003ch3>Explanation\u003c/h3>\n\u003cul>\n\u003cli>A \u003cstrong>CDP\u003c/strong> (collateralised debt position) lets you lock collateral and \u003cstrong>mint\u003c/strong> a stablecoin against it. You owe the stablecoin back, plus a \u003cstrong>stability fee\u003c/strong> (interest).\u003c/li>\n\u003cli>\u003cstrong>Minimum collateral ratio\u003c/strong> (e.g. 150%): below it, the position is liquidated.\u003c/li>\n\u003cli>The stablecoin holds its peg through over-collateralisation, liquidations, interest rates and often a \u003cstrong>peg stability module (PSM)\u003c/strong> that swaps it 1:1 (minus a small fee) with other stablecoins.\u003c/li>\n\u003cli>Compared with borrowing from a lending pool: you create new money rather than borrow someone&#39;s deposit; rates are set by governance, not utilisation.\u003c/li>\n\u003cli>\u003cstrong>Uses:\u003c/strong> liquidity without selling (Module 12.3), funding a liquidity ladder, or a yield-covered credit line (strategy #25).\u003c/li>\n\u003c/ul>\n\u003csection class=\"box ex\">\u003cdiv class=\"tag\">Worked example\u003c/div>\n\u003cp>10 ETH at $3,000 ($30,000) with a 150% minimum ratio: you could mint up to $20,000.\nMint \u003cstrong>$10,000\u003c/strong> instead:\n\u003ccode>defi_calc.py cdp --qty 10 --price 3000 --mint 10000 --fee 6\u003c/code>\n→ ratio \u003cstrong>300%\u003c/strong>, liquidation at \u003cstrong>$1,500 (−50%)\u003c/strong>, stability fee \u003cstrong>$600/yr\u003c/strong>.\nOperators treat the maximum as a cliff, not a target.\u003c/p>\n\u003c/section>\u003csection class=\"box check\">\u003cdiv class=\"tag\">Checklist\u003c/div>\n\u003cul>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.7:c0\">\u003cspan>Collateral ratio target (e.g. ≥ 250%) and action levels written\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.7:c1\">\u003cspan>Stability fee vs alternatives (lending-pool borrow rates) compared\u003c/span>\u003c/label>\u003c/li>\n\u003cli class=\"task\">\u003clabel>\u003cinput type=\"checkbox\" data-k=\"3.7:c2\">\u003cspan>Peg mechanism (PSM, rates) understood, and my exit if the stablecoin depegs\u003c/span>\u003c/label>\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"box quiz\">\u003cdiv class=\"tag\">Quiz\u003c/div>\n\u003cdiv class=\"qq\" data-k=\"3.7:q0\">\u003cdiv class=\"qtext\">What do you owe on a CDP?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>The minted stablecoin plus the accrued stability fee.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"3.7:q1\">\u003cdiv class=\"qtext\">Collateral $40,000, 150% minimum ratio. Maximum mint?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>About $26,667.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qq\" data-k=\"3.7:q2\">\u003cdiv class=\"qtext\">What does a PSM do?\u003c/div>\n      \u003cbutton class=\"reveal\">Reveal answer\u003c/button>\u003cdiv class=\"ans\" hidden>\u003cdiv>Swaps the stablecoin 1:1 (minus a fee) with other stablecoins, supporting the peg.\u003c/div>\n      \u003cdiv class=\"grade\">\u003cspan>How did you do?\u003c/span>\u003cbutton data-g=\"1\">✓ I got it\u003c/button>\u003cbutton data-g=\"0\">✗ I missed it\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>","text":"Objective Mint stablecoins against your own collateral (as your own bank would), and manage the position safely. Explanation A CDP (collateralised debt position) lets you lock collateral and mint a stablecoin against it. You
