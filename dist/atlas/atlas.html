r\u003c/h2>\u003cp>An order that trades only at your price or better.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"linear-contract\">\u003ch2>Linear Contract\u003c/h2>\u003cp>A derivative margined and settled in the quote asset.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"link\">\u003ch2>LINK\u003c/h2>\u003cp>The token associated with the Chainlink oracle network.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"liquid-staking\">\u003ch2>Liquid Staking\u003c/h2>\u003cp>Staking that gives you a token representing the staked position.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"liquid-staking-token\">\u003ch2>Liquid Staking Token\u003c/h2>\u003cp>A token that tracks a claim on staked coins and their rewards.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"liquidation\">\u003ch2>Liquidation\u003c/h2>\u003cp>A forced close when collateral no longer covers the venue&#x27;s rule.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"liquidation-price\">\u003ch2>Liquidation Price\u003c/h2>\u003cp>The price where margin may no longer support a leveraged position.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"liquidation-threshold\">\u003ch2>Liquidation Threshold\u003c/h2>\u003cp>The collateral ratio at which a position may be liquidated.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"liquidity\">\u003ch2>Liquidity\u003c/h2>\u003cp>How easily size can trade without a large price move.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"liquidity-pool\">\u003ch2>Liquidity Pool\u003c/h2>\u003cp>A cluster of resting orders, often beyond equal highs or lows.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"liquidity-provider\">\u003ch2>Liquidity Provider\u003c/h2>\u003cp>Someone who deposits assets into a pool so others can swap.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"liquidity-sweep\">\u003ch2>Liquidity Sweep\u003c/h2>\u003cp>A push beyond an obvious high or low that then reverses.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"litecoin\">\u003ch2>Litecoin\u003c/h2>\u003cp>An early proof-of-work blockchain derived from Bitcoin&#x27;s design.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"loan-to-value\">\u003ch2>Loan-to-value\u003c/h2>\u003cp>Debt divided by the value of the collateral.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"long\">\u003ch2>Long\u003c/h2>\u003cp>Exposure that gains if the price rises.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"long-grid\">\u003ch2>Long Grid\u003c/h2>\u003cp>A grid configured with bullish directional exposure.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"loss-aversion\">\u003ch2>Loss Aversion\u003c/h2>\u003cp>Feeling a loss more strongly than a gain of the same size.\u003c/p>\u003cp>\u003ca href=\"#/lesson/psychology\">Lesson: Psychology\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"lot-size\">\u003ch2>Lot Size\u003c/h2>\u003cp>The smallest quantity step the venue allows.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"low\">\u003ch2>Low\u003c/h2>\u003cp>The lowest traded price of a candle&#x27;s period.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"lower-high\">\u003ch2>Lower High\u003c/h2>\u003cp>A swing high below the previous swing high.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"lower-low\">\u003ch2>Lower Low\u003c/h2>\u003cp>A swing low below the previous swing low.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"lower-price\">\u003ch2>Lower Price\u003c/h2>\u003cp>The bottom boundary of the grid.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"ltc\">\u003ch2>LTC\u003c/h2>\u003cp>The native coin of Litecoin.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-M\">M\u003c/h2>\u003carticle class=\"term\" id=\"macd\">\u003ch2>MACD\u003c/h2>\u003cp>The difference between a shorter and a longer exponential average.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"macd-histogram\">\u003ch2>MACD Histogram\u003c/h2>\u003cp>The gap between the MACD line and the signal line.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"macd-signal\">\u003ch2>MACD Signal Line\u003c/h2>\u003cp>An exponential average of the MACD line.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"macro\">\u003ch2>Macro\u003c/h2>\u003cp>The economy-wide backdrop: rates, inflation, growth, and the dollar.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"mae\">\u003ch2>MAE\u003c/h2>\u003cp>Maximum adverse excursion, the worst open loss during a trade.\u003c/p>\u003cp>\u003ca href=\"#/lesson/journaling\">Lesson: Journaling\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"maintenance-margin\">\u003ch2>Maintenance Margin\u003c/h2>\u003cp>The collateral floor below which a position can be liquidated.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"maker\">\u003ch2>Maker\u003c/h2>\u003cp>The side that adds a resting order to the book.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"maker-fee\">\u003ch2>Maker Fee\u003c/h2>\u003cp>The fee for an order that adds to the book.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"manipulation\">\u003ch2>Manipulation\u003c/h2>\u003cp>Trading or reporting that pushes a price or a metric away from an honest read.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"margin\">\u003ch2>Margin\u003c/h2>\u003cp>Collateral posted to support a derivatives position.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"margin-call\">\u003ch2>Margin Call\u003c/h2>\u003cp>A demand to add collateral or reduce the position.\u003c/p>\u003cp>\u003ca href=\"#/lesson/calls-puts\">Lesson: Calls and puts\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"mark-price\">\u003ch2>Mark Price\u003c/h2>\u003cp>The reference price a venue uses for unrealised results and liquidation.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"market-capitalisation\">\u003ch2>Market Capitalisation\u003c/h2>\u003cp>Price multiplied by circulating supply.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"market-order\">\u003ch2>Market Order\u003c/h2>\u003cp>An order that takes the best prices available now.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"market-regime\">\u003ch2>Market Regime\u003c/h2>\u003cp>The broad behaviour of the market you are in, such as trend or range.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"market-structure\">\u003ch2>Market Structure\u003c/h2>\u003cp>The map of swing highs and swing lows on a timeframe.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"market-structure-shift\">\u003ch2>Market Structure Shift\u003c/h2>\u003cp>Another teaching label for a change of character on a chosen timeframe.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"max-supply\">\u003ch2>Max Supply\u003c/h2>\u003cp>The ceiling on issuance, if the protocol has one.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"maximum-drawdown\">\u003ch2>Maximum Drawdown\u003c/h2>\u003cp>The deepest peak-to-trough decline in the sample.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"mean-reversion\">\u003ch2>Mean Reversion\u003c/h2>\u003cp>A tendency for price to move back toward a central value.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"mempool\">\u003ch2>Mempool\u003c/h2>\u003cp>The waiting room of transactions a node has seen but not yet included.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"mev\">\u003ch2>MEV\u003c/h2>\u003cp>Value captured by choosing the order or inclusion of transactions.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"mfe\">\u003ch2>MFE\u003c/h2>\u003cp>Maximum favourable excursion, the best open gain during a trade.\u003c/p>\u003cp>\u003ca href=\"#/lesson/journaling\">Lesson: Journaling\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"mid-price\">\u003ch2>Mid Price\u003c/h2>\u003cp>The average of the best bid and the best ask.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"miner\">\u003ch2>Miner\u003c/h2>\u003cp>A participant who performs proof-of-work hashing to propose blocks.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"mitigation\">\u003ch2>Mitigation\u003c/h2>\u003cp>Price returning to an order block or a gap that was marked earlier.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"momentum\">\u003ch2>Momentum\u003c/h2>\u003cp>The speed of a price change over a window.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"monte-carlo\">\u003ch2>Monte Carlo\u003c/h2>\u003cp>Many reshuffles of a sample, used to see a spread of paths.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"moving-average\">\u003ch2>Moving Average\u003c/h2>\u003cp>A smoothed average of recent prices.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"multi-timeframe\">\u003ch2>Multi-timeframe Analysis\u003c/h2>\u003cp>Reading the same market on a higher and a lower timeframe together.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"multisig\">\u003ch2>Multisig\u003c/h2>\u003cp>A wallet that requires several keys to approve an action.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"mvrv\">\u003ch2>MVRV\u003c/h2>\u003cp>Market value divided by a realised-value measure of the same supply.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-N\">N\u003c/h2>\u003carticle class=\"term\" id=\"neckline\">\u003ch2>Neckline\u003c/h2>\u003cp>The line drawn across the troughs or peaks of a reversal pattern.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"network\">\u003ch2>Network\u003c/h2>\u003cp>The specific chain a transaction will be sent on.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"neutral-grid\">\u003ch2>Neutral Grid\u003c/h2>\u003cp>A futures grid without a strong long or short bias.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"nft\">\u003ch2>NFT\u003c/h2>\u003cp>A token that is unique or one of a distinct series.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"node\">\u003ch2>Node\u003c/h2>\u003cp>A computer that keeps and checks the ledger.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"nonce\">\u003ch2>Nonce\u003c/h2>\u003cp>A counter that orders transactions from one account.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"notional\">\u003ch2>Notional\u003c/h2>\u003cp>The face value of a position, before considering margin.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-O\">O\u003c/h2>\u003carticle class=\"term\" id=\"off-chain\">\u003ch2>Off-chain\u003c/h2>\u003cp>Information or an agreement that is not settled on the public ledger.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"obv\">\u003ch2>On-balance Volume\u003c/h2>\u003cp>A running total that adds volume on up closes and subtracts it on down closes.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"on-chain\">\u003ch2>On-chain\u003c/h2>\u003cp>Recorded on the public ledger and checkable by anyone running a node.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"one-cancels-the-other\">\u003ch2>One Cancels the Other\u003c/h2>\u003cp>Two orders linked so a fill on one cancels the other.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"open\">\u003ch2>Open\u003c/h2>\u003cp>The first traded price of a candle&#x27;s period.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"open-interest\">\u003ch2>Open Interest\u003c/h2>\u003cp>The stock of derivatives contracts still open.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"optimistic-rollup\">\u003ch2>Optimistic Rollup\u003c/h2>\u003cp>A rollup that assumes batches are valid unless someone challenges them.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"oracle\">\u003ch2>Oracle\u003c/h2>\u003cp>A feed that brings an off-chain or cross-market fact into a contract.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"order\">\u003ch2>Order\u003c/h2>\u003cp>An instruction to trade a size at rules you set.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"order-block\">\u003ch2>Order Block\u003c/h2>\u003cp>A candle cluster at the origin of a strong move, studied as a reaction area.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"order-book\">\u003ch2>Order Book\u003c/h2>\u003cp>The list of resting bids and asks at each price.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"order-size\">\u003ch2>Order Size\u003c/h2>\u003cp>How much each grid order is allowed to trade.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"oscillator\">\u003ch2>Oscillator\u003c/h2>\u003cp>An indicator that swings inside a bounded or centred scale.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"overbought\">\u003ch2>Overbought\u003c/h2>\u003cp>An oscillator reading in its upper zone.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"overcollateralisation\">\u003ch2>Overcollateralisation\u003c/h2>\u003cp>Posting collateral worth more than the debt.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"overfitting\">\u003ch2>Overfitting\u003c/h2>\u003cp>A rule so tailored to past noise that it fails on new data.\u003c/p>\u003cp>\u003ca href=\"#/lesson/journaling\">Lesson: Journaling\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"oversold\">\u003ch2>Oversold\u003c/h2>\u003cp>An oscillator reading in its lower zone.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-P\">P\u003c/h2>\u003carticle class=\"term\" id=\"paper-trading\">\u003ch2>Paper Trading\u003c/h2>\u003cp>Following the plan with recorded hypothetical fills and no capital at risk.\u003c/p>\u003cp>\u003ca href=\"#/lesson/journaling\">Lesson: Journaling\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"partial-fill\">\u003ch2>Partial Fill\u003c/h2>\u003cp>An order that trades some of its size and leaves the rest.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"payoff-ratio\">\u003ch2>Payoff Ratio\u003c/h2>\u003cp>The average win divided by the average loss.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"permissionless\">\u003ch2>Permissionless\u003c/h2>\u003cp>A system anyone can use without an account-opening decision by a firm.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"perpetual-future\">\u003ch2>Perpetual Future\u003c/h2>\u003cp>A derivative with no expiry, kept near spot by funding.\u003c/p>\u003cp>\u003ca href=\"#/lesson/perpetuals\">Lesson: Perpetuals and dated contracts\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"phishing\">\u003ch2>Phishing\u003c/h2>\u003cp>A fake message or site that imitates a real service to steal a secret or a signature.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"pin-bar\">\u003ch2>Pin Bar\u003c/h2>\u003cp>A candle with a long wick and a small body at the other end.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"pivot-point\">\u003ch2>Pivot Point\u003c/h2>\u003cp>A reference price derived from the prior period&#x27;s high, low, and close.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"point-of-control\">\u003ch2>Point of Control\u003c/h2>\u003cp>The price with the most traded volume on a profile.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"points-programme\">\u003ch2>Points Programme\u003c/h2>\u003cp>An off-chain or on-chain score that hints at a possible later reward.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"portfolio-heat\">\u003ch2>Portfolio Heat\u003c/h2>\u003cp>The open risk currently in the account, added up.\u003c/p>\u003cp>\u003ca href=\"#/lesson/building-a-system\">Lesson: Building a system\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"position-sizing\">\u003ch2>Position Sizing\u003c/h2>\u003cp>Choosing exposure so a loss stays inside a planned risk.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"post-only\">\u003ch2>Post-only\u003c/h2>\u003cp>A limit that cancels itself if it would take liquidity.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"premium\">\u003ch2>Premium\u003c/h2>\u003cp>The upper half of a dealing range in a structure map.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"price-action\">\u003ch2>Price Action\u003c/h2>\u003cp>Reading structure from candles and swings without requiring an indicator.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"price-impact\">\u003ch2>Price Impact\u003c/h2>\u003cp>How far your own order moves the price.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"private-key\">\u003ch2>Private Key\u003c/h2>\u003cp>The secret that authorises a signature.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"process\">\u003ch2>Process\u003c/h2>\u003cp>The repeatable steps you follow, scored separately from the result.\u003c/p>\u003cp>\u003ca href=\"#/lesson/psychology\">Lesson: Psychology\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"proof-of-stake\">\u003ch2>Proof of Stake\u003c/h2>\u003cp>A consensus rule that puts staked coins at risk for proposing blocks.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"proof-of-work\">\u003ch2>Proof of Work\u003c/h2>\u003cp>A consensus rule that spends computation to propose blocks.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"protected-swing\">\u003ch2>Protected Swing\u003c/h2>\u003cp>The swing low or high that must hold for the current sequence to stay valid.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"protocol-fee\">\u003ch2>Protocol Fee\u003c/h2>\u003cp>A charge users pay for using a protocol.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"protocol-revenue\">\u003ch2>Protocol Revenue\u003c/h2>\u003cp>The portion of fees that the protocol, the treasury, or the token actually keeps.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"proxy-contract\">\u003ch2>Proxy Contract\u003c/h2>\u003cp>A contract address whose logic can be replaced by an upgrade.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"public-key\">\u003ch2>Public Key\u003c/h2>\u003cp>The key that others can use to verify your signatures.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-Q\">Q\u003c/h2>\u003carticle class=\"term\" id=\"quote-asset\">\u003ch2>Quote Asset\u003c/h2>\u003cp>The asset used to price the base, often a stablecoin or a fiat unit.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-R\">R\u003c/h2>\u003carticle class=\"term\" id=\"r-multiple\">\u003ch2>R Multiple\u003c/h2>\u003cp>A result measured in units of the amount risked.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"range\">\u003ch2>Range\u003c/h2>\u003cp>The upper and lower prices where a grid is meant to work.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"range-high\">\u003ch2>Range High\u003c/h2>\u003cp>The upper edge of a sideways band, as distinct from a grid&#x27;s upper setting.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"range-low\">\u003ch2>Range Low\u003c/h2>\u003cp>The lower edge of a sideways band, as distinct from a grid&#x27;s lower setting.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"range-thesis\">\u003ch2>Range Thesis\u003c/h2>\u003cp>The reason you believe price will stay inside the planned band.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"realised-cap\">\u003ch2>Realised Cap\u003c/h2>\u003cp>A supply value that prices each coin near the price when it last moved.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"realised-pnl\">\u003ch2>Realised P&amp;L\u003c/h2>\u003cp>Profit or loss already locked by completed trades.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"rebasing-token\">\u003ch2>Rebasing Token\u003c/h2>\u003cp>A token whose balance changes automatically under a protocol rule.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"receipt-token\">\u003ch2>Receipt Token\u003c/h2>\u003cp>A token that records your claim on a pool, a lend, or a vault.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"recovery-scam\">\u003ch2>Recovery Scam\u003c/h2>\u003cp>A second fraud that offers to retrieve funds already stolen.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"reduce-only\">\u003ch2>Reduce-only\u003c/h2>\u003cp>An order that may only shrink an open position.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"reentrancy\">\u003ch2>Reentrancy\u003c/h2>\u003cp>A bug where an outside call re-enters a contract before its books update.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"rejection\">\u003ch2>Rejection\u003c/h2>\u003cp>A wick or a quick return showing price did not stay beyond a level.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"relative-volume\">\u003ch2>Relative Volume\u003c/h2>\u003cp>This candle&#x27;s volume compared with its usual volume at that time.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"reorg\">\u003ch2>Reorg\u003c/h2>\u003cp>A replacement of recent blocks by a competing history.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"reportcyber\">\u003ch2>ReportCyber\u003c/h2>\u003cp>The Australian Cyber Security Centre&#x27;s place to report cybercrime.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"resistance\">\u003ch2>Resistance\u003c/h2>\u003cp>An area where selling has repeatedly appeared.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"restaking\">\u003ch2>Restaking\u003c/h2>\u003cp>Using staked assets as security for additional services.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"retest\">\u003ch2>Retest\u003c/h2>\u003cp>A later return to a level that price has broken or rejected.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"revenge-trading\">\u003ch2>Revenge Trading\u003c/h2>\u003cp>A new trade taken to get back a loss, rather than because the plan allows it.\u003c/p>\u003cp>\u003ca href=\"#/lesson/psychology\">Lesson: Psychology\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"risk-budget\">\u003ch2>Risk Budget\u003c/h2>\u003cp>The total loss you will accept across open ideas at once.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"risk-of-ruin\">\u003ch2>Risk of Ruin\u003c/h2>\u003cp>The chance a sequence of losses hits a ruin threshold, under stated assumptions.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"risk-per-trade\">\u003ch2>Risk per Trade\u003c/h2>\u003cp>The cash amount lost if the stop fills at the planned price.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"risk-off\">\u003ch2>Risk-off\u003c/h2>\u003cp>A mood in which investors prefer safer holdings and sell riskier ones.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"risk-on\">\u003ch2>Risk-on\u003c/h2>\u003cp>A mood in which investors prefer riskier assets.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"risk-reward\">\u003ch2>Risk-reward Ratio\u003c/h2>\u003cp>The planned gain compared with the planned loss.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"rollup\">\u003ch2>Rollup\u003c/h2>\u003cp>A layer 2 that posts transaction data or proofs to a base chain.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"round-number\">\u003ch2>Round Number\u003c/h2>\u003cp>A psychologically obvious price such as a whole figure.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"rsi\">\u003ch2>RSI\u003c/h2>\u003cp>A momentum oscillator that compares average up closes with average down closes.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"rug-pull\">\u003ch2>Rug Pull\u003c/h2>\u003cp>A project that removes liquidity or control and leaves holders stranded.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-S\">S\u003c/h2>\u003carticle class=\"term\" id=\"sample-size\">\u003ch2>Sample Size\u003c/h2>\u003cp>How many observations sit behind a statistic.\u003c/p>\u003cp>\u003ca href=\"#/lesson/journaling\">Lesson: Journaling\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"sandwich-attack\">\u003ch2>Sandwich Attack\u003c/h2>\u003cp>A pair of trades wrapped around someone else&#x27;s swap to harvest their price impact.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"satoshi\">\u003ch2>Satoshi\u003c/h2>\u003cp>The smallest usual unit of bitcoin.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"scamwatch\">\u003ch2>Scamwatch\u003c/h2>\u003cp>The ACCC site where Australians report scams.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"seed-phrase\">\u003ch2>Seed Phrase\u003c/h2>\u003cp>The recovery words that can recreate a wallet&#x27;s keys.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"self-custody\">\u003ch2>Self-custody\u003c/h2>\u003cp>Holding the keys that can move your own assets.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"sell-side-liquidity\">\u003ch2>Sell-side Liquidity\u003c/h2>\u003cp>Resting sell orders, often stops, sitting below lows.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"sequencer\">\u003ch2>Sequencer\u003c/h2>\u003cp>The component that orders transactions on many layer 2s.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"settlement\">\u003ch2>Settlement\u003c/h2>\u003cp>The process that closes a contract at expiry or pays a difference.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"short\">\u003ch2>Short\u003c/h2>\u003cp>Exposure that gains if the price falls.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"short-grid\">\u003ch2>Short Grid\u003c/h2>\u003cp>A grid configured with bearish directional exposure.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"sideways-market\">\u003ch2>Sideways Market\u003c/h2>\u003cp>Price oscillating inside a band without a sustained trend.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"signature\">\u003ch2>Signature\u003c/h2>\u003cp>A cryptographic approval produced by a private key.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"sim-swap\">\u003ch2>SIM Swap\u003c/h2>\u003cp>A takeover of your phone number so text codes go to someone else.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"sma\">\u003ch2>Simple Moving Average\u003c/h2>\u003cp>An average that weights each of the last N closes equally.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"slashing\">\u003ch2>Slashing\u003c/h2>\u003cp>A penalty that destroys part of a validator&#x27;s stake.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"slippage\">\u003ch2>Slippage\u003c/h2>\u003cp>The gap between the expected price and the fill.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"slippage-tolerance\">\u003ch2>Slippage Tolerance\u003c/h2>\u003cp>The largest price move you will still accept on a swap or an order.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"smart-contract\">\u003ch2>Smart Contract\u003c/h2>\u003cp>A program stored on a chain that runs when a transaction calls it.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"smart-contract-risk\">\u003ch2>Smart-contract Risk\u003c/h2>\u003cp>The chance that contract code or its economic design fails.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"snapshot\">\u003ch2>Snapshot\u003c/h2>\u003cp>A recorded state of balances or actions at a chosen moment.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"solana\">\u003ch2>Solana\u003c/h2>\u003cp>A layer-1 blockchain that uses proof of stake and aims at high throughput.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"sopr\">\u003ch2>SOPR\u003c/h2>\u003cp>Spent output profit ratio, a UTXO measure of whether moved coins are above their prior reference.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"spot-grid\">\u003ch2>Spot Grid\u003c/h2>\u003cp>A grid that trades the cash market, without derivatives leverage.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"spread\">\u003ch2>Spread\u003c/h2>\u003cp>The gap between the best bid and the best ask.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"stable-swap\">\u003ch2>Stable Swap\u003c/h2>\u003cp>A pool curve shaped for assets that should trade near one another.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"stablecoin\">\u003ch2>Stablecoin\u003c/h2>\u003cp>A token designed to track a reference value, often one unit of fiat.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"staking\">\u003ch2>Staking\u003c/h2>\u003cp>Locking the native coin so a validator can take part in consensus.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"standard-deviation\">\u003ch2>Standard Deviation\u003c/h2>\u003cp>A measure of how far values sit from their average.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"stochastic\">\u003ch2>Stochastic\u003c/h2>\u003cp>An oscillator that locates the close inside the recent high-low range.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"stop-distance\">\u003ch2>Stop Distance\u003c/h2>\u003cp>How far the invalidation sits from the entry, in price.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"stop-loss\">\u003ch2>Stop Loss\u003c/h2>\u003cp>A predefined exit used to cap a loss or honour an invalidation.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"stop-order\">\u003ch2>Stop Order\u003c/h2>\u003cp>An order that becomes active only after a trigger price prints.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"stop-limit-order\">\u003ch2>Stop-limit Order\u003c/h2>\u003cp>A stop that, once triggered, rests as a limit rather than a market order.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"sui\">\u003ch2>Sui\u003c/h2>\u003cp>A layer-1 blockchain with an object-based data model.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"sui-token\">\u003ch2>SUI\u003c/h2>\u003cp>The native token of the Sui network.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"support\">\u003ch2>Support\u003c/h2>\u003cp>An area where buying has repeatedly appeared.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"support-and-resistance\">\u003ch2>Support and Resistance\u003c/h2>\u003cp>The pair of ideas: areas where declines or rallies have stalled before.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"swing-high\">\u003ch2>Swing High\u003c/h2>\u003cp>A high with lower highs on both sides.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"swing-low\">\u003ch2>Swing Low\u003c/h2>\u003cp>A low with higher lows on both sides.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"swing-point\">\u003ch2>Swing Point\u003c/h2>\u003cp>Either a swing high or a swing low.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"sybil\">\u003ch2>Sybil\u003c/h2>\u003cp>Many addresses controlled by one actor to look like many users.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-T\">T\u003c/h2>\u003carticle class=\"term\" id=\"take-profit\">\u003ch2>Take Profit\u003c/h2>\u003cp>A predefined condition for closing a gain.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"taker\">\u003ch2>Taker\u003c/h2>\u003cp>The side that removes a resting order from the book.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"taker-fee\">\u003ch2>Taker Fee\u003c/h2>\u003cp>The fee for an order that removes liquidity from the book.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"throughput\">\u003ch2>Throughput\u003c/h2>\u003cp>How many transactions a network processes in a given time.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"tick-size\">\u003ch2>Tick Size\u003c/h2>\u003cp>The smallest price increment the venue allows.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"time-in-force\">\u003ch2>Time in Force\u003c/h2>\u003cp>The instruction for how long an order is allowed to work.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"time-stop\">\u003ch2>Time Stop\u003c/h2>\u003cp>An exit that fires because too much time has passed.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"timeframe\">\u003ch2>Timeframe\u003c/h2>\u003cp>The period each candle represents.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"timelock\">\u003ch2>Timelock\u003c/h2>\u003cp>A required delay between approving a change and executing it.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"token\">\u003ch2>Token\u003c/h2>\u003cp>A unit issued by a contract on an existing chain.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"token-approval\">\u003ch2>Token Approval\u003c/h2>\u003cp>Permission for a contract to move your tokens up to an allowance.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"tokenomics\">\u003ch2>Tokenomics\u003c/h2>\u003cp>The supply, distribution, and value-capture rules of a token.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"total-supply\">\u003ch2>Total Supply\u003c/h2>\u003cp>The coins created so far, including those still locked.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"trade\">\u003ch2>Trade\u003c/h2>\u003cp>A match between two orders that produces a fill.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"trading-bot\">\u003ch2>Trading Bot\u003c/h2>\u003cp>Software that sends orders when written conditions are true.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-how\">Lesson: How a grid works\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"trading-plan\">\u003ch2>Trading Plan\u003c/h2>\u003cp>A written set of conditions for entry, size, invalidation, and review.\u003c/p>\u003cp>\u003ca href=\"#/lesson/journaling\">Lesson: Journaling\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"trailing-grid\">\u003ch2>Trailing Grid\u003c/h2>\u003cp>A grid whose range can move under written rules.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"trailing-stop\">\u003ch2>Trailing Stop\u003c/h2>\u003cp>A stop that moves in your favour under a written rule.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"transaction\">\u003ch2>Transaction\u003c/h2>\u003cp>A signed instruction that changes ledger state.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"trend\">\u003ch2>Trend\u003c/h2>\u003cp>A persistent direction in swing structure.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"trendline\">\u003ch2>Trendline\u003c/h2>\u003cp>A straight line drawn across swing points in one direction.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"triangle\">\u003ch2>Triangle\u003c/h2>\u003cp>Converging trendlines that compress recent swings.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"trigger-price\">\u003ch2>Trigger Price\u003c/h2>\u003cp>The price that activates a bot or a conditional order.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"true-range\">\u003ch2>True Range\u003c/h2>\u003cp>The widest of the bar&#x27;s range and the gaps from the prior close.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"tvl\">\u003ch2>TVL\u003c/h2>\u003cp>Total value locked, the assets a method counts as deposited.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"twap\">\u003ch2>TWAP\u003c/h2>\u003cp>A time-weighted average price over a window.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"two-factor-authentication\">\u003ch2>Two-factor Authentication\u003c/h2>\u003cp>A second check, beyond a password, before an account action.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-U\">U\u003c/h2>\u003carticle class=\"term\" id=\"unbonding\">\u003ch2>Unbonding\u003c/h2>\u003cp>The waiting period before staked coins can move again.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"unlock\">\u003ch2>Unlock\u003c/h2>\u003cp>The moment previously locked tokens become transferable.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"unrealised-pnl\">\u003ch2>Unrealised P&amp;L\u003c/h2>\u003cp>Mark-to-market result on open inventory or positions.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"upper-price\">\u003ch2>Upper Price\u003c/h2>\u003cp>The top boundary of the grid.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"uptrend\">\u003ch2>Uptrend\u003c/h2>\u003cp>A sequence of higher highs and higher lows.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"utilisation\">\u003ch2>Utilisation\u003c/h2>\u003cp>The share of a lending pool that is currently borrowed.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"utxo\">\u003ch2>UTXO\u003c/h2>\u003cp>An unspent output, the unit Bitcoin-style chains track.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-V\">V\u003c/h2>\u003carticle class=\"term\" id=\"validator\">\u003ch2>Validator\u003c/h2>\u003cp>A participant who proposes or attests to blocks under proof of stake.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"value-area\">\u003ch2>Value Area\u003c/h2>\u003cp>The price band that contains a set share of profile volume.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"variance\">\u003ch2>Variance\u003c/h2>\u003cp>The square of standard deviation, a raw measure of scatter.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"vault\">\u003ch2>Vault\u003c/h2>\u003cp>A contract that pools deposits and runs a strategy for the depositors.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"vesting\">\u003ch2>Vesting\u003c/h2>\u003cp>A schedule that releases allocated tokens over time.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"volatility\">\u003ch2>Volatility\u003c/h2>\u003cp>How large and how fast price moves.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"volatility-drag\">\u003ch2>Volatility Drag\u003c/h2>\u003cp>The damage variance does to a compounded path.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"volume\">\u003ch2>Volume\u003c/h2>\u003cp>How much traded during a period.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"volume-profile\">\u003ch2>Volume Profile\u003c/h2>\u003cp>A histogram of how much traded at each price.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"vwap\">\u003ch2>VWAP\u003c/h2>\u003cp>The volume-weighted average price over a chosen session.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-W\">W\u003c/h2>\u003carticle class=\"term\" id=\"walk-forward\">\u003ch2>Walk-forward\u003c/h2>\u003cp>A test that repeatedly tunes on one window and checks the next.\u003c/p>\u003cp>\u003ca href=\"#/lesson/journaling\">Lesson: Journaling\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"wallet\">\u003ch2>Wallet\u003c/h2>\u003cp>Software or hardware that holds keys and asks a network to accept transactions.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"wallet-address\">\u003ch2>Wallet Address\u003c/h2>\u003cp>The destination identifier you can publish.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"wallet-drainer\">\u003ch2>Wallet Drainer\u003c/h2>\u003cp>A malicious page that asks you to sign a transaction which empties approved assets.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"whale\">\u003ch2>Whale\u003c/h2>\u003cp>An address or a cluster that holds a large share of an asset.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"whipsaw\">\u003ch2>Whipsaw\u003c/h2>\u003cp>A signal that flips and then flips back, catching both sides.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"wick\">\u003ch2>Wick\u003c/h2>\u003cp>The thin line from the body to the high or the low.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"win-rate\">\u003ch2>Win Rate\u003c/h2>\u003cp>The share of trades in a sample that finished positive.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"withdrawal-whitelist\">\u003ch2>Withdrawal Whitelist\u003c/h2>\u003cp>A list of the only addresses an account is allowed to withdraw to.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"wrapped-asset\">\u003ch2>Wrapped Asset\u003c/h2>\u003cp>A token that stands in for an asset on another chain or in another format.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-X\">X\u003c/h2>\u003carticle class=\"term\" id=\"xrp\">\u003ch2>XRP\u003c/h2>\u003cp>The native token of the XRP Ledger.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"xrp-ledger\">\u003ch2>XRP Ledger\u003c/h2>\u003cp>A public ledger designed for payments, with XRP as its native asset.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-Y\">Y\u003c/h2>\u003carticle class=\"term\" id=\"yield-curve\">\u003ch2>Yield Curve\u003c/h2>\u003cp>Interest rates plotted across different lending periods.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"yield-farming\">\u003ch2>Yield Farming\u003c/h2>\u003cp>Moving assets to collect fees and incentive tokens.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-Z\">Z\u003c/h2>\u003carticle class=\"term\" id=\"zk-rollup\">\u003ch2>ZK Rollup\u003c/h2>\u003cp>A rollup that posts a validity proof of its state change.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>","tools":"\n\u003ch1>Tools\u003c/h1>\n\u003cp>These three calculators use the numbers you type. They do not send orders and they do not read a live price. Educational content only, not financial advice.\u003c/p>\n\u003ch2 id=\"tool-size\">Position size\u003c/h2>\n\u003cp>Cash at risk divided by the distance from entry to stop. This belongs to the position sizing lesson.\u003c/p>\n\u003cp>\u003ca href=\"#/lesson/position-size\">Lesson: Position sizing\u003c/a>\u003c/p>\n\u003cform class=\"calc\" data-calc=\"size\">\n\u003cdiv class=\"fields\">\n\u003clabel>Mode \u003cselect name=\"mode\">\u003coption value=\"spot\">Spot\u003c/option>\u003coption value=\"futures\">Futures\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>Account \u003cinput name=\"account\" type=\"number\" min=\"0\" step=\"1\" value=\"10000\">\u003c/label>\n\u003clabel>Risk percent \u003cinput name=\"riskPct\" type=\"number\" min=\"0\" step=\"0.1\" value=\"1\">\u003c/label>\n\u003clabel>Entry \u003cinput name=\"entry\" type=\"number\" min=\"0\" step=\"any\" value=\"100\">\u003c/label>\n\u003clabel>Stop \u003cinput name=\"stop\" type=\"number\" min=\"0\" step=\"any\" value=\"95\">\u003c/label>\n\u003clabel>Fee, basis points \u003cinput name=\"feeBps\" type=\"number\" min=\"0\" step=\"1\" value=\"10\">\u003c/label>\n\u003clabel>Slippage, basis points \u003cinput name=\"slipBps\" type=\"number\" min=\"0\" step=\"1\" value=\"5\">\u003c/label>\n\u003clabel>Leverage cap \u003cinput name=\"leverage\" type=\"number\" min=\"0\" step=\"0.1\" value=\"2\">\u003c/label>\n\u003c/div>\n\u003cdiv class=\"results\">\n\u003cdiv>\u003cspan>Quantity\u003c/span>\u003cstrong data-out=\"qty\">\u003c/strong>\u003c/div>\n\u003cdiv>\u003cspan>Notional\u003c/span>\u003cstrong data-out=\"notional\">\u003c/strong>\u003c/div>\n\u003cdiv>\u003cspan>Cash at risk\u003c/span>\u003cstrong data-out=\"cash\">\u003c/strong>\u003c/div>\n\u003cdiv>\u003cspan>Stop distance\u003c/span>\u003cstrong data-out=\"distance\">\u003c/strong>\u003c/div>\n\u003cdiv>\u003cspan>Fee and slippage\u003c/span>\u003cstrong data-out=\"friction\">\u003c/strong>\u003c/div>\n\u003cdiv>\u003cspan>Loss if stopped\u003c/span>\u003cstrong data-out=\"loss\">\u003c/strong>\u003c/div>\n\u003cdiv>\u003cspan>Implied multiple\u003c/span>\u003cstrong data-out=\"implied\">\u003c/strong>\u003c/div>\n\u003c/div>\n\u003cp class=\"note\" data-note>\u003c/p>\n\u003c/form>\n\u003ch2 id=\"tool-liq\">Liquidation price\u003c/h2>\n\u003cp>A teaching model for an isolated position. Long result is entry times (1 minus 1 divided by leverage, plus the maintenance rate). Short result flips the middle sign. A live venue can use a harsher schedule.\u003c/p>\n\u003cp>\u003ca href=\"#/lesson/liquidation\">Lesson: Liquidation\u003c/a>\u003c/p>\n\u003cform class=\"calc\" data-calc=\"liq\">\n\u003cdiv class=\"fields\">\n\u003clabel>Side \u003cselect name=\"side\">\u003coption value=\"long\">Long\u003c/option>\u003coption value=\"short\">Short\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>Entry \u003cinput name=\"entry\" type=\"number\" min=\"0\" step=\"any\" value=\"100\">\u003c/label>\n\u003clabel>Leverage \u003cinput name=\"leverage\" type=\"number\" min=\"1\" step=\"0.1\" value=\"10\">\u003c/label>\n\u003clabel>Maintenance rate, percent \u003cinput name=\"mmr\" type=\"number\" min=\"0\" step=\"0.1\" value=\"0.5\">\u003c/label>\n\u003c/div>\n\u003cdiv class=\"results\">\u003cdiv>\u003cspan>Example liquidation\u003c/span>\u003cstrong data-out=\"liq\">\u003c/strong>\u003c/div>\u003c/div>\n\u003cp class=\"note\" data-note>\u003c/p>\n\u003c/form>\n\u003ch2 id=\"tool-grid\">Grid profit per gap\u003c/h2>\n\u003cp>Arithmetic step is the box width divided by the number of gaps. The round-trip fee is estimated at the midpoint. If the step is smaller than that fee, the gap does not pay for itself in this model.\u003c/p>\n\u003cp>\u003ca href=\"#/lesson/grid-range\">Lesson: Range and grid count\u003c/a>\u003c/p>\n\u003cform class=\"calc\" data-calc=\"grid\">\n\u003cdiv class=\"fields\">\n\u003clabel>Lower price \u003cinput name=\"lower\" type=\"number\" min=\"0\" step=\"any\" value=\"90\">\u003c/label>\n\u003clabel>Upper price \u003cinput name=\"upper\" type=\"number\" min=\"0\" step=\"any\" value=\"110\">\u003c/label>\n\u003clabel>Gaps \u003cinput name=\"gaps\" type=\"number\" min=\"1\" step=\"1\" value=\"10\">\u003c/label>\n\u003clabel>Fee, basis points each side \u003cinput name=\"feeBps\" type=\"number\" min=\"0\" step=\"1\" value=\"10\">\u003c/label>\n\u003c/div>\n\u003cdiv class=\"results\">\n\u003cdiv>\u003cspan>Step\u003c/span>\u003cstrong data-out=\"step\">\u003c/strong>\u003c/div>\n\u003cdiv>\u003cspan>Round-trip fee at mid\u003c/span>\u003cstrong data-out=\"fee\">\u003c/strong>\u003c/div>\n\u003cdiv>\u003cspan>Step after that fee\u003c/span>\u003cstrong data-out=\"net\">\u003c/strong>\u003c/div>\n\u003c/div>\n\u003cp class=\"note\" data-note>\u003c/p>\n\u003c/form>\n"};</script>
<script>

(function () {
  var views = window.ATLAS_VIEWS;
  var main = document.getElementById("main");
  function num(v) { var n = Number(v); return isFinite(n) ? n : NaN; }
  function money(n) { return n.toLocaleString(undefined, { maximumFractionDigits: 2 }); }
  function sizePosition(input) {
    var account = num(input.account), riskPct = num(input.riskPct), entry = num(input.entry), stop = num(input.stop);
    var feeBps = num(input.feeBps), slipBps = num(input.slipBps), leverage = num(input.leverage);
    if (!isFinite(feeBps) || feeBps < 0) feeBps = 0;
    if (!isFinite(slipBps) || slipBps < 0) slipBps = 0;
    if (!(account > 0) || !(riskPct > 0) || !(entry > 0) || !(stop > 0)) return { error: "Enter a positive account, risk percent, entry, and stop." };
    var distance = Math.abs(entry - stop);
    if (distance === 0) return { error: "The stop has to be a different price from the entry." };
    var riskCash = account * (riskPct / 100);
    var qty = riskCash / distance;
    var notional = qty * entry;
    var friction = notional * ((feeBps + slipBps) / 10000) * 2;
    var implied = notional / account;
    var warning = "";
    if (input.mode === "spot" && implied > 1.001) warning = "The notional is larger than the account. On spot, that means the position needs more cash than the account figure, or the stop is very close.";
    if (input.mode === "futures" && isFinite(leverage) && leverage > 0 && implied > leverage + 0.001) warning = "The size implies about " + implied.toFixed(2) + " times, above the leverage cap you entered.";
    return { qty: qty, notional: notional, riskCash: riskCash, distancePct: distance / entry * 100, friction: friction, lossAtStop: riskCash + friction, impliedLeverage: implied, warning: warning };
  }
  function liquidation(input) {
    var entry = num(input.entry), leverage = num(input.leverage), mmr = num(input.mmr);
    if (!(entry > 0) || !(leverage > 1) || !(mmr >= 0)) return { error: "Enter an entry, leverage above 1, and a maintenance rate." };
    var m = mmr / 100;
    var price = input.side === "short"
      ? entry * (1 + 1 / leverage - m)
      : entry * (1 - 1 / leverage + m);
    if (!(price > 0)) return { error: "This example model produced a price at or below zero. Raise the maintenance rate or lower the leverage." };
    return { price: price };
  }
  function gridStep(input) {
    var lower = num(input.lower), upper = num(input.upper), gaps = num(input.gaps), feeBps = num(input.feeBps);
    if (!(lower > 0) || !(upper > lower) || !(gaps >= 1)) return { error: "Enter a lower price, a higher upper price, and at least one gap." };
    if (!isFinite(feeBps) || feeBps < 0) feeBps = 0;
    gaps = Math.round(gaps);
    var step = (upper - lower) / gaps;
    var mid = (upper + lower) / 2;
    var fee = mid * 2 * (feeBps / 10000);
    return { step: step, fee: fee, net: step - fee };
  }
  function readForm(form) {
    var data = {};
    Array.prototype.forEach.call(form.elements, function (el) {
      if (el.name) data[el.name] = el.value;
    });
    return data;
  }
  function bind(root) {
    root.querySelectorAll("form.calc").forEach(function (form) {
      var run = function () {
        var note = form.querySelector("[data-note]");
        var data = readForm(form);
        var kind = form.getAttribute("data-calc");
        if (kind === "size") {
          var result = sizePosition(data);
          if (result.error) { note.textContent = result.error; return; }
          form.querySelector('[data-out="qty"]').textContent = result.qty.toLocaleString(undefined, { maximumFractionDigits: 6 });
          form.querySelector('[data-out="notional"]').textContent = money(result.notional);
          form.querySelector('[data-out="cash"]').textContent = money(result.riskCash);
          form.querySelector('[data-out="distance"]').textContent = result.distancePct.toFixed(2) + "%";
          form.querySelector('[data-out="friction"]').textContent = money(result.friction);
          form.querySelector('[data-out="loss"]').textContent = money(result.lossAtStop);
          form.querySelector('[data-out="implied"]').textContent = result.impliedLeverage.toFixed(2) + " times";
          note.textContent = "Example only. Fees and slippage are counted on the way in and the way out. This is not an order." + (result.warning ? " " + result.warning : "");
        } else if (kind === "liq") {
          var liq = liquidation(data);
          if (liq.error) { note.textContent = liq.error; return; }
          form.querySelector('[data-out="liq"]').textContent = liq.price.toFixed(4);
          note.textContent = "Example model for an isolated position. It is not a venue schedule.";
        } else {
          var grid = gridStep(data);
          if (grid.error) { note.textContent = grid.error; return; }
          form.querySelector('[data-out="step"]').textContent = grid.step.toFixed(4);
          form.querySelector('[data-out="fee"]').textContent = grid.fee.toFixed(4);
          form.querySelector('[data-out="net"]').textContent = grid.net.toFixed(4);
          note.textContent = grid.net <= 0
            ? "Example only. The step is smaller than the round-trip fee at the midpoint, so this gap does not pay for itself in the model."
            : "Example only. The step is larger than the round-trip fee at the midpoint. Spread and slippage are not in the fee box.";
        }
      };
      form.addEventListener("input", run);
      run();
    });
  }
  var booted = false;
  function render() {
    var raw = location.hash.replace(/^#/, "");
    if (!raw || raw === "/") raw = "/start";
    if (raw.charAt(0) === "/") raw = raw.slice(1);
    var parts = raw.split("/").filter(Boolean);
    var key = parts.join("/");
    var anchor = "";
    if (!views[key] && parts.length > 1) {
      key = parts.slice(0, -1).join("/");
      anchor = parts[parts.length - 1];
    }
    if (!views[key]) key = "start";
    main.innerHTML = views[key];
    document.title = (main.querySelector("h1") ? main.querySelector("h1").textContent : "Atlas") + " - Atlas";
    bind(main);
    document.querySelectorAll(".bar a").forEach(function (link) {
      var href = (link.getAttribute("href") || "").replace("#/", "");
      if (href === key || (href && key.indexOf(href + "/") === 0)) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    });
    var target = anchor && document.getElementById(anchor);
    if (booted) {
      var focusNode = target || main.querySelector("h1");
      if (focusNode) {
        if (!focusNode.hasAttribute("tabindex")) focusNode.setAttribute("tabindex", "-1");
        focusNode.focus();
      }
    }
    if (target) target.scrollIntoView();
    else if (booted) window.scrollTo(0, 0);
    booted = true;
  }
  window.addEventListener("hashchange", render);
  render();
  window.atlasSelfTest = function () {
    var failures = [];
    var a = sizePosition({ account: 10000, riskPct: 1, entry: 100, stop: 95, feeBps: 10, slipBps: 5, leverage: 2, mode: "spot" });
    if (Math.abs(a.qty - 20) > 1e-9) failures.push("qty");
    if (Math.abs(a.riskCash - 100) > 1e-9) failures.push("cash");
    if (Math.abs(a.friction - 6) > 1e-6) failures.push("friction");
    var b = liquidation({ entry: 100, leverage: 10, mmr: 0.5, side: "long" });
    if (Math.abs(b.price - 90.5) > 1e-9) failures.push("liq");
    var c = gridStep({ lower: 90, upper: 110, gaps: 10, feeBps: 10 });
    if (Math.abs(c.step - 2) > 1e-9) failures.push("step");
    return { ok: failures.length === 0, failures: failures };
  };
})();

</script>
