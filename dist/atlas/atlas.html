 font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Marked zone\u003c/text>\u003crect x=\"1040\" y=\"244\" width=\"312\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1058\" y=\"300\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Later price\u003c/text>\u003c/svg>\u003cfigcaption>A small down candle from 102 to 98, then a rise to 120. The small candle is the marked zone.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>The mark is a candle before a strong move.\u003c/li>\u003cli>A return is visible. The outcome is not included in the word.\u003c/li>\u003cli>It is a chart hypothesis, not a receipt.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/fair-value-gaps\">Next lesson: Fair value gaps\u003c/a>\u003c/p>","lesson/fair-value-gaps":"\u003cp class=\"crumb\">Intermediate / Smart money concepts\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a fair value gap is a three-candle pattern where the wick of the first and the wick of the third do not overlap.\u003c/p>\u003ch1>Fair value gaps\u003c/h1>\u003cp>Candle one, a fast middle candle, candle three. If candle three&#x27;s wick does not reach candle one&#x27;s wick, the space between them is the gap.\u003c/p>\u003cp>Some traders expect a later visit into that space. A visit is something you can check. It is not an unfilled order you can audit.\u003c/p>\u003cp>The gap is a location. It is not a reason, by itself, to place a trade.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Candle one high is 100.\u003c/li>\u003cli>The middle candle is large.\u003c/li>\u003cli>Candle three low is 106.\u003c/li>\u003cli>The wicks do not meet. The gap is 100 to 106, which is 6 wide.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-smart-money-04.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Three candles. Candle 1 high is 100. Candle 3 low is 106. The gap between them is the fair value gap.\">\u003ctitle>Three candles. Candle 1 high is 100. Candle 3 low is 106. The gap between them is the fair value gap.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah17\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">A gap between wick and wick\u003c/text>\u003crect x=\"140\" y=\"480\" width=\"280\" height=\"220\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"168\" y=\"602.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">High 100\u003c/text>\u003crect x=\"660\" y=\"220\" width=\"280\" height=\"420\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"688\" y=\"442.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Middle push\u003c/text>\u003crect x=\"1120\" y=\"180\" width=\"300\" height=\"180\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"1148\" y=\"282.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Low 106\u003c/text>\u003cline x1=\"420\" y1=\"560\" x2=\"660\" y2=\"420\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah17)\"/>\u003crect x=\"140\" y=\"704\" width=\"238\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"158\" y=\"760\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Candle 1\u003c/text>\u003crect x=\"1120\" y=\"364\" width=\"238\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"420\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Gap of 6\u003c/text>\u003c/svg>\u003cfigcaption>Three candles. Candle 1 high is 100. Candle 3 low is 106. The gap between them is the fair value gap.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Three candles, and the outer wicks do not overlap.\u003c/li>\u003cli>The gap is the space between those wicks.\u003c/li>\u003cli>A later visit is a check, not a promise.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/premium-discount\">Next lesson: Premium and discount\u003c/a>\u003c/p>","lesson/premium-discount":"\u003cp class=\"crumb\">Intermediate / Smart money concepts\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>you split a swing from its low to its high, and the top half is premium while the bottom half is discount.\u003c/p>\u003ch1>Premium and discount\u003c/h1>\u003cp>Pick the swing yourself. Low to high. The midpoint splits it.\u003c/p>\u003cp>Discount does not mean the coin is cheap in a fundamental sense. It means price is in the lower half of the swing you chose.\u003c/p>\u003cp>Premium does not mean you must sell. It means price is in the upper half of that same swing.\u003c/p>\u003cp>A grid box can sit entirely in one half. Knowing which half only tells you where you are inside the swing.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Swing low 100. Swing high 140. The middle is 120.\u003c/li>\u003cli>Price at 110 is discount. It is 10 below the middle.\u003c/li>\u003cli>Price at 130 is premium. It is 10 above the middle.\u003c/li>\u003cli>Change the swing and the labels move. The words belong to the swing you named.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-smart-money-05.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A dealing range from 100 to 140. The middle is 120. 110 is discount. 130 is premium.\">\u003ctitle>A dealing range from 100 to 140. The middle is 120. 110 is discount. 130 is premium.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah18\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Premium is the top half. Discount is the bottom half.\u003c/text>\u003cline x1=\"160\" y1=\"240\" x2=\"1080\" y2=\"240\" stroke=\"#ffb4b4\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"198\" width=\"312\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"254\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Premium 130\u003c/text>\u003cline x1=\"160\" y1=\"450\" x2=\"1080\" y2=\"450\" stroke=\"#ffe7a3\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"408\" width=\"213\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"464\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Mid 120\u003c/text>\u003cline x1=\"160\" y1=\"660\" x2=\"1080\" y2=\"660\" stroke=\"#7dcea0\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"618\" width=\"337\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"674\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Discount 110\u003c/text>\u003c/svg>\u003cfigcaption>A dealing range from 100 to 140. The middle is 120. 110 is discount. 130 is premium.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Premium and discount need a swing you chose.\u003c/li>\u003cli>The middle is the divider.\u003c/li>\u003cli>The words are locations, not valuations.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/inducement\">Next lesson: Inducement\u003c/a>\u003c/p>","lesson/inducement":"\u003cp class=\"crumb\">Intermediate / Smart money concepts\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>inducement is a smaller obvious high or low that sits in front of a larger one, where early orders can gather.\u003c/p>\u003ch1>Inducement\u003c/h1>\u003cp>Traders mark a minor swing that is easy to see, just before a more important swing. The idea is that early stops collect at the minor one.\u003c/p>\u003cp>Like the other marks in this module, you are guessing where orders might sit. You cannot see them.\u003c/p>\u003cp>A grid range that ignores the larger swing can be built around the small one and then fail when price reaches the larger pool.\u003c/p>\u003cp>The next module leaves these marks and builds a grid from a box, a gap, and a fee.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>The main high on the clock you care about is 140.\u003c/li>\u003cli>A smaller high sits at 125, in front of it.\u003c/li>\u003cli>Early buy stops might cluster above 125.\u003c/li>\u003cli>That is a hypothesis. A close through 125 does not require a stop at 140.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-smart-money-06.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A small high at 125 sits under a larger high at 140.\">\u003ctitle>A small high at 125 sits under a larger high at 140.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah19\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">A small high can lure early buys\u003c/text>\u003cline x1=\"160\" y1=\"360\" x2=\"1080\" y2=\"360\" stroke=\"#ffe7a3\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"318\" width=\"387\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"374\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Small high 125\u003c/text>\u003cline x1=\"160\" y1=\"240\" x2=\"1080\" y2=\"240\" stroke=\"#ffb4b4\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"198\" width=\"362\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"254\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Main high 140\u003c/text>\u003cpath d=\"M 200 640 L 520 360 L 820 560 L 1180 240\" fill=\"none\" stroke=\"#b6f3d4\" stroke-width=\"8\"/>\u003c/svg>\u003cfigcaption>A small high at 125 sits under a larger high at 140.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Inducement is a smaller obvious swing in front of a larger one.\u003c/li>\u003cli>It is a guess about where orders sit.\u003c/li>\u003cli>The larger swing still matters.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/grid-what\">Next lesson: What a grid bot is\u003c/a>\u003c/p>","lesson/grid-what":"\u003cp class=\"crumb\">Intermediate / Grid bots\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a grid bot places buys below the price and sells above it, on rungs you chose, and it does not predict the next candle.\u003c/p>\u003ch1>What a grid bot is\u003c/h1>\u003cp>You choose an upper price and a lower price. Between them you place levels. Levels under the current price are buys. Levels above it are sells.\u003c/p>\u003cp>The bot follows that list. It does not decide that a coin is good. It does not read the news.\u003c/p>\u003cp>If price only goes one way, the bot mostly collects coins or cash. The ladder does not invent a new plan.\u003c/p>\u003cp>Think of it as a ladder in a room. The room is the box. Outside the room, the ladder is the wrong tool until you review it.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Price is 100.\u003c/li>\u003cli>Sells are written at 102 and 104.\u003c/li>\u003cli>Buys are written at 98 and 96.\u003c/li>\u003cli>Nothing has happened yet. These are instructions, not results.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-grid-bots-01.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A ladder. Sells sit above the price at 102 and 104. Buys sit below at 98 and 96. The price is 100.\">\u003ctitle>A ladder. Sells sit above the price at 102 and 104. Buys sit below at 98 and 96. The price is 100.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah20\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">A grid is a ladder you write in advance\u003c/text>\u003cline x1=\"160\" y1=\"200\" x2=\"1080\" y2=\"200\" stroke=\"#ffb4b4\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"158\" width=\"238\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"214\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Sell 104\u003c/text>\u003cline x1=\"160\" y1=\"320\" x2=\"1080\" y2=\"320\" stroke=\"#ffb4b4\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"278\" width=\"238\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"334\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Sell 102\u003c/text>\u003cline x1=\"160\" y1=\"460\" x2=\"1080\" y2=\"460\" stroke=\"#ffe7a3\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"418\" width=\"263\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"474\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Price 100\u003c/text>\u003cline x1=\"160\" y1=\"600\" x2=\"1080\" y2=\"600\" stroke=\"#7dcea0\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"558\" width=\"188\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"614\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Buy 98\u003c/text>\u003cline x1=\"160\" y1=\"720\" x2=\"1080\" y2=\"720\" stroke=\"#7dcea0\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"678\" width=\"188\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"734\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Buy 96\u003c/text>\u003c/svg>\u003cfigcaption>A ladder. Sells sit above the price at 102 and 104. Buys sit below at 98 and 96. The price is 100.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>The bot repeats a ladder.\u003c/li>\u003cli>You choose the rungs.\u003c/li>\u003cli>It does not forecast.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/grid-how\">Next lesson: How a grid works\u003c/a>\u003c/p>","lesson/grid-how":"\u003cp class=\"crumb\">Intermediate / Grid bots\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>one cycle is a buy that fills and a later sell at the next rung, and the gap between them is the gross step.\u003c/p>\u003ch1>How a grid works\u003c/h1>\u003cp>Price falls and a buy fills. Price rises and the paired sell fills. That round trip is one cycle.\u003c/p>\u003cp>The gross step is the sell price minus the buy price, before fees, spread, and slippage.\u003c/p>\u003cp>If price never crosses the next rung, the cycle does not finish. A quiet market can sit still. A market that leaves the box does not complete the old cycles.\u003c/p>\u003cp>The bot will keep the old instructions until you change them. Automation does not notice that your reason expired.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>A buy fills at 98.\u003c/li>\u003cli>A sell fills at 100.\u003c/li>\u003cli>The gross gap is 2 per coin.\u003c/li>\u003cli>A round-trip fee larger than 2 would erase the gap. The next lessons put a fee next to the gap.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-grid-bots-02.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A buy fills at 98 and a later sell fills at 100. The gap is 2 before fees.\">\u003ctitle>A buy fills at 98 and a later sell fills at 100. The gap is 2 before fees.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah21\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">One cycle is a buy and a later sell\u003c/text>\u003crect x=\"160\" y=\"480\" width=\"360\" height=\"150\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"188\" y=\"567.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Buy 98\u003c/text>\u003crect x=\"900\" y=\"260\" width=\"360\" height=\"150\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"928\" y=\"347.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Sell 100\u003c/text>\u003cline x1=\"520\" y1=\"540\" x2=\"900\" y2=\"340\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah21)\"/>\u003crect x=\"620\" y=\"564\" width=\"461\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"638\" y=\"620\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Gap 2 before fees\u003c/text>\u003c/svg>\u003cfigcaption>A buy fills at 98 and a later sell fills at 100. The gap is 2 before fees.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>A cycle needs a fill on the way down and a fill on the way up, or the reverse pair you defined.\u003c/li>\u003cli>Gross step is the gap before costs.\u003c/li>\u003cli>No cross means no finished cycle.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/grid-setup\">Next lesson: Setting one up\u003c/a>\u003c/p>","lesson/grid-setup":"\u003cp class=\"crumb\">Intermediate / Grid bots\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>you write the upper price, the lower price, the number of gaps, the cash, the fee you assume, and the sentence that means the plan is over.\u003c/p>\u003ch1>Setting one up\u003c/h1>\u003cp>Setting up is mostly writing. The bot cannot supply the box or the reason.\u003c/p>\u003cp>Start with a spot explanation. A futures grid uses the same ladder plus margin, funding, and liquidation. Those words have their own module. Do not add them until you can explain them.\u003c/p>\u003cp>The review rule is one sentence. A daily close outside the box is an example of a sentence. I will see is not a sentence.\u003c/p>\u003cp>Keep some cash out of the grid. A reserve is what you use if you must pay fees or meet a margin need. This page does not tell you how much.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Upper 110. Lower 90.\u003c/li>\u003cli>Ten gaps across that box.\u003c/li>\u003cli>Cash set aside for the grid: 1000. More cash stays outside it.\u003c/li>\u003cli>Review rule: a daily close outside 90 to 110 sends you back to the written plan.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-grid-bots-03.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Four setup facts: upper 110, lower 90, 10 gaps, and a review rule.\">\u003ctitle>Four setup facts: upper 110, lower 90, 10 gaps, and a review rule.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah22\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Write the rules before anything runs\u003c/text>\u003crect x=\"60\" y=\"340\" width=\"330\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"88\" y=\"432.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Upper 110\u003c/text>\u003crect x=\"430\" y=\"340\" width=\"330\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"458\" y=\"432.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Lower 90\u003c/text>\u003crect x=\"800\" y=\"340\" width=\"330\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"828\" y=\"432.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Gaps 10\u003c/text>\u003crect x=\"1170\" y=\"340\" width=\"360\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"1198\" y=\"432.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Review rule\u003c/text>\u003c/svg>\u003cfigcaption>Four setup facts: upper 110, lower 90, 10 gaps, and a review rule.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Write the box, the gaps, the cash, the fee, and the review rule.\u003c/li>\u003cli>Spot first.\u003c/li>\u003cli>A review rule is a sentence you can check.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/grid-range\">Next lesson: Range and grid count\u003c/a>\u003c/p>","lesson/grid-range":"\u003cp class=\"crumb\">Intermediate / Grid bots\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>the width of the box and the number of gaps set the step, and the step has to clear a round-trip fee.\u003c/p>\u003ch1>Range and grid count\u003c/h1>\u003cp>A tight box is crossed by ordinary noise. A very wide box spreads the same cash so thin that cycles are rare.\u003c/p>\u003cp>Arithmetic gaps keep the same price distance. Geometric gaps keep the same percentage, so the price distance grows as price rises.\u003c/p>\u003cp>More gaps inside a fixed box make a smaller step. If the step is smaller than the fee and the slippage you assume, extra trades repeat a loss.\u003c/p>\u003cp>Use the grid tool on the tools page to change the fee and watch the warning. The numbers there are the same kind of example as this lesson.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Lower 90. Upper 110. The box is 20 wide.\u003c/li>\u003cli>Ten gaps. Arithmetic step is 20 divided by 10, which is 2.\u003c/li>\u003cli>A fee of 10 basis points on each side is 0.10 percent each way. At a price of 100, the round trip is about 0.20 per unit.\u003c/li>\u003cli>Step 2 is larger than 0.20 in this example. Forty gaps in a box only 10 wide, from 100 to 110, would make a step of 0.25, which is close to a 0.20 fee.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-grid-bots-04.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Three ranges. A tight box from 100 to 105, a middle box from 90 to 110, and a very wide box from 50 to 150.\">\u003ctitle>Three ranges. A tight box from 100 to 105, a middle box from 90 to 110, and a very wide box from 50 to 150.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah23\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Width is a tradeoff\u003c/text>\u003crect x=\"180\" y=\"620\" width=\"220\" height=\"140\" rx=\"8\" fill=\"#12344c\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"196\" y=\"800\" fill=\"#e8f4fc\" font-size=\"32\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Too tight\u003c/text>\u003crect x=\"180\" y=\"544\" width=\"213\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"198\" y=\"600\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">100-105\u003c/text>\u003crect x=\"620\" y=\"440\" width=\"220\" height=\"320\" rx=\"8\" fill=\"#12344c\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"636\" y=\"800\" fill=\"#e8f4fc\" font-size=\"32\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Has room\u003c/text>\u003crect x=\"620\" y=\"364\" width=\"188\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"638\" y=\"420\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">90-110\u003c/text>\u003crect x=\"1060\" y=\"240\" width=\"220\" height=\"520\" rx=\"8\" fill=\"#12344c\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"1076\" y=\"800\" fill=\"#e8f4fc\" font-size=\"32\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Very wide\u003c/text>\u003crect x=\"1060\" y=\"164\" width=\"188\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1078\" y=\"220\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">50-150\u003c/text>\u003c/svg>\u003cfigcaption>Three ranges. A tight box from 100 to 105, a middle box from 90 to 110, and a very wide box from 50 to 150.\u003c/figcaption>\u003c/figure>\u003cfigure data-image=\"atlas-grid-bots-05.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A step of 2 beside a round-trip fee of 0.20. The step is larger than the fee in this example.\">\u003ctitle>A step of 2 beside a round-trip fee of 0.20. The step is larger than the fee in this example.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah24\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">The step has to clear the fee\u003c/text>\u003crect x=\"360\" y=\"280\" width=\"220\" height=\"480\" rx=\"8\" fill=\"#12344c\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"376\" y=\"800\" fill=\"#e8f4fc\" font-size=\"32\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Step\u003c/text>\u003crect x=\"360\" y=\"204\" width=\"64\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"378\" y=\"260\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">2\u003c/text>\u003crect x=\"860\" y=\"680\" width=\"220\" height=\"80\" rx=\"8\" fill=\"#12344c\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"876\" y=\"800\" fill=\"#e8f4fc\" font-size=\"32\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Round-trip fee\u003c/text>\u003crect x=\"860\" y=\"604\" width=\"139\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"878\" y=\"660\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">0.20\u003c/text>\u003c/svg>\u003cfigcaption>A step of 2 beside a round-trip fee of 0.20. The step is larger than the fee in this example.\u003c/figcaption>\u003c/figure>\u003cfigure data-image=\"atlas-grid-bots-06.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Two ladders. The left has equal price gaps. The right has gaps that grow as price rises.\">\u003ctitle>Two ladders. The left has equal price gaps. The right has gaps that grow as price rises.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah25\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Arithmetic gaps differ from geometric gaps\u003c/text>\u003crect x=\"120\" y=\"240\" width=\"520\" height=\"460\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"148\" y=\"482.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Equal price gaps\u003c/text>\u003crect x=\"900\" y=\"240\" width=\"560\" height=\"460\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"928\" y=\"482.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Equal percent gaps\u003c/text>\u003crect x=\"160\" y=\"704\" width=\"362\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"178\" y=\"760\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Same distance\u003c/text>\u003crect x=\"940\" y=\"704\" width=\"412\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"958\" y=\"760\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Same percentage\u003c/text>\u003c/svg>\u003cfigcaption>Two ladders. The left has equal price gaps. The right has gaps that grow as price rises.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Width and count together set the step.\u003c/li>\u003cli>Arithmetic and geometric gaps are different shapes.\u003c/li>\u003cli>A step that does not clear the fee does not get fixed by more trades.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/grid-risk\">Next lesson: Grid risk\u003c/a>\u003c/p>","lesson/grid-risk":"\u003cp class=\"crumb\">Intermediate / Grid bots\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>finished cycles and unsold coins are different results, and the account can be down while the cycle total is up.\u003c/p>\u003ch1>Grid risk\u003c/h1>\u003cp>Grid profit usually counts finished round trips. Coins you bought and have not sold are inventory. Inventory can fall in price.\u003c/p>\u003cp>Several grids on the same coin are one bet that the coin stays in those boxes. They are not five independent ideas.\u003c/p>\u003cp>The cash you can lose if the review rule hits is the risk that matters. Use the position-size idea from the first module: cash divided by distance.\u003c/p>\u003cp>Leverage can turn a small trip outside the box into a margin problem. That is the next level, after this one is clear.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Ten finished cycles make a gross 20 in this example.\u003c/li>\u003cli>You still hold coins bought near 94. The price is now 80.\u003c/li>\u003cli>The unsold coins are a separate loss. They can be larger than the 20.\u003c/li>\u003cli>Reporting only the 20 would hide the account.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-grid-bots-07.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Finished cycles show plus 20. Unsold coins bought near 94 are now priced at 80.\">\u003ctitle>Finished cycles show plus 20. Unsold coins bought near 94 are now priced at 80.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah26\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Cycle profit is not the whole account\u003c/text>\u003crect x=\"120\" y=\"300\" width=\"520\" height=\"200\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"148\" y=\"412.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Cycles plus 20\u003c/text>\u003crect x=\"900\" y=\"300\" width=\"560\" height=\"200\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"928\" y=\"412.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Coins 94 to 80\u003c/text>\u003crect x=\"360\" y=\"564\" width=\"436\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"378\" y=\"620\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Keep these apart\u003c/text>\u003c/svg>\u003cfigcaption>Finished cycles show plus 20. Unsold coins bought near 94 are now priced at 80.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Cycles and inventory are different lines.\u003c/li>\u003cli>Same coin, many grids, one bet.\u003c/li>\u003cli>Write the cash you can lose if the box fails.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/grid-monitor\">Next lesson: Monitoring and adjusting\u003c/a>\u003c/p>","lesson/grid-monitor":"\u003cp class=\"crumb\">Intermediate / Grid bots\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>you check whether the written reason is still true, and you do not drag the box every hour to chase the latest price.\u003c/p>\u003ch1>Monitoring and adjusting\u003c/h1>\u003cp>Look at three things. Is price still inside the box, under the rule you wrote. Does the step still clear the fees you are actually paying. Did a scheduled event make the old reason obsolete.\u003c/p>\u003cp>Adjusting means returning to the sentence you wrote. Moving the box so that price is always inside it deletes the review rule.\u003c/p>\u003cp>Keep a short record. The professional journaling lesson shows one way to turn a list of results into an expectancy. You can start with one line per day.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>The box top is 110. The review rule uses a daily close.\u003c/li>\u003cli>Today closes at 112.\u003c/li>\u003cli>That close starts the review. It does not, by itself, tell you the next box.\u003c/li>\u003cli>If you silently move the top to 120, you no longer have the old plan to judge.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-grid-bots-08.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"The box top is 110 and a later close is 112, which starts a review.\">\u003ctitle>The box top is 110 and a later close is 112, which starts a review.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah27\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Outside the box, open the written rule\u003c/text>\u003cline x1=\"160\" y1=\"480\" x2=\"1080\" y2=\"480\" stroke=\"#ffe7a3\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"438\" width=\"312\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"494\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Box top 110\u003c/text>\u003cpath d=\"M 300 620 L 900 280\" fill=\"none\" stroke=\"#b6f3d4\" stroke-width=\"8\"/>\u003c/svg>\u003cfigcaption>The box top is 110 and a later close is 112, which starts a review.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Check the box, the fee, and the reason.\u003c/li>\u003cli>A close outside starts the written review.\u003c/li>\u003cli>Chasing price with a new box is a new plan.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/grid-mistakes\">Next lesson: Common grid mistakes\u003c/a>\u003c/p>","lesson/grid-mistakes":"\u003cp class=\"crumb\">Intermediate / Grid bots\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>the usual errors are a fee larger than the step, a box that ignores the higher clock, leverage you cannot explain, and no sentence for failure.\u003c/p>\u003ch1>Common grid mistakes\u003c/h1>\u003cp>Too many levels are the first arithmetic error. The picture looks busy. The step is smaller than the cost.\u003c/p>\u003cp>The second error is calling a trend a range because you want fills. Check the higher clock from the structure module.\u003c/p>\u003cp>The third error is adding leverage so a small account can run a large ladder. If you cannot explain liquidation, stay with the spot story.\u003c/p>\u003cp>The fourth error is silence about failure. When the box is left behind, there is no rule, so the loss continues.\u003c/p>\u003cp>Sometimes the careful result is to wait. Waiting is a decision. The next level explains leverage on its own terms, not as a way to force a grid.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Box from 100 to 110. That is 10 wide.\u003c/li>\u003cli>Forty gaps. Step is 10 divided by 40, which is 0.25.\u003c/li>\u003cli>Round-trip fee at a price near 100 is 0.20 in the earlier example.\u003c/li>\u003cli>0.25 minus 0.20 leaves 0.05 before spread and slippage. The ladder is almost all cost.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-grid-bots-09.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Forty gaps inside 100 to 110 make a step of 0.25, next to a fee of 0.20.\">\u003ctitle>Forty gaps inside 100 to 110 make a step of 0.25, next to a fee of 0.20.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah28\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Too many rungs can leave nothing after fees\u003c/text>\u003crect x=\"140\" y=\"300\" width=\"360\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"168\" y=\"392.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">40 gaps\u003c/text>\u003crect x=\"580\" y=\"300\" width=\"360\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"608\" y=\"392.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Step 0.25\u003c/text>\u003crect x=\"1040\" y=\"300\" width=\"400\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"1068\" y=\"392.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Fee 0.20\u003c/text>\u003cline x1=\"500\" y1=\"380\" x2=\"580\" y2=\"380\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah28)\"/>\u003cline x1=\"940\" y1=\"380\" x2=\"1040\" y2=\"380\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah28)\"/>\u003c/svg>\u003cfigcaption>Forty gaps inside 100 to 110 make a step of 0.25, next to a fee of 0.20.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Count the step against the fee.\u003c/li>\u003cli>Match the box to the higher clock.\u003c/li>\u003cli>No review sentence means no real plan.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/margin\">Next lesson: Margin\u003c/a>\u003c/p>","lesson/margin":"\u003cp class=\"crumb\">Advanced / Leverage trading\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>margin is the cash posted to support a position that is larger than that cash.\u003c/p>\u003ch1>Margin\u003c/h1>\u003cp>Notional is price times size. Margin is the part you post. The rest is borrowed exposure.\u003c/p>\u003cp>Isolated margin is assigned to one position. If that position is closed out, the loss is meant to stop at that assignment. Cross margin shares a pool across positions. One loss can draw on the pool.\u003c/p>\u003cp>A venue can change margin rules. This page uses a plain example, not a live schedule.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>You want exposure of 10000.\u003c/li>\u003cli>At 5 times, the margin is 10000 divided by 5, which is 2000.\u003c/li>\u003cli>The position is still 10000 of exposure. The cash posted is 2000.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-leverage-01.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A notional of 10000 posted with 2000 of margin at 5 times.\">\u003ctitle>A notional of 10000 posted with 2000 of margin at 5 times.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah29\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Margin is the cash you post\u003c/text>\u003crect x=\"300\" y=\"240\" width=\"220\" height=\"520\" rx=\"8\" fill=\"#12344c\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"316\" y=\"800\" fill=\"#e8f4fc\" font-size=\"32\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Notional\u003c/text>\u003crect x=\"300\" y=\"164\" width=\"164\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"318\" y=\"220\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">10000\u003c/text>\u003crect x=\"860\" y=\"600\" width=\"220\" height=\"160\" rx=\"8\" fill=\"#12344c\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"876\" y=\"800\" fill=\"#e8f4fc\" font-size=\"32\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Margin\u003c/text>\u003crect x=\"860\" y=\"524\" width=\"139\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"878\" y=\"580\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">2000\u003c/text>\u003c/svg>\u003cfigcaption>A notional of 10000 posted with 2000 of margin at 5 times.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Margin is posted cash.\u003c/li>\u003cli>Notional can be larger than margin.\u003c/li>\u003cli>Isolated and cross share risk differently.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/leverage-multiples\">Next lesson: Leverage\u003c/a>\u003c/p>","lesson/leverage-multiples":"\u003cp class=\"crumb\">Advanced / Leverage trading\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>leverage is notional divided by margin, and it scales both the gain and the loss on that margin.\u003c/p>\u003ch1>Leverage\u003c/h1>\u003cp>At 5 times, a 10 percent move in price is about a 50 percent move on the margin, before fees and funding.\u003c/p>\u003cp>The multiple does not make a setup more correct. It makes the same setup larger.\u003c/p>\u003cp>If you do not know the liquidation price, you do not yet know the leverage you are using.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Margin 2000. Notional 10000. That is 5 times.\u003c/li>\u003cli>Price falls 10 percent. The position loses about 1000.\u003c/li>\u003cli>1000 is half of the 2000 margin. The price move was 10 percent. The margin move was about 50 percent.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-leverage-02.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"The price falls 10 percent. On 5 times leverage the margin result is about minus 50 percent.\">\u003ctitle>The price falls 10 percent. On 5 times leverage the margin result is about minus 50 percent.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah30\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Leverage scales the move\u003c/text>\u003crect x=\"160\" y=\"280\" width=\"480\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"188\" y=\"372.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Price minus 10\u003c/text>\u003crect x=\"860\" y=\"360\" width=\"560\" height=\"240\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"888\" y=\"492.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Margin minus 50\u003c/text>\u003cline x1=\"640\" y1=\"360\" x2=\"860\" y2=\"460\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah30)\"/>\u003c/svg>\u003cfigcaption>The price falls 10 percent. On 5 times leverage the margin result is about minus 50 percent.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Leverage scales the result on the margin.\u003c/li>\u003cli>It does not improve the idea.\u003c/li>\u003cli>Know the liquidation price before you care about the multiple.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/liquidation\">Next lesson: Liquidation\u003c/a>\u003c/p>","lesson/liquidation":"\u003cp class=\"crumb\">Advanced / Leverage trading\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>liquidation is the price where losses have used up the margin down to a maintenance level, and the position is closed.\u003c/p>\u003ch1>Liquidation\u003c/h1>\u003cp>Maintenance margin is the minimum the venue wants left. This directory uses a simple model so you can see the arithmetic. A real schedule can be harsher, and fees make it worse.\u003c/p>\u003cp>For a long, the example price is entry times the quantity one minus one divided by leverage, plus the maintenance rate.\u003c/p>\u003cp>For a short, the example price is entry times the quantity one plus one divided by leverage, minus the maintenance rate.\u003c/p>\u003cp>The tools page runs this model from numbers you type. It is not a venue&#x27;s ladder.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Entry 100. Leverage 10. Maintenance rate 0.5 percent, which is 0.005.\u003c/li>\u003cli>Long example: 100 times (1 minus 0.1 plus 0.005) equals 90.5.\u003c/li>\u003cli>A fall from 100 to 90.5 is 9.5 percent in price. At 10 times, that is enough to exhaust most of the margin in this model.\u003c/li>\u003cli>Short example at the same inputs: 100 times (1 plus 0.1 minus 0.005) equals 109.5.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-leverage-03.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Entry at 100 and an example long liquidation near 90.5 at 10 times with a 0.5 percent maintenance rate.\">\u003ctitle>Entry at 100 and an example long liquidation near 90.5 at 10 times with a 0.5 percent maintenance rate.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah31\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Liquidation is the price that ends the margin\u003c/text>\u003cline x1=\"160\" y1=\"300\" x2=\"1080\" y2=\"300\" stroke=\"#7dcea0\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"258\" width=\"263\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"314\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Entry 100\u003c/text>\u003cline x1=\"160\" y1=\"620\" x2=\"1080\" y2=\"620\" stroke=\"#ffb4b4\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"578\" width=\"436\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"634\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Liquidation 90.5\u003c/text>\u003c/svg>\u003cfigcaption>Entry at 100 and an example long liquidation near 90.5 at 10 times with a 0.5 percent maintenance rate.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Liquidation closes the position for you.\u003c/li>\u003cli>The example formula is a teaching model.\u003c/li>\u003cli>Maintenance and fees move the real price.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/position-size\">Next lesson: Position sizing\u003c/a>\u003c/p>","lesson/position-size":"\u003cp class=\"crumb\">Advanced / Leverage trading\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>you still divide cash at risk by the distance to the stop, and leverage does not replace that division.\u003c/p>\u003ch1>Position sizing\u003c/h1>\u003cp>The beginner rule remains. Cash you can lose, divided by distance, is the size.\u003c/p>\u003cp>Leverage changes whether the account can hold that notional. It should not be the starting point.\u003c/p>\u003cp>If the notional divided by the account is larger than the leverage cap you set, the size does not fit the cap.\u003c/p>\u003cp>The tools page includes this calculator. Change the stop and watch the size move.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Account 10000. Risk 1 percent. Cash at risk 100.\u003c/li>\u003cli>Entry 100. Stop 95. Distance 5.\u003c/li>\u003cli>Size is 20. Notional is 2000.\u003c/li>\u003cli>2000 divided by 10000 is 0.20. You do not need 10 times leverage to hold this example. Wanting 10 times would be a different, larger plan.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-leverage-04.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Cash at risk 100 divided by a distance of 5 gives a size of 20.\">\u003ctitle>Cash at risk 100 divided by a distance of 5 gives a size of 20.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah32\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Size comes from cash and distance\u003c/text>\u003crect x=\"80\" y=\"360\" width=\"380\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"108\" y=\"452.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Risk 100\u003c/text>\u003crect x=\"560\" y=\"360\" width=\"380\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"588\" y=\"452.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Distance 5\u003c/text>\u003crect x=\"1080\" y=\"360\" width=\"400\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"1108\" y=\"452.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Size 20\u003c/text>\u003cline x1=\"460\" y1=\"440\" x2=\"560\" y2=\"440\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah32)\"/>\u003cline x1=\"940\" y1=\"440\" x2=\"1080\" y2=\"440\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah32)\"/>\u003c/svg>\u003cfigcaption>Cash at risk 100 divided by a distance of 5 gives a size of 20.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Size still comes from cash and distance.\u003c/li>\u003cli>Leverage is a constraint, not the goal.\u003c/li>\u003cli>Check notional against the account.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/perpetuals\">Next lesson: Perpetuals and dated contracts\u003c/a>\u003c/p>","lesson/perpetuals":"\u003cp class=\"crumb\">Advanced / Futures\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a perpetual has no expiry, and a dated contract ends on a day you can name.\u003c/p>\u003ch1>Perpetuals and dated contracts\u003c/h1>\u003cp>Both are contracts. You do not hold the coin itself. You hold a claim whose value moves with price, plus the margin rules.\u003c/p>\u003cp>A dated contract stops on its end date. After that, the position is not the same agreement.\u003c/p>\u003cp>A perpetual does not end on a calendar day. It uses funding payments to keep its price near the spot market. The next lesson is that payment.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>One contract in this example has no end date.\u003c/li>\u003cli>Another ends in 30 days.\u003c/li>\u003cli>The second one needs a plan for day 30. The first one needs a plan for funding instead.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-futures-01.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Two contracts. One has no end date. The other ends in 30 days.\">\u003ctitle>Two contracts. One has no end date. The other ends in 30 days.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah33\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Perpetual and dated are different clocks\u003c/text>\u003crect x=\"140\" y=\"320\" width=\"520\" height=\"200\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"168\" y=\"432.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">No end date\u003c/text>\u003crect x=\"900\" y=\"320\" width=\"540\" height=\"200\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"928\" y=\"432.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Ends in 30 days\u003c/text>\u003crect x=\"180\" y=\"564\" width=\"263\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"198\" y=\"620\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Perpetual\u003c/text>\u003crect x=\"940\" y=\"564\" width=\"164\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"958\" y=\"620\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Dated\u003c/text>\u003c/svg>\u003cfigcaption>Two contracts. One has no end date. The other ends in 30 days.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Perpetual means no expiry date.\u003c/li>\u003cli>Dated means a real end date.\u003c/li>\u003cli>You hold a contract, not the coins, unless you separately own coins.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/funding\">Next lesson: Funding rates\u003c/a>\u003c/p>","lesson/funding":"\u003cp class=\"crumb\">Advanced / Futures\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>funding is a periodic payment between longs and shorts on a perpetual, separate from your open and your close.\u003c/p>\u003ch1>Funding rates\u003c/h1>\u003cp>In this directory&#x27;s simple story, a positive rate means longs pay shorts. A negative rate means shorts pay longs. Live contracts can define the sign in their own documents. Read those before you rely on a sign.\u003c/p>\u003cp>The payment is rate times notional, usually several times a day. A small rate on a large notional is not small.\u003c/p>\u003cp>A grid that finishes many small cycles can still bleed if funding runs against the inventory the grid is holding.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Rate 0.01 percent for one interval. Notional 10000.\u003c/li>\u003cli>0.01 percent of 10000 is 1.\u003c/li>\u003cli>Three intervals in a day, if the rate stayed the same, would be 3.\u003c/li>\u003cli>This is an example rate, not a live reading.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-futures-02.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A positive funding example of 0.01 percent. On 10000 of notional that is about 1, paid from longs to shorts in this example.\">\u003ctitle>A positive funding example of 0.01 percent. On 10000 of notional that is about 1, paid from longs to shorts in this example.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah34\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Funding is a periodic payment\u003c/text>\u003crect x=\"140\" y=\"340\" width=\"400\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"168\" y=\"432.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Longs\u003c/text>\u003crect x=\"1040\" y=\"340\" width=\"400\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"1068\" y=\"432.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Shorts\u003c/text>\u003cline x1=\"540\" y1=\"420\" x2=\"1040\" y2=\"420\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah34)\"/>\u003crect x=\"560\" y=\"194\" width=\"337\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"578\" y=\"250\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">0.01 percent\u003c/text>\u003crect x=\"560\" y=\"564\" width=\"213\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"578\" y=\"620\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">About 1\u003c/text>\u003c/svg>\u003cfigcaption>A positive funding example of 0.01 percent. On 10000 of notional that is about 1, paid from longs to shorts in this example.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Funding is a payment between the two sides.\u003c/li>\u003cli>It is not your trading fee, and it is extra.\u003c/li>\u003cli>Small rates matter when the notional is large.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/long-short\">Next lesson: Long and short\u003c/a>\u003c/p>","lesson/long-short":"\u003cp class=\"crumb\">Advanced / Futures\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a long gains when price rises and loses when it falls, and a short does the opposite, before fees and funding.\u003c/p>\u003ch1>Long and short\u003c/h1>\u003cp>Long means you benefit from a higher price. Short means you benefit from a lower price.\u003c/p>\u003cp>Both can be leveraged. Both can be liquidated. The direction does not remove the margin rules.\u003c/p>\u003cp>A short can lose more than a beginner expects because price has no ceiling in the simple model. Write a stop anyway.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Entry 100. One unit.\u003c/li>\u003cli>Price goes to 110. The long is plus 10. The short is minus 10. Fees are not in those two numbers.\u003c/li>\u003cli>Price goes to 90. The long is minus 10. The short is plus 10. Again before fees and funding.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-futures-03.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Price rises by 10. The long result is plus 10 per unit. The short result is minus 10 per unit, before fees.\">\u003ctitle>Price rises by 10. The long result is plus 10 per unit. The short result is minus 10 per unit, before fees.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah35\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Long and short are opposite results\u003c/text>\u003crect x=\"160\" y=\"300\" width=\"480\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"188\" y=\"392.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Long plus 10\u003c/text>\u003crect x=\"920\" y=\"460\" width=\"500\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"948\" y=\"552.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Short minus 10\u003c/text>\u003crect x=\"620\" y=\"164\" width=\"362\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"638\" y=\"220\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Price plus 10\u003c/text>\u003c/svg>\u003cfigcaption>Price rises by 10. The long result is plus 10 per unit. The short result is minus 10 per unit, before fees.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Long and short are opposite price exposures.\u003c/li>\u003cli>Costs sit on top of that opposition.\u003c/li>\u003cli>A stop still belongs on both.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/hedging\">Next lesson: Hedging\u003c/a>\u003c/p>","lesson/hedging":"\u003cp class=\"crumb\">Advanced / Futures\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a hedge is a second position that offsets part of a move in something you already hold.\u003c/p>\u003ch1>Hedging\u003c/h1>\u003cp>If a grid has left you holding coins, a short contract can offset part of a further fall. It can also offset part of a rise. You give up some of the bounce.\u003c/p>\u003cp>The hedge has its own liquidation, fees, and funding. It is not free insurance.\u003c/p>\u003cp>Match the size on purpose. Hedging everything, or hedging a random fraction, are different plans.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>You hold 2 coins. Price falls by 10. The coins lose 20.\u003c/li>\u003cli>You are also short 1 coin. That short gains about 10, before costs.\u003c/li>\u003cli>The net price result is about minus 10, not minus 20. The hedge did not erase the loss.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-futures-04.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Two coins fall by 10 each, a loss of 20. A short of one coin gains about 10. The net loss is smaller.\">\u003ctitle>Two coins fall by 10 each, a loss of 20. A short of one coin gains about 10. The net loss is smaller.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah36\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">A hedge offsets part of a move\u003c/text>\u003crect x=\"120\" y=\"300\" width=\"520\" height=\"180\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"148\" y=\"402.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Coins lose 20\u003c/text>\u003crect x=\"900\" y=\"300\" width=\"540\" height=\"180\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"928\" y=\"402.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Short gains 10\u003c/text>\u003crect x=\"480\" y=\"544\" width=\"511\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"498\" y=\"600\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Net loss is smaller\u003c/text>\u003c/svg>\u003cfigcaption>Two coins fall by 10 each, a loss of 20. A short of one coin gains about 10. The net loss is smaller.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>A hedge offsets part of a move.\u003c/li>\u003cli>It also offsets part of the opposite move.\u003c/li>\u003cli>Costs and liquidation still apply to the hedge.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/options-basics\">Next lesson: Options basics\u003c/a>\u003c/p>","lesson/options-basics":"\u003cp class=\"crumb\">Advanced / Derivatives\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>you pay a premium for the right to buy or sell at a strike, and you can lose that premium.\u003c/p>\u003ch1>Options basics\u003c/h1>\u003cp>The premium is the price of the option. It is paid up front in this simple story.\u003c/p>\u003cp>The strike is the contract price inside the right. Expiry is the last moment the right exists.\u003c/p>\u003cp>You are not required to use the right. If you do nothing, the premium can expire worthless. That limited loss is the main difference from a futures position, which can keep losing past the cash you first noticed.\u003c/p>\u003cp>American or European exercise rules change when you may use the right. This page does not pick a venue&#x27;s rule.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Premium 5. Strike 100.\u003c/li>\u003cli>You pay 5 now.\u003c/li>\u003cli>If the option expires with no value, the result is minus 5, plus any fees.\u003c/li>\u003cli>You do not have to add more cash just because the coin moved, in this simple bought-option story.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-derivatives-01.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"You pay a premium of 5 for a right. You do not have to use the right. The most you lose in this example is 5.\">\u003ctitle>You pay a premium of 5 for a right. You do not have to use the right. The most you lose in this example is 5.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah37\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">An option is a right you pay for\u003c/text>\u003crect x=\"160\" y=\"320\" width=\"480\" height=\"180\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"188\" y=\"422.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Premium 5\u003c/text>\u003crect x=\"900\" y=\"320\" width=\"520\" height=\"180\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"928\" y=\"422.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">A right\u003c/text>\u003cline x1=\"640\" y1=\"410\" x2=\"900\" y2=\"410\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah37)\"/>\u003crect x=\"480\" y=\"564\" width=\"486\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"498\" y=\"620\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Loss can stop at 5\u003c/text>\u003c/svg>\u003cfigcaption>You pay a premium of 5 for a right. You do not have to use the right. The most you lose in this example is 5.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Premium is what you pay for the right.\u003c/li>\u003cli>Strike and expiry define the right.\u003c/li>\u003cli>Doing nothing can lose the premium and no more, in the basic bought case.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/calls-puts\">Next lesson: Calls and puts\u003c/a>\u003c/p>","lesson/calls-puts":"\u003cp class=\"crumb\">Advanced / Derivatives\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a call is the right to buy at the strike, and a put is the right to sell at the strike.\u003c/p>\u003ch1>Calls and puts\u003c/h1>\u003cp>A call becomes valuable when price is above the strike by more than the remaining costs. At expiry, a common example value is the greater of zero and price minus strike.\u003c/p>\u003cp>A put becomes valuable when price is below the strike. At expiry, a common example value is the greater of zero and strike minus price.\u003c/p>\u003cp>Subtract the premium you paid to see a profit. A valuable option can still be a loss if the premium was larger than that value.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Strike 100. Premium 5. These numbers are an example.\u003c/li>\u003cli>Call at expiry, price 110. Value is about 10. Profit is about 10 minus 5, which is 5.\u003c/li>\u003cli>Call at expiry, price 100 or lower. Value is about 0. Result is about minus 5.\u003c/li>\u003cli>Put at expiry, price 90. Value is about 10. Profit is about 5. Put at 100 or higher. Result is about minus 5.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-derivatives-02.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A call with strike 100 and premium 5. At a price of 110 the example profit is 5.\">\u003ctitle>A call with strike 100 and premium 5. At a price of 110 the example profit is 5.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah38\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Call payoff, in this example\u003c/text>\u003cline x1=\"180\" y1=\"760\" x2=\"180\" y2=\"180\" stroke=\"#8fb4cc\" stroke-width=\"4\" marker-end=\"url(#ah38)\"/>\u003cline x1=\"180\" y1=\"470\" x2=\"1460\" y2=\"470\" stroke=\"#8fb4cc\" stroke-width=\"4\" marker-end=\"url(#ah38)\"/>\u003ctext x=\"80\" y=\"200\" fill=\"#c5d7e6\" font-size=\"32\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Profit\u003c/text>\u003ctext x=\"1320\" y=\"520\" fill=\"#c5d7e6\" font-size=\"32\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Price\u003c/text>\u003cpath d=\"M 200 620 L 700 620 L 1300 220\" fill=\"none\" stroke=\"#8fe7ff\" stroke-width=\"8\"/>\u003crect x=\"720\" y=\"644\" width=\"288\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"738\" y=\"700\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Strike 100\u003c/text>\u003crect x=\"200\" y=\"504\" width=\"263\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"218\" y=\"560\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Premium 5\u003c/text>\u003crect x=\"1100\" y=\"124\" width=\"238\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1118\" y=\"180\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Profit 5\u003c/text>\u003c/svg>\u003cfigcaption>A call with strike 100 and premium 5. At a price of 110 the example profit is 5.\u003c/figcaption>\u003c/figure>\u003cfigure data-image=\"atlas-derivatives-03.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A put with strike 100 and premium 5. At a price of 90 the example profit is 5.\">\u003ctitle>A put with strike 100 and premium 5. At a price of 90 the example profit is 5.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah39\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"
