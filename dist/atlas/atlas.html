<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<meta name="description" content="A trading directory from first principles through grid bots, leverage, futures, options, and a written system.">
<style>

:root {
  --bg: #071422;
  --panel: #10283a;
  --text: #e8f4fc;
  --muted: #c5d7e6;
  --line: #3d6484;
  --cyan: #8fe7ff;
  --teach: #b6f3d4;
  --amber: #ffe7a3;
  --ink: #1a1204;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Segoe UI, Helvetica, Arial, sans-serif;
  font-size: 1.05rem;
  line-height: 1.6;
}
a { color: var(--cyan); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
.skip {
  position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden;
  background: var(--amber); color: var(--ink); font-weight: 700;
}
.skip:focus { width: auto; height: auto; padding: 0.6rem 0.8rem; z-index: 5; }
header {
  position: sticky; top: 0; background: #071422; border-bottom: 1px solid var(--line); z-index: 2;
}
.bar { display: flex; flex-wrap: wrap; gap: 0.4rem 0.8rem; align-items: center; padding: 0.7rem 1rem; }
.brand { color: var(--text); text-decoration: none; font-weight: 750; margin-right: 0.4rem; }
.bar nav { display: flex; flex-wrap: wrap; gap: 0.35rem 0.7rem; }
.bar a { text-decoration: none; }
.bar a[aria-current="page"] { color: var(--teach); }
.layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); }
main { padding: 1.1rem 1.1rem 3rem; max-width: 52rem; }
.learn, p, li { max-width: 68ch; }
.learn { background: #10283a; border-left: 4px solid var(--teach); padding: 0.75rem 0.9rem; }
h1 { font-size: clamp(2rem, 4vw, 3rem); line-height: 1.1; margin: 0.4rem 0 0.8rem; max-width: 20ch; }
h2 { font-size: 1.4rem; margin: 1.4rem 0 0.4rem; }
.crumb { color: var(--muted); margin-bottom: 0.2rem; }
figure { margin: 1rem 0; max-width: 100%; }
figure svg, figure img { width: 100%; height: auto; display: block; border-radius: 12px; }
figcaption { color: var(--muted); margin-top: 0.4rem; }
ol.index { list-style: none; padding: 0; }
ol.index a, .index a { display: flex; flex-direction: column; padding: 0.7rem 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--text); }
ol.index strong { color: var(--cyan); font-size: 1.15rem; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 0.7rem; }
label { display: flex; flex-direction: column; gap: 0.25rem; font-weight: 650; }
input, select {
  font: inherit; color: var(--text); background: #0c1c2a; border: 1px solid var(--line);
  border-radius: 10px; min-height: 44px; padding: 0.4rem 0.6rem;
}
.results { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 0.6rem; margin: 0.8rem 0; }
.results div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0.55rem 0.7rem; }
.results span { display: block; color: var(--muted); font-size: 0.9rem; }
.results strong { font-variant-numeric: tabular-nums; }
.note { color: var(--amber); }
.next { border-top: 1px solid var(--line); padding-top: 0.8rem; font-size: 1.15rem; }
.term { border-top: 1px solid var(--line); padding: 0.75rem 0; }
.term h2 { font-size: 1.2rem; margin: 0; }
.letters { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.letters a { min-width: 2.2rem; min-height: 2.4rem; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--text); }
footer { border-top: 1px solid var(--line); padding: 1rem; color: var(--muted); }

</style>
</head>

<script>window.ATLAS_VIEWS = {"start":"\u003ch1>Atlas\u003c/h1>\u003cp>Atlas is a directory for learning how markets work, how to read structure, how grid bots behave, and how leverage and later contracts change the risk.\u003c/p>\u003cp>Educational content only, not financial advice.\u003c/p>\u003cp>If you are new, follow the list below from the top. Each lesson says what you will learn, shows a labelled picture, walks through made-up numbers, and ends with the next lesson. Use the glossary when a word is new. Use the tools when you want to change a number and see the arithmetic.\u003c/p>\u003cfigure data-image=\"atlas-start-01.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Four stages in a row: Beginner, Intermediate, Advanced, and Professional, with an arrow moving to the right.\">\u003ctitle>Four stages in a row: Beginner, Intermediate, Advanced, and Professional, with an arrow moving to the right.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah1\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Read in this order\u003c/text>\u003crect x=\"70\" y=\"360\" width=\"300\" height=\"140\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"98\" y=\"442.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Beginner\u003c/text>\u003crect x=\"430\" y=\"360\" width=\"300\" height=\"140\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"458\" y=\"442.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Intermediate\u003c/text>\u003crect x=\"790\" y=\"360\" width=\"300\" height=\"140\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"818\" y=\"442.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Advanced\u003c/text>\u003crect x=\"1160\" y=\"360\" width=\"360\" height=\"140\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"1188\" y=\"442.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Professional\u003c/text>\u003cline x1=\"370\" y1=\"430\" x2=\"430\" y2=\"430\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah1)\"/>\u003cline x1=\"730\" y1=\"430\" x2=\"790\" y2=\"430\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah1)\"/>\u003cline x1=\"1090\" y1=\"430\" x2=\"1160\" y2=\"430\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah1)\"/>\u003c/svg>\u003cfigcaption>Four stages in a row: Beginner, Intermediate, Advanced, and Professional, with an arrow moving to the right.\u003c/figcaption>\u003c/figure>\u003ch2>Start here\u003c/h2>\u003col class=\"index\">\u003cli>\u003ca href=\"#/lesson/markets\">\u003cstrong>1. Markets\u003c/strong>\u003cspan>a market is where a buyer and a seller agree a price, and the printed price is that agreement.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/candles\">\u003cstrong>2. Candles\u003c/strong>\u003cspan>a candle compresses one period into the open, the high, the low, and the close.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/order-types\">\u003cstrong>3. Order types\u003c/strong>\u003cspan>a limit order waits for your price, and a market order pays the price that is available now.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/wallets\">\u003cstrong>4. Wallets and venues\u003c/strong>\u003cspan>coins you can move sit with your key, and coins at a venue sit with the venue until you withdraw.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/risk-basics\">\u003cstrong>5. Risk basics\u003c/strong>\u003cspan>you choose the cash you can lose, then divide by the distance to the stop, and that quotient is the size.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/trend\">\u003cstrong>6. Trend\u003c/strong>\u003cspan>an uptrend is higher highs and higher lows, and a downtrend is the opposite, on a clock you name.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/swings\">\u003cstrong>7. Swing highs and lows\u003c/strong>\u003cspan>a swing high is a high with lower highs on both sides, and a swing low is a low with higher lows on both sides, under a rule you keep.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/support-resistance\">\u003cstrong>8. Support and resistance\u003c/strong>\u003cspan>support is a price area where declines have stalled, and resistance is a price area where rallies have stalled.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/market-structure\">\u003cstrong>9. Market structure\u003c/strong>\u003cspan>market structure is the ordered list of swing highs and swing lows you are using on one clock.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/break-of-structure\">\u003cstrong>10. Break of structure\u003c/strong>\u003cspan>a break of structure is a close through the swing that would continue the sequence you already mapped.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/change-of-character\">\u003cstrong>11. Change of character\u003c/strong>\u003cspan>a change of character is a break against the sequence, such as losing the higher low an uptrend needed.\u003c/span>\u003c/a>\u003c/li>\u003c/ol>\u003cp>After those lessons, open Intermediate. Grid bots sit in that level, after the structure lessons.\u003c/p>\u003cp class=\"next\">\u003ca href=\"#/lesson/markets\">Next lesson: Markets\u003c/a>\u003c/p>","level/beginner":"\u003ch1>Beginner\u003c/h1>\u003cp>Start here if the words are new. You learn what a market is, how a candle is drawn, how an order waits or crosses, where coins can sit, and how a small risk limit becomes a size. Then you learn to name a trend, a swing, and a break.\u003c/p>\u003csection>\u003ch2>\u003ca href=\"#/module/foundations\">Foundations\u003c/a>\u003c/h2>\u003cp>These five lessons are the floor. Later lessons use these words without stopping to redefine them.\u003c/p>\u003col>\u003cli>\u003ca href=\"#/lesson/markets\">Markets\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/candles\">Candles\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/order-types\">Order types\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/wallets\">Wallets and venues\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/risk-basics\">Risk basics\u003c/a>\u003c/li>\u003c/ol>\u003c/section>\u003csection>\u003ch2>\u003ca href=\"#/module/structure\">Trading structure\u003c/a>\u003c/h2>\u003cp>Structure is a map of swings. You name the trend, the turning points, the floors and ceilings, and the two kinds of break.\u003c/p>\u003col>\u003cli>\u003ca href=\"#/lesson/trend\">Trend\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/swings\">Swing highs and lows\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/support-resistance\">Support and resistance\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/market-structure\">Market structure\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/break-of-structure\">Break of structure\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/change-of-character\">Change of character\u003c/a>\u003c/li>\u003c/ol>\u003c/section>","module/foundations":"\u003cp class=\"crumb\">Beginner\u003c/p>\u003ch1>Foundations\u003c/h1>\u003cp>These five lessons are the floor. Later lessons use these words without stopping to redefine them.\u003c/p>\u003col class=\"index\">\u003cli>\u003ca href=\"#/lesson/markets\">\u003cstrong>Markets\u003c/strong>\u003cspan>a market is where a buyer and a seller agree a price, and the printed price is that agreement.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/candles\">\u003cstrong>Candles\u003c/strong>\u003cspan>a candle compresses one period into the open, the high, the low, and the close.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/order-types\">\u003cstrong>Order types\u003c/strong>\u003cspan>a limit order waits for your price, and a market order pays the price that is available now.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/wallets\">\u003cstrong>Wallets and venues\u003c/strong>\u003cspan>coins you can move sit with your key, and coins at a venue sit with the venue until you withdraw.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/risk-basics\">\u003cstrong>Risk basics\u003c/strong>\u003cspan>you choose the cash you can lose, then divide by the distance to the stop, and that quotient is the size.\u003c/span>\u003c/a>\u003c/li>\u003c/ol>\u003cp class=\"next\">\u003ca href=\"#/lesson/markets\">Next lesson: Markets\u003c/a>\u003c/p>","module/structure":"\u003cp class=\"crumb\">Beginner\u003c/p>\u003ch1>Trading structure\u003c/h1>\u003cp>Structure is a map of swings. You name the trend, the turning points, the floors and ceilings, and the two kinds of break.\u003c/p>\u003col class=\"index\">\u003cli>\u003ca href=\"#/lesson/trend\">\u003cstrong>Trend\u003c/strong>\u003cspan>an uptrend is higher highs and higher lows, and a downtrend is the opposite, on a clock you name.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/swings\">\u003cstrong>Swing highs and lows\u003c/strong>\u003cspan>a swing high is a high with lower highs on both sides, and a swing low is a low with higher lows on both sides, under a rule you keep.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/support-resistance\">\u003cstrong>Support and resistance\u003c/strong>\u003cspan>support is a price area where declines have stalled, and resistance is a price area where rallies have stalled.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/market-structure\">\u003cstrong>Market structure\u003c/strong>\u003cspan>market structure is the ordered list of swing highs and swing lows you are using on one clock.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/break-of-structure\">\u003cstrong>Break of structure\u003c/strong>\u003cspan>a break of structure is a close through the swing that would continue the sequence you already mapped.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/change-of-character\">\u003cstrong>Change of character\u003c/strong>\u003cspan>a change of character is a break against the sequence, such as losing the higher low an uptrend needed.\u003c/span>\u003c/a>\u003c/li>\u003c/ol>\u003cp class=\"next\">\u003ca href=\"#/lesson/trend\">Next lesson: Trend\u003c/a>\u003c/p>","level/intermediate":"\u003ch1>Intermediate\u003c/h1>\u003cp>You already know swings. Here you add marks that some traders use around those swings, and then you learn how a grid bot repeats orders inside a box.\u003c/p>\u003csection>\u003ch2>\u003ca href=\"#/module/smart-money\">Smart money concepts\u003c/a>\u003c/h2>\u003cp>These names describe pictures on a chart. They are not receipts from a bank, and they are not instructions.\u003c/p>\u003col>\u003cli>\u003ca href=\"#/lesson/liquidity\">Liquidity\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/order-blocks\">Order blocks\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/fair-value-gaps\">Fair value gaps\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/premium-discount\">Premium and discount\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/inducement\">Inducement\u003c/a>\u003c/li>\u003c/ol>\u003c/section>\u003csection>\u003ch2>\u003ca href=\"#/module/grid-bots\">Grid bots\u003c/a>\u003c/h2>\u003cp>A grid bot repeats buys and sells inside a box you design. These seven lessons are the path: what it is, how a cycle works, how you set it up, how you choose the box and the count, how you limit the damage, how you watch it, and the mistakes that show up first.\u003c/p>\u003col>\u003cli>\u003ca href=\"#/lesson/grid-what\">What a grid bot is\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/grid-how\">How a grid works\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/grid-setup\">Setting one up\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/grid-range\">Range and grid count\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/grid-risk\">Grid risk\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/grid-monitor\">Monitoring and adjusting\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/grid-mistakes\">Common grid mistakes\u003c/a>\u003c/li>\u003c/ol>\u003c/section>","module/smart-money":"\u003cp class=\"crumb\">Intermediate\u003c/p>\u003ch1>Smart money concepts\u003c/h1>\u003cp>These names describe pictures on a chart. They are not receipts from a bank, and they are not instructions.\u003c/p>\u003col class=\"index\">\u003cli>\u003ca href=\"#/lesson/liquidity\">\u003cstrong>Liquidity\u003c/strong>\u003cspan>liquidity in this lesson means the cluster of stops and resting orders that often sit beyond an obvious high or low.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/order-blocks\">\u003cstrong>Order blocks\u003c/strong>\u003cspan>an order block is a candle, or a small cluster, just before a strong move, which some methods mark in case price returns.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/fair-value-gaps\">\u003cstrong>Fair value gaps\u003c/strong>\u003cspan>a fair value gap is a three-candle pattern where the wick of the first and the wick of the third do not overlap.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/premium-discount\">\u003cstrong>Premium and discount\u003c/strong>\u003cspan>you split a swing from its low to its high, and the top half is premium while the bottom half is discount.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/inducement\">\u003cstrong>Inducement\u003c/strong>\u003cspan>inducement is a smaller obvious high or low that sits in front of a larger one, where early orders can gather.\u003c/span>\u003c/a>\u003c/li>\u003c/ol>\u003cp class=\"next\">\u003ca href=\"#/lesson/liquidity\">Next lesson: Liquidity\u003c/a>\u003c/p>","module/grid-bots":"\u003cp class=\"crumb\">Intermediate\u003c/p>\u003ch1>Grid bots\u003c/h1>\u003cp>A grid bot repeats buys and sells inside a box you design. These seven lessons are the path: what it is, how a cycle works, how you set it up, how you choose the box and the count, how you limit the damage, how you watch it, and the mistakes that show up first.\u003c/p>\u003col class=\"index\">\u003cli>\u003ca href=\"#/lesson/grid-what\">\u003cstrong>What a grid bot is\u003c/strong>\u003cspan>a grid bot places buys below the price and sells above it, on rungs you chose, and it does not predict the next candle.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/grid-how\">\u003cstrong>How a grid works\u003c/strong>\u003cspan>one cycle is a buy that fills and a later sell at the next rung, and the gap between them is the gross step.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/grid-setup\">\u003cstrong>Setting one up\u003c/strong>\u003cspan>you write the upper price, the lower price, the number of gaps, the cash, the fee you assume, and the sentence that means the plan is over.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/grid-range\">\u003cstrong>Range and grid count\u003c/strong>\u003cspan>the width of the box and the number of gaps set the step, and the step has to clear a round-trip fee.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/grid-risk\">\u003cstrong>Grid risk\u003c/strong>\u003cspan>finished cycles and unsold coins are different results, and the account can be down while the cycle total is up.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/grid-monitor\">\u003cstrong>Monitoring and adjusting\u003c/strong>\u003cspan>you check whether the written reason is still true, and you do not drag the box every hour to chase the latest price.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/grid-mistakes\">\u003cstrong>Common grid mistakes\u003c/strong>\u003cspan>the usual errors are a fee larger than the step, a box that ignores the higher clock, leverage you cannot explain, and no sentence for failure.\u003c/span>\u003c/a>\u003c/li>\u003c/ol>\u003cp class=\"next\">\u003ca href=\"#/lesson/grid-what\">Next lesson: What a grid bot is\u003c/a>\u003c/p>","level/advanced":"\u003ch1>Advanced\u003c/h1>\u003cp>Leverage, futures, and options change the size of a loss and add new payments. Read them after the spot and grid lessons, not instead of them.\u003c/p>\u003csection>\u003ch2>\u003ca href=\"#/module/leverage\">Leverage trading\u003c/a>\u003c/h2>\u003cp>Margin is the cash you post. Leverage is how large the position is compared with that cash. Liquidation is the price that ends the position for you.\u003c/p>\u003col>\u003cli>\u003ca href=\"#/lesson/margin\">Margin\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/leverage-multiples\">Leverage\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/liquidation\">Liquidation\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/position-size\">Position sizing\u003c/a>\u003c/li>\u003c/ol>\u003c/section>\u003csection>\u003ch2>\u003ca href=\"#/module/futures\">Futures\u003c/a>\u003c/h2>\u003cp>A futures contract is an agreement on a later price. Perpetuals have no end date. Dated contracts do. Funding, direction, and hedges sit on top of that difference.\u003c/p>\u003col>\u003cli>\u003ca href=\"#/lesson/perpetuals\">Perpetuals and dated contracts\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/funding\">Funding rates\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/long-short\">Long and short\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/hedging\">Hedging\u003c/a>\u003c/li>\u003c/ol>\u003c/section>\u003csection>\u003ch2>\u003ca href=\"#/module/derivatives\">Derivatives\u003c/a>\u003c/h2>\u003cp>An option is a right you pay for. Calls and puts are the two directions. Greeks are names for how the price of that right changes. Basis is the gap between a futures price and spot.\u003c/p>\u003col>\u003cli>\u003ca href=\"#/lesson/options-basics\">Options basics\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/calls-puts\">Calls and puts\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/greeks\">Greeks in plain words\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/basis\">Basis\u003c/a>\u003c/li>\u003c/ol>\u003c/section>","module/leverage":"\u003cp class=\"crumb\">Advanced\u003c/p>\u003ch1>Leverage trading\u003c/h1>\u003cp>Margin is the cash you post. Leverage is how large the position is compared with that cash. Liquidation is the price that ends the position for you.\u003c/p>\u003col class=\"index\">\u003cli>\u003ca href=\"#/lesson/margin\">\u003cstrong>Margin\u003c/strong>\u003cspan>margin is the cash posted to support a position that is larger than that cash.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/leverage-multiples\">\u003cstrong>Leverage\u003c/strong>\u003cspan>leverage is notional divided by margin, and it scales both the gain and the loss on that margin.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/liquidation\">\u003cstrong>Liquidation\u003c/strong>\u003cspan>liquidation is the price where losses have used up the margin down to a maintenance level, and the position is closed.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/position-size\">\u003cstrong>Position sizing\u003c/strong>\u003cspan>you still divide cash at risk by the distance to the stop, and leverage does not replace that division.\u003c/span>\u003c/a>\u003c/li>\u003c/ol>\u003cp class=\"next\">\u003ca href=\"#/lesson/margin\">Next lesson: Margin\u003c/a>\u003c/p>","module/futures":"\u003cp class=\"crumb\">Advanced\u003c/p>\u003ch1>Futures\u003c/h1>\u003cp>A futures contract is an agreement on a later price. Perpetuals have no end date. Dated contracts do. Funding, direction, and hedges sit on top of that difference.\u003c/p>\u003col class=\"index\">\u003cli>\u003ca href=\"#/lesson/perpetuals\">\u003cstrong>Perpetuals and dated contracts\u003c/strong>\u003cspan>a perpetual has no expiry, and a dated contract ends on a day you can name.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/funding\">\u003cstrong>Funding rates\u003c/strong>\u003cspan>funding is a periodic payment between longs and shorts on a perpetual, separate from your open and your close.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/long-short\">\u003cstrong>Long and short\u003c/strong>\u003cspan>a long gains when price rises and loses when it falls, and a short does the opposite, before fees and funding.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/hedging\">\u003cstrong>Hedging\u003c/strong>\u003cspan>a hedge is a second position that offsets part of a move in something you already hold.\u003c/span>\u003c/a>\u003c/li>\u003c/ol>\u003cp class=\"next\">\u003ca href=\"#/lesson/perpetuals\">Next lesson: Perpetuals and dated contracts\u003c/a>\u003c/p>","module/derivatives":"\u003cp class=\"crumb\">Advanced\u003c/p>\u003ch1>Derivatives\u003c/h1>\u003cp>An option is a right you pay for. Calls and puts are the two directions. Greeks are names for how the price of that right changes. Basis is the gap between a futures price and spot.\u003c/p>\u003col class=\"index\">\u003cli>\u003ca href=\"#/lesson/options-basics\">\u003cstrong>Options basics\u003c/strong>\u003cspan>you pay a premium for the right to buy or sell at a strike, and you can lose that premium.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/calls-puts\">\u003cstrong>Calls and puts\u003c/strong>\u003cspan>a call is the right to buy at the strike, and a put is the right to sell at the strike.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/greeks\">\u003cstrong>Greeks in plain words\u003c/strong>\u003cspan>delta, gamma, theta, and vega are names for how an option price responds to the coin, to the speed of that response, to time, and to volatility.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/basis\">\u003cstrong>Basis\u003c/strong>\u003cspan>basis is the futures price minus the spot price, a gap you can measure today.\u003c/span>\u003c/a>\u003c/li>\u003c/ol>\u003cp class=\"next\">\u003ca href=\"#/lesson/options-basics\">Next lesson: Options basics\u003c/a>\u003c/p>","level/professional":"\u003ch1>Professional\u003c/h1>\u003cp>The last module is about behaviour you can repeat: a written plan, a journal, a respect for losing streaks, a way to notice urges, and a system small enough to review.\u003c/p>\u003csection>\u003ch2>\u003ca href=\"#/module/professional\">Professional practice\u003c/a>\u003c/h2>\u003cp>None of these lessons raise the odds of a single idea. They stop you from changing the idea in the middle of the result.\u003c/p>\u003col>\u003cli>\u003ca href=\"#/lesson/trade-plans\">Trade plans\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/journaling\">Journaling\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/risk-of-ruin\">Risk of ruin\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/psychology\">Psychology\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/building-a-system\">Building a system\u003c/a>\u003c/li>\u003c/ol>\u003c/section>","module/professional":"\u003cp class=\"crumb\">Professional\u003c/p>\u003ch1>Professional practice\u003c/h1>\u003cp>None of these lessons raise the odds of a single idea. They stop you from changing the idea in the middle of the result.\u003c/p>\u003col class=\"index\">\u003cli>\u003ca href=\"#/lesson/trade-plans\">\u003cstrong>Trade plans\u003c/strong>\u003cspan>a plan names the entry, the stop, the cash at risk, and what would make the idea wrong, before you act.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/journaling\">\u003cstrong>Journaling\u003c/strong>\u003cspan>a journal records result in R so that different sizes can be compared, and expectancy is the average R in a sample.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/risk-of-ruin\">\u003cstrong>Risk of ruin\u003c/strong>\u003cspan>the percent you risk per idea decides how deep a losing streak cuts, even before you know the win rate.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/psychology\">\u003cstrong>Psychology\u003c/strong>\u003cspan>after a loss you will want to change size, and the want is not a new plan.\u003c/span>\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/lesson/building-a-system\">\u003cstrong>Building a system\u003c/strong>\u003cspan>a small system is one market, one setup, one risk rule, and one day a week when you review the journal.\u003c/span>\u003c/a>\u003c/li>\u003c/ol>\u003cp class=\"next\">\u003ca href=\"#/lesson/trade-plans\">Next lesson: Trade plans\u003c/a>\u003c/p>","lesson/markets":"\u003cp class=\"crumb\">Beginner / Foundations\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a market is where a buyer and a seller agree a price, and the printed price is that agreement.\u003c/p>\u003ch1>Markets\u003c/h1>\u003cp>A market is a meeting place for orders. Someone wants to buy. Someone wants to sell. When they agree, a trade prints.\u003c/p>\u003cp>The printed price is not a vote about the future. It is the last agreement. The next agreement can be higher or lower.\u003c/p>\u003cp>Buyers and sellers can both be wrong about what they wanted a minute ago. The tape only shows the trades that happened.\u003c/p>\u003cp>You do not need a named venue to understand this. Any place that matches orders works the same way at this level.\u003c/p>\u003cp>Next you will see how one period of those trades is drawn as a candle.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>A buyer is willing to pay 100.\u003c/li>\u003cli>A seller wants 110.\u003c/li>\u003cli>They meet in the middle and a trade prints at 105.\u003c/li>\u003cli>105 is the last price. It is not a promise that the next trade is 105.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-foundations-01.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Buyers on the left and sellers on the right meet at a price of 105.\">\u003ctitle>Buyers on the left and sellers on the right meet at a price of 105.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah2\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">A trade is a meeting\u003c/text>\u003crect x=\"80\" y=\"340\" width=\"360\" height=\"180\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"108\" y=\"442.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Buyers\u003c/text>\u003crect x=\"1160\" y=\"340\" width=\"360\" height=\"180\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"1188\" y=\"442.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Sellers\u003c/text>\u003cline x1=\"440\" y1=\"400\" x2=\"620\" y2=\"430\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah2)\"/>\u003cline x1=\"1160\" y1=\"400\" x2=\"980\" y2=\"430\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah2)\"/>\u003crect x=\"80\" y=\"564\" width=\"238\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"98\" y=\"620\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Idea 100\u003c/text>\u003crect x=\"620\" y=\"194\" width=\"263\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"638\" y=\"250\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Price 105\u003c/text>\u003crect x=\"1160\" y=\"564\" width=\"238\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1178\" y=\"620\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Idea 110\u003c/text>\u003c/svg>\u003cfigcaption>Buyers on the left and sellers on the right meet at a price of 105.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>A trade is an agreement.\u003c/li>\u003cli>The last price is history, not a forecast.\u003c/li>\u003cli>The same idea fits any venue.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/candles\">Next lesson: Candles\u003c/a>\u003c/p>","lesson/candles":"\u003cp class=\"crumb\">Beginner / Foundations\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a candle compresses one period into the open, the high, the low, and the close.\u003c/p>\u003ch1>Candles\u003c/h1>\u003cp>Pick a clock. One minute, one hour, one day. A candle covers that clock and then the next candle starts.\u003c/p>\u003cp>The open is the first trade in the period. The close is the last trade. The high is the dearest trade. The low is the cheapest trade.\u003c/p>\u003cp>The body is the box from open to close. The wicks are the lines beyond the body. A wick shows that price visited a level and did not stay there by the close.\u003c/p>\u003cp>A wide body means the close is far from the open. A long wick means the extreme did not hold.\u003c/p>\u003cp>Colour is a convenience. The four prices are the fact. Next you will see how an order can wait at a price or cross the spread.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Open 100. High 108. Low 97. Close 104.\u003c/li>\u003cli>The body runs from 100 to 104. That is 4.\u003c/li>\u003cli>The upper wick runs from 104 to 108. The lower wick runs from 100 to 97.\u003c/li>\u003cli>Price traded at 108, but the period ended at 104.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-foundations-02.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"One candlestick. High 108, close 104, open 100, low 97.\">\u003ctitle>One candlestick. High 108, close 104, open 100, low 97.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah3\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">One candle shows four prices\u003c/text>\u003cline x1=\"780\" y1=\"180\" x2=\"780\" y2=\"760\" stroke=\"#7dcea0\" stroke-width=\"8\"/>\u003crect x=\"756.0\" y=\"300\" width=\"48\" height=\"260\" rx=\"4\" fill=\"#7dcea0\" stroke=\"#7dcea0\" stroke-width=\"0\"/>\u003cline x1=\"820\" y1=\"180\" x2=\"980\" y2=\"180\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah3)\"/>\u003crect x=\"1000\" y=\"140\" width=\"238\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1018\" y=\"196\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">High 108\u003c/text>\u003cline x1=\"820\" y1=\"300\" x2=\"980\" y2=\"300\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah3)\"/>\u003crect x=\"1000\" y=\"260\" width=\"263\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1018\" y=\"316\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Close 104\u003c/text>\u003cline x1=\"700\" y1=\"560\" x2=\"520\" y2=\"560\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah3)\"/>\u003crect x=\"180\" y=\"520\" width=\"238\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"198\" y=\"576\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Open 100\u003c/text>\u003cline x1=\"740\" y1=\"760\" x2=\"560\" y2=\"760\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah3)\"/>\u003crect x=\"220\" y=\"720\" width=\"188\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"238\" y=\"776\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Low 97\u003c/text>\u003c/svg>\u003cfigcaption>One candlestick. High 108, close 104, open 100, low 97.\u003c/figcaption>\u003c/figure>\u003cfigure data-image=\"atlas-foundations-03.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Two candles. The left has a wide body. The right has a long wick.\">\u003ctitle>Two candles. The left has a wide body. The right has a long wick.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah4\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Body and wick are different facts\u003c/text>\u003cline x1=\"520\" y1=\"220\" x2=\"520\" y2=\"700\" stroke=\"#ffb4b4\" stroke-width=\"8\"/>\u003crect x=\"485.0\" y=\"280\" width=\"70\" height=\"340\" rx=\"4\" fill=\"#ffb4b4\" stroke=\"#ffb4b4\" stroke-width=\"0\"/>\u003cline x1=\"1040\" y1=\"160\" x2=\"1040\" y2=\"760\" stroke=\"#ffb4b4\" stroke-width=\"8\"/>\u003crect x=\"1005.0\" y=\"360\" width=\"70\" height=\"60\" rx=\"4\" fill=\"#ffb4b4\" stroke=\"#ffb4b4\" stroke-width=\"0\"/>\u003cline x1=\"590\" y1=\"450\" x2=\"760\" y2=\"450\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah4)\"/>\u003crect x=\"780\" y=\"410\" width=\"263\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"798\" y=\"466\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Wide body\u003c/text>\u003cline x1=\"1110\" y1=\"200\" x2=\"1240\" y2=\"200\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah4)\"/>\u003crect x=\"1260\" y=\"160\" width=\"263\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1278\" y=\"216\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Long wick\u003c/text>\u003c/svg>\u003cfigcaption>Two candles. The left has a wide body. The right has a long wick.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Four prices define the candle.\u003c/li>\u003cli>The body is open to close.\u003c/li>\u003cli>Wicks are visits that did not become the close.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/order-types\">Next lesson: Order types\u003c/a>\u003c/p>","lesson/order-types":"\u003cp class=\"crumb\">Beginner / Foundations\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a limit order waits for your price, and a market order pays the price that is available now.\u003c/p>\u003ch1>Order types\u003c/h1>\u003cp>An order book is a list. Bids are buys that are waiting. Asks are sells that are waiting. The best bid is the highest waiting buy. The best ask is the lowest waiting sell.\u003c/p>\u003cp>The spread is the gap between those two. Crossing the spread costs you that gap, plus any fee.\u003c/p>\u003cp>A limit order rests at the price you choose. It may not fill. A market order fills now against resting orders. You do not choose the exact print.\u003c/p>\u003cp>A stop is a trigger. When price reaches it, the stop becomes a market or a limit, depending on the rule you set. The name stop does not mean the loss is capped until you see the fill.\u003c/p>\u003cp>Next you will see the difference between coins you can move yourself and coins sitting at a venue.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Best bid 99. Best ask 101. The spread is 2.\u003c/li>\u003cli>A limit buy at 99 waits with the bid. It fills only if a seller comes down.\u003c/li>\u003cli>A market buy pays 101 now. The extra 2 is the cost of crossing, before fees.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-foundations-04.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A small book. The ask is 101, the bid is 99, a limit rests at 99, and a market buy pays 101.\">\u003ctitle>A small book. The ask is 101, the bid is 99, a limit rests at 99, and a market buy pays 101.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah5\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Market crosses. Limit waits.\u003c/text>\u003cline x1=\"160\" y1=\"320\" x2=\"1080\" y2=\"320\" stroke=\"#ffb4b4\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"278\" width=\"213\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"334\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Ask 101\u003c/text>\u003cline x1=\"160\" y1=\"560\" x2=\"1080\" y2=\"560\" stroke=\"#7dcea0\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"518\" width=\"188\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"574\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Bid 99\u003c/text>\u003crect x=\"180\" y=\"194\" width=\"288\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"198\" y=\"250\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Market buy\u003c/text>\u003crect x=\"180\" y=\"624\" width=\"461\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"198\" y=\"680\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Limit waits at 99\u003c/text>\u003c/svg>\u003cfigcaption>A small book. The ask is 101, the bid is 99, a limit rests at 99, and a market buy pays 101.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Limit waits. Market crosses.\u003c/li>\u003cli>The spread is a real cost.\u003c/li>\u003cli>A trigger is not the same thing as a fill.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/wallets\">Next lesson: Wallets and venues\u003c/a>\u003c/p>","lesson/wallets":"\u003cp class=\"crumb\">Beginner / Foundations\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>coins you can move sit with your key, and coins at a venue sit with the venue until you withdraw.\u003c/p>\u003ch1>Wallets and venues\u003c/h1>\u003cp>A wallet is a way to hold the secret that can move coins. The common secret is a word list. Anyone who has the words can move the coins. There is no ordinary reset.\u003c/p>\u003cp>A venue account is different. The venue&#x27;s books say the balance is yours, but the keys are theirs until a withdrawal completes.\u003c/p>\u003cp>Both places can fail. You can lose a word list. A venue can freeze, halt withdrawals, or be wrong about a balance.\u003c/p>\u003cp>This directory does not name a venue and does not rank them. The question is only who can move the coins today.\u003c/p>\u003cp>Next you will turn a cash limit into a position size. That habit matters before any bot or any leverage.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>You have 1000 coins in total in this example.\u003c/li>\u003cli>200 sit where you hold the word list.\u003c/li>\u003cli>800 sit in a venue balance.\u003c/li>\u003cli>You can move the 200 yourself. You can move the 800 only if the venue processes a withdrawal.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-foundations-05.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Two balances. Your wallet holds 200 and the key. A venue balance holds 800 and the key stays there.\">\u003ctitle>Two balances. Your wallet holds 200 and the key. A venue balance holds 800 and the key stays there.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah6\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Where the coins sit\u003c/text>\u003crect x=\"280\" y=\"540\" width=\"220\" height=\"220\" rx=\"8\" fill=\"#12344c\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"296\" y=\"800\" fill=\"#e8f4fc\" font-size=\"32\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Your wallet\u003c/text>\u003crect x=\"280\" y=\"464\" width=\"114\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"298\" y=\"520\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">200\u003c/text>\u003crect x=\"860\" y=\"240\" width=\"220\" height=\"520\" rx=\"8\" fill=\"#12344c\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"876\" y=\"800\" fill=\"#e8f4fc\" font-size=\"32\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Venue balance\u003c/text>\u003crect x=\"860\" y=\"164\" width=\"114\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"878\" y=\"220\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">800\u003c/text>\u003c/svg>\u003cfigcaption>Two balances. Your wallet holds 200 and the key. A venue balance holds 800 and the key stays there.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>The word list is the key.\u003c/li>\u003cli>A venue balance is a claim, not the same as a key in your hand.\u003c/li>\u003cli>Split the question: who can move the coins.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/risk-basics\">Next lesson: Risk basics\u003c/a>\u003c/p>","lesson/risk-basics":"\u003cp class=\"crumb\">Beginner / Foundations\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>you choose the cash you can lose, then divide by the distance to the stop, and that quotient is the size.\u003c/p>\u003ch1>Risk basics\u003c/h1>\u003cp>Risk here means the cash you are willing to lose if the idea is wrong. It is a number you write before the entry.\u003c/p>\u003cp>The stop is the price that means the idea is wrong. The distance is the gap from entry to that price.\u003c/p>\u003cp>Size is cash at risk divided by distance. A closer stop makes a larger size. A closer stop is not automatically safer.\u003c/p>\u003cp>Fees and slippage make the loss a bit larger than the cash you named. Later tools show that extra.\u003c/p>\u003cp>You now have the floor. The next module names the shape of the path: trend, swing, and break.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Account 10000. You risk 1 percent. That is 100 of cash.\u003c/li>\u003cli>Entry 100. Stop 95. Distance 5.\u003c/li>\u003cli>Size is 100 divided by 5, which is 20 units.\u003c/li>\u003cli>Notional is 20 times 100, which is 2000. That is the position, not the loss. The planned loss is still about 100, plus fees.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-foundations-06.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"An account bar of 10000 with a small slice of 100, which is 1 percent. The stop is 5 away, so the size is 20.\">\u003ctitle>An account bar of 10000 with a small slice of 100, which is 1 percent. The stop is 5 away, so the size is 20.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah7\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Risk is a slice, then a size\u003c/text>\u003crect x=\"80\" y=\"300\" width=\"1200\" height=\"120\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"108\" y=\"372.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Account 10000\u003c/text>\u003crect x=\"80\" y=\"300\" width=\"140\" height=\"120\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"108\" y=\"372.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">\u003c/text>\u003crect x=\"80\" y=\"464\" width=\"436\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"98\" y=\"520\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">1 percent is 100\u003c/text>\u003crect x=\"620\" y=\"464\" width=\"288\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"638\" y=\"520\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Distance 5\u003c/text>\u003crect x=\"1040\" y=\"464\" width=\"213\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1058\" y=\"520\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Size 20\u003c/text>\u003c/svg>\u003cfigcaption>An account bar of 10000 with a small slice of 100, which is 1 percent. The stop is 5 away, so the size is 20.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Write the cash first.\u003c/li>\u003cli>Size equals cash divided by distance.\u003c/li>\u003cli>A tight stop increases size.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/trend\">Next lesson: Trend\u003c/a>\u003c/p>","lesson/trend":"\u003cp class=\"crumb\">Beginner / Trading structure\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>an uptrend is higher highs and higher lows, and a downtrend is the opposite, on a clock you name.\u003c/p>\u003ch1>Trend\u003c/h1>\u003cp>A trend is a sequence, not a feeling. On an uptrend the lows keep stepping up. On a downtrend the highs keep stepping down.\u003c/p>\u003cp>Name the clock in the same breath. A rising hour can sit inside a falling day. Both descriptions can be true.\u003c/p>\u003cp>A trend does not have to be steep. It has to keep the sequence. When the sequence breaks, you stop calling it that trend.\u003c/p>\u003cp>Grid plans later in this directory prefer back and forth movement. A strong trend fights that plan. You need this lesson before that one.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>On the daily clock the swing lows print at 90, then 100, then 110.\u003c/li>\u003cli>Each low is higher. That is an uptrend on the daily clock.\u003c/li>\u003cli>The same coin can still fall for three hours inside that day. The hour clock is a different sentence.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-structure-01.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A rising path with higher lows at 90, 100, and 110.\">\u003ctitle>A rising path with higher lows at 90, 100, and 110.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah8\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">An uptrend makes higher lows\u003c/text>\u003cpath d=\"M 200 700 L 480 560 L 760 620 L 1040 420 L 1320 480\" fill=\"none\" stroke=\"#b6f3d4\" stroke-width=\"8\"/>\u003crect x=\"180\" y=\"704\" width=\"188\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"198\" y=\"760\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Low 90\u003c/text>\u003crect x=\"500\" y=\"464\" width=\"213\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"518\" y=\"520\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Low 100\u003c/text>\u003crect x=\"1000\" y=\"304\" width=\"213\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1018\" y=\"360\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Low 110\u003c/text>\u003c/svg>\u003cfigcaption>A rising path with higher lows at 90, 100, and 110.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Trend means a sequence of swings.\u003c/li>\u003cli>Always name the clock.\u003c/li>\u003cli>A break in the sequence ends that label.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/swings\">Next lesson: Swing highs and lows\u003c/a>\u003c/p>","lesson/swings":"\u003cp class=\"crumb\">Beginner / Trading structure\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a swing high is a high with lower highs on both sides, and a swing low is a low with higher lows on both sides, under a rule you keep.\u003c/p>\u003ch1>Swing highs and lows\u003c/h1>\u003cp>You need a rule for how many bars sit on each side. Two bars, or five. Write it down and do not change it mid chart.\u003c/p>\u003cp>The swing is confirmed only after the later bars exist. You cannot know the high was a swing at the moment it prints.\u003c/p>\u003cp>Swings are the posts of the map. Trend, support, and breaks all hang off these posts.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>A high prints at 120.\u003c/li>\u003cli>The bar on the left has a high of 110. The bar on the right has a high of 110.\u003c/li>\u003cli>Under a one-bar rule, 120 is a swing high.\u003c/li>\u003cli>If your rule needs five bars on each side, you wait until those bars exist.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-structure-02.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A peak at 120 with 110 on both sides. That peak is a swing high.\">\u003ctitle>A peak at 120 with 110 on both sides. That peak is a swing high.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah9\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">A swing high has lower highs beside it\u003c/text>\u003cpath d=\"M 200 560 L 520 300 L 860 560 L 1200 500\" fill=\"none\" stroke=\"#b6f3d4\" stroke-width=\"8\"/>\u003crect x=\"160\" y=\"584\" width=\"114\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"178\" y=\"640\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">110\u003c/text>\u003crect x=\"500\" y=\"194\" width=\"387\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"518\" y=\"250\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Swing high 120\u003c/text>\u003crect x=\"860\" y=\"584\" width=\"114\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"878\" y=\"640\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">110\u003c/text>\u003c/svg>\u003cfigcaption>A peak at 120 with 110 on both sides. That peak is a swing high.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>A swing is a turn under a written rule.\u003c/li>\u003cli>It is confirmed late, not in real time.\u003c/li>\u003cli>Keep the same rule on one map.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/support-resistance\">Next lesson: Support and resistance\u003c/a>\u003c/p>","lesson/support-resistance":"\u003cp class=\"crumb\">Beginner / Trading structure\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>support is a price area where declines have stalled, and resistance is a price area where rallies have stalled.\u003c/p>\u003ch1>Support and resistance\u003c/h1>\u003cp>These are areas, not magic lines. A single print is weaker than several reactions in the same zone.\u003c/p>\u003cp>When price leaves a ceiling and later uses it as a floor, traders rename it. The rename is a description of later behaviour, not a duty the market owes you.\u003c/p>\u003cp>For a grid, these areas are how you sketch a box. The box is still a choice. It is not a forecast of the high and the low of the year.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Three declines stall near 100. You mark support around 100.\u003c/li>\u003cli>Two rallies stall near 130. You mark resistance around 130.\u003c/li>\u003cli>A plan that needs a range might use 100 and 130 as the first sketch, then add room for ordinary wicks.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-structure-03.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A lower line at 100 called support and an upper line at 130 called resistance.\">\u003ctitle>A lower line at 100 called support and an upper line at 130 called resistance.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah10\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Support holds. Resistance stalls.\u003c/text>\u003cline x1=\"160\" y1=\"260\" x2=\"1080\" y2=\"260\" stroke=\"#ffb4b4\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"218\" width=\"387\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"274\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Resistance 130\u003c/text>\u003cline x1=\"160\" y1=\"640\" x2=\"1080\" y2=\"640\" stroke=\"#7dcea0\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"598\" width=\"312\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"654\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Support 100\u003c/text>\u003cpath d=\"M 200 500 L 480 640 L 700 500 L 980 660 L 1240 480\" fill=\"none\" stroke=\"#b6f3d4\" stroke-width=\"8\"/>\u003c/svg>\u003cfigcaption>A lower line at 100 called support and an upper line at 130 called resistance.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Support and resistance are reaction areas.\u003c/li>\u003cli>Several reactions matter more than one print.\u003c/li>\u003cli>They sketch a box. They do not guarantee it.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/market-structure\">Next lesson: Market structure\u003c/a>\u003c/p>","lesson/market-structure":"\u003cp class=\"crumb\">Beginner / Trading structure\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>market structure is the ordered list of swing highs and swing lows you are using on one clock.\u003c/p>\u003ch1>Market structure\u003c/h1>\u003cp>Write the last few swings in order. In an uptrend you expect a higher high, then a higher low, then another higher high.\u003c/p>\u003cp>The map is only as good as the swing rule. If you change the rule, you draw a different map. Say which rule you used.\u003c/p>\u003cp>Structure is the bridge into the next two lessons: a break that continues the sequence, and a break that opposes it.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Swing low 110, swing high 130, swing low 120, swing high 150.\u003c/li>\u003cli>110 to 120 is a higher low. 130 to 150 is a higher high.\u003c/li>\u003cli>On this clock the structure is still an uptrend.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-structure-04.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Higher highs and higher lows. Marks at 110, 130, 120, and 150.\">\u003ctitle>Higher highs and higher lows. Marks at 110, 130, 120, and 150.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah11\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Structure is the sequence of swings\u003c/text>\u003cpath d=\"M 180 640 L 460 360 L 740 520 L 1100 240\" fill=\"none\" stroke=\"#b6f3d4\" stroke-width=\"8\"/>\u003crect x=\"140\" y=\"664\" width=\"188\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"158\" y=\"720\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">HL 110\u003c/text>\u003crect x=\"420\" y=\"254\" width=\"188\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"438\" y=\"310\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">HH 130\u003c/text>\u003crect x=\"700\" y=\"544\" width=\"188\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"718\" y=\"600\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">HL 120\u003c/text>\u003crect x=\"1080\" y=\"134\" width=\"188\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1098\" y=\"190\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">HH 150\u003c/text>\u003c/svg>\u003cfigcaption>Higher highs and higher lows. Marks at 110, 130, 120, and 150.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Structure is a list of swings.\u003c/li>\u003cli>The swing rule is part of the sentence.\u003c/li>\u003cli>The next lessons name the two kinds of break.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/break-of-structure\">Next lesson: Break of structure\u003c/a>\u003c/p>","lesson/break-of-structure":"\u003cp class=\"crumb\">Beginner / Trading structure\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a break of structure is a close through the swing that would continue the sequence you already mapped.\u003c/p>\u003ch1>Break of structure\u003c/h1>\u003cp>In an uptrend, a break of structure is a close through the latest higher high. The sequence is still up. It has extended.\u003c/p>\u003cp>Decide in advance whether a wick counts or only a close. Teachers differ. Your map cannot use both without saying so.\u003c/p>\u003cp>A break is a description. It is not an order to buy or sell.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>The latest higher high is 130.\u003c/li>\u003cli>A later bar closes at 134.\u003c/li>\u003cli>If your rule uses closes, that is a break of structure in the direction of the uptrend.\u003c/li>\u003cli>A wick to 134 that closes back at 129 would not count under that same rule.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-structure-05.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A prior high at 130 and a later close at 134 beyond that high.\">\u003ctitle>A prior high at 130 and a later close at 134 beyond that high.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah12\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">A break continues the sequence\u003c/text>\u003cline x1=\"160\" y1=\"400\" x2=\"1080\" y2=\"400\" stroke=\"#ffb4b4\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"358\" width=\"387\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"414\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Prior high 130\u003c/text>\u003cpath d=\"M 200 620 L 520 480 L 900 280\" fill=\"none\" stroke=\"#b6f3d4\" stroke-width=\"8\"/>\u003c/svg>\u003cfigcaption>A prior high at 130 and a later close at 134 beyond that high.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Break of structure continues the sequence.\u003c/li>\u003cli>Write wick or close before you look.\u003c/li>\u003cli>The word is a description, not an instruction.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/change-of-character\">Next lesson: Change of character\u003c/a>\u003c/p>","lesson/change-of-character":"\u003cp class=\"crumb\">Beginner / Trading structure\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a change of character is a break against the sequence, such as losing the higher low an uptrend needed.\u003c/p>\u003ch1>Change of character\u003c/h1>\u003cp>In an uptrend the higher low is the post that must hold. A close through that low is against the sequence.\u003c/p>\u003cp>People abbreviate this idea as a change of character. The plain version is enough: the old pattern failed.\u003c/p>\u003cp>This is the point where a range plan and a trend plan part ways. A grid that assumed back and forth now needs the review rule you will write later.\u003c/p>\u003cp>The next level looks at liquidity and gaps. Those are extra marks on the same swings. You can skip ahead only if this page is already clear.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>The uptrend&#x27;s latest higher low is 110.\u003c/li>\u003cli>A later bar closes at 106.\u003c/li>\u003cli>Under a close rule, the higher low failed. The character of that uptrend has changed.\u003c/li>\u003cli>You do not invent a new trend until a new sequence of swings exists.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-structure-06.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"An uptrend higher low at 110, then a close at 106 under that low.\">\u003ctitle>An uptrend higher low at 110, then a close at 106 under that low.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah13\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">A break against the sequence\u003c/text>\u003cline x1=\"160\" y1=\"420\" x2=\"1080\" y2=\"420\" stroke=\"#7dcea0\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"378\" width=\"387\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"434\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Higher low 110\u003c/text>\u003cpath d=\"M 200 300 L 520 420 L 900 680\" fill=\"none\" stroke=\"#b6f3d4\" stroke-width=\"8\"/>\u003c/svg>\u003cfigcaption>An uptrend higher low at 110, then a close at 106 under that low.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Change of character breaks against the sequence.\u003c/li>\u003cli>The failed post is the higher low or the lower high.\u003c/li>\u003cli>Wait for a new sequence before you rename the trend.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/liquidity\">Next lesson: Liquidity\u003c/a>\u003c/p>","lesson/liquidity":"\u003cp class=\"crumb\">Intermediate / Smart money concepts\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>liquidity in this lesson means the cluster of stops and resting orders that often sit beyond an obvious high or low.\u003c/p>\u003ch1>Liquidity\u003c/h1>\u003cp>Equal highs and equal lows are obvious. Stops are often parked just beyond them. Resting breakout orders sit there too.\u003c/p>\u003cp>A pool is a description of that cluster. You cannot see the stops. You can see the obvious level.\u003c/p>\u003cp>A sweep is a push through the level that then returns inside. You may call it a sweep only after the return. Before the return it is only a break.\u003c/p>\u003cp>Price can run those stops and keep going. The picture does not owe you a reversal.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Two highs sit at 130.\u003c/li>\u003cli>A later wick trades 133 and the bar closes back at 128.\u003c/li>\u003cli>After the close back inside, you can call 133 a sweep of the highs.\u003c/li>\u003cli>If the bar had closed at 133, you would not use the word sweep yet.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-smart-money-01.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Two equal highs near 130, with a label that stops often sit just above them.\">\u003ctitle>Two equal highs near 130, with a label that stops often sit just above them.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah14\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Liquidity sits where stops cluster\u003c/text>\u003cline x1=\"160\" y1=\"300\" x2=\"1080\" y2=\"300\" stroke=\"#ffe7a3\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"258\" width=\"412\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"314\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Equal highs 130\u003c/text>\u003cpath d=\"M 200 560 L 480 300 L 760 520 L 1040 300 L 1360 560\" fill=\"none\" stroke=\"#b6f3d4\" stroke-width=\"8\"/>\u003c/svg>\u003cfigcaption>Two equal highs near 130, with a label that stops often sit just above them.\u003c/figcaption>\u003c/figure>\u003cfigure data-image=\"atlas-smart-money-02.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A wick pushes to 133 and the close returns to 128.\">\u003ctitle>A wick pushes to 133 and the close returns to 128.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah15\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">A sweep is a push that comes back\u003c/text>\u003cline x1=\"160\" y1=\"340\" x2=\"1080\" y2=\"340\" stroke=\"#ffe7a3\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"298\" width=\"263\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"354\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Level 130\u003c/text>\u003cpath d=\"M 240 560 L 640 180 L 1040 460\" fill=\"none\" stroke=\"#b6f3d4\" stroke-width=\"8\"/>\u003c/svg>\u003cfigcaption>A wick pushes to 133 and the close returns to 128.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Obvious highs and lows attract orders.\u003c/li>\u003cli>A sweep needs a return.\u003c/li>\u003cli>The mark is a hypothesis about the chart.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/order-blocks\">Next lesson: Order blocks\u003c/a>\u003c/p>","lesson/order-blocks":"\u003cp class=\"crumb\">Intermediate / Smart money concepts\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>an order block is a candle, or a small cluster, just before a strong move, which some methods mark in case price returns.\u003c/p>\u003ch1>Order blocks\u003c/h1>\u003cp>The usual mark is the last opposite candle before the impulse. Down candle, then a strong rise. Or up candle, then a strong drop.\u003c/p>\u003cp>The zone is the body, or the whole candle, under a rule you write. When price later trades back into the zone, that return is called a mitigation. What happens after the return is a separate question.\u003c/p>\u003cp>Nothing on the chart proves a large trader placed an order there. You are marking a candle, not reading a private book.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>A down candle runs from 102 to 98.\u003c/li>\u003cli>The next move rises to 120 without much overlap.\u003c/li>\u003cli>The marked zone is 98 to 102.\u003c/li>\u003cli>A later visit to 100 is a return into the zone. It is not yet a result.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-smart-money-03.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A small down candle from 102 to 98, then a rise to 120. The small candle is the marked zone.\">\u003ctitle>A small down candle from 102 to 98, then a rise to 120. The small candle is the marked zone.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah16\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">An order block is a marked candle\u003c/text>\u003crect x=\"160\" y=\"420\" width=\"280\" height=\"200\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"188\" y=\"532.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Zone 98-102\u003c/text>\u003crect x=\"620\" y=\"240\" width=\"360\" height=\"160\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"648\" y=\"332.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Rise to 120\u003c/text>\u003cline x1=\"440\" y1=\"500\" x2=\"620\" y2=\"340\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah16)\"/>\u003crect x=\"160\" y=\"644\" width=\"312\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"178\" y=\"700\" fill=\"#e8f4fc\" font-size=\"40\"
