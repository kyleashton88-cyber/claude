/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Put payoff, in this example\u003c/text>\u003cline x1=\"180\" y1=\"760\" x2=\"180\" y2=\"180\" stroke=\"#8fb4cc\" stroke-width=\"4\" marker-end=\"url(#ah39)\"/>\u003cline x1=\"180\" y1=\"470\" x2=\"1460\" y2=\"470\" stroke=\"#8fb4cc\" stroke-width=\"4\" marker-end=\"url(#ah39)\"/>\u003ctext x=\"80\" y=\"200\" fill=\"#c5d7e6\" font-size=\"32\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Profit\u003c/text>\u003ctext x=\"1320\" y=\"520\" fill=\"#c5d7e6\" font-size=\"32\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Price\u003c/text>\u003cpath d=\"M 200 220 L 800 620 L 1400 620\" fill=\"none\" stroke=\"#8fe7ff\" stroke-width=\"8\"/>\u003crect x=\"820\" y=\"644\" width=\"288\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"838\" y=\"700\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Strike 100\u003c/text>\u003crect x=\"1040\" y=\"504\" width=\"263\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1058\" y=\"560\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Premium 5\u003c/text>\u003crect x=\"220\" y=\"124\" width=\"238\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"238\" y=\"180\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Profit 5\u003c/text>\u003c/svg>\u003cfigcaption>A put with strike 100 and premium 5. At a price of 90 the example profit is 5.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Call benefits from a higher price.\u003c/li>\u003cli>Put benefits from a lower price.\u003c/li>\u003cli>Subtract the premium before you call it a profit.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/greeks\">Next lesson: Greeks in plain words\u003c/a>\u003c/p>","lesson/greeks":"\u003cp class=\"crumb\">Advanced / Derivatives\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>delta, gamma, theta, and vega are names for how an option price responds to the coin, to the speed of that response, to time, and to volatility.\u003c/p>\u003ch1>Greeks in plain words\u003c/h1>\u003cp>Delta is how much the option price changes when the coin changes by 1. A delta of 0.50 means about half a point, in a small move.\u003c/p>\u003cp>Gamma is how fast delta itself changes as the coin moves. Near expiry, gamma can jump. The option can feel stable and then not.\u003c/p>\u003cp>Theta is the drift from time passing, often a loss for the buyer each day if nothing else changes. Vega is the response to volatility. Higher volatility often raises an option&#x27;s premium, so a buyer can gain from that and a seller can lose.\u003c/p>\u003cp>These are sensitivities, not tips. They move together. Quoting one number and ignoring the others will mislead you.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Delta 0.50. The coin rises by 1. The option price rises by about 0.50, if the other inputs stay still.\u003c/li>\u003cli>Theta 0.20 a day. A quiet day can mark the option down by about 0.20.\u003c/li>\u003cli>Vega 0.10. If volatility rises by 1 point in the model&#x27;s units, the option price rises by about 0.10.\u003c/li>\u003cli>Gamma is the reason tomorrow&#x27;s delta may not be 0.50.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-derivatives-04.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Four plain meanings. Delta 0.50, gamma is the change in delta, theta 0.20 a day, vega 0.10.\">\u003ctitle>Four plain meanings. Delta 0.50, gamma is the change in delta, theta 0.20 a day, vega 0.10.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah40\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Greeks are sensitivities\u003c/text>\u003crect x=\"80\" y=\"280\" width=\"320\" height=\"180\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"108\" y=\"382.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Delta 0.50\u003c/text>\u003crect x=\"460\" y=\"280\" width=\"320\" height=\"180\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"488\" y=\"382.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Gamma\u003c/text>\u003crect x=\"840\" y=\"280\" width=\"320\" height=\"180\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"868\" y=\"382.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Theta 0.20\u003c/text>\u003crect x=\"1220\" y=\"280\" width=\"320\" height=\"180\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"1248\" y=\"382.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Vega 0.10\u003c/text>\u003c/svg>\u003cfigcaption>Four plain meanings. Delta 0.50, gamma is the change in delta, theta 0.20 a day, vega 0.10.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Delta follows the coin.\u003c/li>\u003cli>Gamma changes delta.\u003c/li>\u003cli>Theta is time. Vega is volatility.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/basis\">Next lesson: Basis\u003c/a>\u003c/p>","lesson/basis":"\u003cp class=\"crumb\">Advanced / Derivatives\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>basis is the futures price minus the spot price, a gap you can measure today.\u003c/p>\u003ch1>Basis\u003c/h1>\u003cp>If the futures price is above spot, the basis is positive. If it is below, the basis is negative.\u003c/p>\u003cp>Into a dated expiry, that gap tends to shrink because the contract and the spot market meet. A perpetual uses funding instead of a single expiry to pull the prices together. Neither path is a schedule you can treat as a profit.\u003c/p>\u003cp>Basis is a price difference. It is not a yield until you define both legs, the costs, and the exit.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Spot 100. Futures 103.\u003c/li>\u003cli>Basis is 103 minus 100, which is 3.\u003c/li>\u003cli>As a percent of spot, 3 divided by 100 is 3 percent.\u003c/li>\u003cli>That 3 can shrink, widen, or flip sign. The number is today&#x27;s gap.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-derivatives-05.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Spot at 100 and a futures price at 103. The basis is 3.\">\u003ctitle>Spot at 100 and a futures price at 103. The basis is 3.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah41\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Basis is futures minus spot\u003c/text>\u003cline x1=\"160\" y1=\"360\" x2=\"1080\" y2=\"360\" stroke=\"#8fe7ff\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"318\" width=\"312\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"374\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Futures 103\u003c/text>\u003cline x1=\"160\" y1=\"520\" x2=\"1080\" y2=\"520\" stroke=\"#ffe7a3\" stroke-width=\"6\"/>\u003crect x=\"1120\" y=\"478\" width=\"238\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"1138\" y=\"534\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Spot 100\u003c/text>\u003c/svg>\u003cfigcaption>Spot at 100 and a futures price at 103. The basis is 3.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Basis is futures minus spot.\u003c/li>\u003cli>Dated contracts and perpetuals close the gap differently.\u003c/li>\u003cli>A gap is not a profit by itself.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/trade-plans\">Next lesson: Trade plans\u003c/a>\u003c/p>","lesson/trade-plans":"\u003cp class=\"crumb\">Professional / Professional practice\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a plan names the entry, the stop, the cash at risk, and what would make the idea wrong, before you act.\u003c/p>\u003ch1>Trade plans\u003c/h1>\u003cp>Four lines are enough to start. Where you enter. Where the idea is wrong. How much cash that wrongness may cost. What you will do if price never arrives.\u003c/p>\u003cp>A target can be a fourth price, but a target without a stop is not a plan. It is a wish.\u003c/p>\u003cp>If you cannot write the stop, you are not ready to write the size. Return to position sizing.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Entry 100. Stop 95. Distance 5.\u003c/li>\u003cli>Cash at risk 100. Size 20, from the usual division.\u003c/li>\u003cli>A target at 110 is 10 away, which is 2 times the distance. That is 2 R if the stop was the risk unit.\u003c/li>\u003cli>The target is a scenario. The stop is the rule.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-professional-01.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"A plan card with entry 100, stop 95, cash risk 100, and target 110.\">\u003ctitle>A plan card with entry 100, stop 95, cash risk 100, and target 110.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah42\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Write the plan before the click\u003c/text>\u003crect x=\"360\" y=\"240\" width=\"860\" height=\"420\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"388\" y=\"462.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Entry 100\u003c/text>\u003crect x=\"420\" y=\"364\" width=\"213\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"438\" y=\"420\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Stop 95\u003c/text>\u003crect x=\"820\" y=\"364\" width=\"238\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"838\" y=\"420\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Risk 100\u003c/text>\u003crect x=\"420\" y=\"504\" width=\"288\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"438\" y=\"560\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Target 110\u003c/text>\u003c/svg>\u003cfigcaption>A plan card with entry 100, stop 95, cash risk 100, and target 110.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Write entry, invalidation, and cash before you act.\u003c/li>\u003cli>A target is optional. A stop is not.\u003c/li>\u003cli>If you change the stop later, write a new plan.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/journaling\">Next lesson: Journaling\u003c/a>\u003c/p>","lesson/journaling":"\u003cp class=\"crumb\">Professional / Professional practice\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a journal records result in R so that different sizes can be compared, and expectancy is the average R in a sample.\u003c/p>\u003ch1>Journaling\u003c/h1>\u003cp>One R is the cash you planned to lose if the stop was hit. A result divided by that cash is the R multiple.\u003c/p>\u003cp>Expectancy is the win fraction times the average win, plus the loss fraction times the average loss. Losses are negative numbers, so the second term subtracts.\u003c/p>\u003cp>A short sample is noisy. Ten rows can teach the arithmetic. They cannot prove a method. You need more rows before you trust the average.\u003c/p>\u003cp>The tools page will average a column of R values you paste. It does not know whether you followed the plan.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Ten trades. Six wins. Four losses.\u003c/li>\u003cli>Average win 1.5 R. Average loss minus 1 R.\u003c/li>\u003cli>Expectancy is 0.6 times 1.5, plus 0.4 times minus 1.\u003c/li>\u003cli>That is 0.9 minus 0.4, which is 0.5 R per trade in this sample.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-professional-02.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Ten example results. Six are wins. Expectancy in this sample is 0.5 R.\">\u003ctitle>Ten example results. Six are wins. Expectancy in this sample is 0.5 R.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah43\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">A journal turns results into a sample\u003c/text>\u003crect x=\"160\" y=\"300\" width=\"560\" height=\"200\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"188\" y=\"412.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">6 wins of 10\u003c/text>\u003crect x=\"860\" y=\"300\" width=\"560\" height=\"200\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"888\" y=\"412.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Expectancy 0.5 R\u003c/text>\u003cline x1=\"720\" y1=\"400\" x2=\"860\" y2=\"400\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah43)\"/>\u003c/svg>\u003cfigcaption>Ten example results. Six are wins. Expectancy in this sample is 0.5 R.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Record R, not only cash.\u003c/li>\u003cli>Expectancy is an average of a sample.\u003c/li>\u003cli>A small sample is a lesson in arithmetic, not a verdict.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/risk-of-ruin\">Next lesson: Risk of ruin\u003c/a>\u003c/p>","lesson/risk-of-ruin":"\u003cp class=\"crumb\">Professional / Professional practice\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>the percent you risk per idea decides how deep a losing streak cuts, even before you know the win rate.\u003c/p>\u003ch1>Risk of ruin\u003c/h1>\u003cp>Ruin here means the account is too small to follow the plan. You do not need a total loss for the plan to be dead.\u003c/p>\u003cp>Losses compound. Ten losses at 10 percent do not remove 100 percent. They leave 0.9 to the power 10, which is about 0.35, so about 65 percent of the account is gone.\u003c/p>\u003cp>Ten losses at 1 percent leave 0.99 to the power 10, which is about 0.90. The same streak hurts much less.\u003c/p>\u003cp>This is why the first module started at 1 percent as an example, not as a rule for your life. The percent is the lever.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Start with 10000.\u003c/li>\u003cli>Ten losses of 10 percent leave about 3490.\u003c/li>\u003cli>Ten losses of 1 percent leave about 9044.\u003c/li>\u003cli>The streak length is the same. The percent is the difference.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-professional-03.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Ten losses at 1 percent leave about 90 percent of the account. Ten losses at 10 percent leave about 35 percent.\">\u003ctitle>Ten losses at 1 percent leave about 90 percent of the account. Ten losses at 10 percent leave about 35 percent.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah44\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">Big risk makes a losing streak deeper\u003c/text>\u003cpath d=\"M 200 240 L 700 300 L 1200 360\" fill=\"none\" stroke=\"#b6f3d4\" stroke-width=\"8\"/>\u003cpath d=\"M 200 260 L 700 520 L 1200 760\" fill=\"none\" stroke=\"#ffb4b4\" stroke-width=\"8\"/>\u003crect x=\"180\" y=\"144\" width=\"387\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"198\" y=\"200\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">1 percent risk\u003c/text>\u003crect x=\"160\" y=\"584\" width=\"412\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"178\" y=\"640\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">10 percent risk\u003c/text>\u003c/svg>\u003cfigcaption>Ten losses at 1 percent leave about 90 percent of the account. Ten losses at 10 percent leave about 35 percent.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>Streaks happen.\u003c/li>\u003cli>A larger percent makes the same streak deeper.\u003c/li>\u003cli>Compounding, not addition, is the right picture.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/psychology\">Next lesson: Psychology\u003c/a>\u003c/p>","lesson/psychology":"\u003cp class=\"crumb\">Professional / Professional practice\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>after a loss you will want to change size, and the want is not a new plan.\u003c/p>\u003ch1>Psychology\u003c/h1>\u003cp>Two losses in a row feel like a pattern. Often they are the sample being small. The urge is to win the money back by doubling.\u003c/p>\u003cp>Write the size rule where you can see it. When the urge appears, read the rule. If you still want to change it, change it tomorrow in writing, not in the middle of the urge.\u003c/p>\u003cp>A journal helps because the feeling and the R are on different lines. You can be uncomfortable and still have followed the plan.\u003c/p>\u003cp>None of this removes fear. It gives the fear a place that is not the order button.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>The plan risks 1 percent.\u003c/li>\u003cli>Two losses happen. The urge says to risk 2 percent on the next idea so the loss comes back faster.\u003c/li>\u003cli>2 percent is a different plan. It also doubles the damage of a third loss.\u003c/li>\u003cli>The directory&#x27;s answer is to keep 1 percent until you edit the written rule on purpose.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-professional-04.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"The written plan stays at 1 percent. The urge after two losses wants a bigger size. The urge is not a new plan.\">\u003ctitle>The written plan stays at 1 percent. The urge after two losses wants a bigger size. The urge is not a new plan.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah45\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003crect x=\"1288\" y=\"36\" width=\"232\" height=\"64\" rx=\"12\" fill=\"#ffe7a3\"/>\u003ctext x=\"1322\" y=\"80\" fill=\"#1a1204\" font-size=\"36\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">EXAMPLE\u003c/text>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">A feeling is not a new rule\u003c/text>\u003crect x=\"120\" y=\"320\" width=\"560\" height=\"180\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"148\" y=\"422.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Plan stays 1 percent\u003c/text>\u003crect x=\"880\" y=\"320\" width=\"560\" height=\"180\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"908\" y=\"422.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Urge to double\u003c/text>\u003crect x=\"460\" y=\"564\" width=\"486\" height=\"68\" rx=\"12\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"3\"/>\u003ctext x=\"478\" y=\"620\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Urge is not a plan\u003c/text>\u003c/svg>\u003cfigcaption>The written plan stays at 1 percent. The urge after two losses wants a bigger size. The urge is not a new plan.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>The urge after a loss is predictable.\u003c/li>\u003cli>Doubling size is a new plan.\u003c/li>\u003cli>Edit rules in writing, away from the urge.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/lesson/building-a-system\">Next lesson: Building a system\u003c/a>\u003c/p>","lesson/building-a-system":"\u003cp class=\"crumb\">Professional / Professional practice\u003c/p>\u003cp class=\"learn\">\u003cstrong>What you'll learn: \u003c/strong>a small system is one market, one setup, one risk rule, and one day a week when you review the journal.\u003c/p>\u003ch1>Building a system\u003c/h1>\u003cp>More setups feel like progress. They also make the journal impossible to read. Start with one pattern you can describe to someone else.\u003c/p>\u003cp>One market means one clock and one instrument. Adding a second market is a second system, even if the sentence looks the same.\u003c/p>\u003cp>The review day is part of the system. Without it, the journal is a diary. With it, you can ask whether the expectancy is still the one you wrote down.\u003c/p>\u003cp>When you want a word, use the glossary. When you want the arithmetic, use the tools. When you are new again on a topic, go back to Start here.\u003c/p>\u003ch2>Example\u003c/h2>\u003cul>\u003cli>Market: the coin you already studied, on the daily clock.\u003c/li>\u003cli>Setup: a range box only when the daily structure from the structure module is not a strong one-way trend.\u003c/li>\u003cli>Risk rule: 1 percent, size from cash divided by distance.\u003c/li>\u003cli>Review: one day each week, read the R column before you add a second setup.\u003c/li>\u003c/ul>\u003cfigure data-image=\"atlas-professional-05.png\">\u003csvg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Four parts of a small system: one market, one setup, one risk rule, and one review day.\">\u003ctitle>Four parts of a small system: one market, one setup, one risk rule, and one review day.\u003c/title>\u003crect width=\"1600\" height=\"900\" fill=\"#071422\"/>\u003cdefs>\u003cmarker id=\"ah46\" markerWidth=\"14\" markerHeight=\"10\" refX=\"12\" refY=\"5\" orient=\"auto\">\u003cpolygon points=\"0 0, 14 5, 0 10\" fill=\"#8fe7ff\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"72\" y=\"86\" fill=\"#e8f4fc\" font-size=\"42\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"700\">A system is four written lines\u003c/text>\u003crect x=\"60\" y=\"360\" width=\"320\" height=\"150\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"88\" y=\"447.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Market\u003c/text>\u003crect x=\"430\" y=\"360\" width=\"320\" height=\"150\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"458\" y=\"447.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Setup\u003c/text>\u003crect x=\"800\" y=\"360\" width=\"320\" height=\"150\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"828\" y=\"447.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Risk rule\u003c/text>\u003crect x=\"1170\" y=\"360\" width=\"360\" height=\"150\" rx=\"16\" fill=\"#10283a\" stroke=\"#8fe7ff\" stroke-width=\"4\"/>\u003ctext x=\"1198\" y=\"447.0\" fill=\"#e8f4fc\" font-size=\"40\" font-family=\"Segoe UI, Helvetica, Arial, sans-serif\" font-weight=\"650\">Review day\u003c/text>\u003cline x1=\"380\" y1=\"435\" x2=\"430\" y2=\"435\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah46)\"/>\u003cline x1=\"750\" y1=\"435\" x2=\"800\" y2=\"435\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah46)\"/>\u003cline x1=\"1120\" y1=\"435\" x2=\"1170\" y2=\"435\" stroke=\"#8fe7ff\" stroke-width=\"6\" marker-end=\"url(#ah46)\"/>\u003c/svg>\u003cfigcaption>Four parts of a small system: one market, one setup, one risk rule, and one review day.\u003c/figcaption>\u003c/figure>\u003ch2>Recap\u003c/h2>\u003cul>\u003cli>One market, one setup, one risk rule, one review.\u003c/li>\u003cli>A second market is a second system.\u003c/li>\u003cli>The glossary and the tools are there when the sentence needs a word or a number.\u003c/li>\u003c/ul>\u003cp class=\"next\">\u003ca href=\"#/glossary\">Next: Glossary\u003c/a>\u003c/p>","glossary":"\u003ch1>Glossary\u003c/h1>\u003cp>Each line is a plain definition. The link under it is the lesson that uses the idea.\u003c/p>\u003cnav class=\"letters\" aria-label=\"Letters\">\u003ca href=\"#/glossary/letter-A\">A\u003c/a>\u003ca href=\"#/glossary/letter-B\">B\u003c/a>\u003ca href=\"#/glossary/letter-C\">C\u003c/a>\u003ca href=\"#/glossary/letter-D\">D\u003c/a>\u003ca href=\"#/glossary/letter-E\">E\u003c/a>\u003ca href=\"#/glossary/letter-F\">F\u003c/a>\u003ca href=\"#/glossary/letter-G\">G\u003c/a>\u003ca href=\"#/glossary/letter-H\">H\u003c/a>\u003ca href=\"#/glossary/letter-I\">I\u003c/a>\u003ca href=\"#/glossary/letter-J\">J\u003c/a>\u003ca href=\"#/glossary/letter-K\">K\u003c/a>\u003ca href=\"#/glossary/letter-L\">L\u003c/a>\u003ca href=\"#/glossary/letter-M\">M\u003c/a>\u003ca href=\"#/glossary/letter-N\">N\u003c/a>\u003ca href=\"#/glossary/letter-O\">O\u003c/a>\u003ca href=\"#/glossary/letter-P\">P\u003c/a>\u003ca href=\"#/glossary/letter-Q\">Q\u003c/a>\u003ca href=\"#/glossary/letter-R\">R\u003c/a>\u003ca href=\"#/glossary/letter-S\">S\u003c/a>\u003ca href=\"#/glossary/letter-T\">T\u003c/a>\u003ca href=\"#/glossary/letter-U\">U\u003c/a>\u003ca href=\"#/glossary/letter-V\">V\u003c/a>\u003ca href=\"#/glossary/letter-W\">W\u003c/a>\u003ca href=\"#/glossary/letter-X\">X\u003c/a>\u003ca href=\"#/glossary/letter-Y\">Y\u003c/a>\u003ca href=\"#/glossary/letter-Z\">Z\u003c/a>\u003c/nav>\u003ch2 id=\"letter-A\">A\u003c/h2>\u003carticle class=\"term\" id=\"account-model\">\u003ch2>Account Model\u003c/h2>\u003cp>A ledger that stores a balance and a nonce per address.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"account-risk\">\u003ch2>Account Risk\u003c/h2>\u003cp>The fraction of equity you are willing to lose on one idea.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"active-addresses\">\u003ch2>Active Addresses\u003c/h2>\u003cp>How many addresses sent or received in a window.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"address-poisoning\">\u003ch2>Address Poisoning\u003c/h2>\u003cp>A look-alike address planted in your history so you copy the wrong one.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"aggregator\">\u003ch2>Aggregator\u003c/h2>\u003cp>A router that splits a swap across several pools or venues.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"airdrop\">\u003ch2>Airdrop\u003c/h2>\u003cp>A distribution of tokens to addresses that meet published conditions.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"alert\">\u003ch2>Alert\u003c/h2>\u003cp>A message that fires when a price or a condition is met.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-how\">Lesson: How a grid works\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"allowance\">\u003ch2>Allowance\u003c/h2>\u003cp>The maximum a spender may transfer under an approval.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"aml\">\u003ch2>AML\u003c/h2>\u003cp>Anti-money-laundering controls around the movement of value.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"amm\">\u003ch2>AMM\u003c/h2>\u003cp>An automated market maker that quotes a price from a pool&#x27;s reserves.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"amm-pool\">\u003ch2>AMM Pool\u003c/h2>\u003cp>The pair of token reserves that an automated market maker trades against.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"anchored-vwap\">\u003ch2>Anchored VWAP\u003c/h2>\u003cp>VWAP started from a candle you choose, rather than from the session open.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"api-key\">\u003ch2>API Key\u003c/h2>\u003cp>A credential a program uses to talk to an account.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"apr\">\u003ch2>APR\u003c/h2>\u003cp>A quoted rate over a year, without assuming the rate is reinvested.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"apy\">\u003ch2>APY\u003c/h2>\u003cp>A quoted rate over a year that assumes the rate is compounded.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"arithmetic-grid\">\u003ch2>Arithmetic Grid\u003c/h2>\u003cp>Grid levels spaced by an equal price distance.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-range\">Lesson: Range and grid count\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"ask\">\u003ch2>Ask\u003c/h2>\u003cp>A resting sell order at a stated price.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"atr\">\u003ch2>ATR\u003c/h2>\u003cp>Average true range, a measure of recent movement size.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"austrac\">\u003ch2>AUSTRAC\u003c/h2>\u003cp>The Australian agency that registers digital currency exchange providers.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"auto-deleveraging\">\u003ch2>Auto-deleveraging\u003c/h2>\u003cp>A forced reduction of profitable positions when a venue cannot cover a deficit.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"automation\">\u003ch2>Automation\u003c/h2>\u003cp>Letting software apply a rule you have already written.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-how\">Lesson: How a grid works\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-B\">B\u003c/h2>\u003carticle class=\"term\" id=\"backtest\">\u003ch2>Backtest\u003c/h2>\u003cp>Running a written rule over past data to see what it would have done.\u003c/p>\u003cp>\u003ca href=\"#/lesson/journaling\">Lesson: Journaling\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"backwardation\">\u003ch2>Backwardation\u003c/h2>\u003cp>A futures curve where later expiries cost less than spot.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"bad-debt\">\u003ch2>Bad Debt\u003c/h2>\u003cp>Borrowing that is no longer covered by collateral the protocol can seize.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"base-asset\">\u003ch2>Base Asset\u003c/h2>\u003cp>The asset being priced, such as the coin in a pair.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"basis\">\u003ch2>Basis\u003c/h2>\u003cp>The gap between a derivative&#x27;s price and the spot reference.\u003c/p>\u003cp>\u003ca href=\"#/lesson/perpetuals\">Lesson: Perpetuals and dated contracts\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"bearish-candle\">\u003ch2>Bearish Candle\u003c/h2>\u003cp>A candle that closed below its open.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"best-bid-and-offer\">\u003ch2>Best Bid and Offer\u003c/h2>\u003cp>The highest bid and the lowest ask, shown together.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"bid\">\u003ch2>Bid\u003c/h2>\u003cp>A resting buy order at a stated price.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"bitcoin\">\u003ch2>Bitcoin\u003c/h2>\u003cp>The first widely used public cryptocurrency, a proof-of-work ledger with a fixed supply cap.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"block\">\u003ch2>Block\u003c/h2>\u003cp>A batch of transactions added to the chain together.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"block-explorer\">\u003ch2>Block Explorer\u003c/h2>\u003cp>A website that reads a chain and shows transactions, addresses, and contracts.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"block-reward\">\u003ch2>Block Reward\u003c/h2>\u003cp>The new coins plus fees paid to the producer of a valid block.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"block-time\">\u003ch2>Block Time\u003c/h2>\u003cp>The target or typical gap between blocks.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"blockchain\">\u003ch2>Blockchain\u003c/h2>\u003cp>A shared ledger of transactions grouped into blocks.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"bnb\">\u003ch2>BNB\u003c/h2>\u003cp>The native coin of BNB Chain.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"body\">\u003ch2>Body\u003c/h2>\u003cp>The rectangle between a candle&#x27;s open and close.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"bollinger-bands\">\u003ch2>Bollinger Bands\u003c/h2>\u003cp>A moving average with bands set a number of standard deviations away.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"break-of-structure\">\u003ch2>Break of Structure\u003c/h2>\u003cp>A break that continues the prevailing swing direction.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"breaker-block\">\u003ch2>Breaker Block\u003c/h2>\u003cp>A failed order block that price has broken and may later retest.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"breakout\">\u003ch2>Breakout\u003c/h2>\u003cp>Price moving beyond a range or a marked level.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"bridge\">\u003ch2>Bridge\u003c/h2>\u003cp>A system that moves assets or messages between chains.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"bullish-candle\">\u003ch2>Bullish Candle\u003c/h2>\u003cp>A candle that closed above its open.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"burn\">\u003ch2>Burn\u003c/h2>\u003cp>A destruction of tokens so they cannot be spent.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"buy-side-liquidity\">\u003ch2>Buy-side Liquidity\u003c/h2>\u003cp>Resting buy orders, often stops, sitting above highs.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-C\">C\u003c/h2>\u003carticle class=\"term\" id=\"candlestick\">\u003ch2>Candlestick\u003c/h2>\u003cp>A chart bar showing open, high, low, and close.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"capital-allocation\">\u003ch2>Capital Allocation\u003c/h2>\u003cp>How much capital is assigned to a bot and its orders.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"centralised-exchange\">\u003ch2>Centralised Exchange\u003c/h2>\u003cp>A venue that holds accounts and matches orders on its own books.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"chainlink\">\u003ch2>Chainlink\u003c/h2>\u003cp>A project that runs oracle networks feeding data to smart contracts.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"change-of-character\">\u003ch2>Change of Character\u003c/h2>\u003cp>A break against the prevailing swing direction.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"channel\">\u003ch2>Channel\u003c/h2>\u003cp>Two parallel lines containing a series of swings.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"chart-pattern\">\u003ch2>Chart Pattern\u003c/h2>\u003cp>A named shape in price, such as a triangle or a double top.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"circulating-supply\">\u003ch2>Circulating Supply\u003c/h2>\u003cp>The coins data providers count as available in the market.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"close\">\u003ch2>Close\u003c/h2>\u003cp>The last traded price of a candle&#x27;s period.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"coin\">\u003ch2>Coin\u003c/h2>\u003cp>The native asset of a blockchain, used for fees and often for staking or mining.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"cold-wallet\">\u003ch2>Cold Wallet\u003c/h2>\u003cp>A wallet whose keys stay off the internet.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"collateral\">\u003ch2>Collateral\u003c/h2>\u003cp>Assets locked to secure a borrow.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"composability\">\u003ch2>Composability\u003c/h2>\u003cp>The ability of protocols to call each other as building blocks.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"compounding\">\u003ch2>Compounding\u003c/h2>\u003cp>Leaving results in so later size is calculated on a larger base.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"compression\">\u003ch2>Compression\u003c/h2>\u003cp>A tightening of range and volatility before a move.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"concentrated-liquidity\">\u003ch2>Concentrated Liquidity\u003c/h2>\u003cp>Liquidity posted only inside a chosen price range.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"concentration\">\u003ch2>Concentration\u003c/h2>\u003cp>A large share of risk sitting in one asset, one venue, or one idea.\u003c/p>\u003cp>\u003ca href=\"#/lesson/building-a-system\">Lesson: Building a system\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"conditional-order\">\u003ch2>Conditional Order\u003c/h2>\u003cp>An order that waits for a condition before it is sent.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"confirmation\">\u003ch2>Confirmation\u003c/h2>\u003cp>A block built on top of the block that contains your transaction.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"confirmation-bias\">\u003ch2>Confirmation Bias\u003c/h2>\u003cp>Noticing the evidence that agrees with the view you already hold.\u003c/p>\u003cp>\u003ca href=\"#/lesson/psychology\">Lesson: Psychology\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"confluence\">\u003ch2>Confluence\u003c/h2>\u003cp>Several independent observations lining up at the same area.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"consensus\">\u003ch2>Consensus\u003c/h2>\u003cp>The rule by which nodes agree on the next block.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"consolidation\">\u003ch2>Consolidation\u003c/h2>\u003cp>A pause where price trades in a tighter band.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"constant-product\">\u003ch2>Constant Product\u003c/h2>\u003cp>A pool rule that keeps the product of the two reserves steady, before fees.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"contango\">\u003ch2>Contango\u003c/h2>\u003cp>A futures curve where later expiries cost more than spot.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"correction\">\u003ch2>Correction\u003c/h2>\u003cp>A move against the prevailing impulse.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"correlation\">\u003ch2>Correlation\u003c/h2>\u003cp>How similarly two series move together.\u003c/p>\u003cp>\u003ca href=\"#/lesson/building-a-system\">Lesson: Building a system\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"correlation-regime\">\u003ch2>Correlation Regime\u003c/h2>\u003cp>A period in which assets move together more, or less, than usual.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"counterparty-risk\">\u003ch2>Counterparty Risk\u003c/h2>\u003cp>The risk that the other side, or the venue holding the trade, fails.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"cpi\">\u003ch2>CPI\u003c/h2>\u003cp>A consumer price index, a published measure of consumer inflation.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"cross-margin\">\u003ch2>Cross Margin\u003c/h2>\u003cp>One pool of collateral shared across positions.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"crypto-backed-stablecoin\">\u003ch2>Crypto-backed Stablecoin\u003c/h2>\u003cp>A stablecoin supported by on-chain collateral, usually overcollateralised.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"custody\">\u003ch2>Custody\u003c/h2>\u003cp>Who can actually move the assets.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-D\">D\u003c/h2>\u003carticle class=\"term\" id=\"dao\">\u003ch2>DAO\u003c/h2>\u003cp>An organisation whose decisions are executed by token votes and contracts.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"data-availability\">\u003ch2>Data Availability\u003c/h2>\u003cp>Whether the data needed to rebuild the chain&#x27;s state is actually published.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"dated-future\">\u003ch2>Dated Future\u003c/h2>\u003cp>A futures contract with a set expiry and settlement.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"dealing-range\">\u003ch2>Dealing Range\u003c/h2>\u003cp>The swing high-to-low range used to map premium and discount.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"death-cross\">\u003ch2>Death Cross\u003c/h2>\u003cp>A shorter average crossing below a longer average.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"decentralised-exchange\">\u003ch2>Decentralised Exchange\u003c/h2>\u003cp>A venue where trades settle through contracts you sign yourself.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"defi\">\u003ch2>DeFi\u003c/h2>\u003cp>Financial protocols that run as smart contracts on public chains.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"delegation\">\u003ch2>Delegation\u003c/h2>\u003cp>Assigning your stake, or your votes, to someone who acts for you.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"delta\">\u003ch2>Delta\u003c/h2>\u003cp>How much a position&#x27;s value moves when the underlying moves.\u003c/p>\u003cp>\u003ca href=\"#/lesson/greeks\">Lesson: Greeks in plain words\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"delta-neutral\">\u003ch2>Delta-neutral\u003c/h2>\u003cp>A book whose net delta is near zero.\u003c/p>\u003cp>\u003ca href=\"#/lesson/greeks\">Lesson: Greeks in plain words\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"depeg\">\u003ch2>Depeg\u003c/h2>\u003cp>A stablecoin trading away from its reference value.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"depth\">\u003ch2>Depth\u003c/h2>\u003cp>How much size rests near the current price.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"digital-currency-exchange\">\u003ch2>Digital Currency Exchange\u003c/h2>\u003cp>A business that exchanges digital currency and fiat, in AUSTRAC&#x27;s terms.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"discount\">\u003ch2>Discount\u003c/h2>\u003cp>The lower half of a dealing range in a structure map.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"displacement\">\u003ch2>Displacement\u003c/h2>\u003cp>A fast, one-sided move away from a prior area.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"divergence\">\u003ch2>Divergence\u003c/h2>\u003cp>Price and an oscillator making opposite swings.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"diversification\">\u003ch2>Diversification\u003c/h2>\u003cp>Spreading exposure across risks that do not all fail the same way.\u003c/p>\u003cp>\u003ca href=\"#/lesson/building-a-system\">Lesson: Building a system\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"doji\">\u003ch2>Doji\u003c/h2>\u003cp>A candle whose open and close are almost the same.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"donchian-channel\">\u003ch2>Donchian Channel\u003c/h2>\u003cp>The highest high and lowest low of the last N candles.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"double-bottom\">\u003ch2>Double Bottom\u003c/h2>\u003cp>Two lows at a similar price with a peak between them.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"double-top\">\u003ch2>Double Top\u003c/h2>\u003cp>Two highs at a similar price with a trough between them.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"downtrend\">\u003ch2>Downtrend\u003c/h2>\u003cp>A sequence of lower highs and lower lows.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"drawdown\">\u003ch2>Drawdown\u003c/h2>\u003cp>A decline from a prior equity peak.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"drawdown-recovery\">\u003ch2>Drawdown Recovery\u003c/h2>\u003cp>The rise required to regain a prior equity peak.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"dusting\">\u003ch2>Dusting\u003c/h2>\u003cp>A tiny unwanted transfer used to mark or to bait an address.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"dxy\">\u003ch2>DXY\u003c/h2>\u003cp>A widely quoted index of the US dollar against a basket of currencies.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-E\">E\u003c/h2>\u003carticle class=\"term\" id=\"emission\">\u003ch2>Emission\u003c/h2>\u003cp>The ongoing issuance of new tokens.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"engulfing\">\u003ch2>Engulfing Candle\u003c/h2>\u003cp>A candle whose body fully covers the previous body.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"eoa\">\u003ch2>EOA\u003c/h2>\u003cp>An externally owned account, controlled by a private key rather than by contract code.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"equal-highs\">\u003ch2>Equal Highs\u003c/h2>\u003cp>Two or more highs at nearly the same price.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"equal-lows\">\u003ch2>Equal Lows\u003c/h2>\u003cp>Two or more lows at nearly the same price.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"equilibrium\">\u003ch2>Equilibrium\u003c/h2>\u003cp>The midpoint of a marked dealing range.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"equity-curve\">\u003ch2>Equity Curve\u003c/h2>\u003cp>A plot of account equity after each result.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"erc-20\">\u003ch2>ERC-20\u003c/h2>\u003cp>The common standard for interchangeable tokens on Ethereum-style chains.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"etf\">\u003ch2>ETF\u003c/h2>\u003cp>An exchange-traded fund, a listed vehicle that holds a basket or a commodity-like asset.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"etf-flow\">\u003ch2>ETF Flow\u003c/h2>\u003cp>The net creation or redemption of shares in a crypto-linked fund.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"ethereum\">\u003ch2>Ethereum\u003c/h2>\u003cp>A public blockchain built to run general-purpose smart contracts.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"event-log\">\u003ch2>Event Log\u003c/h2>\u003cp>A structured note a contract emits while it executes.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"exchange-netflow\">\u003ch2>Exchange Netflow\u003c/h2>\u003cp>Coins sent to known venue addresses minus coins sent out, over a window.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"expansion\">\u003ch2>Expansion\u003c/h2>\u003cp>A widening of range after a quieter period.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"expectancy\">\u003ch2>Expectancy\u003c/h2>\u003cp>The average result per trade in a sample.\u003c/p>\u003cp>\u003ca href=\"#/lesson/journaling\">Lesson: Journaling\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"expiry\">\u003ch2>Expiry\u003c/h2>\u003cp>The moment a dated contract settles and ceases.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"ema\">\u003ch2>Exponential Moving Average\u003c/h2>\u003cp>An average that weights recent closes more than older ones.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"exposure\">\u003ch2>Exposure\u003c/h2>\u003cp>How much of an asset or a factor the account actually holds.\u003c/p>\u003cp>\u003ca href=\"#/lesson/building-a-system\">Lesson: Building a system\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-F\">F\u003c/h2>\u003carticle class=\"term\" id=\"fair-value-gap\">\u003ch2>Fair Value Gap\u003c/h2>\u003cp>A three-candle imbalance where wicks do not overlap.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"fake-token\">\u003ch2>Fake Token\u003c/h2>\u003cp>A contract that copies a name or a ticker without being the asset.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"false-breakout\">\u003ch2>False Breakout\u003c/h2>\u003cp>A move beyond a level that fails and returns inside.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"fee-drag\">\u003ch2>Fee Drag\u003c/h2>\u003cp>The share of each grid step consumed by fees and slippage.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-how\">Lesson: How a grid works\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"fiat-on-ramp\">\u003ch2>Fiat On-ramp\u003c/h2>\u003cp>A path that turns government currency into crypto.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"fiat-backed-stablecoin\">\u003ch2>Fiat-backed Stablecoin\u003c/h2>\u003cp>A stablecoin that claims reserves of cash or cash-like assets.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"fibonacci-retracement\">\u003ch2>Fibonacci Retracement\u003c/h2>\u003cp>Horizontal levels at fixed ratios of a prior swing.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"fill-or-kill\">\u003ch2>Fill or Kill\u003c/h2>\u003cp>An instruction to fill the whole order immediately or cancel it.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"finality\">\u003ch2>Finality\u003c/h2>\u003cp>The point after which a transaction is impractical or impossible to reverse under the rules.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"flag\">\u003ch2>Flag\u003c/h2>\u003cp>A small channel against the prior impulse.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"flash-loan\">\u003ch2>Flash Loan\u003c/h2>\u003cp>A loan that must be repaid inside the same transaction.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"floating-pnl\">\u003ch2>Floating P&amp;L\u003c/h2>\u003cp>Another name for open, unrealised profit and loss.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"fomo\">\u003ch2>FOMO\u003c/h2>\u003cp>Fear of missing out, the urge to chase a move already underway.\u003c/p>\u003cp>\u003ca href=\"#/lesson/psychology\">Lesson: Psychology\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"fork\">\u003ch2>Fork\u003c/h2>\u003cp>A split in the rules or in the chain history.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"forward-test\">\u003ch2>Forward Test\u003c/h2>\u003cp>Running a frozen rule on data, or on paper, after the rule was locked.\u003c/p>\u003cp>\u003ca href=\"#/lesson/journaling\">Lesson: Journaling\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"fully-diluted-valuation\">\u003ch2>Fully Diluted Valuation\u003c/h2>\u003cp>Price multiplied by the full supply, including coins not yet circulating.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"funding-interval\">\u003ch2>Funding Interval\u003c/h2>\u003cp>How often perpetual funding is exchanged.\u003c/p>\u003cp>\u003ca href=\"#/lesson/funding\">Lesson: Funding rates\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"funding-rate\">\u003ch2>Funding Rate\u003c/h2>\u003cp>A periodic payment between long and short perpetual positions.\u003c/p>\u003cp>\u003ca href=\"#/lesson/funding\">Lesson: Funding rates\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"futures-grid\">\u003ch2>Futures Grid\u003c/h2>\u003cp>A grid run with derivatives exposure, often with leverage.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-G\">G\u003c/h2>\u003carticle class=\"term\" id=\"gas\">\u003ch2>Gas\u003c/h2>\u003cp>The fee unit that pays for computation and storage on a chain.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"geometric-grid\">\u003ch2>Geometric Grid\u003c/h2>\u003cp>Grid levels spaced by an equal percentage distance.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-range\">Lesson: Range and grid count\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"golden-cross\">\u003ch2>Golden Cross\u003c/h2>\u003cp>A shorter average crossing above a longer average.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"good-till-cancelled\">\u003ch2>Good till Cancelled\u003c/h2>\u003cp>A resting order that stays until it fills or you cancel it.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"governance\">\u003ch2>Governance\u003c/h2>\u003cp>The process that changes a protocol&#x27;s parameters or code.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"governance-token\">\u003ch2>Governance Token\u003c/h2>\u003cp>A token that can vote on protocol parameters, under the protocol&#x27;s rules.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"grid\">\u003ch2>Grid\u003c/h2>\u003cp>A set of predefined price levels with orders inside a range.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"grid-count\">\u003ch2>Grid Count\u003c/h2>\u003cp>How many levels sit inside the range.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-range\">Lesson: Range and grid count\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"grid-cycle\">\u003ch2>Grid Cycle\u003c/h2>\u003cp>One completed round trip between two grid levels.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-how\">Lesson: How a grid works\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"grid-level\">\u003ch2>Grid Level\u003c/h2>\u003cp>One order line inside the range.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-what\">Lesson: What a grid bot is\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"grid-profit\">\u003ch2>Grid Profit\u003c/h2>\u003cp>Realised result from completed buy and sell cycles.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-how\">Lesson: How a grid works\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"grid-spacing\">\u003ch2>Grid Spacing\u003c/h2>\u003cp>The price or percentage gap between two levels.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-range\">Lesson: Range and grid count\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"gwei\">\u003ch2>Gwei\u003c/h2>\u003cp>A small unit of ether used to quote gas prices.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-H\">H\u003c/h2>\u003carticle class=\"term\" id=\"halving\">\u003ch2>Halving\u003c/h2>\u003cp>A scheduled cut in the new-coin subsidy on some proof-of-work chains.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"hammer\">\u003ch2>Hammer\u003c/h2>\u003cp>A small body with a long lower wick, after a decline.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"hard-fork\">\u003ch2>Hard Fork\u003c/h2>\u003cp>A rule change that nodes must adopt or they follow a different chain.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"hard-stop\">\u003ch2>Hard Stop\u003c/h2>\u003cp>A stop order that sits in the market, not only in your notes.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"hardware-wallet\">\u003ch2>Hardware Wallet\u003c/h2>\u003cp>A dedicated device that holds keys and signs on the device.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"hash\">\u003ch2>Hash\u003c/h2>\u003cp>A fixed-length fingerprint of some data.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"hashgraph\">\u003ch2>Hashgraph\u003c/h2>\u003cp>A consensus structure that records who gossiped which event to whom.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"hbar\">\u003ch2>HBAR\u003c/h2>\u003cp>The native token of the Hedera network.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"head-and-shoulders\">\u003ch2>Head and Shoulders\u003c/h2>\u003cp>A peak between two lower peaks, with a neckline through the troughs.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"health-factor\">\u003ch2>Health Factor\u003c/h2>\u003cp>A protocol-specific score of how far a borrow sits from liquidation.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"hedera\">\u003ch2>Hedera\u003c/h2>\u003cp>A public network that orders transactions with hashgraph consensus.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"hedge\">\u003ch2>Hedge\u003c/h2>\u003cp>A position taken to offset an existing exposure.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"hidden-divergence\">\u003ch2>Hidden Divergence\u003c/h2>\u003cp>An oscillator extreme that disagrees with a pullback, studied inside a trend.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"high\">\u003ch2>High\u003c/h2>\u003cp>The highest traded price of a candle&#x27;s period.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"higher-high\">\u003ch2>Higher High\u003c/h2>\u003cp>A swing high above the previous swing high.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"higher-low\">\u003ch2>Higher Low\u003c/h2>\u003cp>A swing low above the previous swing low.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"hodl-waves\">\u003ch2>HODL Waves\u003c/h2>\u003cp>A chart of supply split by how long each coin has stayed unmoved.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"holder-concentration\">\u003ch2>Holder Concentration\u003c/h2>\u003cp>How much of the supply sits in the largest addresses.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"hot-wallet\">\u003ch2>Hot Wallet\u003c/h2>\u003cp>A wallet whose keys are on a machine connected to the internet.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-I\">I\u003c/h2>\u003carticle class=\"term\" id=\"iceberg-order\">\u003ch2>Iceberg Order\u003c/h2>\u003cp>A large order that shows only a slice of its size.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"immediate-or-cancel\">\u003ch2>Immediate or Cancel\u003c/h2>\u003cp>Fill what you can right now, and cancel the rest.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"impermanent-loss\">\u003ch2>Impermanent Loss\u003c/h2>\u003cp>How far a pool position lags simply holding the same coins.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"impulse\">\u003ch2>Impulse\u003c/h2>\u003cp>A strong push in the direction of the current sequence.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"indecision\">\u003ch2>Indecision\u003c/h2>\u003cp>A candle or a cluster that does not close decisively either way.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"index-price\">\u003ch2>Index Price\u003c/h2>\u003cp>A composite spot reference used to anchor a derivative.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"indicator\">\u003ch2>Indicator\u003c/h2>\u003cp>A calculation on price, volume, or both, drawn to summarise the window.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"inducement\">\u003ch2>Inducement\u003c/h2>\u003cp>A minor swing that may attract stops before a larger level is tested.\u003c/p>\u003cp>\u003ca href=\"#/lesson/market-structure\">Lesson: Market structure\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"initial-margin\">\u003ch2>Initial Margin\u003c/h2>\u003cp>The collateral required to open a position.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"inside-bar\">\u003ch2>Inside Bar\u003c/h2>\u003cp>A candle whose high and low sit inside the previous candle.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"insurance-fund\">\u003ch2>Insurance Fund\u003c/h2>\u003cp>A venue buffer that absorbs some losses beyond liquidated margin.\u003c/p>\u003cp>\u003ca href=\"#/lesson/funding\">Lesson: Funding rates\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"interest-rate\">\u003ch2>Interest Rate\u003c/h2>\u003cp>The price of borrowing money, set in markets and influenced by policy.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"invalidation\">\u003ch2>Invalidation\u003c/h2>\u003cp>The condition that means the original idea no longer holds.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"inventory\">\u003ch2>Inventory\u003c/h2>\u003cp>The coins or contracts a grid still holds open.\u003c/p>\u003cp>\u003ca href=\"#/lesson/grid-risk\">Lesson: Grid risk\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"inverse-contract\">\u003ch2>Inverse Contract\u003c/h2>\u003cp>A derivative margined in the base coin, with a nonlinear payoff.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"isolated-margin\">\u003ch2>Isolated Margin\u003c/h2>\u003cp>Margin assigned to one position, not to the whole account.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-J\">J\u003c/h2>\u003carticle class=\"term\" id=\"journal\">\u003ch2>Journal\u003c/h2>\u003cp>A record of what you did, why, and what the result was.\u003c/p>\u003cp>\u003ca href=\"#/lesson/journaling\">Lesson: Journaling\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-K\">K\u003c/h2>\u003carticle class=\"term\" id=\"kelly-criterion\">\u003ch2>Kelly Criterion\u003c/h2>\u003cp>A formula for a size that maximises growth under strong assumptions.\u003c/p>\u003cp>\u003ca href=\"#/lesson/risk-basics\">Lesson: Risk basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"keltner-channel\">\u003ch2>Keltner Channel\u003c/h2>\u003cp>An average with bands set from ATR rather than standard deviation.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"kyc\">\u003ch2>KYC\u003c/h2>\u003cp>Know-your-customer checks a venue uses to identify account holders.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003ch2 id=\"letter-L\">L\u003c/h2>\u003carticle class=\"term\" id=\"lag\">\u003ch2>Lag\u003c/h2>\u003cp>The delay built into a calculation that uses past candles.\u003c/p>\u003cp>\u003ca href=\"#/lesson/support-resistance\">Lesson: Support and resistance\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"last-price\">\u003ch2>Last Price\u003c/h2>\u003cp>The price of the most recent trade on that market.\u003c/p>\u003cp>\u003ca href=\"#/lesson/order-types\">Lesson: Order types\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"layer-1\">\u003ch2>Layer 1\u003c/h2>\u003cp>A base blockchain that settles its own consensus.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"layer-2\">\u003ch2>Layer 2\u003c/h2>\u003cp>A system that executes elsewhere and settles back to a layer 1.\u003c/p>\u003cp>\u003ca href=\"#/lesson/markets\">Lesson: Markets\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"lending-market\">\u003ch2>Lending Market\u003c/h2>\u003cp>A pool that accepts deposits and lends them against collateral.\u003c/p>\u003cp>\u003ca href=\"#/lesson/wallets\">Lesson: Wallets and venues\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"leverage\">\u003ch2>Leverage\u003c/h2>\u003cp>Borrowed exposure that magnifies both gains and losses.\u003c/p>\u003cp>\u003ca href=\"#/lesson/options-basics\">Lesson: Options basics\u003c/a>\u003c/p>\u003c/article>\u003carticle class=\"term\" id=\"limit-order\">\u003ch2>Limit Orde
