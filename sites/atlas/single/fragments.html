<template id="path/what">
<p>A grid bot is a program that places buy and sell orders at prices you chose in advance, inside a high and a low you also chose. It does not look at the news and decide that a coin is good. It follows the ladder you gave it.</p>
<p>Picture a ladder on a price chart. The top rung is the upper boundary. The bottom rung is the lower boundary. Between them are the grid levels. Rungs below the current price are buys. Rungs above it are sells. When price falls through a buy and later rises through the paired sell, that round trip is one cycle. The difference between those two prices, before fees, is the gross step.</p>
<figure class="shot">
  <img src="__MASCOT__" width="200" height="200" alt="White robot mascot with a blue G on its chest, smiling and giving a thumbs up">
  <figcaption>The mascot is a teacher, not a signal. A finished cycle is a buy and a later sell. It is not a promise that the next cycle happens.</figcaption>
</figure>
<h2>What the bot is for</h2>
<p>The job is repetition inside a range. If price wanders up and down through the same area, the ladder can complete cycles. If price runs away and does not come back, the ladder mostly collects inventory: coins you bought and have not sold. That inventory can fall in price. Grid profit on the finished cycles can be positive while the account is still down, because unsold coins are a separate result.</p>
<h2>A hypothetical cycle</h2>
<p>Hypothetical example. A buy fills at 100 and the paired sell fills at 102. The gross difference is 2 per coin, before fees, spread, and slippage. If the fee on the round trip is larger than 2, the cycle did not pay for itself. The <a href="#/tools">grid calculator</a> is where you compare a step with a fee. The numbers are illustrations. They are not a record of anyone's results.</p>
<h2>What it is not</h2>
<ul>
  <li>It is not a forecast of the next candle.</li>
  <li>It is not a machine you can leave without a written reason to turn it off.</li>
  <li>It is not safer because it is automatic. Automation repeats your rules, including a bad range.</li>
</ul>
<p class="practice"><strong>Try this.</strong> In your own words, finish the sentence: a grid bot repeats buys and sells inside a box, and it stops being the plan I wrote when… You will answer that properly in the range lesson. For now, notice that the sentence needs an ending.</p>
<p>The short definitions are under <a href="#/glossary/grid">grid</a>, <a href="#/glossary/grid-level">grid level</a>, and <a href="#/glossary/range">range</a>.</p>

<template id="path/how">
<p>Once the rules are set, the bot does not get bored, frightened, or greedy. That is the useful part. It is also the dangerous part, because it will keep following a plan after the plan has stopped fitting the market.</p>
<figure class="shot">
  <img src="__MASCOT_ALT__" width="220" height="220" alt="The same robot mascot giving a thumbs up, with the words Automate, Trade, Grow above a chart">
  <figcaption>The picture says automate, trade, grow. Here, automate means the bot repeats your rules. It does not mean the account grows.</figcaption>
</figure>
<h2>One cycle, in order</h2>
<ol>
  <li>You set the upper and lower prices. That is the workplace.</li>
  <li>You split the workplace into levels.</li>
  <li>Price falls and a buy fills.</li>
  <li>Price rises and the bot sells at the next level up.</li>
  <li>The gap between that buy and that sell is realised grid profit, before costs.</li>
  <li>The bot replaces the orders and waits for price to cross again.</li>
</ol>
<p>If price never crosses a level, nothing completes. A market that sits still can be quiet for a long time. If price leaves the box and stays away, the original setup has to be reviewed. The bot will not notice that your reason has expired unless you wrote a check for it.</p>
<h2>Spot and futures use the same cycle</h2>
<p>The buy-then-sell idea is the same on spot and on a futures contract. What changes is ownership, margin, funding, and liquidation. Those differences belong in <a href="#/path/setup">setting one up</a> and in the <a href="#/guides/futures-leverage">futures guide</a>. Start from the cycle before you add leverage.</p>
<p>A longer look at how orders sit in a book is in the <a href="#/guides/exchanges">venues guide</a>. A longer look at letting software follow rules is in the <a href="#/guides/automation">automation guide</a>.</p>

<template id="path/setup">
<p>Setting a grid up is mostly writing. You decide the market, the box, the number of gaps, the cash, the fee you will assume, and the sentence that means "this plan is finished". The bot cannot supply those decisions.</p>
<h2>Spot before leverage</h2>
<p>On a spot grid you are buying and selling the coin with cash you put in. You can end up holding more of the coin if price falls through the buys. You do not get liquidated by a funding payment, because there is no leverage. On a futures grid the same ladder can be built with borrowed exposure. Losses can then exceed the cash you think of as the bot's budget, and a liquidation price can close the position for you.</p>

<template id="path/range">
<p>The range is the bot's workplace. Too narrow, and ordinary noise carries price outside it. Too wide, and the same cash is spread so thin that each level is small and cycles are rare. You are balancing room to survive against chances to complete a cycle. You are not predicting the high and the low of the year.</p>
<h2>A way to sketch the box</h2>
<ol>
  <li>Mark the support and resistance you can actually see on the timeframe you care about. The <a href="#/guides/market-structure">market structure guide</a> is the lesson for swings, ranges, and breaks.</li>
  <li>Measure a few recent swings. That is the size of ordinary movement, not a target.</li>
  <li>Look one timeframe higher and ask whether price is already trending hard. A grid is a mean-reversion style of plan. A strong one-way move fights it.</li>
  <li>Leave room so a normal wick does not end the plan on the first candle.</li>
  <li>Write the invalidation in a sentence. "If the daily close is beyond the box, I review" is a sentence. "I will see" is not.</li>
</ol>
<p>The chart studies under <a href="#/markets">markets</a> are bundled samples. Use them to practise the question. They are not a signal to run a bot on that asset.</p>
<h2>Spacing</h2>
<p>Arithmetic spacing keeps the same price gap, such as 2 units, all the way up the ladder. The percentage gap gets smaller as price rises. Geometric spacing keeps the same percentage gap, so the price gap grows as price rises. Neither one is the correct setting. The question is whether the smallest gap still clears fees.</p>
<p>More gaps inside a fixed box means a smaller step. If the step does not clear the fee and the slippage you assume, extra trades do not repair it. They repeat a loss.</p>
<h2>Hypothetical calculator</h2>
<p>Hypothetical example, matching the form below. Lower 100, upper 110, five gaps, arithmetic spacing. The gap is 2. A 10 basis point fee on each side is 0.20 per unit at a price of 100, which is smaller than 2. Change the fee to 150 basis points and the note should warn you. That warning is the lesson. It is not an instruction to use 100 and 110 on any market.</p>
<div data-mount="grid"></div>
<p>Indicators that people use when they draw a box, such as a moving average or ATR, are explained in the <a href="#/guides/technical-analysis">technical analysis guide</a>. They are descriptions of past prices. They are not the bot's permission to run.</p>

<template id="path/risk">
<p>A bot removes hesitation from the clicks. It does not remove the loss if price does the opposite of the story you told. Risk, in this directory, means writing that loss down before you care about the cycles.</p>
<p>A beginner-sized version of the question is: how much cash am I willing to lose if the invalidation is hit, and how far away is that price? Size is that cash divided by the distance. If the stop is very close, the same cash becomes a large position. Close stops are not automatically safer.</p>
<h2>The calculator</h2>
<p>The form uses the figures you type. Fees and slippage are basis points on the notional, counted on the way in and the way out. On spot, if the notional is larger than the account, the position needs more cash than the account figure. On futures, if the implied leverage is above the cap you typed, the size does not fit the cap. A venue's real margin ladder is not in this form.</p>
<div data-mount="risk"></div>
<p>Hypothetical reading of the starting numbers. Account 10,000, risk 1 percent, entry 100, stop 95. The cash at risk before fees is 100. The distance is 5, so the quantity is 20 and the notional is 2,000. That is 0.20 times the account, not a recommendation to buy 20 of anything.</p>
<h2>Several bots are still one account</h2>
<p>Five grids that all hold the same coin are one bet that the coin stays in those boxes. A reserve that is not locked in a grid is what you use when a plan ends and you still have to pay fees or meet a margin call. The longer lesson on expectancy, R, and drawdown is the <a href="#/guides/risk-academy">risk guide</a>. Leverage and funding are in the <a href="#/guides/futures-leverage">futures guide</a>.</p>
<p class="practice"><strong>Try this.</strong> Move the stop closer to the entry and watch the quantity rise. Then move it further away and watch the quantity fall. The cash at risk stays the same until you change the percent. That is the whole idea of the formula.</p>
</template>

<template id="path/monitor">
<p>Monitoring is not staring at every fill. It is a check that the reason you wrote is still true. Price still lives in the box, or you have a rule for when it does not. The gap still clears the fees you are actually paying. Nothing about the market you relied on, such as a scheduled event, has made the box obsolete.</p>
<h2>A small routine</h2>
<ul>
  <li><strong>When you look.</strong> Is price inside the box? If it is outside, do you review, or were you waiting for a close beyond the box?</li>
  <li><strong>On the fills.</strong> Are you counting finished cycles and unsold coins separately? Grid profit can be up while the coins you still hold are down.</li>
  <li><strong>On the costs.</strong> Have fees, spread, or funding changed enough that the step no longer clears them?</li>
  <li><strong>On the week.</strong> Which bot only accumulated inventory? That one needs the invalidation sentence, not a narrower grid to "make it work".</li>
</ul>
<p>Adjusting means returning to the written plan. It does not mean dragging the box every hour so that the bot is always inside the latest price. A box you move constantly is no longer a plan you can review.</p>

<template id="path/mistakes">
<p>Most early grid trouble is a configuration you can name, not a mysterious candle. The usual push is to force more activity: more leverage, more bots, a tighter box, or a coin that jumps around, without a sentence for when the plan is over.</p>
<h2>Mistakes and the fix that is actually a rewrite</h2>
<ul>
  <li><strong>Leverage you cannot explain.</strong> A small move becomes a large account move. The fix is to stay with the spot explanation until liquidation is clear.</li>
  <li><strong>A box that does not match ordinary swings.</strong> Price either never travels the ladder, or it leaves immediately. Rebuild from structure and recent swing size, not from a profit target.</li>
  <li><strong>So many levels that the gap is smaller than the fee.</strong> Model the fee first. Adding levels does not create a larger gap.</li>
  <li><strong>A box so wide that cycles almost never finish.</strong> You have room, and very little repetition. Width and step are a pair.</li>
  <li><strong>Using a range plan in a one-way market.</strong> Check the higher timeframe before you call the market sideways.</li>
  <li><strong>No invalidation.</strong> Drawdown continues after the original idea is already false. Write the failure condition first.</li>
  <li><strong>A thin market.</strong> Spread and slippage can eat the step you calculated on a mid price. The <a href="#/guides/exchanges">venues guide</a> is the lesson on the book and the spread.</li>
</ul>
<h2>Times the careful choice is no grid</h2>
<p>High-impact news, a parabolic run, a crash, and a thin book can all break the assumption that price will wander back through the ladder. Sometimes the finished plan is to wait. Waiting is a decision. It is allowed.</p>
<p>Feelings that show up while a bot is running, and a way to write them down without turning them into a signal, are in the <a href="#/guides/psychology">psychology guide</a>.</p>
