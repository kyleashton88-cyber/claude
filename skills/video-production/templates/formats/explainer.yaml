beats:
  - id: idea
    chapter: The idea
    vo: A grid is a set of orders placed before the price arrives. The picture shows the orders. It does not predict the path.
    on_screen: Orders placed ahead
    labels: [Orders ahead, Not a path]
  - id: pass
    chapter: One pass
    vo: When price crosses a line, that order can fill. A fill is the price touching a level that was already placed.
    on_screen: A line can fill
    labels: [Price touches, A level]
